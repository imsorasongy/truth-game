<!doctype html>
<html lang="ko">
<head><meta charset="utf-8">
<title>의뢰인의 진실 스토리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* 레이아웃: 위 띠 + 인물 무대 + 아래 대화창. 본 게임의 호두나무·놋쇠 색을 그대로 씀(단일 다크) */
:root { color-scheme: dark;
  --wood: #1b120d; --panel: #140d09f0; --line: #c9a24a55; --brass: #c9a24a; --paper: #efe7d6; --ink: #221d18;

* { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { height: 100%; }
/* 장면 전환 */
#fade { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity .42s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade .ft { font-family: var(--f-d); color: var(--brass); font-size: 30px; line-height: 1.3; }

/* 팝업: 본 게임 안내창과 같은 모양 */
.pop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; background: #000a; animation: popin .2s; }
@keyframes popin { from { opacity: 0; } }
.pop-card { width: min(100%, 330px); max-height: 86%; overflow-y: auto; background: #1f150f; border: 1px solid var(--brass); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 14px 36px #000c; }
.pop-k { font-size: 13px; color: var(--brass); }
.pop-card h3 { margin: 0; font-family: var(--f-d); font-weight: 400; font-size: 22px; line-height: 1.3; color: var(--text); text-align: center; }
.pop-b { font-size: 15px; line-height: 1.6; color: #e6dac6; text-align: center; }
.pop-pic { width: 150px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid var(--brass); }
.pop-ico svg { width: 42px; height: 42px; fill: none; stroke: var(--brass); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pop-btns { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.pop-btns .btn { text-align: center; border-left-width: 1px; }
/* 오프닝 뒤 달력 */
.calbox { flex: 1; display: flex; align-items: center; justify-content: center; }
.cal-wrap { position: relative; width: min(290px, 76vw); aspect-ratio: 3 / 4; perspective: 1200px; }
.cal { position: absolute; inset: 0; background: #f4ede0; color: #2a2018; border-radius: 6px; box-shadow: 0 12px 32px #000b; padding: 26px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; transform-origin: top center; backface-visibility: hidden; }
.cal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14px; border-radius: 6px 6px 0 0; background: #3a2a1d; }
.cal.top { transition: transform 1.1s ease-in, opacity 1.1s ease-in; }
.cal.top.flip { transform: rotateX(105deg); opacity: 0; }
.cal-y { font-size: 15px; color: #7a6a55; letter-spacing: .2em; }
.cal-m { font-family: var(--f-d); font-size: 48px; line-height: 1.1; color: #a3322b; }
.cal-g { width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; text-align: center; font-size: 13px; margin-top: 6px; }
.cal-g b { font-weight: 600; color: #7a6a55; } .cal-g b:first-child { color: #a3322b; }
.cal-g i { font-style: normal; }
body { margin: 0; background: var(--wood); color: var(--text); font-family: var(--f-b); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

#bg { position: fixed; inset: 0; background: var(--wood) center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0d0806b0, #0d080666 34%, #0d0806e8 66%); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0d0806f5; border-top: 1px solid #c9a24a44; }
#tabs .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); background: none; border: none; }
#tabs .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs .tab.on { color: var(--brass); }
#tabs .tab.off { opacity: .3; cursor: default; }
/* 증거: 그림 칸, 누르면 설명 */
.evgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.evtile { background: #f1e9d8; color: var(--ink); border: 1px solid #d7c9ab; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.evt { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; background: #e2d4b6; display: grid; place-items: center; overflow: hidden; }
.evt svg { width: 46%; height: 46%; fill: none; stroke: #6b5a44; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.evt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.evn { font-size: 12.5px; line-height: 1.3; text-align: center; word-break: keep-all; }
.top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.top .tt { font-family: var(--f-d); color: var(--brass); font-size: 17px; flex: 1; min-width: 0; text-shadow: 0 1px 4px #000; }
.mini { background: #000a; border: 1px solid var(--brass); color: var(--brass); border-radius: 8px; padding: 4px 11px; font-size: 13.5px; white-space: nowrap; }
.stage { flex: 1 1 0; min-height: 70px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
/* 인물 크기는 본 게임 일반 사건과 같은 계산(화면 폭의 60%, 170~230px의 3/4) */
.stage img.who { --sz: calc(max(170px, min(230px, 60vw)) * .75); width: var(--sz); height: var(--sz); object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 10px 18px #000c); -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }
/* 대화 상대가 있는 화면: 본 게임처럼 얼굴은 위에 고정, 대사와 선택지는 그 바로 아래부터 */
.stage:not(:empty) { flex: 0 0 auto; height: calc(max(170px, min(230px, 60vw)) * .75 + 16px); align-items: flex-start; }
.stage:not(:empty) + .panel { flex: 1 1 0; max-height: none; min-height: 0; }
.stage:not(:empty) + .panel > .btn.go:last-child, .stage:not(:empty) + .panel > .btn.ghost:last-child { margin-top: auto; flex: none; }
.tag { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: var(--brass); color: #2a1c0c; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 1px 12px; white-space: nowrap; }
.panel { flex: 0 1 auto; max-height: 66%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.say { background: var(--panel); border: 1.5px solid var(--brass); border-radius: 12px; padding: 11px 14px; }
.say .n { font-size: 13px; color: var(--brass); }
.say p { margin: 0; font-family: var(--f-s); font-size: 17.5px; line-height: 1.7; }
.say.mono { border-color: #c9a24a66; }
.say.mono p { color: #e6d9c2; }
.hint { text-align: center; font-size: 12.5px; color: var(--muted); }
.btn { display: block; width: 100%; text-align: left; background: #1d140ef2; border: 1px solid var(--brass); border-left-width: 4px; border-radius: 8px; padding: 9px 12px; font-size: 16px; line-height: 1.45; }
.btn small { display: block; color: var(--muted); font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: linear-gradient(#e4c46e, #b38a34); color: #2a1c0c; border: 1px solid #f1d98f; text-align: center; font-weight: 600; }

.lbl { font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

.ev { display: block; width: 100%; text-align: left; background: #f1e9d8; color: var(--ink); border: 1px solid #d7c9ab; border-radius: 8px; padding: 9px 12px; }
.ev b { font-size: 16px; }
.evpic { float: right; width: 64px; height: 64px; object-fit: cover; border-radius: 6px; margin-left: 8px; }
.evshow { width: min(220px, 60%); align-self: center; border-radius: 10px; border: 2px solid var(--brass); box-shadow: 0 6px 18px #000a; }
.stamp.long { font-size: 21px; letter-spacing: 0; }
.ev-ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ev .ev-ico { color: #6b5a44; }
.ev .d { display: block; font-size: 15px; color: #4a4034; line-height: 1.55; }
.ev .tagr { font-size: 11.5px; background: var(--lose); color: #fff; border-radius: 3px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.sheet { position: fixed; inset: 0 0 calc(62px + env(safe-area-inset-bottom, 0px)) 0; z-index: 20; background: #000b; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: #f1e9d8; color: var(--ink); width: 100%; max-width: 480px; max-height: 76%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet h3 { margin: 0; font-family: var(--f-d); font-weight: 400; color: #6b4a1e; }
/* 재판: 본 게임 폰 화면과 같은 배치(사건 제목 위, 상대 왼쪽·우리 오른쪽, 게이지, 아래 대화창) */
#bg.court::after { background: linear-gradient(180deg, #140d0955 0%, #140d0922 35%, #140d0988 65%, #140d09e6 100%); }
#app.court { padding: 0; display: block; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
#app.quake { animation: quake .5s; }
@keyframes quake { 10%, 50%, 90% { transform: translate(-7px, 3px); } 30%, 70% { transform: translate(7px, -3px); } }
.court .top { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px; }
.court .bench { position: absolute; top: calc(68px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: 80%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.court .bench .no, .court .bench .who { color: #d6c6aa; font-family: var(--f-s); font-size: 11.5px; line-height: 1.5; text-shadow: 0 1px 3px #000; }
.court .bench .tt { font-family: var(--f-s); font-weight: 700; font-size: 15px; line-height: 1.5; text-shadow: 0 2px 6px #000; }
.court .sides { position: absolute; top: 32%; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.court .side { position: relative; width: 36%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 2px solid; box-shadow: 0 6px 18px #000; }
.court .side img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.court .side span { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11.5px; line-height: 1.5; background: #000b; padding: 2px; }
.court .side.opp { border-color: var(--lose); } .court .side.us { border-color: var(--win); }
.court.hit-us .side.us, .court.hit-opp .side.opp { animation: shake .45s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.court .gw { position: absolute; left: 16px; right: 16px; top: 58.6%; }
.gauge { position: relative; height: 34px; border-radius: 6px; overflow: hidden; background: linear-gradient(90deg, #6e2f27 0 var(--t1), #6a5426 var(--t1) var(--t2), #2f5a3a var(--t2)); border: 1px solid var(--line); }
.gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--paper); box-shadow: 0 0 8px #000; transition: left .5s cubic-bezier(.3,1.4,.6,1); }
.gauge-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; text-shadow: 0 1px 3px #000; }
.gauge.zw { animation: zw 1s ease-out; } .gauge.zl { animation: zl 1s ease-out; }
@keyframes zw { 0% { box-shadow: 0 0 0 0 #8fdc9f; } 30% { box-shadow: 0 0 18px 6px #8fdc9fcc; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes zl { 0% { box-shadow: 0 0 0 0 #ff7a66; } 30% { box-shadow: 0 0 18px 6px #ff7a66cc; } 100% { box-shadow: 0 0 0 0 transparent; } }
.court .log-wrap { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 3; max-height: calc(100% - 140px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.log-line { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; background: #140d09f0; border: 1.5px solid var(--brass); border-radius: 12px; padding: 12px; font-size: 18px; line-height: 1.5; box-shadow: 0 6px 18px #000a; animation: pop .25s ease-out; }

.log-line .who { font-size: 12px; color: var(--muted); display: block; }
.log-line .d { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; white-space: nowrap; }
.log-line .d.pos { color: var(--win); } .log-line .d.neg { color: var(--lose); }
.log-line .more { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--brass); }
.court .opts { display: flex; flex-direction: column; gap: 5px; }
.court .opts .btn { font-size: 15px; padding: 8px 12px; }
.cutin { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; pointer-events: none; }
.ci-band { position: relative; width: 100%; height: 150px; display: flex; align-items: center; gap: 14px; padding: 0 18px; overflow: hidden; }
.cutin.us .ci-band { background: linear-gradient(100deg, #0b2a5ae6, #1b4fa0e6 60%, #0b2a5ae6); animation: ciL var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.cutin.opp .ci-band { flex-direction: row-reverse; background: linear-gradient(260deg, #5a0b0be6, #a01b1be6 60%, #5a0b0be6); animation: ciR var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.ci-face { width: 128px; height: 128px; flex: none; border-radius: 10px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 20px #000a; }
.ci-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.ci-txt { font-family: var(--f-d); font-size: clamp(34px, 11vw, 54px); color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #000; transform: rotate(-4deg); white-space: nowrap; }
@keyframes ciL { 0% { transform: translateX(-100%) skewY(-4deg); } 18%, 80% { transform: translateX(0) skewY(-4deg); } 100% { transform: translateX(100%) skewY(-4deg); opacity: 0; } }
@keyframes ciR { 0% { transform: translateX(100%) skewY(4deg); } 18%, 80% { transform: translateX(0) skewY(4deg); } 100% { transform: translateX(-100%) skewY(4deg); opacity: 0; } }

.flash.white { background: #fff; } .flash.red { background: #ff2a1a; }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

.vd-top { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; }
.vd-stamp { width: 112px; height: 112px; display: grid; place-items: center; }

.ledger { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-variant-numeric: tabular-nums; background: #1f150fd1; border: 1px solid #c9a24a33; border-radius: 10px; padding: 8px 12px; font-size: 14px; }

<script>
const A = "assets/", H = { m: { n: "한서준", img: A + "hero-m.webp" }, f: { n: "윤서연", img: A + "hero-f.webp" } };
const OFF = Math.max(0, Math.min(3, +new URLSearchParams(location.search).get("office") || 0));
const BG = { court: A + "court-2.webp", m: `${A}office-${OFF}-m.jpg`, f: `${A}office-${OFF}-f.jpg` };
const OLD_BG = ["rec", "er", "diner", "alley", "dock", "rest"];
// 아직 그림이 없는 장소는 비슷한 그림으로 대신한다(그림이 들어오면 여기서 지운다)
const PENDING_BG = {};

  toCourt: ["기록을 처음부터 끝까지 한 번 더 읽었다. 재판에서 내가 할 일은 검사가 내놓은 증거가 제대로 모은 것인지 하나씩 따지는 것이다.", "재판 날 아침, 약국 앞에서 아래층 약사가 잘 다녀오시라고 손을 흔들었다. 서류 가방을 고쳐 들고 법원으로 향했다."],
  client: { n: "오명환", m: "52세 · 서해광역시 건축과장", img: A + "story/face-oh-50.webp" },
  prologue: [{ bg: "m4-kang-office", lines: [
    [null, "2030년 1월. 개업했다는 소식도 전해 드릴 겸 인사를 드리러 법무법인 목멱에 들렀었다. 대학 시절 내 모의법정 지도교수였던 강도윤 교수님의 사무실이다."],
    [null, "교수님은 검사장까지 지내고 나와서 이 법인을 세우셨다. 그러고도 일주일에 한 번은 학교에 나가 학생들을 가르치신다."],
    ["강도윤", "서준이 왔구나. 앉아라. 커피는 내가 타마. 네가 탄 커피는 모의법정 때 이미 질렸다.", A + "story/face-kang.webp"],
    ["한서준", "교수님, 그때 일은 이제 잊어 주십시오. 설탕을 소금으로 착각한 건 딱 한 번이었습니다.", A + "story/cut/hero-m.webp"],
    ["강도윤", "한 번이면 충분하지. 그래, 사무실은 어디에 차렸다고? 사람들이 오기는 하는 동네냐?", A + "story/face-kang.webp"],
    ["한서준", "이 근처 남산 밑 동네 상가 2층입니다. 아래층이 약국이고 옆집이 보습학원이요. 월세가 싸서요.", A + "story/cut/hero-m.webp"],
    ["강도윤", "잘했다. 처음부터 서초동에 앉아서 전화만 기다리는 놈들보다 낫다. 사람 사는 데서 사람 일을 봐야 변호사가 되는 거다.", A + "story/face-kang.webp"],
    ["한서준", "교수님, 그때 등록금 말입니다. 이제 조금씩이라도 갚아 드리고 싶습니다.", A + "story/cut/hero-m.webp"],
    ["강도윤", "또 그 소리다. 3학년 2학기 고지서를 들고 복도에서 서성이던 놈 얼굴을 내가 아직 기억한다. 갚으려거든 나중에 돈 없는 의뢰인한테 갚아라.", A + "story/face-kang.webp"],
    ["강도윤", "자, 개업 선물이다. 내가 직접 썼어. 표구는 인사동까지 가서 맡겼으니까 떨어뜨리지 마라.", A + "story/face-kang.webp"],
    [null, "교수님이 내민 것은 두 팔로 안아야 할 만큼 큰 액자였다. 먹빛이 짙은 네 글자. 수구여병(守口如甁)."],
    ["한서준", "입을 병마개처럼 지켜라, 맞습니까?", A + "story/cut/hero-m.webp"],
    ["강도윤", "입 지키기를 병 막듯 하라. 주자가 제 마음 다잡으려고 쓴 글에 나오는 말이다. 내가 처음 사무실을 열던 날 내 은사께서 이 넉 자를 써 주셨지. 그 뒤로 제자가 개업할 때마다 나도 똑같이 써 준다.", A + "story/face-kang.webp"],
    ["강도윤", "서준아, 의뢰인이 너를 찾아올 때는 세상에 아무한테도 못 할 말을 들고 온다. 변호사는 그 말을 무덤까지 가져가는 사람이다. 판사도 검사도 그 입은 못 연다. 법이 그렇게 정해 둔 거야.", A + "story/face-kang.webp"],
    ["한서준", "그 말씀은 수업 때도 몇 번이나 하셨습니다.", A + "story/cut/hero-m.webp"],
    ["강도윤", "시험에 안 나와서 아무도 안 듣더구나. 벽에 걸어 놓고 매일 봐라. 힘든 날에 전화하고. 밥은 내가 산다.", A + "story/face-kang.webp"],
    [null, "액자를 안고 계단을 내려오는데 어깨가 절로 펴졌다. 세상에 내 편이 한 사람은 있는 것 같았다."]] }],
  intro: ["개업한 지 석 달째. 동네 상가 2층, 아래층은 약국이고 옆집은 보습학원이다. 오후 네 시면 아이들 뛰어다니는 소리가 벽을 타고 올라온다.", "벽에 걸어 둔 액자가 이 사무실에서 제일 비싼 물건이다. 수구여병. 입을 병마개처럼 지켜라.", "커피는 믹스 한 상자로 석 달째 버티는 중이다. 손님이 오면 두 봉을 넣고, 혼자 마실 때는 한 봉으로 두 잔을 탄다. 이번 달은 아직 손님 몫을 한 봉도 뜯지 못했다.","퇴근 무렵, 진남색 정장에 태극 배지를 단 남자가 계단참에서 한참 두리번거리더니 문을 닫고 들어왔다. 반백 머리를 뒤로 단정하게 넘긴 사람이었다."],
  greet: [
    ["c", "안녕하십니까. 오명환이라고 합니다. 여기가 한서준 변호사님 사무실 맞지요?"],
    ["h", "네, 제가 한서준입니다. 앉으시죠. 차라도 한 잔 드릴까요?"],
    ["c", "아닙니다, 괜찮습니다. 문은 닫혔지요? 서해광역시 변호사들은 다들 시청 일에 한 다리씩 걸치고 있어서 그쪽에는 못 갑니다. 아래층 약국 약사님이 제 처제인데, 위층에 새로 온 변호사가 있다면서 명함을 주더군요."],
    ["h", "약사님께 감사드려야겠네요. 문은 닫혀 있습니다. 여기서 하시는 말씀은 절대 밖으로 나가지 않으니까 편하게 말씀하세요. 저기 액자 보이시죠? 수구여병이라고, 변호사는 반드시 의뢰인의 비밀을 지켜야 한다는 뜻입니다. 걱정하지 마세요."],
    ["c", "수구여병이라. 믿음이 가네요. 저는 서해광역시청 건축과장으로 있는 사람입니다. 공무원 생활만 이십 년을 넘게 했습니다."],
    ["h", "그런데 어떤 일로 오셨습니까?"],
    ["c", "법원에서 공소장이 날아왔습니다. 두 달 전 금요일에 부서 회식을 하고 사고가 났는데, 제가 술을 먹고 운전을 했다는 겁니다."],
    ["h", "사람이 다쳤습니까?"],
    ["c", "골목에서 보행자 한 분이 치였어요. 전치 6주랍니다. 저도 그 자리에서 의식을 잃어서 병원에서 깨어났고요."],
    ["h", "그러면 위험운전치상입니다. 술에 취해 제대로 운전하기 어려운 상태로 사람을 다치게 한 경우인데, 보통 음주운전보다 훨씬 무겁게 처벌합니다."]],
  opening: "근데 변호사님, 저는 운전 안 했습니다. 대리기사가 몰았고, 사고가 나니까 그 사람이 도망간 겁니다.",
  hireLine: ["고맙습니다, 변호사님. 공소장하고, 그 대리기사가 써 준 확인서도 여기 가져왔습니다.", "이번 일은 시청에 절대 새어 나가면 안 됩니다."],

    ["대리기사는 어떻게 부르셨어요?", ["앱으로 불렀습니다. 회식 끝나고 식당 앞에서요. 몇 분 있으니까 기사가 왔고, 같이 골목 안 주차장까지 걸어가서 저는 뒷자리에 탔지요.", "얼굴은 어두워서 기억이 안 납니다. 모자를 쓰고 있었던 것 같기도 하고요."], ["app"]],
    ["그날 술은 얼마나 드셨어요?", ["부서 회식이라 소주 몇 잔 했습니다. 시청 앞 대성식당이라고, 우리 과가 늘 가는 고깃집이에요. 삼겹살이 괜찮습니다. 만취할 정도로 마신 것도 아니었지만… 그래도 혹시 몰라서 대리기사는 불렀습니다."], ["diner"]],
    ["전에도 음주로 처벌받은 적 있으세요?", ["…7년 전에 한 번요. 벌금 내고 끝났습니다. 그때 징계를 받고 승진이 3년 밀렸어요.", "집사람이 그 뒤로 차 키를 현관 서랍에 넣어 두게 했습니다. 술 마시는 날은 키를 두고 나가라고요.", ["한서준", "같은 전과가 있으면 이번에는 벌금으로 끝나기 어렵습니다. 정말 음주운전을 하신 게 맞다면요."], "저는 진짜 아닙니다. 술 마시는 날은 절대 운전 안 해요."], []],
    ["누가 과장님을 봤다는 거죠?", ["우리 과 정한별 주무관이요. 사고 난 골목 어귀에서 제가 운전석에서 내리는 걸 봤답니다.", "그 친구도 그날 회식 자리에 있었어요. 저한테 감정이 좀 있습니다."], ["alley"]],
    ["왜 저를 찾아오셨어요?", ["시청 근처 변호사들은 다 시청 일을 하거나 시청 사람하고 줄이 닿아 있습니다. 거기 가면 다음 날 국장 귀에 들어가요. 소문나면 재판 받기 전에 제가 먼저 죽습니다.", "변호사님은 개업하신 지 얼마 안 됐고, 시청 일은 안 하셨잖아요. 집에서 가깝기도 하고요.", [null, "새로 연 사무실이라서 왔다는 말이다. 소문이 안 나서 좋다는 건지, 아직 뭘 잘 모를 테니 좋다는 건지는 알 수 없었다."]], []],
    ["유죄가 나오면 어떻게 되는 건가요?", ["저 지금 국장 승진 명단에 올라 있습니다. 올해가 마지막 기회예요.", "그런데 금고 이상 형이 나오면 공무원 자리가 그날로 끝이라고 들었습니다. 집행유예도 마찬가지라면서요?", ["한서준", "네. 금고 이상이면 집행유예라도 당연퇴직입니다. 벌금이면 자리는 지키실 수 있지만 징계는 따로 받으실 겁니다."], "…뭐, 징계면 괜찮겠습니다만 퇴직만은 안 됩니다. 무조건 무죄 아니면 벌금을 받아 주셔야 해요."], []],
    ["사고 때 기억나는 게 있으세요?", ["뒷자리에서 졸았습니다. 쿵 하는 소리에 눈을 떴던 것 같기도 하고, 그다음엔 병원 천장이에요.", "정말 죽는 줄 알았어요. 그렇게 무서운 적이 없었습니다. 그런데 아무리 찾아도 대리기사는 안 보이고… 당황스러웠습니다."], []],
    ["정한별 주무관과는 무슨 일이 있었나요?", ["서류를 몇 번 돌려보낸 일이 있지요. 제가 글자 틀린 걸 못 보는 성격이라. 작년 근무평정도 좋게 못 줬고요.", "아랫사람들은 그런 걸 오래 담아 둡니다. 요새는 자기 일도 아닌 제 결재 서류를 자꾸 들여다보고 다녀요."], [], ["q3"]],
    ["다친 분과는 합의가 됐나요?", ["집사람이 병원에 찾아가서 합의금을 드렸습니다. 처벌을 원하지 않는다는 서류도 받았고요.", "세탁소 하시는 분인데 두 달을 문을 닫으셨다고 해서 면목이 없었습니다. 혹, 합의서로 어떻게 잘 처리될 수는 없을까요?", ["한서준", "아쉽지만 아닙니다. 위험운전치상은 반의사불벌죄나 친고죄가 아니기 때문에 이런 경우는 피해자가 처벌을 원하지 않아도 재판이 계속됩니다. 합의서는 형을 정할 때 참작되는 정도예요."], "…그렇습니까. 집사람이 그 돈을 어떻게 마련했는데."], []],
    ["대리기사 사실확인서는 어떻게 받으셨어요?", ["며칠 전에 집 우편함에 들어 있었습니다. 그 사람도 양심에 찔렸는지 '그날 제가 운전했습니다' 하고 손으로 써서 넣어 놨더라고요.", "이름은 있는데 연락처는 없습니다. 찾을 방법이 없어요."], [], ["q0"]],
    ["선처를 구하는 글도 준비하셨나요?", ["탄원서를 제가 직접 써 뒀습니다. 그래도 나랏밥 먹은 지 오래돼서 글씨 하나는 주변에서 알아줍니다. 끝에 서명도 해 놨어요.", ["한서준", "본인이 쓰신 글은 보통 탄원서가 아니라 반성문이라고 합니다. 그런데 과장님, 운전을 안 하셨다면서 무엇을 반성하신다는 겁니까?"], "…다친 분께 죄송하다는 거지요. 제 차에서 난 사고니까요. 사본은 드릴 테니 가지고 계십시오."], [], ["q8"]],
    ["공소장에는 0.172%라고 돼 있던데요?", ["그러니까 제가 어이가 없는 겁니다. 소주 몇 잔에 그런 숫자가 어떻게 나옵니까.", "의식도 없는 사람 피를 뽑았다는데, 그게 제 피가 맞는지부터 따져 봐야지요."], []],
    ["대리 앱 회사에 그날 호출 기록이 없다던데요.", ["그럴 리가요. 분명히 앱으로… 아니, 그날은 앱이 잘 안 돼서 전화로 불렀던가.", "술이 좀 들어가서 그 부분은 저도 헷갈립니다. 아무튼 기사가 왔어요. 그건 확실합니다.", [null, "소주 몇 잔 마신 사람치고는 헷갈리는 게 많다."]], [], ["nohail"]],
    ["식당 사장님은 과장님이 혼자 한 병은 넘게 드셨다던데요.", ["사장이야 매상 올린 건 기억하겠지요. 열두 명이 마신 걸 누가 몇 잔 마셨는지 어떻게 압니까.", "저는 진짜 몇 잔 안 마셨습니다. 과장이 회식에서 취하면 다음 날 아랫사람들 얼굴을 못 봅니다."], [], ["t:drank"]],
    ["골목 슈퍼 주인은 그날 뛰어가는 사람을 못 봤답니다.", ["어두웠잖습니까. 그 양반이 셔터 내리느라 못 본 거겠지요.", "사람이 겁나면 얼마나 빨리 뛰는데요. 저라도 도망갔을 겁니다."], [], ["t:runaway"]],
    ["회식 중에 전화를 받으러 자주 나가셨다던데요.", ["업무 전화입니다. 해안 복합개발 심의가 코앞이라 밤낮이 없어요. 업체도 전화하고 위원들도 전화하고.", "그건 이 사건하고 상관없지 않습니까. 시청 일은 묻지 말아 주십시오."], [], ["t:calls"]],
    ["차 키를 두고 다니신다면서, 그날 차는 왜 가지고 나가셨어요?", ["아침에 출근할 때 몰고 나왔습니다. 회식이 잡힌 줄 몰랐어요. 오후에 국장님이 갑자기 한턱내라고 하셔서요.", "그러니까 대리를 불렀지요. 집사람한테는 차 놓고 간다고 해 놓고… 이건 집사람한테 말하지 마십시오."], [], ["q2", "q0"]]],

        { id: "wstmt", q: "목격자 진술조서를 읽는다", req: ["t:recopen"], opens: ["city"], a: ["정한별, 서해광역시청 건축과 주무관. '회식이 끝나고 식당 앞에 서서 담배를 한 대 피우다가 쿵 소리를 듣고 뒤 돌아보았습니다. 과장님이 운전석에서 내리시는 것을 보았습니다.'", "'가로등 밑이라 잘 보였습니다. 저는 그날 술을 거의 마시지 않았어서.. 기억은 명확합니다.", "끝에 이런 말이 붙어 있다. '요즘 과장님은 해안 복합개발 심의 서류를 혼자 붙들고 계셨습니다.' 사고와는 상관없는 말 같은데 굳이 이런 내용까지 다 적어놨군."] },

          { id: "stay", q: "끝까지 남은 사람이 있었나요?", req: ["t:dopen"], a: ["안경 쓴 분이요. 금속테 안경에 회갈색 재킷 입은 분.", "과장님이 잔을 주면 넙죽넙죽 받아서 다 드셨어요. 이름이 뭐라더라.. 정 뭐라고 했는데. 상사가 주는 술을 어떻게 안 마시겠어요. 술도 안 세 보이더구만. 끝날 때까지 과장님 옆에 계셨는데 나중에는 술이 좀 올랐는지 밖에서 바람 쐬더라고요.", "그날 영수증 찾아 드릴까요? 카드 전표 옆에 제가 방 번호랑 인원을 적어 두거든요."],
            gives: ["receipt", { n: "회식 영수증", d: "12명, 소주 11병. 사장은 안경 쓴 직원이 끝까지 함께 마셨고, 가게 앞에 대리기사는 오지 않았다고 했다.", img: "ev/m1-receipt.webp" }] },
          { id: "front", q: "회식이 끝나고 가게 앞은 어땠어요?", req: ["t:dopen"], a: ["11시 반쯤 파했어요. 다들 택시 잡으러 큰길로 가고, 과장님은 골목 안 주차장 쪽으로 가셨지요. 안경 쓴 분은 가게 앞에서 담배를 피우시고.", "대리요? 대리 기사가 오면 다들 가게 앞에서 기다리니까 제가 보거든요. 그날은 못 봤어요.", "저는 불판 닦느라 그다음은 못 봤죠. 쿵 소리 나서 나가 보니 벌써 사람들이 몰려 있더라고요."] },
          { id: "calls", q: "회식 자리에서 과장님은 어떠셨어요?", req: ["t:drank"], a: ["요즘 해안 복합개발인가 그것 때문에 시청 분들이 바빠요. 그래서 늘 늦게들 스트레스 푼다고 회식하러 오세요.", "그 과장님은 회식 중에도 전화를 받으러 밖으로 몇 번씩 나가셨어요. 한 번은 양복 입은 남자가 가게 앞에 차를 대 놓고 기다리다가 과장님하고 몇 마디 하고 갔고요.", "큰 사업 하는 데는 다 그런가 봐요."] },
          { id: "dphoto", q: "벽에 붙은 사진은 다 회식 사진인가요?", req: ["t:front"], a: ["시청 분들 오시면 제가 꼭 한 장씩 찍어 드려요. 제가 학창시절에 사진 동호회 활동을 좀 했었어서 .. 다 제 작품입니다. 기획예산과는 저기, 환경과는 저기, 감사실은 저 구석.", "3월 15일 건축과요? 있지요. 그날은 국장님도 오셔서 제가 특별히 두 장 찍었어요. 한 장은 국장님이 눈을 감으셔서요.", ["한서준", "그 사진을 빌려 갈 수 있을까요?"], "엥. 사진 그냥 찍어가시면 되지 저걸 왜 빌려가세요. 떼 가시면 그 자리가 비잖아요. 제 작품이라니까요. 플래시는 터뜨리지 마시고요. 사진 바래요.", [null, "열두 명이 불판 앞에 앉아 있다. 오명환 옆에 머리가 희끗한 국장이 앉았고, 맞은편 계장도 반백이다. 셋 다 짙은 남색 양복이다."], [null, "밝은 데서 봐도 체격이 비슷하다. 어두운 골목에서 뒷모습만 보고 셋을 가려낼 자신은 없다."]],
            gives: ["photo", { n: "회식 단체 사진", d: "그날 대성식당에서 찍은 사진. 피고인과 국장, 계장 세 사람이 모두 반백에 짙은 남색 양복 차림이고 체격도 비슷하다.", img: "ev/m1-photo.webp" }] },
          { id: "daudit", q: "시청에 감사 기간이라 다들 술을 자제했다던데요.", req: ["t:jdrink"], a: ["음. 평소에 비하면 자제한건가? 오과장님 혼자서 서너병도 드시니까. 그날 열두 분이 소주 열한 병 드셨어요.", "근데 감사 기간이면 오히려 더 드시던데요. 다들 속이 타는지. 감사 기간이라고 술을 자제한 건 아닐 것 같아요."] }] }] },
    alley: { n: "사고 골목", s: "직접 둘러보기", bg: "alley",
      arrive: ["밤 11시 40분, 사고가 난 시각에 맞춰 골목에 와 봤다. 큰길 불빛이 골목 어귀에서 끊긴다.", "어귀의 작은 슈퍼에서 주인이 셔터를 반쯤 내리고 있다."],
      desc: "골목 안쪽으로 공영주차장 간판이 보인다. 차 한 대가 겨우 지나갈 너비다.",
      people: [{ id: "shop", n: "슈퍼 주인", face: A + "cut/n60f4.webp",
        intro: ["문 닫는 중이에요. 뭐 사시게요?", ["한서준", "아… 죄송합니다. 물건 사러 온 건 아니고요."], "아, 그럼 뭐요. 화장실이라도 급해?", ["한서준", "아이고, 아닙니다. 죄송합니다. 뭐 좀 여쭤보려고요."]],
        topics: [
          { id: "runaway", q: "3월에 여기서 난 사고를 보셨어요?", a: ["봤지요. 이 시간쯤 셔터 내리다가 쿵 소리가 나서 내다봤어요.", "차가 저 전봇대에 박혀 있고, 남자 하나가 운전석 옆에 주저앉아 있더라고요. 다친 양반은 전봇대 앞에 쓰러져 있고.", "도망가는 사람이요? 못 봤어요. 이 골목은 외길이라 누가 큰길로 뛰어가려면 우리 가게 앞을 지나가야 할텐데. 글쎄.. 제 기억에는 없네요."] },
          { id: "lampday", q: "저 가로등은 언제부터 꺼져 있었어요?", req: ["t:lamp"], a: ["두 달 됐나. 구청에 민원을 세 번 넣었는데 아직이에요.", "사고 난 날도 꺼져 있었지요. 그러니까 사고가 나지. 우리 가게 불 끄면 여기는 깜깜해요."] },
          { id: "carlight", q: "그날 사고 난 차는 불이 켜져 있었나요?", req: ["alley"], a: ["불이요? 하나도 없었어요. 앞이 저렇게 찌그러졌는데 불이 켜져 있겠어요. 깜깜해서 내가 셔터를 도로 올리고 가게 불을 켰다니까요.", "그래 봐야 우리 가게 불은 저 전봇대까지 안 가요. 사람 쓰러진 것도 가까이 가서야 알았어요.", "근데 아까 줄자 들고 바닥을 기어 다니던 양반이 변호사였어요? 나는 구청에서 드디어 가로등 고치러 온 줄 알고 반가워했네.", ["한서준", "죄송합니다. 가로등 민원은 제가 한 번 더 넣어 드리겠습니다."], "미안한 줄은 아나 보네. 그럼 뭐라도 하나 사 가요. 퇴근하려는 사람 붙잡고 30분이나 떠들었으면.", ["한서준", "그… 죄송한데… 제가 진짜 돈이 별로 없어서요. 생수 하나만 주십시오. 제일 싼 걸로요."], "뭔 놈의 변호사가 돈이 없어? 웃기는 양반이네. 에휴… 여깄소. 생수. 천 원, 현금으로.", [null, "결국 천 원짜리 생수를 하나 샀다. 계산대 옆에 '가로등 민원 4회째'라고 적힌 쪽지가 붙어 있었다. 아까 세 번이라더니, 또 넣으시려고 준비 중이셨나 보다."], [null, "차에 불이 안 들어왔다면 실황조사서에도 적혀 있을지 모른다. 기록을 다시 봐야겠다."]] }] }],
      looks: [
        { id: "lamp", q: "가로등을 살핀다", a: ["사고가 난 전봇대 위 가로등이 꺼져 있다. 덮개 안에 날벌레가 까맣게 들어차 있다.", "골목 어귀는 어둡다. 큰길 불빛은 여기까지 오지 않는다."] },
        { id: "measure", q: "식당 앞에서 사고 지점까지 재 본다", req: ["t:wstmt", "t:lampday"], a: ["정한별이 섰다는 식당 앞에서 전봇대까지 줄자를 끌어가며 길이를 쟀다. 약 128미터. 지나가던 고등학생이 이상하다는 듯 쳐다본다.", "식당 앞에 서서 전봇대 쪽을 보았다. 사람이 서 있는 건 알겠는데 얼굴은 보이지 않는다.", "조서에는 가로등 밑이라 잘 보였다고 적혀 있었다. 그 가로등은 그날 꺼져 있었다."],
          gives: ["alley", { n: "현장 사진·거리 측정", d: "사고 지점 위 가로등은 그날도 꺼져 있었다. 정한별이 섰던 식당 앞까지 약 128m.", img: "ev/m1-alley.webp" }] },
        { id: "banner", q: "담벼락의 현수막을 본다", a: ["'해안 복합개발 건축심의 예정.' 요즘 시내 어디를 가도 보인다.", "조감도 속 타워는 구름에 닿을 듯 길쭉하게 그려져 있다."] }] },
    city: { n: "서해광역시청", s: "건축과 정한별 주무관", bg: "m3-cityhall", gated: true,
      arrive: ["서해광역시청 본관. 로비에 해안 복합개발 조감도가 크게 걸려 있다.", "검사 쪽 증인을 만나는 건 조심해야 하는 일이다. 말을 맞추자는 것처럼 보이면 안 된다. 물을 것만 묻기로 하고 건축과에 면담을 청했다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["오 과장님 변호사시라고요. 오래는 못 있습니다. 과장님이 자리를 자주 비우셔서 일이 밀려 있어요.", [null, "금속테 안경에 회갈색 재킷. 서류 뭉치를 가슴에 안고 로비로 내려왔다."]],
        topics: [
          { id: "jsaw", q: "그날 보신 걸 직접 듣고 싶습니다.", a: ["경찰에서 말씀드린 그대로입니다. 쿵 소리가 나서 돌아보니 과장님이 운전석에서 내리셨습니다.", "가로등 밑이라 잘 보였습니다. 법정에서도 똑같이 말할 겁니다."] },
          { id: "jdrink", q: "그날 술은 얼마나 드셨어요?", req: ["t:jsaw"], a: ["거의 안 마셨습니다. 한두 잔 받아 놓기만 했습니다.", "요즘 감사실에서 공직기강 점검을 하고 있어서요. 회식을 해도 술은 자제하라는 공문이 내려와 있습니다."] },
          { id: "jstop", q: "과장님이 주차장 쪽으로 가실 때 말리지는 않으셨어요?", req: ["t:jsaw"], a: ["거기서 대리를 부르신 줄 알았습니다.", "그리고 저희 과에서 과장님께 운전하지 마시라고 말할 수 있는 사람은 없습니다. 제가 그 말을 했으면.. 난리가 났겠죠. 지금쯤 제 업무는 두 배가 돼 있을거고요."] },
          { id: "jgrudge", q: "과장님과 사이가 좋으셨나요?", req: ["t:jsaw", "q7"], a: ["뭐, 일반적인 직장의 상사와 부하직원. 그 이상도 이하도 아니지요. 오과장님이 의외로 좀 깐깐한 분이라 제가 올리는 서류 반려도 자주하시기도 하고.", "그렇다고 제가 거짓말로 오과장님이 음주운전했다고 말 할 이유도 없습니다.  저도 이 일로 마음이 편하지 않습니다.", "그 동안 해안 복합개발 심의 자료 과장님 그래도 많이 봐주셔서 덜 바빴는데, 과장님 안 나오니 보십시오. 가장 정신없이 일하고 있는게 누구인지…사건과 상관없는 얘기네요. 바빠서 이만 들어가 보겠습니다."] }] }] },
    kang: { n: "강도윤 교수님께 전화", s: "개업 선물을 주신 은사",
      arrive: ["휴대폰을 들었다. 교수님은 신호가 두 번 가기도 전에 받으셨다."],
      people: [{ id: "kang", n: "강도윤", face: A + "story/face-kang.webp",
        intro: ["그래, 서준이구나. 밥은 먹고 다니냐?", ["한서준", "네. 점심은 편의점 도시락에 아랫층 약사님이 주신 구론산 먹었습니다."], "그게 밥이냐, 개업한지 얼마 안 되어 자리 잡기 전이라 역시 힘들지? 약사 양반이 너를 먹여 살리는구나. 이번 주말에 와라. 고기 사 주마."],
        topics: [
          { id: "kfirst", q: "교수님, 형사 사건을 하나 맡았습니다.", req: ["sun"], a: ["벌써? 그 동네에서? 잘됐다. 약사 양반한테 인사라도 해 뒀나 보구나.", "처음 맡는 사건은 평생 기억에 남는다. 나는 초임 때 사건이 아직도 꿈에 나와.", "서두르지 말고 기록부터 네 눈으로 다 읽어라. 남이 정리해 준 걸 믿지 말고."] },
          { id: "kblood", q: "근데 수사기관이 의식이 없는 사람한테서 영장 없이 피를 뽑았습니다. 증거능력을 다툴 수 있겠습니까?", req: ["nowarrant"], a: ["영장이 없다고? 그럼 그것부터 잡아야지. 사람 몸에서 피를 뽑는 건 압수다. 의식이 없으니 동의도 못 받고.", "검사는 틀림없이 급했다고 할 거다. 급하면 먼저 뽑을 수는 있어. 대신 그 뒤에 지체 없이 영장을 받아야 해. 사후영장이라도 없으면 재판에서 못 쓴다.", "하나 더. 가족이 와서 대신 동의했다는 말이 나올 수도 있다. 그건 안 된다. 피를 뽑는 데 동의하는 건 본인만 할 수 있어. 병원에 가서 그날 일을 직접 물어봐라."] },
          { id: "klie", q: "교수님, 의뢰인이 저한테 거짓말을 하는 것 같으면 어떻게 해야 합니까?", req: ["nohail"], a: ["좋은 질문이다. 수업 때 그런 걸 물은 놈이 있었나 모르겠다.", "먼저 네 눈으로 확인해라. 거짓말인 걸 알았으면 그 거짓말을 법정에 내놓지는 마라. 가짜인 줄 아는 서류를 내거나 의뢰인한테 거짓 증언을 시키면 그때부터는 너도 같이 죄를 짓는 거다.", "다만 검사가 증명하지 못한 걸 네가 대신 증명해 줄 의무는 없다. 그리고 들은 말은 내가 준 액자에 적힌 그 넉 자대로 하는 거다. 너무 어렵게 생각하지 말고, 밥 먹어라."] },
          { id: "kframe", q: "그 액자는 왜 제자들한테 똑같이 써 주십니까?", req: ["t:kfirst"], a: ["돈 드는 일이 아니니까 그렇지. 먹하고 종이값이면 된다.", "농담이다. 제자들이 어디서 어떤 사건을 하든 같은 글자를 보고 산다고 생각하면 내 마음이 좀 놓인다. 늙으면 그런 게 위안이 되더라.", [null, "교수님 목소리가 잠깐 낮아졌다. 수화기 너머에서 서류 넘기는 소리가 났다."]] }] }] } },
  lies: [["대리기사가 운전했다는 말", -1], ["앱으로 대리기사를 불렀다는 말", 0], ["소주 몇 잔만 마셨다는 말", 1]],
  keyLie: 1, altLie: 0, keyCard: "nohail",

      ["앵커", "속보입니다. 서해광역시 해안 복합개발 단지의 49층 건물, 스타포트 타워가 무너졌습니다. 상업시설이 문을 연 지 19일째로, 지하 매장에 손님과 직원이 많았던 것으로 보입니다."],
      [null, "화면 속 건물은 위에서부터 접히듯 주저앉아 있었다. 흙먼지가 가라앉는 데 한참 걸렸다. 아무도 말을 하지 않았다."],
      ["앵커", "구조 당국은 지하 1층과 2층에 아직 많은 사람이 갇혀 있는 것으로 보고 있습니다."]] },
    { bg: "m2-altar", lines: [
      [null, "사흘 뒤, 변호사회에서 유족 법률 상담 자원자를 찾는다는 문자가 왔다. 서해광역시로 내려가는 첫차를 탔다."],
      [null, "분향소 옆 천막에 이틀을 앉아 있었다. 그사이 사망자는 143명으로 늘었다."],
      [null, "사람들이 묻는 것은 법이 아니었다. 시신은 언제 찾을 수 있느냐, 보험회사에는 누가 전화하느냐, 죽은 딸 휴대폰 요금은 어떻게 끊느냐."],
      [null, "천막 기둥에 신문 기사 한 장이 붙어 있었다. 시행사가 '사업 자문' 명목으로 수십억을 쓴 회사들 가운데 도원컨설팅이라는 이름에 누가 볼펜으로 동그라미를 쳐 놓았다."],
      [null, "도원컨설팅. 박진서가 세운 회사다. 사람은 구치소에 있는데 이름은 아직 이런 데서 나온다."]] },
    { bg: "m4-kang-office", lines: [
      [null, "이듬해 초, 이삿짐을 다 풀기도 전에 들를 데가 있었다. 법무법인 목멱, 대학 은사 강도윤 교수님의 방이다."],
      [null, "창 너머로 남산이 걸려 있었다. 교수님은 오늘도 조끼까지 갖춰 입고 앉아 무테안경 너머로 나를 보셨다."],
      ["강도윤", "서연이 왔구나. 앉아라. 서초동으로 나왔다면서.", A + "story/face-kang.webp"],
      ["윤서연", "네, 교수님. 법조타운이라 월세가 무섭긴 한데요.", A + "hero-f.webp"],
      ["강도윤", "월세는 무서워해도 된다. 의뢰인을 무서워하지만 마라. 타워 상담 천막에 앉아 있었다는 얘기는 들었다. 고생했다.", A + "story/face-kang.webp"],
      ["윤서연", "고생은 그분들이 하셨죠. 저는 이틀 앉아 있다가 왔어요. 아무것도 못 해 드리고요.", A + "hero-f.webp"],
      ["강도윤", "이틀이라도 앉아 있던 사람이 드물다. 큰 사고가 나면 우리 같은 데도 바빠진다. 좋은 일로 바쁜 게 아니라서 그렇지.", A + "story/face-kang.webp"],
      ["강도윤", "내가 써 준 액자는 챙겼고?", A + "story/face-kang.webp"],
      ["윤서연", "제일 먼저 쌌어요. 수구여병. 입을 병마개처럼 지켜라.", A + "hero-f.webp"],
      ["강도윤", "그래. 사무실 벽지는 바뀌어도 그 글씨는 바뀌면 안 된다. 그나저나 밥은 먹고 다니냐? 너희 학번은 개업만 하면 밥을 굶더라.", A + "story/face-kang.webp"],
      ["윤서연", "교수님 앞에서 밥 얘기하면 또 사 주실 거잖아요. 등록금 못 내서 과사무실 앞에서 서성이던 애들 일도 저희 다 알아요. 누가 대신 내 주셨는지도요.", A + "hero-f.webp"],
      ["강도윤", "난 모르는 일이다. 밖에 나가서 그런 소리 하지 마라.", A + "story/face-kang.webp"],
      ["강도윤", "막히는 사건 있으면 와라. 전화로 말고 얼굴 보고. 밤이든 주말이든 괜찮아. 늙은이가 방에 불 켜 놓을 핑계도 되고.", A + "story/face-kang.webp"],
      [null, "돌아오는 길에 철물점에서 못을 하나 샀다. 액자 걸 자리는 이미 정해 두었다."]] }],
  intro: ["창밖으로 법원 건물 모서리가 보인다. 월세는 전보다 세 배가 됐다.", "법률구조 사건은 줄었고 이혼 사건이 늘었다. 창 옆 벽에는 수구여병 액자를 걸었다.", "옛 기록철은 상자째 서랍장 맨 아래 칸에 밀어 넣었다. 타워가 무너진 지 열 달이 지났는데 TV에는 아직도 구속된 시행사 회장 얼굴이 나온다.", "이사하고 첫 주, 예약 명단에서 낯익은 이름을 보았다. 4년 전 택배 절도 사건의 고소인."],
  greet: [["c", "오랜만이에요, 변호사님. 이수아입니다. 기억하세요?"], ["h", "…네. 방재호 씨 사건 고소인이셨죠. 앉으세요. 이렇게 다시 뵐 줄은 몰랐어요."], ["c", "저도요. 법정에서 저를 그렇게 몰아세우시던 분 사무실에 제 발로 올 줄은 몰랐죠."], ["h", "그때는 제 일을 한 거예요. 오늘은 어떤 일로 오셨어요?"]],
  opening: "증거인멸로 기소됐어요. 제가 다니던 회사 장부를 없앴다고요. 변호사님, 그 택배가 어디로 갔는지는 저보다 변호사님이 더 잘 아시잖아요.",
  qs: [
    ["그 사건에 대해서는 제가 아무 말씀도 드릴 수 없어요. 그보다, 무슨 장부예요?", [
      "도원컨설팅 대표가 손으로 쓰던 장부요. 박진서요. 뉴스에 나온 그 사람.",
      "누구한테 얼마를 줬고 누구 사건을 어떻게 했는지, 그런 거요. 그런데 대표가 이상하게 써 놨어요. 남이 펼쳐 보면 그냥 소설 같아요. 문장처럼 죽 이어서 쓰고, 이름이나 숫자는 자기만 아는 말로 바꿔서요.",
      "대표가 구속된 뒤로는 제가 접견 가서 불러 주는 걸 받아 적어 이어 썼어요. 무슨 뜻인지는 저도 반도 몰라요. 받아 적으라니까 적은 거예요.",
      [null, "남이 보면 소설 같은 장부. 그걸 받아 적으러 구치소를 드나든 사람이 지금 내 앞에 앉아 있다."]], []],
    ["왜 하필 저한테 오셨어요?", [
      "다른 변호사들은 도원 얘기만 나오면 전화를 안 받아요. 세 군데서 잘렸어요. 한 군데는 상담료까지 받고 나서 못 하겠다고 하더라고요.",
      "그리고 변호사님은 4년 전에 저를 이겼잖아요. 저를 이긴 사람이면 저쪽도 이길 수 있겠다 싶었어요.",
      "…농담이에요. 반은요."], []],
    ["장부는 어떻게 하셨어요?", [
      "태웠어요. 회사 나올 때 불안해서요. 집 앞 공터에 드럼통이 있었거든요. 거기서요.",
      "그런 거 갖고 있으면 위험하잖아요. 수사관한테도 그렇게 말했어요. 경위서도 써서 냈고요.",
      [null, "대답이 매끄러웠다. 여러 번 해 본 말처럼 들렸다."]], ["home"]],
    ["지금 장부를 찾는 사람이 누구예요?", [
      "대표가 구속되고 나서 최동규 상무가 회사를 맡았어요. 그 사람이 공소청에 가서 제가 빼돌렸다고 진술했어요.",
      "4년 동안 가만있다가 타워가 무너지고 나서요. 그 회사 지금도 있어요. 간판만 바꿔 달고 같은 건물에요."], ["office"]],
    ["수사 기록에 권태훈이라는 수사관 이름이 나와요. 이분과 연락하신 적 있어요?", [
      "…없어요. 그 사람 누군지도 몰라요.",
      "제가 그런 데를 어떻게 알아요. 회사 다니면서 경조사 봉투나 챙기던 사람인데요.",
      [null, "이름을 다 듣기도 전에 고개부터 저었다."]], [], ["t:kwonst"]],
    ["4년 전 택배로는 뭘 보내신 거예요?", [
      "회사 서류요. 말씀드렸잖아요, 사무 서류. 고소장에도 그렇게 썼고요.",
      "그건 왜 자꾸 물으세요? 변호사님이 더 잘 아시면서.",
      [null, "자꾸 물은 적은 없다. 처음 물었다."]], [], ["q2"]],
    ["최 상무가 처음엔 장부가 없다고 진술했던데요. 왜 이제 와서 기소가 됐을까요?", [
      "타워 일로 수사관들이 회사 계좌를 뒤졌대요. 용역비가 수십억인데 뭘 했는지 설명할 서류가 없잖아요.",
      "처음엔 장부 같은 거 없다고 했겠죠. 그러다 그걸로는 안 되겠으니까 말을 바꾼 거예요. 장부가 있었는데 이수아가 없앴다고. 없앤 사람이 있으면 자기들은 편하니까요.",
      "돈이 어디 갔냐고 물으면 '그건 장부에 있었는데요' 하면 되잖아요."], [], ["choi1"]],
    ["지금은 어떻게 지내세요?", [
      "학원 경리 봐요. 수요일마다 어머니 투석 모시고 가고요. 어머니가 인천에 사시는데 병원이 멀어서, 저도 그쪽으로 이사하려고 지금 집 짐 빼는 중이에요.",
      "…죄송해요, 이런 얘기를 왜 하지. 재판 날짜가 수요일만 아니면 좋겠어요.",
      "아, 다음에 저한테 물어보실 게 있으면 수요일엔 병원으로 와 주실 수 있어요? 투석이 네 시간이라 그동안은 꼼짝을 못 해서요."], ["hospital"]],
    ["병원에서 어머님께 아버님 이야기를 들었어요.", [
      "…엄마가 그 얘기를 했어요? 변호사님한테?",
      "아버지는 인천에서 작은 건설회사를 했어요. 직원 열몇 명 되는. 관급공사 하나만 따면 숨통이 트인다고, 그 말을 몇 년을 했어요.",
      "그때 누가 도원컨설팅을 소개해 줬대요. 전직 검사장이 하는 데라 공무원들한테 말이 통한다고요. 착수금 2억을 냈고, 그 뒤로 '인사할 데가 있다'고 해서 현금으로 1억을 더 갖다줬어요. 은행에서 빌린 돈으로요.",
      "공사는 다른 회사가 땄어요. 돈 돌려 달라고 찾아갔더니 자문료는 원래 돌려주는 게 아니라고 하더래요. 그해 겨울에 회사가 부도났고, 아버지는 현장 컨테이너에서 쓰러져서 못 일어나셨어요. 쉰셋이었어요.",
      "그다음 해에 도원에 경리로 들어갔어요. 이력서에 아버지 회사 얘기는 안 썼어요. 대표실 옆자리가 비었다길래 거기 앉겠다고 했고요.",
      "왜 들어갔냐고는 묻지 마세요. 아시잖아요. 아버지 돈이 어디로 갔는지 적힌 데가 거기밖에 없었어요.",
      "아버지 영수증은 아직 갖고 있어요. 집에 아버지 사진 뒤에 끼워 놨어요. 버릴 수가 없더라고요.",
      [null, "이 사람이 박진서 옆자리에 앉은 이유를 처음 들었다. 장부를 태웠다는 말이 그만큼 더 이상하게 들렸다."]], [], ["t:dad"]],
    ["어머님 병원에 양복 입은 사람들이 찾아왔었다면서요.", [
      "엄마가 그 얘기까지 했어요? …회사 사람들이에요. 짐 정리 덜 된 거 있냐고 물으러 왔대요.",
      "별일 아니에요. 엄마가 놀라서 크게 말하는 거예요.",
      [null, "별일 아닌 일로 투석실까지 찾아오는 회사는 없다."]], [], ["t:suits"]],
    ["최 상무가 아버님 일을 알고 있더라고요. 앙심을 품고 들어온 사람이라고요.", [
      "그 사람 입에서 우리 아버지 얘기가 나와요?",
      "앙심이요? 네, 품었어요. 그 사람들이 우리 아버지한테 한 짓을 아는데 어떻게 안 품어요.",
      "그래도 그걸로 제가 장부를 숨겼다는 건 말이 안 돼요. 숨길 거면 왜 굳이…",
      "…아니에요. 태웠다니까요. 태운 거예요.",
      [null, "말이 중간에 끊겼다. 숨길 거면 왜 굳이, 뭘 했다는 걸까."]], [], ["t:choigrudge"]]],
  pre: [0, 1],
  hireLine: "고맙습니다. 공소장하고 제가 쓴 경위서 가져왔어요. 태운 일 적어 낸 거요.",

  cards0: {
    gong: { n: "공소장", d: "피고인이 박진서 등의 형사사건 증거인 회계 장부를 회사에서 빼돌려 2031년 1월경 소각했다는 내용.", img: "ev/f2-gong.webp" },
    st: { n: "최동규 진술조서(2차)", d: "\"이수아가 퇴사하며 대표실 장부를 들고 나갔다. 태웠다고 직원들에게 말했다고 들었다.\"", img: "ev/f2-st.webp" },
    note: { n: "이수아의 자필 경위서", d: "\"2031년 1월 집 앞 드럼통에 장부를 넣고 태웠습니다. 회사가 괴롭힐까 무서웠습니다.\"", bad: 1, img: "ev/f2-note.webp" } },
  officeLooks: [
    { q: "수구여병 액자를 본다", a: ["교수님 글씨다. 서초동 사무실에도 이 액자부터 걸었다.", "입을 병마개처럼 지켜라. 오늘따라 글자가 크게 보인다."] },
    { q: "서랍장 맨 아래 칸을 연다", a: ["옛 기록철 상자 맨 위에 4년 전 택배 절도 사건 기록이 있다. 피고인 방재호.", "그 사건에서 내가 아는 것은 이 상자 안에 있고, 이 상자 밖으로는 나가지 않는다.", "서랍을 닫았다."] },
    { q: "커피머신을 본다", a: ["이사 기념으로 큰맘 먹고 들인 캡슐 커피머신이다. 의뢰인한테 내놓을 게 있어야 한다는 핑계였다.", "한 달 지나 계산해 보니 캡슐 값이 관리비 다음으로 많이 나갔다. 의뢰인보다 내가 더 많이 마셨다."] },

    { id: "urge", q: "재판부에 낼 촉구서를 쓴다", req: ["t:gearno"], round: 1, a: ["공소청이 사실조회 회신을 붙잡고 있다. 가만히 기다리면 회신보다 다음 기일이 먼저 온다.", "재판부에 촉구서를 썼다. 회신이 계속 늦어지면 총무과 담당자를 증인으로 불러 지급 대장을 들고 나오게 해 달라는 내용이다.", "다 쓰고 나니 밤 열한 시였다. 서초동으로 옮기면 야근이 줄 줄 알았다. 옮기고 나서 알았다. 이 동네는 열한 시에도 옆 건물 불이 다 켜져 있다."] },

          { q: "복도에 서 있는 직원 쪽을 본다", silent: true, a: ["저 친구요? 총무 일 보는 앤데 뭘 물어보시려고요. 오래 붙잡지 마세요.", [null, "복도의 직원이 고개를 숙인 채 1층 쪽을 눈짓했다."]], opens: ["clerk"] },
          { id: "choigrudge", q: "이수아 씨 아버님 일을 아세요?", req: ["q8"], a: ["…그 얘기는 어디서 들으셨습니까.", "그 여자 아버지가 옛날에 대표님한테 일 부탁했다가 잘 안 된 사람이라던데요. 그런 사람이 많아요. 일이 안 되면 다 남 탓이지.", "앙심 품고 들어온 겁니다. 저도 나중에 알았어요. 그러니 장부를 들고 나갔겠죠. 대표님 약점 쥐려고.", [null, "검사도 이 얘기를 들었을 것이다. 원한은 동기가 된다. 어느 쪽으로 쓰일지는 누가 먼저 설명하느냐에 달렸다."]] },
          { q: "이수아 씨 아버님 수첩에 '인사비 1억 현금, 최 상무 전달'이라고 적혀 있던데요.", req: ["dad", "t:choigrudge"], a: ["…무슨 수첩이요. 그런 옛날 일을 누가 기억합니까.", "회사에 상무가 저 하나였던 것도 아니고요. 오늘은 여기까지 하시죠. 나가실 때 안내 데스크에 출입증 반납하시고요.", [null, "목소리는 그대로였는데 손이 넥타이로 갔다. 이 사람은 그 돈을 기억한다."]] },
          { q: "공소장이 바뀌었더군요. 이제는 숨겼다고요.", round: 1, a: ["태웠든 숨겼든 저희 장부가 없어진 건 같습니다.", "변호사님은 이수아 씨 편을 드시면 됩니다. 저는 회사 편이고요. 다음에 오실 때는 미리 연락 주세요."] }] }] },
    clerk: { n: "도원컨설팅 총무 직원", s: "건물 1층 커피숍", bg: "f2-consult",
      people: [{ id: "clerk", n: "총무 직원", face: A + "cut/n20f2.webp",
        intro: ["여기서 잠깐이면 돼요. 상무님이 보면 곤란해서요.", "제가 작년에 수사관들한테 복도 영상 뽑아 준 사람이에요."],
        topics: [
          { q: "4년 전 영상을 아직 가지고 있어요?", a: ["옛날 서버를 안 지웠거든요. 이수아 선배 퇴사하던 날, 2031년 1월 17일 거예요. 보세요. 손에 든 건 작은 쇼핑백 하나뿐이에요.", "그런데 며칠 앞에, 1월 13일 밤에는 대표실에서 상자를 들고 나오는 게 찍혔어요. 수사관들도 그 장면만 몇 번을 돌려 봤어요.", "전 그건 모르겠어요. 선배 나쁜 사람 아니에요."],
            gives: ["cctv", { n: "복도 CCTV 영상", d: "퇴사일(2031. 1. 17.) 피고인이 든 것은 작은 쇼핑백뿐. 1월 13일 밤 대표실에서 상자를 들고 나오는 장면도 찍혀 있다.", img: "ev/f2-cctv.webp" }] },
          { q: "이수아 씨는 회사에서 어떤 사람이었어요?", a: ["경조사 봉투 챙기고 대표님 구치소 심부름 다니고 그랬죠. 대표님 잡혀가고 다들 도망갈 때 혼자 남아 있었어요.", "대표님 말씀 받아 적고 온 날은 화장실에 한참 있다 나오더라고요. 눈이 빨개서요. 저는 대표님한테 혼나서 그런 줄 알았어요."] },
          { q: "이수아 씨가 처음 입사할 때 일을 아세요?", req: ["q8"], a: ["저보다 한참 선배라 들은 얘기예요. 경리로 들어왔는데 대표실 옆자리를 자기가 하겠다고 했대요.", "거기 다들 싫어했거든요. 대표님 고함이 벽 너머로 다 들려서요. 선배는 한 번도 자리 바꿔 달라고 안 했어요.", "…그러고 보니 그것도 이상하네요. 그런 자리를 왜 자원했을까."] }] }] },
    insp: { n: "권태훈 수사관", s: "공소청 수사과", bg: "f2-investigator",

        intro: ["변호사님이 저를 왜 찾아오십니까.", [null, "남색 재킷 위로 목걸이 신분증이 흔들렸다. 자리에서 일어나지도 않았다."]],
        topics: [

          { q: "받은 적이 없다는 건 알겠습니다. 연락도 없었습니까?", req: ["t:kwon1"], a: ["…없었습니다.", "더 물으실 게 있으면 법정에서 하시죠. 바쁩니다.", [null, "받은 적 없다는 대답은 빨랐다. 연락이 없었다는 대답은 한 박자 늦었다."]] },
          { q: "책상 위 사진 속 아이들이 귀엽네요.", a: ["…제 아이들입니다. 둘 다 올해 중학교에 갑니다.", "사진은 왜 보십니까. 나가실 때 문은 닫아 주십시오."] },
          { q: "지난 기일에 그 번호가 공용 회선이라고 하셨죠.", round: 1, req: ["f:phone1"], a: ["법정에서 말씀드린 대로입니다.", [null, "권태훈은 신분증 줄을 손가락에 감았다가 풀었다. 나를 보지 않았다."]] },
          { q: "2031년 1월 20일에 보내신 문자를 기억하세요?", round: 1, req: ["del"], a: ["……", "그 기계를 아직 갖고 있었습니까.", [null, "무슨 문자냐고 묻지 않았다. 권태훈은 그 말만 하고 모니터 쪽으로 의자를 돌렸다."]] }] }] },
    hospital: { n: "인천 병원 투석실", s: "수요일 오후", bg: "f-hospital",

      people: [{ id: "mom", n: "이수아의 어머니", face: A + "cut/n60f3.webp",
        intro: ["변호사님이세요? 우리 수아가 신세 지네요.", [null, "투석 바늘을 꽂은 팔로 몸을 일으키려 해서 말렸다."]],
        topics: [
          { id: "mom1", q: "따님은 어떤 분이세요?", a: ["착해요. 너무 착해서 탈이지. 회사 그만두고 나서는 학원 다니면서 저 병원까지 데리고 다니고.", "어릴 때는 아빠를 그렇게 따랐어요. 현장에 따라간다고 떼를 써서, 헬멧 쓰고 사진도 찍고 그랬지."] },
          { id: "dad", q: "아버님은 어떤 분이셨어요?", req: ["t:mom1"], a: ["그 양반은 인천에서 작은 건설회사 했어요. 사람 좋다는 소리만 듣고 돈은 못 벌었지.", "관급공사 하나 따 보겠다고 누가 소개해 준 데를 찾아갔어요. 서울에 무슨 컨설팅이라고. 전직 검사장이 하는 데라 말 한마디면 된다고 그랬대요.", "착수금으로 2억, 나중에 '인사할 데가 있다'고 현금 1억. 은행 돈을 빌려서 갖다줬어요. 공사는 딴 회사가 가져갔고요.", "그해 겨울에 부도가 났어요. 그 양반 현장 컨테이너에서 쓰러져서… 그 길로 못 일어났어요.", "수아가 그 회사에 들어간다고 했을 때 내가 얼마나 말렸는지 몰라요. 아빠 죽인 데를 왜 들어가냐고. 그 애가 그러더라고. 엄마, 거기 가야 알 수 있어. 그 돈이 어디로 갔는지.", [null, "도원컨설팅. 천막 기둥의 신문 기사에서 본 이름이 여기서 다시 나왔다."]] },
          { id: "suits", q: "요즘 따님 회사 일로 찾아온 사람은 없었어요?", req: ["t:dad"], a: ["…있었어요. 작년 가을에, 타워 무너지고 나서. 양복 입은 남자 둘이 여기 병원까지 왔었어요.", "수아가 회사에서 갖고 나간 거 어디 있냐고. 책인지 공책인지. 내가 모른다니까 웃으면서 어머님 몸조리 잘하시라고 하고 가더라고요.", "그날 밤에 수아한테 전화했더니, 엄마 그거 내가 태웠어, 이제 아무도 안 와, 그러더라고요. 근데 변호사님, 그 뒤로도 한 번 더 왔어요."] },
          { q: "투석은 오래 받으셨어요?", a: ["삼 년 됐어요. 일주일에 세 번. 수요일만 수아가 오고 나머지는 혼자 와요.", "수아가 재판받는 거 나는 다 알아요. 걔는 내가 모르는 줄 알지. 변호사님, 우리 애 잘 좀 부탁해요."] }] }] },
    forensic: { n: "디지털 감정 업체", s: "휴대폰 감정 의뢰", round: 1,

          { id: "delask", q: "지워진 메시지도 살릴 수 있나요?", req: ["t:fxok"], a: ["살릴 수는 있습니다. 다만 지운 걸 되살리는 건 기기 주인 동의서가 따로 있어야 합니다. 저희 규정이에요.", "변호사님이 맡기신 건 '있는 메시지 감정'이라서요. 지운 걸 살리는 건 다른 일이고, 서식도 다릅니다. 이 서식이요. 뒷장까지 서명 칸이 여섯 개예요."] },

            gives: ["del", { n: "복원된 1월 20일 메시지", d: "감정 중 복원한 2031. 1. 20. 오후 6:03 '권 수사관님'의 메시지. \"물건이 오지 않았습니다. 택배사에 분실 신고하시고, 이 문자는 지워 주십시오.\"", img: "ev/f2-del.webp" }] },
          { q: "법정에서 위조라고 몰아붙이면 어떻게 답하면 될까요?", req: ["t:fxok"], a: ["나중에 메시지를 지어내 넣으면 저장 순번이 앞뒤 기록과 어긋납니다. 이 휴대폰은 앞뒤로 미용실 예약, 학원 문자가 순서대로 붙어 있어요.", "감정서에 그 표를 붙여 드리겠습니다. 법정에서 물으면 그 표를 보여 주시면 됩니다."] }] }] },
    gear: { n: "공소청 총무과", s: "업무용 휴대폰 지급 대장", round: 1, bg: "rec",

          { id: "gearno", q: "법원 사실조회 촉탁서가 왔을 텐데요. 2031년 1월 그 번호를 누가 썼는지요.", a: ["촉탁서는 왔어요. 그런데 회신은 법원으로 보내는 거라서 변호사님께 직접은 못 드려요.", "그리고 지금 회신이 안 나가고 있어요. 검사실에서 '수사 보안 자료일 수 있으니 회신 범위를 검토하겠다'면서 서류를 가져가셨거든요. 언제 돌려주실지는 저도 몰라요.", [null, "검사가 먼저 손을 썼다. 여기서 기다려 봐야 회신보다 다음 기일이 먼저 온다. 재판부를 움직이는 수밖에 없다."]] },
          { q: "대장은 어떻게 적어요?", a: ["번호, 지급받은 사람, 지급일, 반납일, 반납 서명. 다섯 칸이에요. 볼펜은 검정만 돼요.", "작년 감사 때 파란 볼펜으로 쓴 줄 하나 때문에 한 시간 동안 경위서를 썼어요. 그 뒤로 제 책상엔 검정 볼펜밖에 없어요."] }] }] },

        intro: ["얼굴 보고 오라고 했더니 정말 왔구나. 앉아라. 커피는 네가 타라."],
        topics: [
          { id: "kang1", q: "전 의뢰인의 비밀 때문에 막혔어요.", a: ["네가 아는 걸 말하면 빠르겠지. 그래서 힘든 거다. 말하면 안 되는 걸 아는 사람은 제일 빠른 길을 앞에 두고 돌아가야 하니까.", "변호사는 의뢰인의 비밀을 무덤까지 가져가는 사람이다. 지금 의뢰인이 아무리 딱해도 그건 안 바뀐다. 네 입이 한 번 열리면, 앞으로 네 방에 오는 사람은 아무도 너한테 진실을 말하지 않아.", "돌아가거라. 돌아가는 길이 있을 거다."] },
          { id: "kang2", q: "검사가 제 옛 변론을 그대로 들고 나왔어요.", req: ["t:kang1"], a: ["'내용물을 특정할 수 없다'? 잘 썼구나. 그 말이 왜 이제 와서 아프냐?", "그 사건에서 다툰 건 없어진 물건이 뭔지, 누가 가져갔는지였다. 지금 사건에서 다투는 건 보낸 사람이 왜 보냈느냐다. 같은 상자라도 묻는 게 달라.", "상자가 어디로 갔는지 증명하려 들지 마라. 보낸 사람 손을 떠날 때 그 사람이 무슨 마음이었는지를 증명해라."] },
          { q: "보낸 사람의 마음은 어떻게 증명해요?", req: ["t:kang2"], a: ["택배를 잃어버리면 회사가 물어 주잖니. 물어 줄 때 서류를 안 쓰겠냐. 받는 사람, 무게, 크기가 거기 있을 거다.", "송장은 없어져도 돈 나간 기록은 오래 간다. 택배사 배상 담당을 찾아가 봐라."], opens: ["parcel"] },
          { q: "은닉이라는 게 정확히 어디까지예요?", req: ["t:kang2"], a: ["옛날 모의법정 때 쓰던 강의안이 있다. 책장 어디… 여기 있구나. 비매품이야. 복사하지 말고 너만 봐라. 복사하면 내가 안다.", "증거를 숨겼다고 하려면 찾기 어렵게 만들 뜻이 있어야 한다. 수사기관에 보낸 사람한테 그런 뜻이 있겠냐. 받아 적지 말고 머리에 넣어 가라.", [null, "강의안 귀퉁이에 판례 하나가 인쇄되어 있다. '대법원 2011. 2. 30. 선고.' 교수님 강의안에서 판례 날짜까지 따져 볼 일은 없었다. 그대로 가방에 넣었다."], "도원 사건이라니, 몸조심하고. 내 제자가 다치는 건 못 본다."],
            gives: ["lect", { n: "강도윤 교수의 강의안", d: "비매품 강의안. \"은닉은 발견을 어렵게 하려는 뜻이 있어야 한다. 수사기관에 넘기려는 행위와는 함께 설 수 없다.\" 귀퉁이에 '대법원 2011. 2. 30. 선고' 인용.", img: "ev/f2-lect.webp" }] },
          { q: "교수님 방 커피는 여전히 쓰네요.", a: ["네가 타 놓고 왜 나한테 그러냐.", "그 원두는 네 선배 하나가 개업했다고 놓고 간 거다. 너희는 왜 개업만 하면 나한테 원두를 들고 오냐. 나는 차를 마시는데.", "액자 값은 원두로 갚는 거라고 누가 소문을 냈는지 모르겠다. 찾으면 혼낼 거다."] },
          { q: "의뢰인이 제게 처음부터 거짓말을 했어요.", req: ["t:kang1"], a: ["의뢰인은 다 거짓말을 한다. 변호사가 무서워서, 세상이 무서워서. 거짓말을 안 하는 의뢰인이 오면 그게 더 걱정이다.", "중요한 건 왜 했느냐다. 그 이유를 알면 그 사람이 어디까지 너를 믿는지도 보여."] }] }] },
    parcel: { n: "택배사 배상팀", s: "분실 배상 서류 창고", round: 1, gated: true, bg: "dock",
      people: [{ id: "claim", n: "배상팀 직원", face: A + "cut/n40f2.webp",
        intro: ["4년 전 분실 건이요? 돈이 나간 건이면 서류는 남아 있어요. 보내는 분 위임장 있으세요?"],
        topics: [
          { id: "purged", q: "보내는 사람 이수아 씨의 위임장입니다. 2031년 1월 분실 배상 서류를 찾고 싶어요.", a: ["위임장 확인했습니다. 잠시만요… 2031년 1월이면, 아. 배상 서류는 보존 기간이 3년이에요. 작년 2월에 한꺼번에 폐기됐네요.", "폐기 대장은 있어요. 이 건이 폐기 목록에 들어 있다는 것까지는 확인해 드릴 수 있어요. 폐기 대장은 보존 기간이 10년이거든요. 버린 걸 적은 종이를 버린 서류보다 오래 갖고 있는 거죠.", [null, "헛걸음이다. 돈 나간 기록은 오래 간다던 교수님 말씀이 이번에는 빗나갔다."], "지점에서 따로 사본을 갖고 있을 수는 있어요. 그건 지점마다 달라서 저희도 몰라요. 접수 지점은 폐기 대장에 적혀 있어요. 여기요.", [null, "접수 지점 칸에 낯익은 터미널 이름이 있다. 4년 전 그 터미널이다."]] },
          { q: "분실된 물건을 나중에 찾는 경우도 있나요?", req: ["t:purged"], a: ["가끔요. 몇 달 뒤에 엉뚱한 지점 창고에서 나오기도 하고요. 그래도 이건 안 나왔어요. 폐기 목록에 '미회수'라고 적혀 있네요.", [null, "어디로 갔는지는 아무도 모른다. 내가 찾는 건 누가 어디로 보냈는지 적힌 종이 한 장이다."]] }] }] },
    term: { n: "옛 터미널", s: "방재호를 찾아서", round: 1, bg: "dock",
      people: [{ id: "mate", n: "동료 기사", face: A + "cut/n50m2.webp",
        intro: ["어, 그때 그 변호사님이시네. 방 형님이요? 왜요, 또 무슨 일 났어요?"],
        topics: [
          { id: "bangq", q: "방재호 씨 연락처를 아세요?", a: ["그 일 있고 다음 해에 그만두셨어요. 번호도 바뀌었고요. 어디 지방 내려갔다는 말만 들었지 저도 몰라요.", "찾으시면 안부나 전해 주세요. 형님 떠날 때 술값 내가 냈다고."] },
          { q: "방재호 씨를 찾는 사람이 또 있었어요?", req: ["t:bangq"], a: ["어떻게 아셨어요? 그저께 양복 입은 사람 둘이 와서 방 형님 어디 사냐고 묻더라고요. 4년 전 상자 얘기를 하면서요.", "모른다고 했죠. 진짜 모르니까. 그랬더니 동료면서 왜 모르냐고, 형님 아니냐고 그래서 내가 두 살 어리다고 했더니 그 사람들도 안 믿는 눈치더라고.", [null, "누군가 나보다 먼저 이곳을 다녀갔다. 방재호를 찾을 수는 없다. 찾아도 그 이름은 내가 쓸 수 없다."]] },
          { q: "본사에서 분실 배상 서류를 이미 폐기했대요. 지점에도 사본이 있을까요?", req: ["t:purged"], a: ["배상 서류요? 본사는 3년 지나면 버리죠. 그런데 우리 지점장님은 못 버려요.", "분실 나면 경위서 쓰면서 송장 사본을 같이 붙여서 철해 놓거든요. 창고 뒤 철제 캐비닛에 연도별로 다 있을걸요. 2019년 것도 있어요.", "지점장님한테는 제가 말해 둘게요. 그 양반 누가 그거 찾으러 오는 날만 기다렸어요."], opens: ["branch"] },
          { q: "여전히 방재호 씨를 형님이라고 부르시네요.", a: ["형님은 형님이죠. 아, 또 그 얘기 하시려고요? 내가 더 늙어 보인다는 거?", "다들 그래요. 나이는 내가 두 살 어린데. 이 일이 사람을 이렇게 만들어요. 변호사님도 서초동 가시더니 얼굴이 좀 상하셨네."] },
          { q: "휴게실은 어떻게 됐어요?", a: ["리모델링해서 싹 바뀌었어요. 탁자도 새로 들이고 냄비도 새로 샀어요. 옛날 물건은 다 내다 버렸고요.", "에어컨도 달았어요. 형님이 그렇게 노래를 부르던 거. 형님은 정작 못 써 보고 가셨네."] }] }] },
    branch: { n: "터미널 지점 창고", s: "분실 경위서 철", round: 1, gated: true, bg: "f2-storage",
      arrive: ["창고 안쪽에 철제 캐비닛이 줄지어 서 있다. 서랍마다 연도 딱지가 붙어 있다. 정말 2019년도 있다."],
      people: [{ id: "boss", n: "지점장", face: A + "cut/n60m3.webp",
        intro: ["변호사님이 2031년 분실 철을 찾으신다고요? 거봐, 내가 버리지 말자고 했지.", [null, "지점장은 누구한테 하는 말인지 모를 소리를 하며 열쇠 꾸러미를 흔들었다."]],
        topics: [
          { q: "이걸 다 보관하세요?", a: ["버리면 꼭 다음 달에 찾는 사람이 와요. 오늘처럼. 본사는 3년 지나면 버리라는데, 3년 하고 하루 지나서 찾으러 오는 사람이 꼭 있다니까.", "집사람은 집에 있는 것도 못 버리게 한다고 난리예요. 그건 다른 문제고."] },
          { q: "분실 건마다 경위서를 쓰세요?", a: ["돈 나가는 건 다 써요. 마지막 스캔 시각, 담당 기사, 송장 사본까지 붙여서 본사에 올리고, 사본은 여기 철하고.", "근데 4년 전 걸 왜요? 그때 무슨 일 있었어요?", [null, "경위서에 누구 이름이 적혀 있든 그건 내가 쓸 수 없는 이름이다. 필요한 건 송장 사본 한 장이다."]] }] }],
      looks: [
        { q: "2031년 1월 분실 철을 넘긴다", a: ["1월 철은 얇다. 설 대목이라 그런지 분실 건이 몇 개 안 된다.", "'2031. 1. 16. 접수. 보내는 사람 이수아. 받는 사람 공소청 수사과 권태훈 앞.' 송장 사본이 경위서에 스테이플러로 박혀 있다.", "무게 1.3킬로, 30×25×8센티미터. 품목란에는 보낸 사람이 볼펜으로 직접 쓴 '홍삼 세트'. 배상금 5만 원 지급.", "경위서 본문은 덮어 두고 송장 사본만 복사해 달라고 했다."],
          gives: ["waybill", { n: "택배 분실 경위서의 송장 사본", d: "2031. 1. 16. 접수. 받는 사람 '공소청 수사과 권태훈 앞'. 1.3kg, 30×25×8cm, 품목 '홍삼 세트'(보낸 사람이 직접 씀). 배상금 5만 원 지급.", img: "ev/f2-waybill.webp" }] }] } },
  lies: [["장부를 태웠다는 말", 2], ["수사기관과 연락한 적 없다는 말", 4], ["구속된 대표의 말을 접견 가서 받아 적었다는 말", 0], ["최동규 상무가 회사를 맡았다는 말", 3], ["아버지 일로 도원에 들어갔다는 말", 8]],
  keyLie: 0, altLie: 1, keyCard: "phone",
  denies: ["왜 저를 범인 취급하세요? 전 그런 사람 아니에요.", "변호사님, 저 세 군데서 잘리고 온 사람이에요. 제 말을 믿고 시작해 주셔야죠.", "그건 또 무슨 말씀이세요. 어머니 병원 가야 하는데, 이러실 거면 오늘은 그만해요.", "됐어요. 제가 사람을 잘못 봤네요. 4년 전에도 그러시더니."],
  warn: "\"변호사님, 저 정말 다른 데 갈 데 없어요. 그런데 자꾸 이러시면 저도 그만두는 수밖에 없어요.\"",
  blind: [["윤서연", "알겠어요. 이수아 씨 말씀대로 정리해 볼게요. 태운 건 태운 거고, 왜 그랬는지를 설명해야죠."], ["이수아", "…믿어 주시는 거예요?"], ["윤서연", "제가 맡은 분 말인데요. 믿고 시작해야죠."], ["이수아", "고맙습니다. 정말이에요."], "이수아는 잠깐 눈을 내리깔았다가 고개를 숙였다. 경위서 한 장이면 충분하다고, 나는 생각했다."],
  press: { open: [["h", "이수아 씨, 정말 태우셨어요?"], ["c", "말씀드렸잖아요. 집 앞 드럼통에서요."]],
    steps: [
      { card: "noburn", show: G => [["h", "집 앞에 가 봤어요. 건물 주인분 말이, 그해 겨울에 뭘 태운 일이 없대요. 연기가 나면 위층까지 올라가서 바로 안다고요. 드럼통도 없었고요."], ["c", "밤에 몰래 했으니까요. 드럼통은… 어디서 주워 왔어요."], ["h", "밤에 몰래 주워 온 드럼통에 불을 피우고, 그 드럼통은 어디로 갔어요?"], ["c", "……"]] },
      { card: "phone", show: G => [["h", "서랍에서 나온 휴대폰이요. 2031년 1월 16일, 권 수사관이라는 분께 택배로 서류를 보낸다는 메시지가 있어요."], ["c", "……"], ["h", "태운 게 아니죠. 보내셨죠. 제가 맡았던 그 택배로요."],
        ...(G.cards.dad ? [["h", "아버님 영수증을 그렇게 오래 간직한 분이 아버님 돈이 어디로 갔는지 적힌 장부를 불에 넣었을 리가 없어요."]] : []),
        ...(/^blind/.test(G.hist.f1 || "") ? [["h", "4년 전에 저는 판결이 난 뒤에야 제 의뢰인이 어떤 사람인지 알았어요. 이번에도 뒤늦게 알게 되는 건 사양할게요."]] : [["h", "4년 전 그 상자 일은 제가 입을 다물어야 하는 일이에요. 이번 일까지 저한테 입을 다무시면 저는 싸울 방법이 없어요."]])] }] },
  sus: ["장부를 팔아넘기려 했다", "최동규와 사귀는 사이였다", "회사 돈을 횡령했다"],
  confess: "…맞아요. 수사관한테 보냈어요. 4년 전 그 택배요. 표지에 『남산 아래 봄』이라고 붙은, 겉으로 보면 그냥 소설책이에요. 공책 두 권 분량을 한 권으로 묶어 놓은 거요. 상자 겉에는 홍삼 세트라고 적었어요. 아무나 열어 보지 않게요. 아버지를 그렇게 만든 사람들 벌 받게 하려고 들어간 회사였으니까요. 그런데 수사관한테서는 없어졌다는 연락만 왔고, 그래서 고소한 거예요. 그 뒤로 어디로 갔는지는 저도 몰라요. 정말 몰라요. 태웠다고 한 건, 아직 어딘가 있다고 하면 그 사람들이 끝까지 찾아다닐 테니까요. 엄마 병원까지 왔었어요. 태웠다고 해야 저도 엄마도 살아요.",

    { bg: "m2-altar", lines: [[null, "합동분향소는 1년째 시민체육관에 차려져 있다. 처음엔 143개였던 영정이 지금은 서른한 개 남았다."], [null, "합의서에 도장을 찍은 집부터 영정을 거두어 갔다. 남은 서른한 개는 소송에 이름을 올린 집의 수와 같다."]] }],
  intro: ["해성개발을 상대로 한 소송은 끝났다. 판결문에 적힌 숫자와 유족들 통장에 찍힌 숫자는 끝내 같지 않았다.", "봄이 다 갈 무렵 조경숙 어머니가 다시 찾아왔다. 이번에는 파란 서류철을 두 손으로 들고 왔다.", "유족 서른한 집이 돈을 모았다고 했다. 이번 상대는 서해광역시다."],
  greet: [["c", "변호사님, 오랜만이에요. 저희가 모여서 얘기를 많이 했어요. 이제 시청을 상대로 해 보자고요. 허가를 내준 게 시청이잖아요."], ["h", "앉으세요, 어머님. 먼저 말씀드리면 쉬운 소송은 아닙니다."], ["h", "국가배상이라는 게, 공무원이 일을 하다가 법을 어겨서 사람이 다쳤을 때 시나 나라가 대신 물어 주는 제도입니다."], ["c", "그럼 허가를 잘못 내줬으니까 물어 줘야 하는 거 아니에요?"], ["h", "허가가 잘못됐다는 것만으로는 안 됩니다. 담당 공무원이 알면서 그랬거나, 마땅히 확인할 것을 확인하지 않았다는 걸 저희가 증명해야 합니다. 그런데 시청 서류는 전부 시청이 갖고 있습니다."], ["c", "알아요. 그래서 변호사님을 찾아온 거예요."]],
  opening: "돈이 전부는 아니에요. 그 건물을 누가 지어도 된다고 했는지, 그 사람 이름을 판결문에서 보고 싶어요.",
  hireSay: "맡겠습니다. 위임장부터 쓰시죠. 서른한 집 모두 이름이 들어가야 합니다.",
  hireLine: "고맙습니다. 유족회 서류는 여기 다 있어요. 없는 건 제가 또 찾아올게요.",
  refuseLine: "시를 상대로 한 소송은 이기기 어렵다. 그래도 저 파란 서류철을 그대로 돌려보낼 수는 없었다.",
  qs: [
    ["다른 유족분들 사정은 어떠세요?", ["다들 지쳤어요. 합의한 집도 많고요.", "미영이 아빠는 택시를 다시 시작했고, 3층 식당 하던 양반은 아직 밥을 못 드세요. 남은 사람들끼리 끝까지 하자고 했어요."], []],
    ["왜 이번에는 시청을 상대로 하시려는 겁니까?", ["회사는 판결을 받아도 줄 돈이 없다잖아요. 그건 변호사님이 제일 잘 아시고요.", "그런데 생각해 보니까요, 그 땅에 49층을 올려도 된다고 도장 찍은 사람들이 있잖아요. 회사 사람들은 재판이라도 받았는데, 시청에서는 아무도 안 불려 갔어요.", "다들 시청은 원래 이기기 어렵다고 해요. 그래도 해 보자고 했어요."], []],
    ["시에서 합의 얘기는 없었습니까?", ["있었죠. 위로금 줄 테니 더는 안 따지겠다고 쓰라고요. 집으로 사람이 찾아오기도 했어요.", "저는 응한 적 없어요. 다은이 값을 어떻게 돈으로 정해요."], []],
    ["소송 비용은 어떻게 마련하셨습니까?", ["회비로 모았어요. 서른한 집이 형편대로 냈어요. 다른 데서 들어온 돈은 없어요.", "장부가 궁금하시면 유족회 사무실에 총무님이 계세요. 체육관 분향소 옆 방이에요."], ["assoc"]],
    ["시청 심의 자료는 받아 보셨어요?", ["유족회가 정보공개를 청구했는데 '영업비밀'이라고 안 줘요. 사람이 죽었는데 영업비밀이래요.", ["한서준", "소송이 시작되면 법원을 통해 내놓으라고 할 수 있습니다. 소장 낼 때 같이 신청하겠습니다."], "법원에서 내놓으라고 하면 다르겠죠. 꼭 봐 주세요."], ["cityfile"]],
    ["그 땅에 대해 설명해 줄 전문가를 아십니까?", ["땅이요? 그 땅이 원래 바다였잖아요. 어릴 때 거기서 조개 캤어요.", "작년에 유족회에서 설명회를 했는데, 지반 공부하신 교수님이 오셔서 그림까지 그려 가며 설명해 주셨어요. 그분 연락처 드릴게요."], ["site"], ["nine"]],
    ["정한별이라는 이름을 들어 보셨습니까?", ["정한별 씨요? 고발했다가 지하로 쫓겨난 주무관이라고 들었어요.", "유족회 앞으로 편지를 한 통 보냈어요. '심의 자료의 시추공 번호를 세어 보십시오. 저는 그때 더 말했어야 했습니다.' 그게 다예요. 보낸 사람 주소도 없었어요.", "만난 적은 없어요. 그 한 통이 전부예요.", [null, "정한별. 5년 전 증인석에 앉아 있던 얼굴이 먼저 떠올랐다."]], [], ["t:binder"]],
    ["따님은 그 건물에서 어떻게 일하게 됐습니까?", ["다은이요? 새 건물로 옮긴다고 얼마나 좋아했는지 몰라요. 지하인데도 천장이 높다고, 에어컨이 잘 나온다고요.", "부점장 달고 처음 맡은 매장이었어요. 개장 전날 밤에 진열 다시 한다고 열두 시 넘어서 들어왔어요.", "아이고, 제가 또 딴소리를 하네요. 허가 같은 건 저는 몰라요."], [], ["q0"]],
    ["유족회 장부에 따님 이름으로 들어온 돈이 있던데요.", ["……그거요.", "다은이 돈이에요. 그 얘기는 조금 있다가 할게요. 지금은 말이 잘 안 나와요."], [], ["fund"]],
    ["시청 합의 의향서에 어머님 서명이 있던데요.", ["그거 받았다는 표시만 한 거예요. 합의한 적 없어요.", "총무님이 그걸 보여 드렸어요? 버리라고 할 걸 그랬네요."], [], ["uihyang"]],
    ["정한별 씨가 증언하기로 했습니다.", ["그분이요? 편지 보낸 그분이요?", "……고맙다고 전해 주세요. 아니에요, 제가 직접 할게요. 재판 날 법원 앞에서 기다릴게요."], [], ["jungok"]]],

    { q: "수구여병 액자를 본다", a: ["교수님이 개업 선물로 주신 액자다. 서초동으로 옮길 때 제일 먼저 챙겼다.", "수구여병(守口如甁). 입을 병마개처럼 지켜라."] },
    { q: "커피 머신을 본다", a: ["서초동으로 옮기면서 큰맘 먹고 들인 커피 머신이다. 할부는 아직 일곱 달 남았다.", "이 사무실에서 하루도 빠지지 않고 출근하는 건 나와 이 기계뿐이다. 그나마 이 기계는 야근 수당 얘기를 안 한다."] },
    { id: "trustee", q: "대양지질 파산관재인 사무실에 전화한다", round: 1, req: ["t:dy_gone"], a: ["관리인이 알려 준 번호로 전화를 걸었다. 신호가 한참 가고, 녹음된 안내가 두 번 나온 뒤에야 사람이 받았다.", ["파산관재인 사무실 직원", "대양지질이요? 잠시만요. 네, 그 건은 파산 절차 끝나고 종결됐습니다."], ["한서준", "회사에서 옮겨 온 서류 가운데 지반조사 보고서가 있었을 겁니다. 2030년 해성개발 현장 건입니다."], ["파산관재인 사무실 직원", "서류요? 종결되고 보존 기간 지나서 일괄 폐기했어요. 서버는 처음부터 안 넘어왔고요. 폐기 확인서는 보내 드릴 수 있어요."], ["한서준", "폐기 확인서는 괜찮습니다."], ["파산관재인 사무실 직원", "그리고 혹시 해서 말씀드리는데, 현장 직원들이 개인적으로 쓰던 공책 같은 건 회사 재산이 아니라서 저희가 안 받았어요. 그런 걸 찾으시면 사람을 찾으셔야 할 거예요."], "전화를 끊었다. 회사 서류는 없다. 남은 건 그 현장에 있던 사람이다."] },
    { id: "cabinet", q: "캐비닛 맨 아래 칸에서 2030년 기록철을 꺼낸다", round: 1, a: ["2030고단1187. 라벨 글씨가 내 글씨인데 낯설다.", "판결문 전문을 다시 읽었다. '증인은 야간에 음주한 상태로, 가로등이 고장 난 골목에서 약 128미터 떨어진 곳에서 사고를 보았다.'", "'위와 같은 목격 조건에 비추어 증인 정한별의 진술은 믿기 어렵다.'", "판결이 믿기 어렵다고 한 것은 그날 밤 그 골목에서 본 것이다. 정한별이라는 사람을 두고 한 말은 한 줄도 없다.", "이 문장을 끌어낸 건 나다. 그 문장이 어디까지를 말하는지, 이제 내가 다시 따지고 있다."], gives: ["ruling", { n: "2030고단1187 판결 이유", d: "'야간, 음주, 고장 난 가로등, 약 128미터'라는 목격 조건 때문에 믿기 어렵다고 판단했다. 증인의 사람됨이나 다른 일에 대한 판단은 없다.", img: "ev/m3-ruling.webp" }] },
    { q: "함께 묶인 수사기록을 넘겨 본다", req: ["t:cabinet"], a: ["정한별의 진술조서. '요즘 과장님은 해안 복합개발 심의 서류를 혼자 붙들고 계셨고.'", "그날 법정에서 이 말이 끝까지 나왔던가. 나는 그 대목에서 증인의 말을 끊었다.", "이 사람은 그때 이미 뭔가 말하려던 것 같다."] },
    { q: "그때 쓴 변론 메모를 본다", req: ["t:cabinet"], a: ["'128m, 가로등, 소주 11병.' 밑줄을 두 번 그었다.", "밑줄이 반듯하다. 나는 그때 일을 참 잘했다."] },
    { id: "anon_open", q: "우편함에 꽂힌 봉투를 연다", round: 2, optional: true, a: ["퇴근하려는데 우편함에 두꺼운 봉투가 꽂혀 있었다. 보낸 사람이 없다.", "타자로 친 녹취록 한 장. '2030년 11월 6일 오후 2시, 시장실 앞 복도.'", "'오명환: 15개는 빼고 올려. 말 나오면 내가 책임질게.'", "이 한 줄이면 다음 기일은 볼 것도 없다."], gives: ["anon", { n: "익명 녹취록", d: "보낸 사람 없는 우편. 오명환이 '15개는 빼고 올려'라고 했다는 녹취를 타자로 친 종이. 녹음 파일도, 받아 적은 사람 이름도 없다.", bad: 1, img: "ev/m3-anon.webp" }] },
    { q: "봉투를 보낸 사람을 따져 본다", req: ["t:anon_open"], a: ["소인은 서초 우체국. 이 사무실이 있는 동네다. 녹음 파일은 없고 받아 적었다는 사람 이름도 없다.", "이렇게 잘 들어맞는 종이가 재판을 앞두고 저절로 올 리가 있을까.", "5년 전 어느 의뢰인이 가져온 사실확인서도 이렇게 깔끔했다."] }],

        topics: [

          { q: "이 자료를 찾는 사람이 많았습니까?", req: ["t:arch_ok"], a: ["사고 나고 공소청에서 한 번 통째로 가져갔다가 돌려줬고요. 그 뒤로는 변호사님이 처음이에요.", "시 쪽 변호사님들은 여기 안 내려오세요. 필요한 건 위에서 다 올려 드리니까요."] },
          { q: "심의 회의록은 어디 있습니까?", req: ["t:arch_ok"], a: ["목록에는 있는데 철이 비어 있죠? '위원 보호를 위해 비공개.' 그건 저도 손 못 대요.", "위원이 누구였는지는 정보공개로 받으실 수 있을 거예요. 회의록은 몰라도 명단은 공개하거든요."] },
          { q: "철 등에 찍힌 정한별 주무관, 아직 시청에 있습니까?", req: ["t:binder"], a: ["정 주무관이요? 있죠. 지하 2층 보일러실 옆에 자리가 있어요. 기록실이라고 부르는데, 습기 먹은 서류 말리는 데예요.", "이 문서고에 뭐가 어디 있는지는 그 사람이 제일 잘 알아요. 저도 모르는 건 그 사람한테 물어봅니다.", "다만 그 사람 찾아가시는 거, 위에서는 안 좋아할 거예요. 저한테 들었다고는 하지 마세요."], opens: ["jung"] }] }],
      looks: [
        { q: "지반조사 결과를 읽는다", req: ["t:arch_ok"], a: ["건축위원회에 올라간 지반조사 결과다. 시추공 9개. 땅에 구멍을 뚫어 깊이별로 흙을 확인한 기록이다.", "9개 모두 적합 판정. 번호는 BH-1, 2, 4, 7, 8, 11, 12, 15, 18. 왜 번호를 건너뛰었는지는 어디에도 설명이 없다.", "기록철에 넣어 둔 해성개발 정산서가 떠올랐다. 거기엔 24개분이라고 적혀 있었다. 돈은 24개분을 치르고 시청에는 9개만 냈다."], gives: ["nine", { n: "심의 제출 지반조사", d: "건축위원회에 제출된 시추공 9개. 모두 적합. 번호는 1부터 18까지 띄엄띄엄이다.", img: "ev/m3-nine.webp" }] },
        { id: "binder", q: "철 등을 본다", req: ["t:arch_ok"], a: ["철 등에 견출지가 붙어 있다. '해안 복합개발 건축위원회 심의 자료. 2030. 11.' 그 아래 편철 담당자 도장이 찍혀 있다.", "정한별.", "5년 전 법정에서 '믿기 어렵다'는 판결을 받아 낸 증인이다. 그 사람이 이 철을 묶었다."] },
        { q: "결재란을 본다", req: ["t:arch_ok"], a: ["결재자: 건축과장 오명환. 결재일 2030년 11월 8일.", "2030년 11월. 내가 그 사람의 무죄 판결을 받아 낸 것이 그해 7월이었다. 넉 달 뒤다.", "기록철에서 탄원서 사본을 꺼냈다. 똑같이 반듯한 글씨, 똑같은 서명.", "오명환은 이 소송의 당사자가 아니다. 상대는 시다. 그래도 그 사람 사건에서 알게 된 것은 한 글자도 쓸 수 없다. 서류로만 싸워야 한다."], gives: ["sign", { n: "결재란·탄원서 서명", d: "심의 자료 결재자 오명환, 2030년 11월 8일 결재. 지난 사건 탄원서의 서명과 같다.", img: "ev/m3-sign.webp" }] },
        { id: "permit", q: "설계변경 승인 서류를 본다", req: ["t:arch_ok"], a: ["지하층 흙막이 설계변경 승인일 2032년 5월 3일. 땅을 팔 때 옆의 흙이 무너지지 않게 막는 벽을 바꾼 내용이다.", "서류만 보면 이상한 건 없다. 그 공사가 실제로 언제 있었는지 알아야 비교가 된다."] },
        { q: "첨부된 법률검토의견서를 읽는다", req: ["t:arch_ok"], a: ["법무법인 정헌. '일부 지점의 조사 결과만으로도 심의 자료로 족하다.'", "인용 판례가 붙어 있다. '대법원 2011. 2. 30. 선고 2010다77417 판결.'", "2월 30일. 지난 소송의 청람 의견서도 이 날짜를 인용했다. 사건번호까지 같다."], gives: ["opin2", { n: "정헌 법률검토의견서", d: "시추공 일부만 낸 것을 적법하다고 본 의견서. 있을 수 없는 날짜인 대법원 2011. 2. 30. 판결을 인용했다.", img: "ev/m3-opin2.webp" }] }] },
    assoc: { n: "유족회 사무실", s: "체육관 분향소 옆 방", bg: "m2-altar",
      arrive: ["유족회 사무실은 분향소가 차려진 체육관 한쪽, 탈의실을 비워 쓰는 방이다.", "문 앞에 국화 상자가 쌓여 있었다."],
      people: [{ id: "chong", n: "유족회 총무", face: A + "cut/n50f3.webp",
        intro: ["아이고, 변호사님. 회장님 전화 받았어요.", "뭐든 보세요. 저희는 숨길 게 없어요."],
        topics: [
          { q: "회비 장부를 보여 주십시오.", optional: true, a: ["여기요. 형편대로 낸 거라 금액이 들쭉날쭉해요. 10만 원 낸 집도 있고요.", "이 큰 금액이요? 2,800만 원. 입금자가 김다은으로 돼 있네요. 김다은 씨면… 회장님 따님인데요.", "회장님이 알아서 처리한다고 하셔서 저는 그대로 적어만 뒀어요. 어디서 난 돈인지는 저도 잘 몰라요."], gives: ["fund", { n: "유족회 회비 장부", d: "2,800만 원이 사망자 '김다은' 이름으로 입금됐다. 총무도 출처를 모른다.", img: "ev/m3-fund.webp" }] },
          { q: "시청에서 합의하자고 온 적이 있습니까?", optional: true, a: ["몇 번 왔죠. 여기 의향서 복사본이 있네요. 맨 아래 회장님 서명이 있고요.", "왜 있는지는 저도 몰라요. 회장님은 안 한다고 하셨는데."], gives: ["uihyang", { n: "합의 의향서 사본", d: "시청이 유족에게 돌린 합의 의향서. 맨 아래 조경숙의 서명이 있다.", img: "ev/m3-uihyang.webp" }] },
          { q: "유족회 분위기는 어떻습니까?", a: ["작년엔 쉰 집이 넘었어요. 이제 서른한 집이에요. 합의한 분들 욕 못 해요. 애 학원비가 없는데 어쩌겠어요.", "회장님은 분향소에서 밤을 새우실 때가 많아요. 집에 가면 다은이 방이 그대로라서요."] },
          { q: "이 위원 명단에 아는 이름이 있습니까?", req: ["members"], a: ["건축위원 명단이요? 우리가 이런 걸 어떻게 알아요. 잠깐만요.", "……이분. 이 교수님이요. 목요일마다 아침 일찍 오세요. 국화 한 송이 놓고 한참 서 있다 가세요.", "누구시냐고 물었더니 미안한 사람이라고만 하셨어요. 내일이 목요일이네요."], opens: ["committee"] }] }] },
    site: { n: "매립지 시추 현장", s: "지반공학 교수", bg: "m3-site", gated: true,
      arrive: ["교수는 현장에서 보자고 했다. 타워 부지 펜스 옆으로 지하철 고가가 지나간다. 바람에서 갯내가 났다."],
      people: [{ id: "prof", n: "지반공학 교수", face: A + "cut/n60f2.webp",
        intro: ["한 변호사님이시죠. 어머님 전화 받았어요.", "여기가 바다를 메운 땅이에요. 저 아래로 지하철까지 지나가고요."],
        topics: [
          { q: "이 땅은 뭐가 문제입니까?", a: ["바다 쪽으로 갈수록 뻘이 두꺼워요. 육지 쪽은 18미터쯤 파면 단단한 층이 나오는데, 바다 쪽은 41미터를 파도 안 나옵니다.", "건물은 말뚝을 단단한 층까지 박아서 세웁니다. 그 층이 너무 깊으면 말뚝이 뻘에 떠 있는 셈이에요."] },
          { id: "prof_24", q: "심의 자료에는 시추공이 9개, 정산서에는 24개입니다.", req: ["nine"], a: ["땅은 한 필지 안에서도 다 달라요. 그래서 여러 군데를 뚫어 보는 거예요.", "원본 조사표가 없으면 단정은 못 해요. 그런데 단단한 데만 골라서 내면 9개로도 전부 합격이 나옵니다.", "시험을 스물네 과목 보고 잘 본 아홉 과목 성적표만 낸 거죠."] },
          { q: "빠진 곳이 어디인지 알 방법이 있습니까?", req: ["t:prof_24", "bore"], a: ["번호요. 시추공은 뚫는 순서대로 번호가 붙습니다. 번호가 띄엄띄엄이면 빠진 게 있는 거예요.", "정산서에 위치도가 붙어 있네요. 제출된 번호를 여기에 표시해 볼게요.", "보세요. 제출된 9개는 전부 육지 쪽 줄이에요. 빠진 15개는 전부 바다 쪽이고요."], gives: ["map", { n: "시추공 번호 대조", d: "심의 제출 9개와 정산서 위치도의 24개를 맞춰 본 표. 빠진 15개는 전부 연약한 바다 쪽이다.", img: "ev/m3-map.webp" }] },
          { q: "그런 땅이면 처음부터 49층은 무리였습니까?", req: ["t:prof_24"], a: ["법적으로는 제가 답할 일이 아니죠.", "공학자로서 말씀드리면, 바다 쪽 자료를 봤으면 저는 도장 못 찍습니다."] },
          { id: "prof_orig", q: "24개를 실제로 뚫었다는 원본을 찾아야 합니다.", round: 1, a: ["원본이면 용역사가 납품한 지반조사 보고서죠. 대양지질에 남아 있을 거예요.", "정산서에 회사 주소가 찍혀 있네요. 거기부터 가 보세요. 요즘 지질 회사들이 하도 문을 닫아서 장담은 못 하지만요."], opens: ["daeyang"] },
          { id: "prof_driller", q: "대양지질은 폐업했고, 회사 서류는 폐기됐다고 합니다.", round: 1, req: ["t:trustee"], a: ["폐기요. 그럴 것 같았어요. 망한 회사 서류는 제일 먼저 버리니까요.", "그럼 사람을 찾으셔야죠. 시추 기사는 야장이라는 걸 씁니다. 그날 뚫은 깊이랑 흙 상태를 손으로 적는 공책이에요. 그건 회사 물건이 아니라 기사 물건이에요.", "대양지질이면… 제 제자 하나가 그 회사 현장 기사였어요. 회사가 망하고 지금은 우물 파러 다닌다던데요. 연락처 드릴게요.", "처음부터 이 얘기를 할 걸 그랬네요. 회사 서류가 있으면 그게 제일 깔끔하니까 그쪽을 먼저 말씀드렸어요."], opens: ["survey"] },
          { id: "prof_call", q: "제자분이 입을 닫았습니다. 시 측 변호사가 먼저 다녀갔다고 합니다.", round: 1, req: ["t:sv1"], a: ["먼저 다녀갔다고요? 그 애를 어떻게 알고요.", "……그 애가 겁내는 건 법정이 아니에요. 우물 파는 일도 시에 신고하고 허가받아야 하거든요. 시청 눈 밖에 나면 그 일도 끊겨요.", "제가 전화해 볼게요. 야장은 사본으로 내고 원본은 그 애가 갖고 있게 해 주세요. 법정에 세우지 않겠다고 약속해 주시고요.", [null, "교수는 그 자리에서 전화를 걸었다. 통화는 길었다. 끊고 나서 교수가 고개를 끄덕였다."], "오늘 저녁에 다시 가 보세요. 제 말은 듣는 애예요. 학교 다닐 때도 시추기 소리는 좋아하고 제 강의는 싫어했지만요."] }] }] },
    daeyang: { n: "옛 대양지질 사무실", s: "정산서에 찍힌 주소", bg: "alley", round: 1, gated: true,
      arrive: ["정산서에 찍힌 주소는 공단 뒷골목의 3층 건물이었다.", "2층 창문에 '대양지질' 시트지 글자가 반쯤 뜯긴 채 남아 있다. 지금 그 층에는 휴대폰 케이스 도매상이 들어와 있었다."],
      people: [{ id: "mgr", n: "건물 관리인", face: A + "cut/n60m1.webp",
        intro: ["대양지질 찾아오셨어요? 그 회사 나간 지가 언젠데요."],
        topics: [
          { id: "dy_gone", q: "대양지질 서류는 어디로 갔습니까?", a: ["망하고 나서 법원에서 사람이 나왔어요. 파산관재인이라던가. 박스를 트럭으로 실어 갔어요.", "그쪽 사무실 전화번호는 내가 적어 놨어요. 관리비 때문에 몇 번을 걸었는지 몰라요. 여기요."] },
          { q: "관리비요?", req: ["t:dy_gone"], a: ["석 달 치 안 내고 나갔어요. 파산관재인한테 신고는 했는데 순서가 맨 뒤래요. 은행이 먼저고 직원 월급이 먼저고 관리비는 한참 뒤라나.", "변호사시면 그거 좀 받아 주실 수 있어요? 수임료는 받은 돈에서 떼 가시고요.", ["한서준", "그건 제가 맡은 사건이 아니라서요."], "다들 그 말만 해요. 3년째 그 말만 들었어요."] }] }],
      looks: [
        { q: "건물 우편함을 본다", a: ["2층 우편함에 아직 '(주)대양지질' 이름표가 붙어 있다. 안에는 3년 묵은 전단지와 법원 등기 반송 안내서가 들어 있었다.", "회사는 없어졌는데 이름표는 남았다. 서류는 이름표만큼 오래 남지 않았을 것이다."] }] },
    jung: { n: "시청 지하 기록실", s: "정한별의 자리", bg: "m3-sideline", gated: true,
      arrive: ["지하 2층. 보일러 소리가 벽을 타고 울린다.", "제습기 옆 책상 의자에 회갈색 재킷이 걸려 있었다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["……그때 그 변호사죠.", "명함 안 주셔도 됩니다. 얼굴 압니다."],
        topics: [
          { id: "jung_no", q: "유족분들 소송에서 증언을 부탁드리러 왔습니다.", a: ["5년 전에 법정에서 제가 술에 취해 헛것을 봤다고 하셨잖아요. 그 판결문 때문에 저 여기 있습니다.", "판결 나고 다음 달부터 일을 안 주더군요. 문서 편철이나 하라고요. 그 일도 고발하고 나서는 뺏겼고요.", "이번에는 저를 뭐라고 하실 건데요? 돌아가세요."] },
          { q: "고발은 어떻게 된 겁니까?", req: ["t:jung_no"], a: [[null, "그날 내가 틀렸다고 말하고 싶었다. 말할 수 없는 일이었다. 대신 다른 것을 물었다."], "심의 자료를 묶다가 번호가 이상해서 과장님께 보고했습니다. 위에서 정리된 일이니 넘어가라고 하더군요. 그래서 고발했죠. 2030년 12월이요.", "석 달도 안 돼서 불기소요. 그다음엔 내부 문서를 들고 나갔다고 감사를 받고 여기로 왔습니다."] },
          { q: "여기서는 무슨 일을 하십니까?", a: ["습기 먹은 서류 말립니다. 제습기 물통 비우고요.", "이 건물에서 제일 성실한 건 저 제습기예요. 하루에 물통을 세 번 채웁니다. 저는 그걸 세 번 비우고요. 실적으로 치면 제가 2등입니다.","그 일을 4년 했어요. 타워가 무너진 날도 여기 있었습니다. 위층 사람들은 뉴스를 먼저 봤는데 저한테는 아무도 말을 안 해 줬어요. 퇴근길에 알았습니다."] },
          { q: "유족회에 편지를 보내셨다고 들었습니다.", req: ["q6"], a: ["……회장님이 그 얘기까지 하셨어요.", "분향소에 몇 번 갔어요. 체육관 입구까지 갔다가 돌아왔습니다. 제가 그때 더 세게 했으면, 그 생각을 하면 들어갈 수가 없더라고요.", "그래서 편지로 썼어요. 번호를 세어 보라고. 제가 할 수 있는 건 그게 다였습니다."] },
          { q: "빠진 15개가 어디였는지 보여 드리겠습니다.", req: ["t:jung_no"], needs: "map", lock: ["……그게 뭡니까. 그런 종이로 저를 설득하실 생각이면 그만두세요."], okLine: ["……", "바다 쪽이요. 전부요.", "저는 번호가 빈 것까지만 봤어요. 어디가 빠졌는지는 몰랐습니다. 알아볼 방법도 없었고요.", "5년을 혼자 이상하다고 했는데, 다른 사람이 같은 걸 본 건 처음이네요.", "나갈게요. 다만 변호사님을 믿어서 나가는 건 아닙니다. 이 종이를 믿어서 나가는 겁니다."], gives: ["jungok", { n: "정한별의 증언 동의", d: "심의 자료의 빈 번호를 처음 알아챈 내부 증인. 번호 대조표를 보고 법정에 서기로 했다.", img: "ev/m3-jungok.webp" }] }] }] },
    survey: { n: "우물 공사 현장", s: "전 대양지질 시추 기사", bg: "m3-site", round: 1, gated: true,
      arrive: ["교외 과수원 한쪽에서 소형 시추기가 돌고 있었다. 기계 소리가 멎을 때까지 한참 기다렸다."],
      people: [{ id: "driller", n: "전 시추 기사", face: A + "cut/n50m4.webp",
        intro: ["교수님이 말씀하신 변호사님이시죠.", "대양지질이요? 망한 지 3년 됐어요. 저는 지금 우물 파러 다닙니다."],
        topics: [
          { id: "sv1", q: "해성개발 현장에서 시추공을 몇 개 뚫었습니까?", a: ["그걸 제가 어떻게 기억해요. 벌써 몇 년 전 일인데요.", "……솔직히 말씀드릴게요. 어제 서울에서 변호사라는 분이 다녀갔어요. 명함에 법무법인 목멱이라고 돼 있더라고요. 시청 쪽 일을 한다고요.", "그때 기록 같은 게 있으면 자기들이 보관해 주겠대요. 괜히 갖고 있다가 증인으로 불려 다니면 피곤하실 거라고, 요즘 지하수 허가 갱신도 깐깐하다고 하더라고요.", "협박한 건 아니에요. 아주 친절했어요. 그래서 더 무섭더라고요. 저는 그 일로 엮이기 싫습니다."] },
          { id: "sv_ok", q: "이 정산서를 보십시오.", req: ["t:sv1", "t:prof_call"], needs: "bore", lock: ["그게 저희 회사 거라는 표시가 어디 있어요. 엉뚱한 걸로 사람 잡지 마세요."], okLine: ["교수님 전화 받았어요. 한 시간을 혼나고 반 시간을 달램 받았네요. 법정에는 안 나가도 되는 거 맞죠?", ["한서준", "약속드리겠습니다. 야장도 사본만 받겠습니다."], "……어, 이거 우리 회사 정산서네. 위치도에 제 글씨도 있어요.", "24공 맞아요. 그 현장 기억납니다. 2030년 9월부터 10월 말까지 팠어요. 바다 쪽 파다가 장비가 뻘에 빠져서 고생했거든요. 크레인까지 불러서 꺼냈어요."] },
          { q: "원본 조사표가 남아 있습니까?", req: ["t:sv_ok"], a: ["회사 서버는 폐업하면서 없어졌어요. 그런데 현장 기사는 원래 야장을 씁니다.", "제가 뭘 잘 안 버리는 성격이라. 잠깐만요. 트럭에 박스째 있어요.", "집사람이 이 박스 좀 버리라고 3년을 그랬어요. 트럭 짐칸에 우물 장비보다 이게 더 많다고요.", "여기요. BH-1부터 BH-24까지 다 있어요. 날짜도 다 적혀 있고요. 바다 쪽 번호는 땅이 단단한 정도를 재는 숫자, N값이 2니 3이니 그래요. 물렁하다는 뜻입니다. 육지 쪽은 30이 넘고요.", "변호사님, 부탁 하나만 해도 될까요. 이게 쓸모가 있었다고 집사람한테 꼭 좀 말해 주세요. 명함도 한 장 주시고요. 증거로 보여 줘야 해서요."], gives: ["orig", { n: "시추 원본 야장", d: "BH-1~24 전부의 현장 기록. 2030년 9~10월에 24공을 모두 뚫었다. 바다 쪽 15공은 N값 2~4, 41m까지 단단한 층이 없다. 육지 쪽 9공은 N값 30 이상.", img: "ev/m3-orig.webp" }] },
          { q: "9개짜리 자료는 누가 만들었습니까?", req: ["t:sv_ok"], a: ["저희가 납품한 보고서엔 24공이 다 들어갔어요. 9개만 뽑은 건 저희가 만든 게 아닙니다.", "해성개발 과장이 '시청에 낼 건 저희가 따로 정리합니다' 하고 가져갔어요. 돈은 24개분으로 다 줬고요. 그건 깔끔했어요."] },
          { q: "야장을 왜 버리지 않으셨습니까?", req: ["orig"], a: ["타워 무너진 날 뉴스 보고 바로 트럭에 가서 박스부터 열어 봤어요.", "누가 물어보러 올 줄 알았습니다. 1년 넘게 아무도 안 왔어요. 변호사님이 처음입니다.", "법정에 나오라고는 하지 마세요. 야장은 드릴게요."] }] }] },
    jung2: { n: "시청 뒤 분식집", s: "정한별과 증언 준비", bg: "diner", round: 1,
      arrive: ["정한별이 고른 곳은 시청 뒤 분식집이었다. 시청 사람들은 이쪽으로 잘 오지 않는다고 했다."],
      people: [{ id: "jung2", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["지난 기일 얘기는 들었습니다. 다음에 제가 나가는 거죠.", "여기 떡볶이는 맵기만 해요. 시키지 마세요."],
        topics: [
          { q: "다음 기일에 그 판결문이 나올 겁니다.", a: ["알아요. 그쪽에서 안 쓰면 이상하지요.", "그 말 듣는 건 익숙해요. 5년을 들었으니까. 다만 변호사님이 받아 낸 말을 변호사님 앞에서 다시 듣게 되네요."] },
          { q: "2030년에 이상을 발견했다는 기록이 남아 있습니까?", a: ["번호를 보고 검토 메모를 썼어요. 2030년 11월 3일. 번호 9개 옮겨 적고 '공번 15개 사유 확인 요망'이라고요. 공번은 빈 번호라는 뜻입니다.", "제목도 그렇게 달았어요. '해안 복합개발 심의 자료 공번 15개 사유 확인 요망.' 바쁜 분들은 제목만 보니까요.", "내부 전자문서로 올렸어요. 그 문서는 누가 언제, 몇 분 동안 열어 봤는지가 남아요. 11월 4일 오전 9시 12분에 과장님이 열어서 11분 동안 보셨습니다. 결재는 그 나흘 뒤고요.", "열람 기록은 그때 출력해 뒀어요. 무시당할 것 같았거든요.", "이거 내시면 저 또 문서 빼돌렸다는 소리 나옵니다. 그건 아세요?"], gives: ["memo", { n: "정한별 검토 메모·열람 기록", d: "2030년 11월 3일 작성. 제목 '해안 복합개발 심의 자료 공번 15개 사유 확인 요망.' 11월 4일 09:12 오명환 과장이 11분 동안 열람. 결재는 나흘 뒤.", img: "ev/m3-memo.webp" }] },
          { q: "고발 사건 불기소 이유서를 갖고 계십니까?", a: ["통지서 받았죠. 봉투째 있어요. 여기요.", "'증거 불충분으로 혐의없음.' 무고니 허위 고발이니 하는 말은 한 줄도 없어요. 그런데 시청 사람들은 다 제가 허위 고발을 했다고 알아요."], gives: ["nopros", { n: "불기소 이유 통지서", d: "2031년 2월. 증거 불충분으로 혐의없음. 허위 고발이라는 판단은 없다.", img: "ev/m3-nopros.webp" }] },
          { q: "왜 시청을 그만두지 않으셨습니까?", a: ["그만두면 그 사람들 말이 맞는 게 되니까요.", "그리고 기록실에 있으면 문서가 어디 있는지는 제일 잘 알게 됩니다. 언젠가 쓸 데가 있겠지 했어요."] },
          { q: "흙막이 설계변경 공사가 실제로 언제 있었는지 알 방법이 있습니까?", round: 2, req: ["t:permit"], a: ["공사 날짜요? 그건 감리가 압니다. 감리단은 공사를 날마다 일지로 적어요.", "그리고 그 무렵 감리단에서 건축과로 공문이 왔었어요. 제가 요즘 하는 일이 그런 접수 대장 정리라서 압니다. 승인 전에 공사부터 했다는 내용이었어요.", "보낸 사람은 감리단장이었고요. 지금은 은퇴하셨는데, 연락처는 대장에 남아 있습니다."], opens: ["supervise"] },
          { id: "jung_audit", q: "지난 기일 뒤로 별일 없으셨습니까?", round: 2, a: ["어제 감사실에서 불렀어요. 법정에 낸 메모를 어떻게 갖고 나갔는지 경위서를 쓰래요.", "시 쪽 변호사님이 법정에서 반출 얘기를 꺼낸 바로 다음 날이에요. 우연이겠죠.", "그래서 당분간 저는 서류에 손을 못 대요. 종이 한 장 복사해 드려도 또 반출이 되니까요. 이번에는 어디 있는지 말씀만 드릴 수 있습니다."] },
          { id: "jung_sibo", q: "2030년 사무전결 규정이 폐기됐다고 합니다. 위원 명단 공개도 미뤄졌고요.", round: 2, req: ["t:rule_old", "t:mem_wait", "t:jung_audit"], a: ["폐기요? 민원실에서 그렇게 말해요?", "구판 출력물은 버렸겠죠. 그런데 사무전결 규정은 시 규칙이에요. 만들거나 고칠 때마다 시보에 실어서 공포합니다. 시보는 버리는 문서가 아니에요.", "민원실 안쪽 열람대에 연도별로 다 꽂혀 있어요. 2030년 철 찾으시면 그해 규정이 통째로 실려 있을 겁니다.", "위원 명단도 그래요. 위원을 위촉하면 시보에 공고가 나갑니다. 공개를 미루든 말든 이미 공고된 건 못 숨겨요.", "그 열람대 먼지를 제가 4년 동안 털었어요. 시청에서 시보를 처음부터 끝까지 읽는 사람은 아마 저 하나일 겁니다. 자랑은 아니고요."] }] }] },
    rule: { n: "시청 민원실", s: "정보공개 창구", bg: "m3-cityhall", round: 2,
      arrive: ["민원실 번호표를 뽑았다. 정보공개를 청구해 둔 자료 두 가지를 받으러 왔다.", "하나는 누가 어디까지 결정할 수 있는지 적은 내부 규정, 사무전결 규정이다. 오명환이 결재하던 2030년 당시의 것이어야 한다.", "다른 하나는 회의록은 비공개라던 건축위원회의 위원 명단이다."],
      people: [{ id: "clerk", n: "민원실 직원", face: A + "cut/n30f1.webp",
        intro: ["정보공개 청구하신 거 찾으러 오셨어요? 접수 번호 불러 주세요."],
        topics: [
          { id: "rule_new", q: "청구한 사무전결 규정을 받으러 왔습니다.", a: ["네, 여기 있습니다. 출력물이 스무 장이 안 넘어서 수수료는 없어요.", "흰 봉투 맞으시죠? 노란 봉투는 다른 분 거예요. 지난주에 바뀌어서 가져가신 분이 있었거든요."] },
          { id: "mem_wait", q: "건축위원회 위원 명단은요?", req: ["t:rule_new"], a: ["그건 공개 결정이 연기됐어요. 연기 통지서 드릴게요.", "위원분들한테 공개해도 되는지 의견을 묻는 중이고요, 시 소송대리인 쪽에서도 의견서가 들어왔대요. '소송 중인 사안이라 위원들을 보호할 필요가 있다'고요.", "열흘 더 걸린다고 돼 있는데, 그렇게 연기되면 보통 한 번 더 연기돼요. 저는 서식대로 드리는 것뿐이에요.", [null, "열흘에 열흘이면 다음 기일이 먼저 온다. 목멱이 그 날짜를 모를 리 없다."]] },
          { id: "rule_old", q: "제가 청구한 건 2030년 당시 규정입니다.", req: ["t:rule_wrong"], a: ["2030년이요? 규정이 개정되면 구판은 폐기해요. 문서관리 규정에 그렇게 돼 있어요.", ["한서준", "그 문서관리 규정은 언제 판입니까?"], "그건 현행이죠. 현행은 폐기 안 해요.", "청구서에 그냥 '사무전결 규정'이라고 쓰셔서 현행을 드린 거예요. '2030년 판'이라고 쓰셨으면 부존재 통지를 드렸을 거고요. 다시 청구하시면 부존재 통지 드릴게요. 그것도 열흘 걸려요.", [null, "열흘을 기다려 없다는 종이를 받는 셈이다. 나는 정중하게 사양했다."]] },

        { q: "돈의 흐름을 읽는다", req: ["t:recok"], a: ["해성개발에서 도원으로 86억. 그 뒤로는 전부 현금 인출이다. 은행 창구에서 뽑아 간 날짜와 금액은 나오는데, 그다음이 없다.", "특검은 이 돈이 공무원과 공소청 쪽으로 갔다고 썼다. 받았다는 사람도, 받았다는 기록도 없다. 돈이 사무실 문을 나서는 순간 길이 끊긴다."], gives: ["cut", { n: "현금 인출 뒤 끊긴 돈", d: "도원에서 현금으로 인출된 뒤 사용처를 알 수 없다. 받은 사람을 특정한 자료가 없다.", img: "ev/f4-cut.webp" }] },
        { q: "이수아의 진술을 읽는다", req: ["t:recok"], a: ["'대표의 장부를 직접 봤습니다. 구속 뒤엔 접견 때 받아 적어서 제가 이어 썼습니다. 현금을 누구에게 줬는지 적혀 있었습니다.'", "특검이 쥔 것 중 돈의 끝을 말해 주는 건 이 진술뿐이다. 실물은 없다."], gives: ["leest", { n: "이수아 진술조서", d: "장부를 직접 봤고, 구속 뒤에는 접견 때 받아 적어 이어 썼다는 진술. 실물은 없다.", img: "ev/f4-leest.webp" }] },
        { q: "구치소 접견 기록을 읽는다", req: ["leest"], a: ["이수아 씨가 접견 때 받아 적었다고 했다. 정말 그만큼 드나들었는지 접견 명단부터 찾았다.", "2030년 봄부터 2031년 1월까지, 이수아 이름만 마흔여섯 번 나온다. 한 번에 10분 안팎.", "어머니도 아내도 아닌 회사 직원이 마흔여섯 번을 왔다. 안부만 물으러 온 사람의 횟수가 아니다."], gives: ["visit", { n: "구치소 접견 기록", d: "구속 뒤 이수아의 접견 46회. 한 번에 10분 안팎.", img: "ev/f4-visit.webp" }] },
        { q: "방재호의 수사 진술을 읽는다", req: ["t:recok"], a: ["'서류라서 쓰레기봉투에 버렸습니다. 소각장으로 갔을 겁니다.'", "특검은 소각장까지 확인했다고 적었다. 5년 전 쓰레기라 더 파 볼 수가 없었던 모양이다.", "방재호 기사님. 5년 만에 보는 이름이다."], gives: ["jaest", { n: "방재호 수사 진술", d: "\"서류는 쓰레기봉투에 버렸다. 소각장으로 갔을 것이다.\"", img: "ev/f4-jaest.webp" }], opens: ["jae"] },
        { q: "해성개발 재무이사의 진술조서를 읽는다", req: ["t:recok"], a: ["문상철. 해성개발 재무이사. 특검이 첫 기일에 세우겠다고 예고한 증인이다.", "'도원으로 간 돈은 회장님이 시청 일 봐 주는 값이라고 하셨습니다. 저는 회장님한테서만 들었고, 도원 쪽 사람과는 회장님 일정 말고 따로 연락한 적이 없습니다.'", "맨 끝 장에 문상철의 서명과 무인이 있다. 들은 말을 옮기는 사람이다. 그것도 한 사람한테서만 들었다고 스스로 적었다."], gives: ["munst", { n: "문상철 진술조서", d: "해성개발 재무이사의 특검 진술. 돈의 성격은 회장에게서만 들었고, 도원 쪽 사람과 따로 연락한 적은 없다고 서명했다.", img: "ev/f4-munst.webp" }] },
        { q: "불기소 관련 자료를 읽는다", req: ["t:recok"], a: ["2031년 정한별 고발의 불기소 참고자료로 법무법인 한강로의 의견서가 붙어 있다.", "인용 판례. '대법원 2011. 2. 30. 선고 2010다77417 판결.' 또 2월 30일이다. 이번엔 오타라고 넘길 수가 없다.", "그때 이 사건을 맡은 사람은 권태훈 수사관이었다."], gives: ["opin4", { n: "한강로 의견서", d: "정한별 고발의 불기소 참고자료. 있을 수 없는 날짜인 대법원 2011. 2. 30. 판결을 인용했다.", img: "ev/f4-opin4.webp" }], opens: ["kwon"] },
        { q: "도원컨설팅 압수 현장 사진을 넘겨 본다", req: ["t:recok"], a: ["대표실 사진이다. 소파, 서가, 빈 금고. 벽 한가운데에 액자가 하나 걸려 있다.", "수구여병. 守口如甁.", "손이 멈췄다. 내 사무실에 걸린 것과 같은 글씨다. 획 끝을 살짝 꺾어 올리는 버릇까지 똑같다.", "교수님 글씨를 받은 사람은 제자들뿐인 줄 알았다. 이 바닥에서 교수님 글씨 한 점 받는 게 드문 일은 아니겠지. 그렇게 생각하기로 했다."], gives: ["frame", { n: "대표실 압수 사진", d: "도원컨설팅 대표실 벽의 '수구여병' 액자. 강도윤의 글씨와 같아 보인다.", img: "ev/f4-frame.webp" }] }] },

    jae: { n: "터미널 휴게실", s: "방재호를 찾아서", bg: "rest", gated: true,
      arrive: ["5년 만에 오는 휴게실이다. 형광등 하나가 여전히 깜빡인다.", "탁자 위에 양은 냄비가 있다. 냄비 밑에는 고무 받침이 깔려 있다."],
      people: [
        { id: "bang", n: "방재호", face: A + "cut/n40m2.webp",
          intro: ["어, 변호사님! 이게 몇 년 만이에요. 안경 새로 맞췄는데 알아보시네.", "그런데 무슨 일로 여기까지… 혹시 그 일 때문이에요? 그 사람들이 또 왔었거든요."],
          topics: [
            { id: "yoovisit", q: "누가 또 왔었어요?", a: ["양복 입은 사람들이요. 두 해 전에도 왔고 지난달에도 왔어요. 그 서류 어떻게 했냐, 진짜 버렸냐. 똑같은 거 묻고 가요.", "이번엔 변호사님 쪽 사람이라던데요. 사무장이라고. 유 뭐시기요.", "저는 또 변호사님이 보낸 줄 알고 잘 말해 줬죠. 버렸다고요."] },
            { id: "bangthrow", q: "그 서류, 정말 버리셨어요?", a: ["…네. 버렸다니까요. 쓰레기봉투에요.", "변호사님, 저 이제 나이도 있고 애들 대학 등록금도 있고요. 그때 얘기는 진짜 그만하고 싶어요."] },
            { q: "어머님은 요즘 어떠세요?", req: ["t:bangthrow"], a: ["아직 요양병원에 계세요. 5년째요. 제 얼굴을 알아보실 때도 있고 못 알아보실 때도 있고.", "그해 설에는 선물 하나를 못 사 들고 갔어요. 그게 아직도 걸려요.", [null, "방재호가 재킷 소매를 잡아당겼다. 5년 전에도 저 손을 봤던 것 같다."]] },
            { id: "askwit", q: "증인으로 나와 주실 수 있겠습니까?", round: 2, a: ["…변호사님, 그 얘기 하러 오신 거예요?", "어제 특검이라는 데서 전화가 왔어요. 변호인 쪽 증인으로 신청됐다고, 나오시면 2031년 택배 일도 다시 여쭤볼 게 있다고요. 말은 공손한데 무슨 뜻인지는 알겠더라고요.", "저 못 나가요. 진짜 죄송해요. 그때 그 일로 한 번 죽다 살았는데, 또 그 사람들 앞에 서라고요?", "오늘은 어머니 병원 가는 날이라 이만 가 볼게요.", [null, "방재호는 내 대답을 듣지 않고 재킷을 집어 들고 나갔다. 휴게실 문이 두 번 덜컹거렸다."]] }] },
        { id: "mate", n: "동료 기사", face: A + "cut/n50m2.webp",
          intro: ["변호사님 아니세요? 방 형님 일로 오셨구나. 저 기억하시죠? 그때 형님 편 들어 드렸던 사람.", "아, 그리고 미리 말씀드리는데 저 형님보다 일곱 살 어려요. 다들 제가 형인 줄 알아서."],
          topics: [
            { q: "방 기사님은 요즘 어떠세요?", a: ["밥은 잘 먹어요. 근데 양복쟁이들 다녀가고 나면 며칠씩 말이 없어요.", "형님이 원래 겁이 많아요. 남의 택배 하나에도 벌벌 떠는 사람이에요."] },
            { id: "bookhint", q: "요즘도 사무장이 찾아옵니까?", round: 2, a: ["그 유 사무장이요? 지난주에 또 왔는데 이번엔 형님 말고 저한테 묻더라고요. 방 형님이 옛날에 헌책 판 데가 어디냐고.", "형님이 예전에 휴게실에 굴러다니던 책들 몇 권 묶어서 골목 헌책방에 팔았거든요. 그걸 어떻게 알았는지 몰라.", "저는 뭐 숨길 것도 없어서 알려 줬죠. 시장 골목 끝에 있는 데요. 근데 헌책은 왜 찾는대요?", [null, "나도 모른다. 장부가 없다는 사건에서 내 의뢰인의 사무장이 헌책방을 찾고 있다."]], opens: ["bookshop"] },
            { q: "방 기사님 어머님 병원이 어디예요?", req: ["t:askwit"], a: ["형님 방금 나갔죠? 특검 전화 받고부터 저래요. 어제는 라면을 반이나 남겼어요. 형님이요.", "어머님은 개천 건너 요양병원에 계세요. 쉬는 날이면 형님 거기서 하루 종일 있어요.", "근데 병원까지 쫓아가시게요? …가시면 제가 알려 줬다고 하지 마세요. 저 형님보다 일곱 살 어린 거, 증명해 줄 사람이 형님밖에 없어요.", [null, "여기서 일곱 살 얘기가 왜 나오는지는 묻지 않았다. 이 사람한테는 그게 제일 중요한 일이다."]], opens: ["hosp"] }] }],
      looks: [
        { id: "pot", q: "냄비 밑을 본다", a: ["고무 받침이다. 새것은 아니다.", "5년 전 이 자리에는 공책을 묶은 듯한 소설책이 깔려 있었다. 『남산 아래 봄』. 국물이 배어 표지 손글씨가 번져 있었다.", "어느 날 가 보니 그 책이 없었고, 동료 기사가 방 형님이 헌책 묶어서 헌책방에 넘기더라고 했다. 그때도 지금도 신경 쓸 일은 아니다."] },
        { q: "벽의 근무표를 본다", a: ["방재호 이름 옆에 이번 달 야간이 열하루다. 5년 전보다 더 많다."] }] },

    kwon: { n: "권태훈 수사관", s: "퇴근길 주차장", bg: "f2-investigator", gated: true,
      people: [{ id: "kwon", n: "권태훈", face: A + "story/insp.webp",
        intro: ["…변호사님. 왜 또 저를.", [null, "목에 건 신분증이 차 문에 부딪혀 달그락거렸다."]],
        topics: [
          { id: "kwon1", q: "불기소 때 누가 지시했습니까?", a: ["말할 수 없습니다. 애가 둘입니다.", [null, "권태훈은 긴 머리를 뒤로 넘기며 목에 건 신분증을 재킷 안으로 집어넣었다. 얘기를 끝내겠다는 몸짓이었다."]] },
          { q: "이 의견서, 누가 가져왔는지 기억하세요?", req: ["opin4"], a: ["의견서야 사건마다 들어옵니다. 다만 그 건은 제가 올리기도 전에 결론이 내려와 있었습니다.", "더 묻지 마십시오. 변호사님 모시는 분 쪽으로 이어지는 얘기일 수도 있습니다.", ["윤서연", "모시는 분이요?"], [null, "권태훈은 대답하지 않고 차 문을 열었다."]] },
          { q: "그때 법정에서 물을 수 있었는데 묻지 않았습니다", req: ["t:kwon1"], a: ["…압니다. 감사하다는 말은 못 합니다.", "언젠가, 말해야 하는 날이 오면 말하겠습니다."], gives: ["kwono", { n: "권태훈의 약속", d: "\"말해야 하는 날이 오면 말하겠다.\"", img: "ev/f4-kwono.webp" }] }] }] },

    guard: { n: "구치소 접견 담당", s: "접견 녹음 요지", bg: "f4-detention", gated: true,
      people: [{ id: "guard", n: "접견 담당 교도관", face: A + "cut/n40m3.webp",
        intro: ["변호인 접견 말고 일반 접견은 전부 녹음됩니다. 요지는 문서로 남고요."],
        topics: [
          { id: "tape", q: "이수아 접견 때 녹음 요지를 신청한다", needs: "sun", lock: "변호인이시면 선임서를 주십시오. 그래야 드릴 수 있습니다.", okLine: "확인했습니다. 여기요. 양이 많지는 않습니다." },
          { q: "수감자가 바깥일을 지시할 수 있습니까?", req: ["t:tape"], a: ["원칙은 못 하죠. 그런데 변호인 접견은 안 들리거든요.", "일반 접견은 다 듣지만 뜻은 저희가 어떻게 압니까. 감자라면 감자로 적는 수밖에요."] }] }],
      looks: [
        { q: "녹음 요지를 읽는다", req: ["t:tape"], a: ["'거래처 안부 전달. 건강 문의. 감자 세 상자 보냈다는 말. 아이 돌잔치 축의 이야기.'", "감자 세 상자. 돌잔치 축의. 돈이나 이름은 한 번도 안 나온다.", "그런데 왜 이 사람은 감자 이야기를 마흔여섯 번이나 하러 온 걸까."], gives: ["rectape", { n: "접견 녹음 요지", d: "이수아 접견 46회분. 돈이나 공무원 이름은 없고 '감자 세 상자', '돌잔치 축의' 같은 말만 있다.", img: "ev/f4-rectape.webp" }] }] },

    clerk: { n: "사무장 유기택", s: "서초동 찻집", bg: "f2-consult", gated: true,
      people: [{ id: "yoo", n: "유기택", face: A + "cut/n50m3.webp",
        intro: ["변호사님! 말씀 많이 들었습니다. 강 교수님 애제자시라면서요.", "이쪽 일은 제가 다 챙겨 드립니다. 차는 뭐로 하시겠어요?"],

<!doctype html>
<html lang="ko">
<head><meta charset="utf-8">
<title>의뢰인의 진실 스토리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* 레이아웃: 위 띠 + 인물 무대 + 아래 대화창. 본 게임의 호두나무·놋쇠 색을 그대로 씀(단일 다크) */
:root { color-scheme: dark;
  --wood: #1b120d; --panel: #140d09f0; --line: #c9a24a55; --brass: #c9a24a; --paper: #efe7d6; --ink: #221d18;

* { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { height: 100%; }
/* 장면 전환 */
#fade { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity .42s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade .ft { font-family: var(--f-d); color: var(--brass); font-size: 30px; line-height: 1.3; }

/* 팝업: 본 게임 안내창과 같은 모양 */
.pop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; background: #000a; animation: popin .2s; }
@keyframes popin { from { opacity: 0; } }
.pop-card { width: min(100%, 330px); max-height: 86%; overflow-y: auto; background: #1f150f; border: 1px solid var(--brass); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 14px 36px #000c; }
.pop-k { font-size: 13px; color: var(--brass); }
.pop-card h3 { margin: 0; font-family: var(--f-d); font-weight: 400; font-size: 22px; line-height: 1.3; color: var(--text); text-align: center; }
.pop-b { font-size: 15px; line-height: 1.6; color: #e6dac6; text-align: center; }
.pop-pic { width: 150px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid var(--brass); }
.pop-ico svg { width: 42px; height: 42px; fill: none; stroke: var(--brass); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pop-btns { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.pop-btns .btn { text-align: center; border-left-width: 1px; }
/* 오프닝 뒤 달력 */
.calbox { flex: 1; display: flex; align-items: center; justify-content: center; }
.cal-wrap { position: relative; width: min(290px, 76vw); aspect-ratio: 3 / 4; perspective: 1200px; }
.cal { position: absolute; inset: 0; background: #f4ede0; color: #2a2018; border-radius: 6px; box-shadow: 0 12px 32px #000b; padding: 26px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; transform-origin: top center; backface-visibility: hidden; }
.cal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14px; border-radius: 6px 6px 0 0; background: #3a2a1d; }
.cal.top { transition: transform 1.1s ease-in, opacity 1.1s ease-in; }
.cal.top.flip { transform: rotateX(105deg); opacity: 0; }
.cal-y { font-size: 15px; color: #7a6a55; letter-spacing: .2em; }
.cal-m { font-family: var(--f-d); font-size: 48px; line-height: 1.1; color: #a3322b; }
.cal-g { width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; text-align: center; font-size: 13px; margin-top: 6px; }
.cal-g b { font-weight: 600; color: #7a6a55; } .cal-g b:first-child { color: #a3322b; }
.cal-g i { font-style: normal; }
body { margin: 0; background: var(--wood); color: var(--text); font-family: var(--f-b); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

#bg { position: fixed; inset: 0; background: var(--wood) center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0d0806b0, #0d080666 34%, #0d0806e8 66%); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0d0806f5; border-top: 1px solid #c9a24a44; }
#tabs .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); background: none; border: none; }
#tabs .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs .tab.on { color: var(--brass); }
#tabs .tab.off { opacity: .3; cursor: default; }
/* 증거: 그림 칸, 누르면 설명 */
.evgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.evtile { background: #f1e9d8; color: var(--ink); border: 1px solid #d7c9ab; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.evt { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; background: #e2d4b6; display: grid; place-items: center; overflow: hidden; }
.evt svg { width: 46%; height: 46%; fill: none; stroke: #6b5a44; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.evt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.evn { font-size: 12.5px; line-height: 1.3; text-align: center; word-break: keep-all; }
.top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.top .tt { font-family: var(--f-d); color: var(--brass); font-size: 17px; flex: 1; min-width: 0; text-shadow: 0 1px 4px #000; }
.mini { background: #000a; border: 1px solid var(--brass); color: var(--brass); border-radius: 8px; padding: 4px 11px; font-size: 13.5px; white-space: nowrap; }
.stage { flex: 1 1 0; min-height: 70px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
/* 인물 크기는 본 게임 일반 사건과 같은 계산(화면 폭의 60%, 170~230px의 3/4) */
.stage img.who { --sz: calc(max(170px, min(230px, 60vw)) * .75); width: var(--sz); height: var(--sz); object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 10px 18px #000c); -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }
/* 대화 상대가 있는 화면: 본 게임처럼 얼굴은 위에 고정, 대사와 선택지는 그 바로 아래부터 */
.stage:not(:empty) { flex: 0 0 auto; height: calc(max(170px, min(230px, 60vw)) * .75 + 16px); align-items: flex-start; }
.stage:not(:empty) + .panel { flex: 1 1 0; max-height: none; min-height: 0; }
.stage:not(:empty) + .panel > .btn.go:last-child, .stage:not(:empty) + .panel > .btn.ghost:last-child { margin-top: auto; flex: none; }
.tag { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: var(--brass); color: #2a1c0c; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 1px 12px; white-space: nowrap; }
.panel { flex: 0 1 auto; max-height: 66%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.say { background: var(--panel); border: 1.5px solid var(--brass); border-radius: 12px; padding: 11px 14px; }
.say .n { font-size: 13px; color: var(--brass); }
.say p { margin: 0; font-family: var(--f-s); font-size: 17.5px; line-height: 1.7; }
.say.mono { border-color: #c9a24a66; }
.say.mono p { color: #e6d9c2; }
.hint { text-align: center; font-size: 12.5px; color: var(--muted); }
.btn { display: block; width: 100%; text-align: left; background: #1d140ef2; border: 1px solid var(--brass); border-left-width: 4px; border-radius: 8px; padding: 9px 12px; font-size: 16px; line-height: 1.45; }
.btn small { display: block; color: var(--muted); font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: linear-gradient(#e4c46e, #b38a34); color: #2a1c0c; border: 1px solid #f1d98f; text-align: center; font-weight: 600; }

.lbl { font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

.ev { display: block; width: 100%; text-align: left; background: #f1e9d8; color: var(--ink); border: 1px solid #d7c9ab; border-radius: 8px; padding: 9px 12px; }
.ev b { font-size: 16px; }
.evpic { float: right; width: 64px; height: 64px; object-fit: cover; border-radius: 6px; margin-left: 8px; }
.evshow { width: min(220px, 60%); align-self: center; border-radius: 10px; border: 2px solid var(--brass); box-shadow: 0 6px 18px #000a; }
.stamp.long { font-size: 21px; letter-spacing: 0; }
.ev-ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ev .ev-ico { color: #6b5a44; }
.ev .d { display: block; font-size: 15px; color: #4a4034; line-height: 1.55; }
.ev .tagr { font-size: 11.5px; background: var(--lose); color: #fff; border-radius: 3px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.sheet { position: fixed; inset: 0 0 calc(62px + env(safe-area-inset-bottom, 0px)) 0; z-index: 20; background: #000b; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: #f1e9d8; color: var(--ink); width: 100%; max-width: 480px; max-height: 76%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet h3 { margin: 0; font-family: var(--f-d); font-weight: 400; color: #6b4a1e; }
/* 재판: 본 게임 폰 화면과 같은 배치(사건 제목 위, 상대 왼쪽·우리 오른쪽, 게이지, 아래 대화창) */
#bg.court::after { background: linear-gradient(180deg, #140d0955 0%, #140d0922 35%, #140d0988 65%, #140d09e6 100%); }
#app.court { padding: 0; display: block; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
#app.quake { animation: quake .5s; }
@keyframes quake { 10%, 50%, 90% { transform: translate(-7px, 3px); } 30%, 70% { transform: translate(7px, -3px); } }
.court .top { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px; }
.court .bench { position: absolute; top: calc(68px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: 80%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.court .bench .no, .court .bench .who { color: #d6c6aa; font-family: var(--f-s); font-size: 11.5px; line-height: 1.5; text-shadow: 0 1px 3px #000; }
.court .bench .tt { font-family: var(--f-s); font-weight: 700; font-size: 15px; line-height: 1.5; text-shadow: 0 2px 6px #000; }
.court .sides { position: absolute; top: 32%; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.court .side { position: relative; width: 36%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 2px solid; box-shadow: 0 6px 18px #000; }
.court .side img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.court .side span { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11.5px; line-height: 1.5; background: #000b; padding: 2px; }
.court .side.opp { border-color: var(--lose); } .court .side.us { border-color: var(--win); }
.court.hit-us .side.us, .court.hit-opp .side.opp { animation: shake .45s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.court .gw { position: absolute; left: 16px; right: 16px; top: 58.6%; }
.gauge { position: relative; height: 34px; border-radius: 6px; overflow: hidden; background: linear-gradient(90deg, #6e2f27 0 var(--t1), #6a5426 var(--t1) var(--t2), #2f5a3a var(--t2)); border: 1px solid var(--line); }
.gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--paper); box-shadow: 0 0 8px #000; transition: left .5s cubic-bezier(.3,1.4,.6,1); }
.gauge-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; text-shadow: 0 1px 3px #000; }
.gauge.zw { animation: zw 1s ease-out; } .gauge.zl { animation: zl 1s ease-out; }
@keyframes zw { 0% { box-shadow: 0 0 0 0 #8fdc9f; } 30% { box-shadow: 0 0 18px 6px #8fdc9fcc; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes zl { 0% { box-shadow: 0 0 0 0 #ff7a66; } 30% { box-shadow: 0 0 18px 6px #ff7a66cc; } 100% { box-shadow: 0 0 0 0 transparent; } }
.court .log-wrap { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 3; max-height: calc(100% - 140px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.log-line { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; background: #140d09f0; border: 1.5px solid var(--brass); border-radius: 12px; padding: 12px; font-size: 18px; line-height: 1.5; box-shadow: 0 6px 18px #000a; animation: pop .25s ease-out; }

.log-line .who { font-size: 12px; color: var(--muted); display: block; }
.log-line .d { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; white-space: nowrap; }
.log-line .d.pos { color: var(--win); } .log-line .d.neg { color: var(--lose); }
.log-line .more { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--brass); }
.court .opts { display: flex; flex-direction: column; gap: 5px; }
.court .opts .btn { font-size: 15px; padding: 8px 12px; }
.cutin { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; pointer-events: none; }
.ci-band { position: relative; width: 100%; height: 150px; display: flex; align-items: center; gap: 14px; padding: 0 18px; overflow: hidden; }
.cutin.us .ci-band { background: linear-gradient(100deg, #0b2a5ae6, #1b4fa0e6 60%, #0b2a5ae6); animation: ciL var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.cutin.opp .ci-band { flex-direction: row-reverse; background: linear-gradient(260deg, #5a0b0be6, #a01b1be6 60%, #5a0b0be6); animation: ciR var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.ci-face { width: 128px; height: 128px; flex: none; border-radius: 10px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 20px #000a; }
.ci-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.ci-txt { font-family: var(--f-d); font-size: clamp(34px, 11vw, 54px); color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #000; transform: rotate(-4deg); white-space: nowrap; }
@keyframes ciL { 0% { transform: translateX(-100%) skewY(-4deg); } 18%, 80% { transform: translateX(0) skewY(-4deg); } 100% { transform: translateX(100%) skewY(-4deg); opacity: 0; } }
@keyframes ciR { 0% { transform: translateX(100%) skewY(4deg); } 18%, 80% { transform: translateX(0) skewY(4deg); } 100% { transform: translateX(-100%) skewY(4deg); opacity: 0; } }

.flash.white { background: #fff; } .flash.red { background: #ff2a1a; }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

.vd-top { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; }
.vd-stamp { width: 112px; height: 112px; display: grid; place-items: center; }

.ledger { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-variant-numeric: tabular-nums; background: #1f150fd1; border: 1px solid #c9a24a33; border-radius: 10px; padding: 8px 12px; font-size: 14px; }

<script>
const A = "assets/", H = { m: { n: "한서준", img: A + "hero-m.webp" }, f: { n: "윤서연", img: A + "hero-f.webp" } };
const OFF = Math.max(0, Math.min(3, +new URLSearchParams(location.search).get("office") || 0));
const BG = { court: A + "court-2.webp", m: `${A}office-${OFF}-m.jpg`, f: `${A}office-${OFF}-f.jpg` };
const OLD_BG = ["rec", "er", "diner", "alley", "dock", "rest"];
// 아직 그림이 없는 장소는 비슷한 그림으로 대신한다(그림이 들어오면 여기서 지운다)
const PENDING_BG = {};

          { id: "appother", q: "다른 앱을 썼거나 전화로 불렀을 수도 있을까요?", req: ["t:hailget"], a: ["다른 회사 앱이면 저희는 모르죠. 전화 콜도 저희 기록에는 안 잡히고요.", "그런데 이 고객님은 지난 2년 동안 저희 앱 계속 쓰셨거든요. 한 달에 두세 번씩요. 그날은 안 쓰신 게 확실하고요."] },
          { id: "appnear", q: "그날 그 근처에서 들어온 호출을 볼 수 있나요?", req: ["t:hailget"], a: ["위치별로 뽑아 드리는 건 다른 고객님 정보라서 안 돼요. 법원에서 정식으로 사실조회가 오면 몰라도요.", "금요일 밤이라 시청 앞은 기사님들이 많이 대기하셨을 거예요.", "아, 그리고 전화 끊으시면 상담 만족도 조사 문자가 갈 거예요. '매우 만족' 눌러 주시면 감사하겠습니다.", ["한서준", "저는 고객이 아닌데요."], "고객이 아니셔도 상관없어요. 지금 거신 번호로 조사 문자 가거든요. 시스템이 그렇게 돼 있어서요. 매우 만족 부탁드립니다.", [null, "전화를 끊자마자 문자가 왔다. '고객님, 오늘 상담에 만족하셨나요?' 고객도 아닌데 싶어 잠깐 고민하다가 '매우 만족'을 눌렀다. 그분도 즐거운 마음으로 퇴근하셔야지."]] }] }] },
    diner: { n: "대성식당", s: "회식한 고깃집", bg: "diner",
      arrive: ["대성식당. 저녁 장사 전이라 불판이 한쪽에 쌓여 있다. 벽에 시청 각 과의 회식 사진이 붙어 있다."],
      people: [{ id: "owner", n: "식당 사장", face: A + "cut/n60m3.webp",
        intro: ["아직 장사 전인데요. 나가세요.", ["한서준", "아, 저는 손님은 아니고요…"], "손님 아니시면 무슨 일로? 돈 받으러 오셨나?", [null, "내가 수금원같이 생겼나…"], ["한서준", "아닙니다. 저는 변호사고요."], "변호사? 나는 잘못한 것도 없는데?", ["한서준", "아니요, 사장님이 잘못하셔서 찾아온 건 아니고요. 말씀 좀 여쭤봐도 될까요?"]],
        topics: [
          { id: "dopen", q: "3월 15일 시청 건축과 회식 일로 여쭤볼 게 있습니다.", a: ["…"], needs: "sun",
            lock: ["손님 일을 함부로 말씀드릴 수가 있나요. 그쪽이 누구신지도 모르는데."],
            okLine: ["아, 오 과장님 변호사시구나. 그 양반 사고 난 날이지요.", "그날 열두 분 오셨어요. 저 안쪽 방에서요."] },
          { id: "drank", q: "그날 과장님은 얼마나 드셨어요?", req: ["t:dopen"], a: ["많이 드셨죠.", ["한서준", "몇 잔 안 드셨다던데요?"], "몇 잔 안 마셔요? 그 양반이? 누가 그래요? 혼자 한두 병은 넘게 드셨을걸요.", "그 양반은 원래 잘 드세요. 회식 때마다 마지막 병은 과장님이 다 비우고 가요. 술을 워낙 좋아해, 그 양반."] },
          { id: "stay", q: "끝까지 남은 사람이 있었나요?", req: ["t:dopen"], a: ["안경 쓴 분이요. 금속테 안경에 회갈색 재킷 입은 분.", "과장님이 잔을 주면 넙죽넙죽 받아서 다 드셨어요. 이름이 뭐라더라… 정 뭐라고 했는데. 상사가 주는 술을 어떻게 안 마시겠어요. 술도 안 세 보이더구만. 끝날 때까지 과장님 옆에 계셨는데 나중에는 술이 좀 올랐는지 밖에서 바람 쐬더라고요.", "그날 영수증 찾아 드릴까요? 카드 전표 옆에 제가 방 번호랑 인원을 적어 두거든요."],
            gives: ["receipt", { n: "회식 영수증", d: "12명, 소주 11병. 사장은 안경 쓴 직원이 끝까지 함께 마셨다고 했다.", img: "ev/m1-receipt.webp" }] },
          { id: "front", q: "회식이 끝나고 가게 앞은 어땠어요?", req: ["t:dopen"], a: ["11시 반쯤 파했어요. 다들 택시 잡으러 큰길로 가고, 과장님은 골목 안 주차장 쪽으로 가셨지요. 안경 쓴 분은 가게 앞에서 담배를 피우시고.", "대리요? 대리 기사가 오면 다들 가게 앞에서 기다리니까 제가 보거든요. 그날은 못 봤어요.", "저는 불판 닦느라 그다음은 못 봤죠. 쿵 소리 나서 나가 보니 벌써 사람들이 몰려 있더라고요."] },
          { id: "calls", q: "회식 자리에서 과장님은 어떠셨어요?", req: ["t:drank"], a: ["요즘 해안 복합개발인가 그것 때문에 시청 분들이 바빠요. 그래서 늘 늦게들 스트레스 푼다고 회식하러 오세요.", "그 과장님은 회식 중에도 전화를 받으러 밖으로 몇 번씩 나가셨어요. 한 번은 양복 입은 남자가 가게 앞에 차를 대 놓고 기다리다가 과장님하고 몇 마디 하고 갔고요.", "큰 사업 하는 데는 다 그런가 봐요."] },
          { id: "dphoto", q: "벽에 붙은 사진은 다 회식 사진인가요?", req: ["t:front"], a: ["시청 분들 오시면 제가 꼭 한 장씩 찍어 드려요. 제가 학창 시절에 사진 동호회 활동을 좀 했거든요. 다 제 작품입니다. 기획예산과는 저기, 환경과는 저기, 감사실은 저 구석.", "3월 15일 건축과요? 있지요. 그날은 국장님도 오셔서 제가 특별히 두 장 찍었어요. 한 장은 국장님이 눈을 감으셔서요.", ["한서준", "그 사진을 빌려 갈 수 있을까요?"], "엥. 사진 그냥 찍어가시면 되지 저걸 왜 빌려가세요. 떼 가시면 그 자리가 비잖아요. 제 작품이라니까요. 플래시는 터뜨리지 마시고요. 사진 바래요.", [null, "열두 명이 불판 앞에 앉아 있다. 오명환 옆에 머리가 희끗한 국장이 앉았고, 맞은편 계장도 반백이다. 셋 다 짙은 남색 양복이다."], [null, "밝은 데서 봐도 체격이 비슷하다. 어두운 골목에서 뒷모습만 보고 셋을 가려낼 자신은 없다."]],
            gives: ["photo", { n: "회식 단체 사진", d: "그날 대성식당에서 찍은 사진. 피고인과 국장, 계장 세 사람이 모두 반백에 짙은 남색 양복 차림이고 체격도 비슷하다.", img: "ev/m1-photo.webp" }] },
          { id: "daudit", q: "시청에 감사 기간이라 다들 술을 자제했다던데요.", req: ["t:jdrink"], a: ["음. 평소에 비하면 자제한 건가? 오 과장님 혼자서 서너 병도 드시니까. 그날 열두 분이 소주 열한 병 드셨어요.", "근데 감사 기간이면 오히려 더 드시던데요. 다들 속이 타는지. 감사 기간이라고 술을 자제한 건 아닐 것 같아요."] }] }] },
    alley: { n: "사고 골목", s: "직접 둘러보기", bg: "alley",
      arrive: ["밤 11시 40분, 사고가 난 시각에 맞춰 골목에 와 봤다. 큰길 불빛이 골목 어귀에서 끊긴다.", "어귀의 작은 슈퍼에서 주인이 셔터를 반쯤 내리고 있다."],
      desc: "골목 안쪽으로 공영주차장 간판이 보인다. 차 한 대가 겨우 지나갈 너비다.",
      people: [{ id: "shop", n: "슈퍼 주인", face: A + "cut/n60f4.webp",
        intro: ["문 닫는 중이에요. 뭐 사시게요?", ["한서준", "아… 죄송합니다. 물건 사러 온 건 아니고요."], "아, 그럼 뭐요. 화장실이라도 급해?", ["한서준", "아이고, 아닙니다. 죄송합니다. 뭐 좀 여쭤보려고요."]],
        topics: [
          { id: "runaway", q: "3월에 여기서 난 사고를 보셨어요?", a: ["봤지요. 이 시간쯤 셔터 내리다가 쿵 소리가 나서 내다봤어요.", "차가 저 전봇대에 박혀 있고, 남자 하나가 운전석 옆에 주저앉아 있더라고요. 다친 양반은 전봇대 앞에 쓰러져 있고.", "도망가는 사람이요? 못 봤어요. 이 골목은 외길이라 누가 큰길로 뛰어가려면 우리 가게 앞을 지나가야 할 텐데. 글쎄… 제 기억에는 없네요."] },
          { id: "lampday", q: "저 가로등은 언제부터 꺼져 있었어요?", req: ["t:lamp"], a: ["석 달 됐나. 구청에 민원을 세 번 넣었는데 아직이에요.", "사고 난 날도 꺼져 있었지요. 그러니까 사고가 나지. 우리 가게 불 끄면 여기는 깜깜해요."] },
          { id: "carlight", q: "그날 사고 난 차는 불이 켜져 있었나요?", req: ["alley"], a: ["불이요? 하나도 없었어요. 앞이 저렇게 찌그러졌는데 불이 켜져 있겠어요. 깜깜해서 내가 셔터를 도로 올리고 가게 불을 켰다니까요.", "그래 봐야 우리 가게 불은 저 전봇대까지 안 가요. 사람 쓰러진 것도 가까이 가서야 알았어요.", "근데 아까 줄자 들고 바닥을 기어 다니던 양반이 변호사였어요? 나는 구청에서 드디어 가로등 고치러 온 줄 알고 반가워했네.", ["한서준", "죄송합니다. 가로등 민원은 제가 한 번 더 넣어 드리겠습니다."], "미안한 줄은 아나 보네. 그럼 뭐라도 하나 사 가요. 퇴근하려는 사람 붙잡고 30분이나 떠들었으면.", ["한서준", "그… 죄송한데… 제가 진짜 돈이 별로 없어서요. 생수 하나만 주십시오. 제일 싼 걸로요."], "뭔 놈의 변호사가 돈이 없어? 웃기는 양반이네. 에휴… 여깄소. 생수. 천 원, 현금으로.", [null, "결국 천 원짜리 생수를 하나 샀다. 계산대 옆에 '가로등 민원 4회째'라고 적힌 쪽지가 붙어 있었다. 아까 세 번이라더니, 또 넣으시려고 준비 중이셨나 보다."], [null, "차에 불이 안 들어왔다면 실황조사서에도 적혀 있을지 모른다. 기록을 다시 봐야겠다."]] }] }],
      looks: [
        { id: "lamp", q: "가로등을 살핀다", a: ["사고가 난 전봇대 위 가로등이 꺼져 있다. 덮개 안에 날벌레가 까맣게 들어차 있다.", "골목 어귀는 어둡다. 큰길 불빛은 여기까지 오지 않는다."] },
        { id: "measure", q: "식당 앞에서 사고 지점까지 재 본다", req: ["t:wstmt", "t:lampday"], a: ["정한별이 섰다는 식당 앞에서 전봇대까지 줄자를 끌어가며 길이를 쟀다. 약 128미터. 지나가던 고등학생이 이상하다는 듯 쳐다본다.", "식당 앞에 서서 전봇대 쪽을 보았다. 사람이 서 있는 건 알겠는데 얼굴은 보이지 않는다.", "조서에는 가로등 밑이라 잘 보였다고 적혀 있었다. 그 가로등은 그날 꺼져 있었다."],
          gives: ["alley", { n: "현장 사진·거리 측정", d: "사고 지점 위 가로등은 그날도 꺼져 있었다. 정한별이 섰던 식당 앞까지 약 128m.", img: "ev/m1-alley.webp" }] },
        { id: "banner", q: "담벼락의 현수막을 본다", a: ["'해안 복합개발 건축심의 예정.' 요즘 시내 어디를 가도 보인다.", "조감도 속 타워는 구름에 닿을 듯 길쭉하게 그려져 있다."] }] },
    city: { n: "서해광역시청", s: "건축과 정한별 주무관", bg: "m3-cityhall", gated: true,
      arrive: ["서해광역시청 본관. 로비에 해안 복합개발 조감도가 크게 걸려 있다.", "검사 쪽 증인을 만나는 건 조심해야 하는 일이다. 말을 맞추자는 것처럼 보이면 안 된다. 물을 것만 묻기로 하고 건축과에 면담을 청했다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["오 과장님 변호사시라고요. 오래는 못 있습니다. 과장님이 자리를 자주 비우셔서 일이 밀려 있어요.", [null, "금속테 안경에 회갈색 재킷. 서류 뭉치를 가슴에 안고 로비로 내려왔다."]],
        topics: [
          { id: "jsaw", q: "그날 보신 걸 직접 듣고 싶습니다.", a: ["경찰에서 말씀드린 그대로입니다. 쿵 소리가 나서 돌아보니 과장님이 운전석에서 내리셨습니다.", "가로등 밑이라 잘 보였습니다. 법정에서도 똑같이 말할 겁니다."] },
          { id: "jdrink", q: "그날 술은 얼마나 드셨어요?", req: ["t:jsaw"], a: ["거의 안 마셨습니다. 한두 잔 받아 놓기만 했습니다.", "요즘 감사실에서 공직기강 점검을 하고 있어서요. 회식을 해도 술은 자제하라는 공문이 내려와 있습니다."] },
          { id: "jstop", q: "과장님이 주차장 쪽으로 가실 때 말리지는 않으셨어요?", req: ["t:jsaw"], a: ["거기서 대리를 부르신 줄 알았습니다.", "그리고 저희 과에서 과장님께 운전하지 마시라고 말할 수 있는 사람은 없습니다. 제가 그 말을 했으면… 난리가 났겠죠. 지금쯤 제 업무는 두 배가 돼 있을 거고요."] },
          { id: "jgrudge", q: "과장님과 사이가 좋으셨나요?", req: ["t:jsaw", "q7"], a: ["뭐, 일반적인 직장의 상사와 부하직원. 그 이상도 이하도 아니지요. 오 과장님이 의외로 좀 깐깐한 분이라 제가 올린 서류도 자주 반려하셨고요.", "그렇다고 제가 거짓말로 오 과장님이 음주운전했다고 말할 이유도 없습니다. 저도 이 일로 마음이 편하지 않습니다.", "그동안은 과장님이 해안 복합개발 심의 자료를 많이 맡아 주셔서 덜 바빴는데, 과장님이 안 나오시니 보십시오. 누가 제일 정신없이 일하고 있는지…. 사건과 상관없는 얘기네요. 바빠서 이만 들어가 보겠습니다."] }] }] },

  intro: ["벽지가 들뜨고 창틀에 곰팡이 자국이 남은 상가 2층 사무실. 중고 책상과 철제 캐비닛 사이에서, 교수님이 써 주신 수구여병(守口如甁) 액자만 안 어울리게 비싸 보인다.", "오늘은 법률구조 상담 명단에서 소개받은 의뢰인이 오는 날이다.", "약속 시간에 맞춰 갈색 재킷을 입은 마른 남자가 문을 두드렸다. 안경 너머 눈이 피곤해 보였다. 셔츠 단추는 맨 위까지 잠겨 있었다."],

          { q: "복도에 서 있는 직원 쪽을 본다", silent: true, a: ["저 친구요? 총무 일 보는 앤데 뭘 물어보시려고요. 오래 붙잡지 마세요.", [null, "복도의 직원이 고개를 숙인 채 1층 쪽을 눈짓했다."]], opens: ["clerk"] },
          { id: "choigrudge", q: "이수아 씨 아버님 일을 아세요?", req: ["q8"], a: ["…그 얘기는 어디서 들으셨습니까.", "그 여자 아버지가 옛날에 대표님한테 일 부탁했다가 잘 안 된 사람이라던데요. 그런 사람이 많아요. 일이 안 되면 다 남 탓이지.", "앙심 품고 들어온 겁니다. 저도 나중에 알았어요. 그러니 장부를 들고 나갔겠죠. 대표님 약점 쥐려고.", [null, "검사도 이 얘기를 들었을 수 있다. 법정에서 아버지 일이 나올지 모른다."]] },

    clerk: { n: "도원컨설팅 총무 직원", s: "건물 1층 커피숍", bg: "f2-consult",

          { q: "4년 전 영상을 아직 가지고 있어요?", a: ["옛날 서버를 안 지웠거든요. 이수아 선배 퇴사하던 날, 2031년 1월 17일 거예요. 보세요. 손에 든 건 작은 쇼핑백 하나뿐이에요.", "그런데 며칠 앞에, 1월 13일 밤에는 대표실에서 상자를 들고 나오는 게 찍혔어요. 신발 상자만 한 거요. 수사관들도 그 장면만 몇 번을 돌려 봤어요.", "전 그건 모르겠어요. 선배 나쁜 사람 아니에요."],
            gives: ["cctv", { n: "복도 CCTV 영상", d: "퇴사일(2031. 1. 17.) 피고인이 든 것은 작은 쇼핑백뿐. 1월 13일 밤 대표실에서 신발 상자만 한 상자를 들고 나오는 장면도 찍혀 있다.", img: "ev/f2-cctv.webp" }] },
          { q: "이수아 씨는 회사에서 어떤 사람이었어요?", a: ["경조사 봉투 챙기고 대표님 구치소 심부름 다니고 그랬죠. 대표님 잡혀가고 다들 도망갈 때 혼자 남아 있었어요.", "대표님 말씀 받아 적고 온 날은 화장실에 한참 있다 나오더라고요. 눈이 빨개서요. 저는 대표님한테 혼나서 그런 줄 알았어요."] },
          { q: "이수아 씨가 처음 입사할 때 일을 아세요?", req: ["q8"], a: ["저보다 한참 선배라 들은 얘기예요. 경리로 들어왔는데 대표실 옆자리를 자기가 하겠다고 했대요.", "거기 다들 싫어했거든요. 대표님 고함이 벽 너머로 다 들려서요. 선배는 한 번도 자리 바꿔 달라고 안 했어요.", "…그러고 보니 그것도 이상하네요. 그런 자리를 왜 자원했을까."] }] }] },

          { q: "받은 적이 없다는 건 알겠습니다. 연락도 없었습니까?", req: ["t:kwon1"], a: ["제보 연락이 한 번 있었던 것 같습니다. 회사 자료를 보내겠다고요. 그러고는 안 보냈습니다. 그런 사람 많습니다.", "이름은 기억나지 않습니다. 그 무렵엔 제보가 하루에 수십 건씩 들어왔어요. 조사 때도 그렇게 말씀드렸습니다.", [null, "권태훈이 아는 건 물건이 안 왔다는 데까지다. 이수아가 안 보냈다는 근거는 없다."]] },

          { q: "2031년 1월 20일에 보내신 문자를 기억하세요?", round: 1, req: ["del"], a: ["1월 20일이요? 기억에 없습니다. 무슨 문자입니까?", ["윤서연", "법정에서 보여 드릴게요."], [null, "권태훈은 수첩을 꺼내 날짜를 적었다."]] }] }] },

        topics: [
          { id: "mom1", q: "따님은 어떤 분이세요?", a: ["착해요. 너무 착해서 탈이지. 회사 그만두고 나서는 학원 다니면서 저 병원까지 데리고 다니고.", "어릴 때는 아빠를 그렇게 따랐어요. 현장에 따라간다고 떼를 써서, 헬멧 쓰고 사진도 찍고 그랬지."] },

          { id: "suits", q: "요즘 따님 회사 일로 찾아온 사람은 없었어요?", req: ["t:dad"], a: ["…있었어요. 작년 가을에, 타워 무너지고 나서. 양복 입은 남자 둘이 여기 병원까지 왔었어요.", "수아가 회사에서 갖고 나간 거 어디 있냐고. 책인지 공책인지. 내가 모른다니까 웃으면서 어머님 몸조리 잘하시라고 하고 가더라고요.", "그날 밤에 수아한테 전화했더니, 엄마 그거 내가 태웠어, 이제 아무도 안 와, 그러더라고요. 근데 변호사님, 그 뒤로도 한 번 더 왔어요."] },
          { q: "투석은 오래 받으셨어요?", a: ["삼 년 됐어요. 일주일에 세 번. 수요일만 수아가 오고 나머지는 혼자 와요.", "수아가 재판받는 거 나는 다 알아요. 걔는 내가 모르는 줄 알지. 변호사님, 우리 애 잘 좀 부탁해요."] }] }] },

        intro: ["얼굴 보고 오라고 했더니 정말 왔구나. 앉아라. 커피는 네가 타라."],
        topics: [
          { id: "kang1", q: "전 의뢰인의 비밀 때문에 막혔어요.", a: ["네가 아는 걸 말하면 빠르겠지. 그래도 안 된다.", "변호사는 의뢰인의 비밀을 무덤까지 가져가는 사람이다. 지금 의뢰인이 아무리 딱해도 그건 안 바뀐다. 네가 한 번 입을 열면, 앞으로 네 방에 오는 사람은 아무도 너한테 사실대로 말하지 않는다.", "다른 길을 찾아라. 찾아보면 있다."] },
          { id: "kang2", q: "검사가 제 옛 변론을 그대로 들고 나왔어요.", req: ["t:kang1"], a: ["'피해품이 특정되지 않는다.' 네가 쓴 변론이지. 틀린 말은 아니었다.", "그 사건에서 다툰 건 없어진 물건이 뭔지, 누가 가져갔는지였다. 지금 사건에서 다투는 건 보낸 사람이 왜 보냈느냐다.", "상자가 어디로 갔는지는 증명하려 하지 마라. 보낸 사람이 누구한테, 왜 보냈는지를 증명해라."] },
          { q: "왜 보냈는지는 어떻게 증명해요?", req: ["t:kang2"], a: ["택배를 잃어버리면 회사가 물어 주잖니. 물어 줄 때 서류를 안 쓰겠냐. 받는 사람, 무게, 크기가 거기 있을 거다.", "배상금이 나갔으면 서류가 남았을 거다. 택배사 배상 담당을 찾아가 봐라."], opens: ["parcel"] },
          { q: "은닉이라는 게 정확히 어디까지예요?", req: ["t:kang2"], a: ["옛날 모의법정 때 쓰던 강의안이 있다. 책장 어디… 여기 있구나. 비매품이야. 복사하지 말고 너만 봐라. 복사하면 내가 안다.", "증거를 숨겼다고 하려면 찾기 어렵게 만들 뜻이 있어야 한다. 수사기관에 보낸 사람한테 그런 뜻이 있겠냐. 받아 적지 말고 머리에 넣어 가라.", [null, "강의안 귀퉁이에 판례 하나가 인쇄되어 있다. '대법원 2011. 2. 30. 선고.' 교수님 강의안에서 판례 날짜까지 따져 볼 일은 없었다. 그대로 가방에 넣었다."], "도원 사건이라니, 몸조심하고. 내 제자가 다치는 건 못 본다."],
            gives: ["lect", { n: "강도윤 교수의 강의안", d: "비매품 강의안. \"은닉은 발견을 어렵게 하려는 뜻이 있어야 한다. 수사기관에 넘기려는 행위와는 함께 설 수 없다.\" 귀퉁이에 '대법원 2011. 2. 30. 선고' 인용.", img: "ev/f2-lect.webp" }] },
          { q: "교수님 방 커피는 여전히 쓰네요.", a: ["네가 타 놓고 왜 나한테 그러냐.", "그 원두는 네 선배 하나가 개업했다고 놓고 간 거다. 나는 차를 마신다."] },
          { q: "의뢰인이 제게 처음부터 거짓말을 했어요.", req: ["t:kang1"], a: ["의뢰인은 다 거짓말을 한다. 겁이 나서 그런다. 거짓말 안 하는 의뢰인은 삼십 년 동안 몇 명 못 봤다.", "왜 거짓말을 했는지 알아봐라. 그걸 알면 그 사람이 너를 얼마나 믿는지도 알 수 있다."] }] }] },
    parcel: { n: "택배사 배상팀", s: "분실 배상 서류 창고", round: 1, gated: true, bg: "dock",
      people: [{ id: "claim", n: "배상팀 직원", face: A + "cut/n40f2.webp",
        intro: ["4년 전 분실 건이요? 돈이 나간 건이면 서류는 남아 있어요. 보내는 분 위임장 있으세요?"],
        topics: [
          { id: "purged", q: "보내는 사람 이수아 씨의 위임장입니다. 2031년 1월 분실 배상 서류를 찾고 싶어요.", a: ["위임장 확인했습니다. 잠시만요… 2031년 1월이면, 아. 배상 서류는 보존 기간이 3년이에요. 작년 2월에 한꺼번에 폐기됐네요.", "폐기 대장은 있어요. 이 건이 폐기 목록에 들어 있다는 것까지는 확인해 드릴 수 있어요. 폐기 대장은 보존 기간이 10년이거든요.", "지점에서 따로 사본을 갖고 있을 수는 있어요. 그건 지점마다 달라서 저희도 몰라요. 접수 지점은 폐기 대장에 적혀 있어요. 여기요.", [null, "접수 지점 칸에 4년 전 그 터미널 이름이 있다."]] },
          { q: "분실된 물건을 나중에 찾는 경우도 있나요?", req: ["t:purged"], a: ["가끔요. 몇 달 뒤에 엉뚱한 지점 창고에서 나오기도 하고요. 그래도 이건 안 나왔어요. 폐기 목록에 '미회수'라고 적혀 있네요.", [null, "필요한 건 받는 사람이 적힌 송장이다."]] }] }] },
    term: { n: "옛 터미널", s: "방재호를 찾아서", round: 1, bg: "dock",
      people: [{ id: "mate", n: "동료 기사", face: A + "cut/n50m2.webp",
        intro: ["어, 그때 그 변호사님이시네. 방 형님이요? 왜요, 또 무슨 일 났어요?"],
        topics: [
          { id: "bangq", q: "방재호 씨 연락처를 아세요?", a: ["그 일 있고 다음 해에 그만두셨어요. 번호도 바뀌었고요. 어디 지방 내려갔다는 말만 들었지 저도 몰라요.", "찾으시면 안부나 전해 주세요. 형님 떠날 때 술값 내가 냈다고."] },
          { q: "방재호 씨를 찾는 사람이 또 있었어요?", req: ["t:bangq"], a: ["어떻게 아셨어요? 그저께 양복 입은 사람 둘이 와서 방 형님 어디 사냐고 묻더라고요. 4년 전 상자 얘기를 하면서요.", "모른다고 했죠. 진짜 모르니까. 그랬더니 동료면서 왜 모르냐고 한참을 캐묻다 갔어요.", [null, "도원 사람들이 방재호를 찾고 있다. 나는 방재호를 찾더라도 그 이름을 법정에서 쓸 수 없다."]] },
          { q: "본사에서 분실 배상 서류를 이미 폐기했대요. 지점에도 사본이 있을까요?", req: ["t:purged"], a: ["배상 서류요? 본사는 3년 지나면 버리죠. 그런데 우리 지점장님은 못 버려요.", "분실 나면 경위서 쓰면서 송장 사본을 같이 붙여서 철해 놓거든요. 창고 뒤 철제 캐비닛에 연도별로 다 있을걸요. 2019년 것도 있어요.", "지점장님한테는 제가 말해 둘게요."], opens: ["branch"] },
          { q: "여전히 방재호 씨를 형님이라고 부르시네요.", a: ["형님은 형님이죠. 아, 또 그 얘기 하시려고요? 내가 더 늙어 보인다는 거?", "다들 그래요. 나이는 내가 다섯 살 어린데."] },
          { q: "휴게실은 어떻게 됐어요?", a: ["리모델링해서 싹 바뀌었어요. 탁자도 새로 들이고 냄비도 새로 샀어요. 옛날 물건은 다 내다 버렸고요.", "에어컨도 달았어요. 형님이 그렇게 노래를 부르던 거. 형님은 정작 못 써 보고 가셨네.", [null, "옛날 물건 가운데 헌책방에 넘긴 게 없었는지 묻고 싶었다. 그걸 물으면 방재호가 상자를 뜯었다고 말하는 셈이 된다. 그만두었다."]] }] }] },
    branch: { n: "터미널 지점 창고", s: "분실 경위서 철", round: 1, gated: true, bg: "f2-storage",

      people: [{ id: "boss", n: "지점장", face: A + "cut/n60m3.webp",
        intro: ["변호사님이 2031년 분실 철을 찾으신다고요? 거봐, 내가 버리지 말자고 했지.", [null, "지점장이 열쇠 꾸러미를 꺼냈다."]],
        topics: [
          { q: "이걸 다 보관하세요?", a: ["버리면 꼭 나중에 찾는 사람이 와요. 오늘처럼. 본사는 3년 지나면 버리라는데 저는 못 버리겠더라고요."] },
          { q: "분실 건마다 경위서를 쓰세요?", a: ["돈 나가는 건 다 써요. 마지막 스캔 시각, 담당 기사, 송장 사본까지 붙여서 본사에 올리고, 사본은 여기 철하고.", "근데 4년 전 걸 왜요? 그때 무슨 일 있었어요?", [null, "경위서에는 담당 기사 이름이 있을 테니 그 부분은 쓸 수 없다. 필요한 건 송장 사본이다."]] }] }],
      looks: [
        { q: "2031년 1월 분실 철을 넘긴다", a: ["1월 철은 얇다. 분실 건이 몇 개 안 된다.", "'2031. 1. 16. 접수. 보내는 사람 이수아. 받는 사람 공소청 수사과 권태훈 앞.' 송장 사본이 경위서에 스테이플러로 박혀 있다.", "4년 전 본사 고객지원팀이 개인정보라며 가려 준 칸이다.", "무게 1.3킬로, 30×25×8센티미터. 품목란에는 보낸 사람이 볼펜으로 직접 쓴 '홍삼 세트'. 배상금 5만 원 지급.", "경위서 본문은 덮어 두고 송장 사본만 복사해 달라고 했다."],
          gives: ["waybill", { n: "택배 분실 경위서의 송장 사본", d: "2031. 1. 16. 접수. 받는 사람 '공소청 수사과 권태훈 앞'. 1.3kg, 30×25×8cm, 품목 '홍삼 세트'(보낸 사람이 직접 씀). 배상금 5만 원 지급.", img: "ev/f2-waybill.webp" }] }] } },
  lies: [["장부를 태웠다는 말", 2], ["수사기관과 연락한 적 없다는 말", 4], ["구속된 대표의 말을 접견 가서 받아 적었다는 말", 0], ["최동규 상무가 회사를 맡았다는 말", 3], ["아버지 일로 도원에 들어갔다는 말", 8]],

  blind: [["윤서연", "알겠어요. 이수아 씨 말씀대로 정리해 볼게요. 태운 건 태운 거고, 왜 그랬는지를 설명해야죠."], ["이수아", "…믿어 주시는 거예요?"], ["윤서연", "제가 맡은 분 말인데요. 믿고 시작해야죠."], ["이수아", "고맙습니다. 정말이에요."], "이수아가 고개를 숙였다. 경위서 한 장으로 충분할 거라고 생각했다."],

      { card: "phone", show: G => [["h", "서랍에서 나온 휴대폰이요. 2031년 1월 16일, 권 수사관이라는 분께 택배로 서류를 보낸다는 메시지가 있어요."], ["c", "……"], ["h", "태운 게 아니죠. 보내셨죠. 제가 맡았던 그 택배로요."],
        ...(G.cards.dad ? [["h", "아버님 영수증은 지금도 사진 뒤에 끼워 두셨잖아요. 장부도 남기고 싶으셨던 거 아니에요? 수사관한테 보낸 이유를 말씀해 주세요."]] : []),

  sus: ["장부를 팔아넘기려 했다", "최동규와 사귀는 사이였다", "회사 돈을 횡령했다"],
  confess: [
    "…맞아요. 수사관한테 보냈어요. 4년 전 그 택배요.",
    "『남산 아래 봄』, 상·하 두 권이에요. 대표가 노트북으로 소설처럼 쳐서, 인쇄소에는 제가 맡겨서 문고판으로 찍었어요. 겉으로 보면 그냥 소설책이에요. 파일은 찍고 나면 지웠고요.",
    "하권은 뒤에 빈 장을 넉넉히 붙여서 찍었어요. 대표가 구속되고 나서는 제가 접견 가서 받아 적은 걸 거기다 손으로 이어 썼어요.",
    "상자 겉에는 홍삼 세트라고 적었어요. 아무나 열어 보지 않게요. 그 회사에 들어간 것부터가 아버지를 그렇게 만든 사람들 벌 받게 하려고였으니까요.",
    "나흘 뒤에 그 수사관한테서 문자가 왔어요. 물건이 안 왔다고, 분실됐으면 택배사에서 찾게 하고 이 문자는 지우라고요.",
    "택배사는 분실이라고만 했어요. 누가 가져간 거면 경찰이 찾아 줄 줄 알고 고소했어요. 그 뒤로 어디로 갔는지는 저도 몰라요.",
    ["윤서연", "그럼 왜 태웠다고 하셨어요? 경위서까지 쓰시고요."],
    "작년 가을에 타워 일로 수사가 시작되고 나서 회사 사람들이 집에 왔어요. 그다음엔 엄마 투석실까지 왔고요. 장부 어디 있냐고.",
    "연말에는 최 상무가 공소청에 가서 제가 들고 나갔다고 진술했고요.",

        topics: [
          { q: "회비 장부를 보여 주십시오.", optional: true, a: ["여기요. 형편대로 낸 거라 금액이 들쭉날쭉해요. 10만 원 낸 집도 있고요.", "이 큰 금액이요? 2,800만 원. 입금자가 김다은으로 돼 있네요. 김다은 씨면… 회장님 따님인데요.", "회장님이 알아서 처리한다고 하셔서 저는 그대로 적어만 뒀어요. 어디서 난 돈인지는 저도 잘 몰라요."], gives: ["fund", { n: "유족회 회비 장부", d: "2,800만 원이 사망자 '김다은' 이름으로 입금됐다. 총무도 출처를 모른다.", img: "ev/m3-fund.webp" }] },
          { q: "시청에서 합의하자고 온 적이 있습니까?", optional: true, a: ["몇 번 왔죠. 여기 의향서 복사본이 있네요. 맨 아래 회장님 서명이 있고요.", "왜 있는지는 저도 몰라요. 회장님은 안 한다고 하셨는데."], gives: ["uihyang", { n: "합의 의향서 사본", d: "시청이 유족에게 돌린 합의 의향서. 맨 아래 조경숙의 서명이 있다.", img: "ev/m3-uihyang.webp" }] },
          { q: "유족회 분위기는 어떻습니까?", a: ["작년엔 쉰 집이 넘었어요. 이제 서른한 집이에요. 합의한 분들 욕 못 해요. 애 학원비가 없는데 어쩌겠어요.", "회장님이 이번 달부터 분향소 국화를 조화로 바꾸자고 하셨어요. 생화 값이면 한 집 회비라고요. 처음엔 다들 서운해했는데, 회장님이 먼저 조화를 사 오시니까 아무 말 못 하더라고요.", "그 국화 상자들은 생화 마지막 거예요. 시들기 전에 다 놓으려고요."] },
          { q: "이 위원 명단에 아는 이름이 있습니까?", req: ["members"], a: ["건축위원 명단이요? 우리가 이런 걸 어떻게 알아요. 잠깐만요.", "……이분. 이 교수님이요. 목요일마다 아침 일찍 오세요. 국화 한 송이 놓고 한참 서 있다 가세요.", "누구시냐고 물었더니 미안한 사람이라고만 하셨어요. 내일이 목요일이네요."], opens: ["committee"] }] }] },
    site: { n: "매립지 시추 현장", s: "지반공학 교수", bg: "m3-site", gated: true,
      arrive: ["교수는 현장에서 보자고 했다. 타워 부지 펜스 옆으로 지하철 고가가 지나간다. 바람에서 갯내가 났다."],
      people: [{ id: "prof", n: "지반공학 교수", face: A + "cut/n60f2.webp",
        intro: ["한 변호사님이시죠. 어머님 전화 받았어요.", "여기가 바다를 메운 땅이에요. 저 아래로 지하철까지 지나가고요."],
        topics: [
          { q: "이 땅은 뭐가 문제입니까?", a: ["바다 쪽으로 갈수록 뻘이 두꺼워요. 육지 쪽은 18미터쯤 파면 단단한 층이 나오는데, 바다 쪽은 41미터를 파도 안 나옵니다.", "건물은 말뚝을 단단한 층까지 박아서 세웁니다. 그 층이 너무 깊으면 말뚝이 뻘에 떠 있는 셈이에요."] },
          { id: "prof_24", q: "심의 자료에는 시추공이 9개, 정산서에는 24개입니다.", req: ["nine"], a: ["땅은 한 필지 안에서도 다 달라요. 그래서 여러 군데를 뚫어 보는 거예요.", "원본 조사표가 없으면 단정은 못 해요. 그런데 단단한 데만 골라서 내면 9개로도 전부 적합이 나옵니다."] },
          { q: "빠진 곳이 어디인지 알 방법이 있습니까?", req: ["t:prof_24", "bore"], a: ["번호요. 시추공은 뚫는 순서대로 번호가 붙습니다. 번호가 띄엄띄엄이면 빠진 게 있는 거예요.", "정산서에 위치도가 붙어 있네요. 제출된 번호를 여기에 표시해 볼게요.", "보세요. 제출된 9개는 전부 육지 쪽 줄이에요. 빠진 15개는 전부 바다 쪽이고요."], gives: ["map", { n: "시추공 번호 대조", d: "심의 제출 9개와 정산서 위치도의 24개를 맞춰 본 표. 빠진 15개는 전부 연약한 바다 쪽이다.", img: "ev/m3-map.webp" }] },
          { q: "그런 땅이면 처음부터 49층은 무리였습니까?", req: ["t:prof_24"], a: ["법적으로는 제가 답할 일이 아니죠.", "공학자로서 말씀드리면, 바다 쪽 자료를 봤으면 저는 도장 못 찍습니다."] },
          { id: "prof_orig", q: "24개를 실제로 뚫었다는 원본을 찾아야 합니다.", round: 1, a: ["원본이면 용역사가 납품한 지반조사 보고서죠. 대양지질에 남아 있을 거예요.", "정산서에 회사 주소가 찍혀 있네요. 거기부터 가 보세요. 요즘 지질 회사들이 하도 문을 닫아서 장담은 못 하지만요."], opens: ["daeyang"] },
          { id: "prof_driller", q: "대양지질은 폐업했고, 회사 서류는 폐기됐다고 합니다.", round: 1, req: ["t:trustee"], a: ["폐기요. 그럴 것 같았어요.","그럼 사람을 찾으셔야죠. 시추 기사는 야장이라는 걸 씁니다. 그날 뚫은 깊이랑 흙 상태를 손으로 적는 공책이에요. 그건 기사 개인 물건이라 회사 서류하고 같이 넘어가지 않아요.", "대양지질이면… 제 제자 하나가 그 회사 현장 기사였어요. 회사가 망하고 지금은 우물 파러 다닌다던데요. 연락처 드릴게요.", "처음부터 이 얘기를 할 걸 그랬네요. 회사 서류가 남아 있으면 그게 제일 확실하니까 그쪽을 먼저 말씀드렸어요."], opens: ["survey"] },
          { id: "prof_call", q: "제자분이 입을 닫았습니다. 시 측 변호사가 먼저 다녀갔다고 합니다.", round: 1, req: ["t:sv1"], a: ["먼저 다녀갔다고요? 그 애를 어떻게 알고요.", "그 애가 겁내는 건 우물 일이에요. 우물 파는 것도 시에 신고하고 허가받아야 하거든요. 시청 눈 밖에 나면 그 일도 끊겨요.", "제가 전화해 볼게요. 야장은 사본으로 내고 원본은 그 애가 갖고 있게 해 주세요. 법정에 세우지 않겠다고 약속해 주시고요.", [null, "교수는 그 자리에서 전화를 걸어 한참 통화하고는 고개를 끄덕였다."], "오늘 저녁에 다시 가 보세요. 제 말은 듣는 애예요."] }] }] },
    daeyang: { n: "옛 대양지질 사무실", s: "정산서에 찍힌 주소", bg: "alley", round: 1, gated: true,
      arrive: ["정산서에 찍힌 주소는 공단 뒷골목의 3층 건물이었다.", "2층 창문에 '대양지질' 시트지 글자가 반쯤 뜯긴 채 남아 있다. 지금 그 층에는 휴대폰 케이스 도매상이 들어와 있었다."],
      people: [{ id: "mgr", n: "건물 관리인", face: A + "cut/n60m1.webp",
        intro: ["대양지질 찾아오셨어요? 그 회사 나간 지가 언젠데요."],
        topics: [
          { id: "dy_gone", q: "대양지질 서류는 어디로 갔습니까?", a: ["망하고 나서 법원에서 사람이 나왔어요. 파산관재인이라던가. 박스를 트럭으로 실어 갔어요.", "그쪽 사무실 전화번호는 내가 적어 놨어요. 관리비 때문에 몇 번을 걸었는지 몰라요. 여기요."] },
          { q: "관리비요?", req: ["t:dy_gone"], a: ["석 달 치 안 내고 나갔어요. 파산관재인한테 신고는 했는데 순서가 맨 뒤래요. 은행이 먼저고 직원 월급이 먼저고 관리비는 한참 뒤라나.", "변호사시면 그거 좀 받아 주실 수 있어요? 수임료는 받은 돈에서 떼 가시고요.", ["한서준", "그건 제가 맡은 사건이 아니라서요."], "다들 그 말만 해요. 3년째요."] }] }],
      looks: [
        { q: "건물 우편함을 본다", a: ["2층 우편함에 아직 '(주)대양지질' 이름표가 붙어 있다. 안에는 3년 묵은 전단지와 법원 등기 반송 안내서가 들어 있었다."] }] },
    jung: { n: "시청 지하 기록실", s: "정한별의 자리", bg: "m3-sideline", gated: true,
      arrive: ["지하 2층. 보일러 소리가 벽을 타고 울린다.", "제습기 옆 책상 의자에 회갈색 재킷이 걸려 있었다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["……그때 그 변호사죠.", "명함 안 주셔도 됩니다. 얼굴 압니다."],
        topics: [
          { id: "jung_no", q: "유족분들 소송에서 증언을 부탁드리러 왔습니다.", a: ["5년 전에 법정에서 제가 술에 취해 헛것을 봤다고 하셨잖아요. 그 판결문 때문에 저 여기 있습니다.", "판결 나고 다음 달부터 일을 안 주더군요. 문서 편철이나 하라고요. 그 일도 고발하고 나서는 뺏겼고요.", "이번에는 저를 뭐라고 하실 건데요? 돌아가세요."] },
          { q: "고발은 어떻게 된 겁니까?", req: ["t:jung_no"], a: [[null, "판결 얘기에는 답하지 못하고 다른 것을 물었다."],"심의 자료를 묶다가 번호가 이상해서 과장님께 보고했습니다. 위에서 정리된 일이니 넘어가라고 하더군요. 그래서 고발했죠. 2030년 12월이요.", "석 달도 안 돼서 불기소요. 그다음엔 내부 문서를 들고 나갔다고 감사를 받고 여기로 왔습니다."] },
          { q: "여기서는 무슨 일을 하십니까?", a: ["습기 먹은 서류 말립니다. 제습기 물통 비우고요. 하루에 세 번 비웁니다.", "그 일을 4년 했어요. 타워가 무너진 날도 여기 있었습니다. 위층 사람들은 뉴스를 먼저 봤는데 저한테는 아무도 말을 안 해 줬어요. 퇴근길에 알았습니다."] },
          { q: "유족회에 편지를 보내셨다고 들었습니다.", req: ["q6"], a: ["……회장님이 그 얘기까지 하셨어요.", "분향소에 몇 번 갔어요. 체육관 입구까지 갔다가 그냥 돌아왔습니다. 제가 그때 더 세게 말했어야 했는데요.", "그래서 편지로 썼어요. 번호를 세어 보라고. 제가 할 수 있는 건 그게 다였습니다."] },
          { id: "jung_yes", q: "빠진 15개가 어디였는지 보여 드리겠습니다.", req: ["t:jung_no"], needs: "map", lock: ["……그게 뭡니까. 그런 종이로 저를 설득하실 생각이면 그만두세요."], okLine: ["……", "바다 쪽이요. 전부요.", "저는 번호가 빈 것까지만 봤어요. 어디가 빠졌는지는 몰랐습니다. 알아볼 방법도 없었고요.", "5년 동안 이상하다고 한 사람은 저 하나였어요.", "법정에 나갈게요. 이 종이를 봤으니까요."], gives: ["jungok", { n: "정한별의 증언 동의", d: "심의 자료의 빈 번호를 처음 알아챈 내부 증인. 번호 대조표를 보고 법정에 서기로 했다.", img: "ev/m3-jungok.webp" }] }] }] },
    survey: { n: "우물 공사 현장", s: "전 대양지질 시추 기사", bg: "m3-site", round: 1, gated: true,
      arrive: ["교외 과수원 한쪽에서 소형 시추기가 돌고 있었다. 기계 소리가 멎을 때까지 한참 기다렸다."],
      people: [{ id: "driller", n: "전 시추 기사", face: A + "cut/n50m4.webp",
        intro: ["교수님이 말씀하신 변호사님이시죠.", "대양지질이요? 망한 지 3년 됐어요. 저는 지금 우물 파러 다닙니다."],
        topics: [
          { id: "sv1", q: "해성개발 현장에서 시추공을 몇 개 뚫었습니까?", a: ["그걸 제가 어떻게 기억해요. 벌써 몇 년 전 일인데요.", "……솔직히 말씀드릴게요. 어제 서울에서 변호사라는 분이 다녀갔어요. 명함에 법무법인 목멱이라고 돼 있더라고요. 시청 쪽 일을 한다고요.", "그때 기록 같은 게 있으면 자기들이 보관해 주겠대요. 괜히 갖고 있다가 증인으로 불려 다니면 피곤하실 거라고, 요즘 지하수 허가 갱신도 깐깐하다고 하더라고요.", "협박한 건 아니에요. 가면서 우리 집사람 허리는 좀 괜찮냐고 묻더라고요. 제가 집사람 얘기를 한 적이 없는데요.", "저는 그 일로 엮이기 싫습니다."] },
          { id: "sv_ok", q: "이 정산서를 보십시오.", req: ["t:sv1", "t:prof_call"], needs: "bore", lock: ["그게 저희 회사 거라는 표시가 어디 있어요. 엉뚱한 걸로 사람 잡지 마세요."], okLine: ["교수님 전화 받았어요. 한 시간 동안 혼났습니다. 법정에는 안 나가도 되는 거 맞죠?", ["한서준", "약속드리겠습니다. 야장도 사본만 받겠습니다."], "……어, 이거 우리 회사 정산서네. 위치도에 제 글씨도 있어요.", "24공 맞아요. 그 현장 기억납니다. 2030년 9월부터 10월 초까지 팠어요. 바다 쪽 파다가 장비가 뻘에 빠져서 크레인까지 불러서 꺼냈거든요."] },
          { q: "원본 조사표가 남아 있습니까?", req: ["t:sv_ok"], a: ["회사 서버는 폐업하면서 없어졌어요. 그런데 현장 기사는 원래 야장을 씁니다.", "잠깐만요. 트럭에 박스째 있어요. 집사람이 이 박스 좀 버리라고 3년을 그랬어요.", "여기요. BH-1부터 BH-24까지 다 있어요. 날짜도 다 적혀 있고요.", "바다 쪽은 N값이 2니 3이니 그래요. 땅이 단단한 정도를 재는 숫자인데, 물렁하다는 뜻입니다. 육지 쪽은 30이 넘고요.", "변호사님, 명함 한 장만 주세요. 이게 쓸모가 있었다고 집사람한테 보여 줘야 해서요."], gives: ["orig", { n: "시추 원본 야장", d: "BH-1~24 전부의 현장 기록. 2030년 9월부터 10월 초까지 24공을 모두 뚫었다. 바다 쪽 15공은 N값 2~4, 41m까지 단단한 층이 없다. 육지 쪽 9공은 N값 30 이상.", img: "ev/m3-orig.webp" }] },
          { q: "9개짜리 자료는 누가 만들었습니까?", req: ["t:sv_ok"], a: ["저희가 납품한 보고서엔 24공이 다 들어갔어요. 9개만 뽑은 건 저희가 만든 게 아닙니다.", "해성개발 과장이 '시청에 낼 건 저희가 따로 정리합니다' 하고 가져갔어요. 돈은 24개분으로 다 받았고요."] },
          { q: "야장을 왜 버리지 않으셨습니까?", req: ["orig"], a: ["타워 무너진 날 뉴스 보고 바로 트럭에 가서 박스부터 열어 봤어요.", "누가 물어보러 올 줄 알았습니다. 1년 넘게 아무도 안 왔어요. 변호사님이 처음입니다.", "법정에 나오라고는 하지 마세요. 야장은 드릴게요."] }] }] },
    jung2: { n: "시청 뒤 분식집", s: "정한별과 점심", bg: "diner", round: 1,
      arrive: ["정한별이 고른 곳은 시청 뒤 분식집이었다. 시청 사람들은 이쪽으로 잘 오지 않는다고 했다."],
      people: [{ id: "jung2", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["지난 기일 얘기는 들었습니다. 시 쪽에서 제 이름을 꺼냈다면서요."],
        topics: [
          { q: "다음 기일에 증인으로 나와 주실 수 있겠습니까?", req: ["!jung_yes"], a: ["그건 아직이요.", "번호가 빈 건 저도 봤어요. 그런데 빠진 데가 어디인지는 몰라요. 그걸 모르고 나가면 5년 전처럼 됩니다.", "증언 얘기는 기록실에서 하시죠. 여기서는 밥만 드시고요."] },
          { q: "다음 기일에 그 판결문이 나올 겁니다.", req: ["jungok"], a: ["알아요. 그쪽에서 안 쓰면 이상하지요.", "그 말은 5년 동안 들었어요. 이번에는 변호사님 앞에서 듣겠네요."] },
          { q: "2030년에 이상을 발견했다는 기록이 남아 있습니까?", req: ["jungok"], a: ["번호를 보고 검토 메모를 썼어요. 2030년 11월 3일. 번호 9개 옮겨 적고 '공번 15개 사유 확인 요망'이라고요. 공번은 빈 번호라는 뜻입니다.", "제목도 그렇게 달았어요. '해안 복합개발 심의 자료 공번 15개 사유 확인 요망.' 바쁜 분들은 제목만 보니까요.", "내부 전자문서로 올렸어요. 그 문서는 누가 언제, 몇 분 동안 열어 봤는지가 남아요. 11월 4일 오전 9시 12분에 과장님이 열어서 11분 동안 보셨습니다. 결재는 그 나흘 뒤고요.", "열람 기록은 그때 출력해 뒀어요. 무시당할 것 같았거든요.", "이거 내시면 저 또 문서 빼돌렸다는 소리 나옵니다. 그건 아세요?"], gives: ["memo", { n: "정한별 검토 메모·열람 기록", d: "2030년 11월 3일 작성. 제목 '해안 복합개발 심의 자료 공번 15개 사유 확인 요망.' 11월 4일 09:12 오명환 과장이 11분 동안 열람. 결재는 나흘 뒤.", img: "ev/m3-memo.webp" }] },
          { q: "고발 사건 불기소 이유서를 갖고 계십니까?", a: ["통지서 받았죠. 봉투째 있어요. 여기요.", "'증거 불충분으로 혐의없음.' 무고니 허위 고발이니 하는 말은 한 줄도 없어요. 그런데 시청 사람들은 다 제가 허위 고발을 했다고 알아요."], gives: ["nopros", { n: "불기소 이유 통지서", d: "2031년 2월. 증거 불충분으로 혐의없음. 허위 고발이라는 판단은 없다.", img: "ev/m3-nopros.webp" }] },
          { q: "왜 시청을 그만두지 않으셨습니까?", a: ["그만두면 그 사람들 말이 맞는 게 되니까요.", "그리고 기록실에 있으면 문서가 어디 있는지는 제일 잘 알게 됩니다. 언젠가 쓸 데가 있겠지 했어요."] },
          { q: "흙막이 설계변경 공사가 실제로 언제 있었는지 알 방법이 있습니까?", round: 2, req: ["t:permit"], a: ["공사 날짜요? 그건 감리가 압니다. 감리단은 공사를 날마다 일지로 적어요.", "그리고 그 무렵 감리단에서 건축과로 공문이 왔었어요. 제가 요즘 하는 일이 그런 접수 대장 정리라서 압니다. 승인 전에 공사부터 했다는 내용이었어요.", "보낸 사람은 감리단장이었고요. 지금은 은퇴하셨는데, 연락처는 대장에 남아 있습니다."], opens: ["supervise"] },
          { id: "jung_audit", q: "지난 기일 뒤로 별일 없으셨습니까?", round: 2, a: ["어제 감사실에서 불렀어요. 내부 문서를 밖으로 갖고 나간 게 있는지 경위서를 쓰래요.", "시 쪽 변호사님이 법정에서 제 얘기를 한 바로 다음 날이에요. 우연이겠죠.", "그래서 당분간 저는 서류에 손을 못 대요. 종이 한 장 복사해 드려도 또 반출이 되니까요. 이번에는 어디 있는지 말씀만 드릴 수 있습니다."] },
          { id: "jung_sibo", q: "2030년 사무전결 규정이 폐기됐다고 합니다. 위원 명단 공개도 미뤄졌고요.", round: 2, req: ["t:rule_old", "t:mem_wait", "t:jung_audit"], a: ["폐기요? 민원실에서 그렇게 말해요?", "구판 출력물은 버렸겠죠. 그런데 사무전결 규정은 시 규칙이에요. 만들거나 고칠 때마다 시보에 실어서 공포합니다. 시보는 버리는 문서가 아니에요.", "민원실 안쪽 열람대에 연도별로 다 꽂혀 있어요. 2030년 철 찾으시면 그해 규정이 통째로 실려 있을 겁니다.", "위원 명단도 그래요. 위원을 위촉하면 시보에 공고가 나갑니다. 공개를 미뤄도 이미 공고된 건 그대로 있어요."] }] }] },
    rule: { n: "시청 민원실", s: "정보공개 창구", bg: "m3-cityhall", round: 2,

        intro: ["정보공개 청구하신 거 찾으러 오셨어요? 접수 번호 불러 주세요."],
        topics: [
          { id: "rule_new", q: "청구한 사무전결 규정을 받으러 왔습니다.", a: ["네, 여기 있습니다. 스무 장이 안 넘어서 수수료는 없어요."] },
          { id: "mem_wait", q: "건축위원회 위원 명단은요?", req: ["t:rule_new"], a: ["그건 공개 결정이 연기됐어요. 연기 통지서 드릴게요.", "위원분들한테 공개해도 되는지 의견을 묻는 중이고요, 시 소송대리인 쪽에서도 의견서가 들어왔대요. '소송 중인 사안이라 위원들을 보호할 필요가 있다'고요.", "열흘 더 걸린다고 돼 있는데, 이렇게 연기되면 보통 한 번 더 연기돼요.", [null, "두 번 미뤄지면 다음 기일이 먼저 온다."]] },
          { id: "rule_old", q: "제가 청구한 건 2030년 당시 규정입니다.", req: ["t:rule_wrong"], a: ["2030년이요? 규정이 개정되면 구판은 폐기해요. 문서관리 규정에 그렇게 돼 있어요.", ["한서준", "그 문서관리 규정은 언제 판입니까?"], "그건 현행이죠. 현행은 폐기 안 해요.", "청구서에 그냥 '사무전결 규정'이라고 쓰셔서 현행을 드린 거예요. 다시 청구하시면 부존재 통지가 나갈 거예요. 그것도 열흘 걸려요.", ["한서준", "그럼 됐습니다."]] },
          { q: "요즘 시청 분위기는 어떻습니까?", a: ["……변호사님, 여기서 그런 거 물어보시면 저 곤란해요.", "오 국장님이 재판에 나가신다고 다들 말조심해요. 그 정도만 아세요."] }] }],
      looks: [
        { id: "rule_wrong", q: "받은 사무전결 규정을 읽는다", req: ["t:rule_new"], a: ["봉투를 열어 첫 장부터 넘겼다. '건축위원회 심의 안건: 도시국장 전결.'", "도시국장. 오명환의 지금 자리다. 맨 뒷장 개정 이력을 보니 2033년에 전결권자가 과장에서 국장으로 올라갔다.", "받은 것은 현행 규정이다. 2030년에 건축과장이 무엇을 확인해야 했는지는 이 종이에 없다."] },
        { q: "열람대에서 2030년 시보 철을 찾는다", req: ["t:jung_sibo"], a: ["민원실 안쪽, 아무도 앉지 않는 열람대에 시보가 연도별로 꽂혀 있었다. 2030년 철은 맨 아래 칸에 있었다.", "3월호에 '서해광역시 사무전결 규칙 일부개정규칙'이 통째로 실려 있다.", "'건축위원회 심의 안건 및 첨부 자료의 구성: 건축과장 전결.' 전결이란 위로 올리지 않고 그 자리에서 최종 결정한다는 뜻이다.", "'전결권자는 첨부 자료의 누락 여부를 확인하여야 한다.'", "창구로 돌아가 3월호 복사를 신청했다."], gives: ["rule", { n: "사무전결 규정(2030년 시보)", d: "2030년 시보에 공포된 규정. 심의 안건과 첨부 자료의 구성은 건축과장 전결이고, 전결권자에게 누락 여부를 확인할 의무가 있다.", img: "ev/m3-rule.webp" }] },
        { q: "시보에서 건축위원회 위촉 공고를 찾는다", req: ["t:jung_sibo"], optional: true, a: ["같은 해 6월호에 '서해광역시 건축위원회 위원 위촉 공고'가 실려 있다.", "위원 아홉 명의 이름과 소속이 다 나와 있다. 공개를 미룬다던 명단이다.", "회의록은 볼 수 없다. 그날 이 아홉 명 가운데 누가 무엇을 물었는지 알려면 사람을 찾아야 한다."], gives: ["members", { n: "건축위원회 위원 명단", d: "2030년 시보에 실린 위촉 공고. 해안 복합개발 심의에 참석한 위원 아홉 명의 이름과 소속.", img: "ev/m3-members.webp" }] },
        { q: "복도의 조감도를 본다", a: ["조감도는 오늘도 복도에 걸려 있다. 그림 속 타워 옆으로 사람들이 웃으며 걸어간다."] }] },

      people: [{ id: "sup", n: "전 감리단장", face: A + "cut/n60m4.webp",

        topics: [
          { id: "sup_ok", q: "감리일지를 보여 주시겠습니까?", needs: "sun", lock: ["누구 쪽에서 오신 분인지부터 알아야겠어요. 일지를 아무한테나 보여 줄 수는 없잖아요."], okLine: ["유족 쪽 대리인이시군요.", "일지 복사본은 제가 따로 갖고 있었어요. 마음이 편치 않아서요."] },
          { q: "흙막이 설계변경 공사는 언제 끝났습니까?", req: ["t:sup_ok"], a: ["일지에 있어요. 2032년 3월 19일 지하 흙막이 시공 완료.", "바뀐 설계대로 벽 두께를 줄여서 공사 기간을 맞췄습니다. 승인은 그 뒤에 나왔어요. 5월 3일이요.", "다 지은 뒤에 승인 도장이 찍힌 거죠. 원래는 승인부터 받고 시공해야 하는 일입니다."], gives: ["late", { n: "감리일지·설계변경 승인일", d: "흙막이 시공 완료 2032년 3월 19일. 승인은 5월 3일. 공사가 끝난 뒤에 승인이 났다.", img: "ev/m3-late.webp" }] },
          { q: "감리단은 그 일을 문제 삼지 않았습니까?", req: ["t:sup_ok"], a: ["공문 보냈죠. 시청 건축과로요. 답이 뭐였는지 아세요? '추후 일괄 처리 예정.'", "그 '일괄 처리'에 건축과장 결재가 있었어요."] },
          { q: "왜 지금까지 일지를 갖고 계셨습니까?", req: ["t:sup_ok"], a: ["무너지고 나서 감리단도 조사를 받았어요. 일지는 그때 원본을 다 냈습니다.", "복사본은 제가 집에 두고 있었어요. 언젠가 누가 '승인은 제대로 났느냐'고 물으면 보여 주려고요."] }] }] },
    committee: { n: "체육관 분향소", s: "목요일 아침, 전 건축위원", bg: "m2-altar", round: 2, gated: true,

        { q: "구치소 접견 기록을 읽는다", req: ["leest"], a: ["접견 명단을 찾았다.", "2030년 1월부터 2031년 1월까지 이수아 이름만 마흔여섯 번 나온다. 회사 직원이다. 한 번에 10분 안팎."], gives: ["visit", { n: "구치소 접견 기록", d: "2030년 1월 구속 뒤 이수아의 접견 46회. 한 번에 10분 안팎. 날짜가 모두 남아 있다.", img: "ev/f4-visit.webp" }] },
        { q: "방재호의 수사 진술을 읽는다", req: ["t:recok"], a: ["'상자를 뜯어 보니 웬 소설책 두 권이 들어 있었습니다. 쓸모없는 거라 쓰레기봉투에 넣어 버렸습니다. 소각장으로 갔을 겁니다.'", "특검은 소각장까지 확인했다고 적었다. 5년 전 쓰레기라 남은 게 없다.", "소설책 두 권이라고 했다. 5년 전 휴게실 냄비 밑에서 나도 책 두 권을 본 적이 있다. 얼마 뒤에는 동료 기사가 방 기사님이 헌책을 묶어 팔더라고 했고. 그 책이 이 상자에서 나온 건지, 기사님이 정말 버렸는지는 확인해 본 적이 없다."], gives: ["jaest", { n: "방재호 수사 진술", d: "\"상자에 소설책 두 권이 있었다. 쓰레기봉투에 넣어 버렸다. 소각장으로 갔을 것이다.\"", img: "ev/f4-jaest.webp" }], opens: ["jae"] },
        { q: "해성개발 재무이사의 진술조서를 읽는다", req: ["t:recok"], a: ["문상철. 해성개발 재무이사. 특검이 첫 기일에 세우겠다고 예고한 증인이다.", "'도원으로 간 돈은 회장님이 시청 일 봐 주는 값이라고 하셨습니다. 저는 회장님한테서만 들었고, 도원 쪽 사람과는 회장님 일정 말고 따로 연락한 적이 없습니다.'", "맨 끝 장에 문상철의 서명과 무인이 있다. 회장한테 들은 말을 옮기는 증인이다."], gives: ["munst", { n: "문상철 진술조서", d: "해성개발 재무이사의 특검 진술. 돈의 성격은 회장에게서만 들었고, 도원 쪽 사람과 따로 연락한 적은 없다고 서명했다.", img: "ev/f4-munst.webp" }] },
        { q: "불기소 관련 자료를 읽는다", req: ["t:recok"], a: ["2031년 정한별 고발의 불기소 참고자료로 법무법인 한강로의 의견서가 붙어 있다.", "인용 판례. '대법원 2011. 2. 30. 선고 2010다77417 판결.' 또 2월 30일이다. 없는 날짜다.", "그때 이 사건을 맡은 사람은 권태훈 수사관이었다."], gives: ["opin4", { n: "한강로 의견서", d: "정한별 고발의 불기소 참고자료. 있을 수 없는 날짜인 대법원 2011. 2. 30. 판결을 인용했다.", img: "ev/f4-opin4.webp" }], opens: ["kwon"] },
        { q: "도원컨설팅 압수 현장 사진을 넘겨 본다", req: ["t:recok"], a: ["대표실 사진이다. 소파, 서가, 빈 금고. 벽 한가운데에 액자가 하나 걸려 있다.", "수구여병. 守口如甁.", "내 사무실에 걸린 것과 같은 글씨다. 획 끝을 살짝 꺾어 올리는 버릇까지 똑같다.", "교수님께 전화하려고 휴대폰을 꺼냈다가 도로 넣었다."], gives: ["frame", { n: "대표실 압수 사진", d: "도원컨설팅 대표실 벽의 '수구여병' 액자. 강도윤의 글씨와 같아 보인다.", img: "ev/f4-frame.webp" }] }] },

    jae: { n: "터미널 휴게실", s: "방재호를 찾아서", bg: "rest", gated: true,
      arrive: ["터미널 2층 기사 휴게실이다. 5년 만에 올라왔다. 형광등 하나가 깜빡인다.", "탁자 위에 양은 냄비가 있다. 냄비 밑에는 고무 받침이 깔려 있다.", "구석 의자에 갈색 재킷을 입은 남자가 앉아 있다. 방재호 기사님이다. 올해 초에 이 터미널에 왔을 때는 그만두고 지방에 내려갔다고 들었다."],
      people: [
        { id: "bang", n: "방재호", face: A + "cut/n40m2.webp",
          intro: ["어, 변호사님! 이게 몇 년 만이에요. 안경 새로 맞췄는데 알아보시네.", ["윤서연", "기사님, 그만두고 지방 내려가셨다고 들었는데요."], "내려갔었죠. 지난가을에 다시 들어왔어요. 어머니가 저기 개천 건너 요양병원으로 옮기셔서, 가까이서 일하려고요.", "그런데 무슨 일로 여기까지… 혹시 그 일 때문이에요? 그 사람들이 또 왔었거든요."],
          topics: [
            { id: "yoovisit", q: "누가 또 왔었어요?", a: ["양복 입은 사람들이요. 지방에 있을 때도 찾아왔고 지난달에도 왔어요. 그 상자에 든 거 어떻게 했냐, 진짜 버렸냐. 똑같은 거 묻고 가요.", "이번엔 변호사님 쪽 사람이라던데요. 사무장이라고. 유 뭐시기요.", "저는 또 변호사님이 보낸 줄 알고 다 말해 줬죠. 웬 소설책이 들었길래 몇 장 읽다 말고 버렸다고요."] },
            { id: "bangthrow", q: "그 책, 정말 버리셨어요?", a: ["…네. 버렸다니까요. 쓰레기봉투에요.", "변호사님, 저 이제 나이도 있고 애들 대학 등록금도 있고요. 그때 얘기는 진짜 그만하고 싶어요."] },
            { q: "어머님은 요즘 어떠세요?", req: ["t:bangthrow"], a: ["개천 건너 요양병원에 계세요. 병원 생활만 5년째예요. 제 얼굴을 알아보실 때도 있고 못 알아보실 때도 있고.", "그해 설에는 선물 하나를 못 사 들고 갔어요. 그게 아직도 걸려요.", [null, "방재호가 재킷 소매를 잡아당겼다."]] },
            { id: "askwit", q: "증인으로 나와 주실 수 있겠습니까?", round: 2, a: ["…변호사님, 그 얘기 하러 오신 거예요?", "어제 특검이라는 데서 전화가 왔어요. 변호인 쪽 증인으로 신청됐다고, 나오시면 2031년 택배 일도 다시 여쭤볼 게 있다고요. 말은 공손한데 무슨 뜻인지는 알겠더라고요.", "저 못 나가요. 진짜 죄송해요. 그때 그 일로 한 번 죽다 살았는데, 또 그 사람들 앞에 서라고요?", "오늘은 어머니 병원 가는 날이라 이만 가 볼게요.", [null, "방재호는 내 대답을 듣지 않고 재킷을 집어 들고 나갔다."]] }] },
        { id: "mate", n: "동료 기사", face: A + "cut/n50m2.webp",
          intro: ["변호사님 아니세요? 방 형님 일로 오셨구나. 저 기억하시죠? 그때 형님 편 들어 드렸던 사람."],
          topics: [
            { q: "방 기사님은 요즘 어떠세요?", a: ["밥은 잘 먹어요. 근데 양복쟁이들 다녀가고 나면 며칠씩 말이 없어요.", "형님이 원래 겁이 많아요. 남의 택배 하나에도 벌벌 떠는 사람이에요."] },
            { id: "bookhint", q: "요즘도 사무장이 찾아옵니까?", round: 2, a: ["그 유 사무장이요? 지난주에 또 왔는데 이번엔 형님 말고 저한테 묻더라고요. 방 형님이 옛날에 헌책 판 데가 어디냐고.", "형님이 예전에 휴게실에 굴러다니던 책들 몇 권 묶어서 골목 헌책방에 팔았거든요. 그걸 어떻게 알았는지 몰라.", "저는 뭐 숨길 것도 없어서 알려 줬죠. 시장 골목 끝에 있는 데요. 근데 헌책은 왜 찾는대요?", ["윤서연", "글쎄요. 그 사무장이 또 오면 저한테도 알려 주실래요?"]], opens: ["bookshop"] },
            { q: "방 기사님 어머님 병원이 어디예요?", req: ["t:askwit"], a: ["형님 방금 나갔죠? 특검 전화 받고부터 저래요. 어제는 라면을 반이나 남겼어요.", "어머님은 개천 건너 요양병원에 계세요. 쉬는 날이면 형님 거기서 하루 종일 있어요.", "근데 병원까지 가시게요? …가시면 제가 알려 줬다고 하지 마세요."], opens: ["hosp"] }] }],
      looks: [
        { id: "pot", q: "냄비 밑을 본다", a: ["고무 받침이다. 새것은 아니다.", "5년 전 이 자리에는 문고판만 한 책 두 권이 깔려 있었다. 『남산 아래 봄』 상, 하. 들춰 보면 출판사 이름도 가격도 없는 인쇄본이었고, 하권 뒤쪽은 볼펜 손글씨였다. 위에 놓인 하권 표지에 국물 자국이 둥글게 배어 있었다.", "그 제목을 이수아 씨 입으로 다시 들은 건 상담실에서였다. 그때부터 이 책이 무엇인지 짐작은 하고 있었다.", "어느 날 가 보니 책이 없었고, 동료 기사가 방 형님이 헌책 묶어서 넘기더라고 했다. 이수아 씨도 방재호 기사님도 내 의뢰인이라 여태 확인을 미뤘다."] },
        { q: "벽의 근무표를 본다", a: ["방재호 이름 옆에 이번 달 야간이 열하루다. 5년 전보다 더 많다."] }] },

    kwon: { n: "권태훈 수사관", s: "퇴근길 주차장", bg: "f2-investigator", gated: true,
      people: [{ id: "kwon", n: "권태훈", face: A + "story/insp.webp",
        intro: ["…변호사님. 왜 또 저를.", [null, "목에 건 신분증이 차 문에 부딪혀 달그락거렸다."]],
        topics: [
          { id: "kwon1", q: "불기소 때 누가 지시했습니까?", a: ["말할 수 없습니다. 애가 둘입니다.", [null, "권태훈이 신분증을 재킷 안으로 집어넣었다."]] },
          { q: "이 의견서, 누가 가져왔는지 기억하세요?", req: ["opin4"], a: ["의견서야 사건마다 들어옵니다. 다만 그 건은 제가 올리기도 전에 결론이 내려와 있었습니다.", "더 묻지 마십시오. 변호사님 모시는 분 쪽으로 이어지는 얘기일 수도 있습니다.", ["윤서연", "모시는 분이요?"], [null, "권태훈은 대답하지 않고 차 문을 열었다."]] },
          { q: "그때 법정에서 물을 수 있었는데 묻지 않았습니다", req: ["t:kwon1"], a: ["…압니다. 감사하다는 말은 못 합니다.", "언젠가, 말해야 하는 날이 오면 말하겠습니다."], gives: ["kwono", { n: "권태훈의 약속", d: "\"말해야 하는 날이 오면 말하겠다.\"", img: "ev/f4-kwono.webp" }] }] }] },

    guard: { n: "구치소 접견 담당", s: "접견 녹음 요지", bg: "f4-detention", gated: true,
      people: [{ id: "guard", n: "접견 담당 교도관", face: A + "cut/n40m3.webp",
        intro: ["변호인 접견 말고 일반 접견은 전부 녹음됩니다. 요지는 문서로 남고요."],
        topics: [
          { id: "tape", q: "이수아 접견 때 녹음 요지를 신청한다", needs: "sun", lock: "변호인이시면 선임서를 주십시오. 그래야 드릴 수 있습니다.", okLine: "확인했습니다. 여기요. 양이 많지는 않습니다." },
          { q: "수감자가 바깥일을 지시할 수 있습니까?", req: ["t:tape"], a: ["원칙은 못 하죠. 그런데 변호인 접견은 안 들리거든요.", "일반 접견은 다 듣지만 뜻은 저희가 어떻게 압니까. 감자라면 감자로 적는 수밖에요."] }] }],
      looks: [
        { q: "녹음 요지를 읽는다", req: ["t:tape"], a: ["'거래처 안부 전달. 건강 문의. 감자 세 상자 보냈다는 말. 아이 돌잔치 축의 이야기.'", "마흔여섯 번 동안 돈이나 이름은 한 번도 안 나온다."], gives: ["rectape", { n: "접견 녹음 요지", d: "이수아 접견 46회분. 돈이나 공무원 이름은 없고 '감자 세 상자', '돌잔치 축의' 같은 말만 있다.", img: "ev/f4-rectape.webp" }] }] },

    clerk: { n: "사무장 유기택", s: "서초동 찻집", bg: "f2-consult", gated: true,
      people: [{ id: "yoo", n: "유기택", face: A + "cut/n50m3.webp",
        intro: ["변호사님! 말씀 많이 들었습니다. 강 교수님 애제자시라면서요.", "이쪽 일은 제가 다 챙겨 드립니다. 차는 뭐로 하시겠어요?"],
        topics: [
          { q: "준비해 두셨다는 서류를 보여 주세요", a: ["이거요. 소각장 쪽에서 떼 온 폐기물 반입 확인서입니다. 2031년 1월, 그 터미널 쓰레기가 소각장으로 들어갔다는 겁니다.", "이걸 내면 그 상자는 끝난 얘기가 됩니다. 특검이 원본을 못 내면 남는 건 이수아 씨 말뿐이지요.", ["윤서연", "5년도 더 된 서류를 어떻게 떼 오셨어요?"], [null, "유기택은 대답 대신 웃기만 했다."]], gives: ["burn", { n: "폐기물 반입 확인서", d: "사무장 유기택이 건넨 서류. 2031년 1월 터미널 폐기물이 소각장에 들어갔다는 내용.", bad: 1, img: "ev/f4-burn.webp" }] },
          { q: "방재호 씨는 왜 찾아가셨어요?", req: ["t:yoovisit"], a: ["옛날 일 확인차 들른 거지요. 변호사님 일 덜어 드리려고요. 사람이 불안해하면 안 되잖습니까.", "제가 대표님 모신 지 스무 해입니다. 예전엔 목멱에서도 일을 봤고요. 다 한집안이지요, 뭐."] },
          { q: "수임료는 누가 냅니까?", a: ["변호사님 그건 신경 쓰지 마시라니까요. 다 입금될 겁니다.", [null, "통장에 찍힌 입금자는 처음 보는 법인 이름이었다."], ["윤서연", "이 회사는 어디예요?"], [null, "유기택은 찻잔을 들어 올렸다."]] },
          { q: "헌책방에는 왜 가셨어요?", req: ["@bookshop"], a: ["아, 그 얘기 들으셨어요? 제가 옛날 책을 좋아해서요. 지나가다 들른 겁니다.", "변호사님, 재판 준비하시기도 바쁘실 텐데 그런 데까지 신경 쓰실 것 없습니다."] }] }] },

    doold: { n: "도원컨설팅 옛 사무실", s: "1회 뒤 · 이수아의 옛 직장", round: 1, bg: "alley",
      arrive: ["도원컨설팅이 있던 건물이다.", "4층 창문에 '필라테스 · 체험 수업 1회 무료'라고 붙어 있다. 도원이라는 글자는 우편함 한 칸에만 남아 있다."],
      people: [{ id: "super", n: "건물 관리인", face: A + "cut/n60m2.webp",

        topics: [

            { q: "증인으로 나와 주실 수 있겠습니까?", req: ["t:dbl"], a: ["…변호사님이 나오라면 나가야죠. 제가 그때 그 은혜를 어떻게 잊어요. 사무장이라는 분도 돈 몇 푼 준다고 했는데 그건 안 받았어요. 진짜예요.", "뭐라고 말하면 돼요? 사무장님은 소설책 봤다는 얘기만 하면 된다던데. 버렸다고 한 것도 그대로 하면 되는 거죠?", [null, "대답하지 못했다. 버렸다는 말이 거짓말이 될지도 모르는데, 왜 그렇게 짐작하는지는 이 사람한테도 말할 수 없다."], [null, "방재호가 어머니 손을 다시 잡았다."]] }] },

    bookshop: { n: "골목 헌책방", s: "시장 골목 끝", bg: "f-bookshop", gated: true,
      arrive: ["시장 골목 끝, 간판 글씨가 반쯤 지워진 헌책방이다.", "문을 열자 종이 냄새가 확 끼쳤다. 천장까지 책이 쌓여 있다."],
      people: [{ id: "owner", n: "헌책방 주인", face: A + "cut/n60m1.webp",
        intro: ["찾는 책 있어요? 제목 말하면 있는지 없는지는 알려 드려요. 어디 있는지는 나도 모르고."],
        topics: [
          { id: "yoocard", q: "얼마 전에 양복 입은 분이 다녀가지 않았어요?", a: ["아, 그 사람. 터미널 기사 양반이 옛날에 팔고 간 책을 찾더라고. 5년 전 거를.", "그 기사 양반 기억은 나요. 설 지나서 노끈으로 묶은 책 한 덩이 갖고 와서 소주 값이나 달라고 했지.", "근데 5년 전에 들어온 걸 내가 어떻게 찾아. 저 뒤에 묶음째로 쌓아 둔 게 수백 덩이인데.", "그 양반이 명함을 두고 갔어. 찾으면 연락 달라고, 값은 넉넉히 쳐 주겠다고."], gives: ["yoocard", { n: "유기택의 명함", d: "헌책방 주인이 받은 유기택의 명함. 5년 전 터미널 기사가 판 책을 찾으면 연락해 달라고 했다.", img: "ev/f4-yoocard.webp" }] },
          { q: "그 기사분이 판 책은 어떤 책이었어요?", req: ["t:yoocard"], a: ["몰라요. 묶음째 받았으니까. 문고판 몇 권, 잡지 몇 권 그랬겠지.", "기사들이 파는 책이 다 그래요. 휴게실에 굴러다니던 거."] },
          { q: "특검이 책을 찾아간 날 보셨어요?", round: 3, req: ["f:oath", "f:warned"], a: ["봤지. 내가 묶음 풀어 줬는데. 가게 하고 삼십 년 만에 압수수색은 처음이야.", "그래서 사진도 찍어 뒀어.", [null, "주인이 내민 화면에 문고판만 한 책 두 권이 나란히 실려 있었다. 컬러 사진이다. 하권 표지 한가운데 둥근 국물 자국에 제목 글자가 번졌다. 펼친 하권 앞쪽 몇 장도 누렇게 얼룩졌다. 상권은 뒤표지가 우글우글하고 마지막 몇 장이 떨어져 나갔다."], [null, "사진을 내 메일로 보내 달라고 했다. 주인은 메일 보내는 법을 몰라서, 손주에게 전화를 걸었다."]], gives: ["stainc", { n: "장부 컬러 사진", d: "헌책방 주인이 압수 당일 찍은 상·하 두 권 사진. 하권 표지와 앞쪽은 국물 자국으로 얼룩졌고, 상권 마지막 몇 장은 떨어져 나갔다.", img: "ev/f4-stainc.webp" }] },
          { q: "혹시 특검에서 다녀갔어요?", round: 3, req: ["f:nobook", "t:leak"], a: ["특검? 아무도 안 왔는데. 누가 와요?", "그 양복 입은 사무장 양반만 또 왔지. 이번엔 안쪽 묶음을 통째로 사면 얼마냐고 묻더라고. 헌책 묶음을 통째로 사는 사람은 처음 봐.", [null, "특검은 여기 오지 않았다. 장부 단서를 잡았다는 말은 기자들 앞에서만 한 말이다."]] }] }],
      looks: [
        { q: "안쪽 서가를 본다", a: ["노끈으로 묶은 책 덩이가 사람 키만큼 쌓여 있다. 덩이마다 먼지가 앉은 두께가 다르다.", "이 묶음 어딘가에 문고판만 한 책 두 권이 있을지도 모른다. 풀어서 찾으면 내 의뢰인에게 불리한 증거를 내가 꺼내게 된다. 변호인이 할 일이 아니다.", "풀지 않으면 유기택이 사 갈지도 모른다.", "묶음에 손을 대지 않고 가게를 나왔다."] }] },

        { q: "특검이 첫날 약속한 것을 찾는다", a: ["특검은 첫날 '청탁 내용과 받은 경위를 입증하겠다'고 했다. 재판 내내 그 약속을 어디까지 지켰는지 표시해 봤다.", "청탁 내용은 공소장대로 적혀 있다. 받은 경위는 계좌에 다 있다. 빈칸은 하나다. 그 돈을 받을 때 무슨 말이 오갔느냐."] }] },

    ledger: { n: "압수된 장부 사본", s: "특검 증거 열람", round: 3, gated: true, bg: "f4-special",
      arrive: ["압수물 흑백 사본이다. 상·하 두 권. 문고판 소설책이다. 출판사 이름과 가격이 없는 것만 다르다.", "하권 표지에 『남산 아래 봄』 하. 그 한가운데 둥근 얼룩이 회색으로 찍혀 있다."],
      people: [{ id: "evdesk", n: "특검 증거물 담당", face: A + "cut/n40f2.webp",

        topics: [
          { id: "orig", q: "원본을 직접 보고 싶습니다", a: ["원본은 감정에 들어가 있습니다. 인쇄 종이하고 손글씨 둘 다요. 특검에서 변호인 원본 열람은 감정이 끝난 뒤로 미뤄 달라는 의견서를 냈고요.", "감정은 결심 다음 주에 끝납니다.", ["윤서연", "결심이 끝나면 볼 이유가 없잖아요."], "그 말씀은 의견서로 내시면 됩니다. 저는 사본 담당이라서요.", [null, "원본을 못 보면 훼손을 다툴 수 없다. 흑백 사본에는 얼룩이 회색 동그라미로만 나온다."]] }] }],
      looks: [
        { q: "표지를 살핀다", a: ["흑백이라 국물 자국은 회색 동그라미로만 보인다. 5년 전 휴게실 냄비 밑에 깔려 있던 그 책이다.", "그때는 들춰 보고 하권 뒤쪽에 손글씨가 있다는 것까지만 봤다.", "이 사본으로는 얼룩이 얼마나 번졌는지, 뒷장이 어떻게 떨어져 나갔는지 알 수 없다. 원본을 본 사람이 필요하다. 묶음을 푼 날 그 자리에 있던 사람을 찾아야 한다."] },
        { q: "인쇄된 곳과 손글씨를 비교한다", a: ["상권과 하권 앞쪽은 인쇄된 글이다. 하권 뒤쪽 빈 장부터 또박또박한 손글씨가 이어진다. 이수아 씨가 말한 대로다.", "인쇄된 부분은 누가 쳤는지 종이만 봐서는 알 수 없으니 그 점은 다퉈 볼 만하다. 다만 이수아 씨는 대표가 직접 쳤고 인쇄소에도 자기가 맡겼다고 할 테니 쉽지는 않다."], gives: ["hand", { n: "장부 인쇄와 손글씨", d: "상권과 하권 앞쪽은 출판사 표시 없는 인쇄본. 하권 뒤쪽 빈 장에 이수아의 손글씨가 이어진다. 인쇄된 글은 누가 쳤는지 종이로는 알 수 없다.", img: "ev/f4-hand.webp" }] },
        { q: "장부 항목을 기록과 맞춰 본다", req: ["cut", "visit"], a: ["특검이 장부를 다른 기록과 맞춰 오기 전에 내가 먼저 맞춰 봤다.", "상권 2029년 12월. '성탄 전에 감자 스무 상자를 창고에 들였다.' 현금 인출 기록을 폈다. 12월 23일, 도원 계좌에서 현금 20억. 맞는다.", "하권, 이수아 씨 글씨로 된 대목에 날짜가 아홉 개 나온다. 접견 기록과 하나씩 대 봤다. 아홉 개 모두 이수아 씨가 접견을 온 날이다.", "하권 2030년 11월 19일. '회의 사흘 앞두고 시청 어르신께 감자 열 상자.' 그날 도원 계좌에서 현금 10억이 빠졌다. 특검 기록에 붙은 시청 건축위원회 회의록을 찾았다. 사흘 뒤 11월 22일, 타워 건축 심의가 열렸다.", "세 군데 다 맞는다. 내 의뢰인한테는 나쁜 소식이다.", "그런데 하권 손글씨 부분, 2030년 7월 대목의 '오 과장 정리비 50'만 다르다. 다른 줄은 전부 감자 몇 상자인데 이 줄만 맨 숫자다. '부쳤다', '들였다' 같은 말도 없다. 이름과 숫자뿐이다. 준 돈인지, 줄 몫으로 잡아 둔 돈인지 장부만 봐서는 모른다."], gives: ["chk", { n: "장부 대조 메모", d: "상권 '감자 스무 상자'는 2029년 12월 23일 현금 20억 인출과, 하권 11월 대목은 11월 19일 현금 10억 인출·11월 22일 건축위원회 심의와, 하권 날짜 아홉 개는 이수아 접견일과 맞는다. '오 과장 정리비 50'만 감자가 아닌 맨 숫자이고 보냈다는 말도 없다.", img: "ev/f4-chk.webp" }] },

    ["교수님을 한번 찾아뵐까 합니다.", ["고소대리인 사무실 대표를요? 말리지는 않을게요. 스승 찾아뵙는 거니까요.", "대신 아무것도 약속하지 마시고, 들은 건 저한테 전부 말씀해 주세요. 단어 하나까지요."], ["kang"], ["comp"]],

    ["교수님이 고소를 취소하게 해 주겠다고 하셨습니다.", ["조건이 뭐였어요? 정확히요.", ["한서준", "앞으로 장부 일에 입을 열지 않겠다고 약속하면, 오 국장이 고소를 거두게 하겠다고 하셨습니다."], "대리인 사무실 대표 말 한마디에 고소를 거둔다면, 이 고소는 그 대표 뜻이라는 얘기예요.", "약속은 안 하셨죠?", ["한서준", "차만 마시고 나왔습니다."], "잘하셨어요. 그 말, 나중에 법정에서 변호사님 입으로 하셔야 할 수도 있어요."], [], ["offer"]],
    ["특검 기록을 제 재판에 가져올 수 있겠습니까?", ["문서송부촉탁을 신청할게요. 다른 기관이 가진 기록을 우리 재판부를 통해 보내 달라고 하는 거예요.", "장부 사본이랑 해독표는 특검에, 2031년 정한별 씨 고발 사건 불기소 기록은 공소청에 신청할게요. 불기소 기록 원본은 공소청에 있으니까요.", [null, "이틀 뒤 서연이 얇은 서류 한 부를 들고 다시 왔다. 표지에 법무법인 목멱."], "고소대리인이 의견서를 냈어요. 불기소 기록에는 진술조서가 많아서 제3자 개인정보가 많고, 이 사건과도 관계가 없대요.", "재판부가 장부 사본이랑 해독표만 먼저 보내라고 했어요. 불기소 기록은 보류됐고요.", ["한서준", "불기소 기록이 빠지면 '남산' 대목이 반쪽이 됩니다."], "알아요. 그쪽도 그걸 알고 낸 의견서예요.", [null, "다시 사흘 뒤, 장부 사본과 해독표가 재판부에 도착했다. 서연이 복사본을 사무실로 가져왔다."]], ["ledger"], ["t:sp2"]],

          { q: "복사는 언제쯤 됩니까?", req: ["t:recok"], a: ["변호인이 신청하시면 이삼일이요.", "근데 변호사님, 이 사건 기록 얇아요. 조서 몇 장이랑 고소장이 거의 다예요. 다툴 게 별로 없나 봐요."] }] }],
      looks: [
        { q: "고소장을 읽는다", req: ["t:recok"], a: ["고소인 오명환, 서해광역시 도시국장. 고소대리인 법무법인 목멱, 담당 변호사 차윤희. 국가배상 소송 때 시 측을 대리했던 그 사무실, 그 변호사다.", "'피고소인은 의뢰인의 가장 내밀한 고백을 세상에 팔았다.' 문장을 '팔았다'로 끝내는 건 교수님 말버릇이다. 수업 때 많이 들었다.", "접수일 2036년 3월 19일. 증언 일주일 뒤다."], gives: ["comp", { n: "오명환 고소장", d: "2036년 3월 19일 접수. 고소대리인 법무법인 목멱(차윤희). 국가배상 소송 때 시 측을 대리한 사무실.", img: "ev/m4-comp.webp" }] },
        { q: "특검 재판 증인신문 조서를 읽는다", req: ["t:recok"], a: ["순서대로 적혀 있다. 특별검사의 증인신청서와 의견서. 형사소송법 제149조 단서, 중대한 공익상 필요가 있어 변호사라도 증언을 거부할 수 없다는 내용이다.", "그다음 오명환 측 의견서. 비밀 공개를 승낙하지 않는다, 공익상 필요도 없고 대리기사에게 물으면 될 일이라는 내용이다.", "그리고 재판부 결정. '장부의 오 과장 정리비 50 항목에 한하여 증인의 증언거부를 인정하지 아니한다.' 그 뒤에야 내 증언이 시작된다.", "질문은 그 항목에 관한 것뿐이었다. 어디까지 답할지는 내가 정했다."], gives: ["order", { n: "특검 재판 증인신문 조서", d: "특별검사가 제149조 단서를 들어 신청하고, 오명환 측은 승낙하지 않는다는 서면을 냈다. 재판부가 '정리비 50' 항목에 한해 증언거부를 인정하지 않는다고 결정한 뒤 증언했다.", img: "ev/m4-order.webp" }] },
        { q: "특검 사건 판결문을 읽는다", req: ["t:recok"], a: ["2036고합47. 피고인 박진서 징역 12년.", "장부를 믿은 이유가 여러 줄이다. '오 과장 정리비 50' 항목은 증인 한서준의 증언과 맞는다.", "그 밖에 2029년 12월 23일 도원 법인 계좌의 현금 20억 원 인출, 이수아의 구치소 접견일, 2030년 11월 22일 시청 건축위원회 회의 일정이 장부의 다른 항목과 맞는다."], gives: ["ruling", { n: "특검 사건 판결문", d: "박진서 징역 12년. 장부의 '정리비 50'은 한서준의 증언과, 다른 항목들은 12월 23일 현금 20억 원 인출·구치소 접견일·11월 22일 건축위원회 회의 일정과 맞는다고 보았다.", img: "ev/m4-ruling.webp" }] }] },

    driver: { n: "대리기사 배상철", s: "대리기사 대기소 앞 골목", bg: "alley", gated: true,
      arrive: ["밤 열한 시, 대리기사들이 휴대전화를 들여다보며 콜을 기다리는 골목이다.", "배상철 씨를 찾는다고 하자 기사 한 사람이 대기소 문 앞에서 담배를 끄던 남자를 턱으로 가리켰다."],
      people: [{ id: "bae", n: "배상철", face: A + "cut/n40m4.webp",
        intro: G => /^blind/.test(G.hist.m1 || "") ? ["어, 변호사님. 6년 전에 사무실로 찾아갔던 배상철입니다.", "저 그 일로는 이제 말 안 합니다. 무서워서요."] : ["제가 배상철인데요. …어, 그 변호사님이시죠? 특검 뉴스에 나오셨던.", "저 그 일로는 이제 말 안 합니다. 무서워서요."],
        topics: [
          { id: "bae1", q: "6년 전 일 때문에 왔습니다", a: ["오 과장, 아니 지금은 국장이죠. 그 양반이 사고 나고 며칠 있다가 전화를 했어요. 전에 몇 번 태워 드린 손님이라 번호가 있었거든요.", "그분 술 드시면 조수석에서 아들 얘기를 그렇게 하세요. 공무원 시험을 세 번 떨어졌다고….", "아니, 그게 중요한 게 아니고. 50만 원 줄 테니까 그날 자기가 운전했다고 한 장만 써 달라고 했어요. 애 학원비가 밀려 있어서 썼어요. 돈은 끝내 못 받았지만요.", "근데 그거, 지금도 잡혀 갈 수 있는 거죠? 남의 재판에 가짜 종이 써 준 거. 신문에서 그렇게 봤어요."] },
          { id: "suit", req: ["t:bae1"],
            get q() {
              const m1 = (typeof G !== "undefined" && G && G.hist && G.hist.m1) || "";
              return /^blind/.test(m1) ? "그때 양복 입은 사람이 찾아왔다고 하셨지요" : "재판 끝나고 누가 찾아온 적은 없었습니까?";
            },
            a: ["왔었어요. 재판 끝나고 바로요. 양복 입은 남자가 집 앞에 와서 오 과장 일 정리하러 왔다면서, 얼마 받기로 했냐고 묻더라고요. 받은 건 없고 50 주기로 했다고 했죠.", "그 사람이 수첩에 뭘 적었어요. 명함은 안 줬는데, 가다가 전화를 받더라고요. '네, 도원입니다.' 그건 똑똑히 들었어요.", "작년에 뉴스에서 박진서 회사 이름 나올 때 그 말이 생각났어요. 도원컨설팅."] },
          { id: "visitq", q: "요즘 그 일로 찾아온 사람이 있었습니까?", req: ["t:bae1"], a: ["어떻게 아셨어요. 3월 11일이요. 제 생일이라 기억해요. 낮 두 시쯤 여자 변호사가 여기까지 왔어요. 차윤희라고 명함을 주더라고요.", "'곧 오 국장님이 고소를 하게 될 겁니다. 특검에서 물어보면 모른다고 하세요.' 그러고 갔어요.", "명함 여기 있어요. 뒷면에 그 사람이 볼펜으로 적고 갔어요.", [null, "명함 뒷면에 '3/11 방문. 연락 바랍니다.'와 휴대전화 번호가 적혀 있다. 법무법인 목멱 변호사 차윤희."], "가져가세요. 저는 그거 갖고 있기 싫어요. 근데 변호사님, 저 잘못되는 건 아니죠? 저 작년에 무릎 수술도 해서…."], gives: ["visit", { n: "차윤희의 방문", d: "증언 전날인 2036년 3월 11일 낮 2시, 목멱 차윤희 변호사가 배상철에게 '곧 오 국장이 고소를 하게 될 것'이라 말했다. 배상철이 받은 차윤희 명함 뒷면에 '3/11 방문' 자필 메모가 있다.", img: "ev/m4-visit.webp" }] },
          { q: "특검에서도 연락이 왔었습니까?", req: ["t:visitq"], a: ["왔죠. 그 변호사 오기 이틀 전에요. 오 국장님 옛날 통화 기록에 제 번호가 있었대요. 기억 안 난다고 했어요. 나와 달라는 것도 못 간다고 했고요.", "저도 가짜 종이 써 준 사람이잖아요. 말하면 저부터 잡혀 갈 것 같아서요."] },
          { q: "법정에 나와 주실 수 있겠습니까?", req: ["t:suit"], a: ["…변호사님, 저 애가 아직 고등학생이에요. 그건 못 해요.", [null, "그때 써 준 확인서는 이 사람에게도 죄가 될 수 있다. 공소시효도 아직 남았다. 증인석에 세우면 자기에게 불리한 질문마다 답을 거부할 것이고, 거부하지 않으면 이 사람이 처벌받을 수 있다."], ["한서준", "그럼 그 양복 입은 사람 얘기만 종이에 써 주실 수 있습니까. 배상철 씨 일은 빼고요."], "그건 써 드릴게요. 6년 전엔 50만 원 준다고 해서 썼는데. 이번엔 돈 얘기 없는 거죠?", ["한서준", "없습니다."], [null, "배상철은 대기소 탁자에서 볼펜을 빌려 한 장을 썼다. 날짜, 그 남자가 한 말, '도원입니다'. 이름을 쓰고 지장을 찍었다."]], gives: ["fifty", { n: "배상철의 확인서", d: "2030년 재판 직후 '도원'이라고 전화를 받는 남자가 찾아와 오명환이 약속한 돈이 얼마인지 묻고 50이라 적어 갔다. 배상철은 특검에는 처벌이 두려워 '기억 안 난다'고 했고, 법정에는 나오지 않겠다고 했다.", img: "ev/m4-fifty.webp" }] }] }] },

    kang: { n: "강도윤의 집무실", s: "법무법인 목멱", bg: "m4-kang-office", gated: true,
      arrive: ["법무법인 목멱. 벽 한쪽은 법률 서적, 맞은편 벽에는 수구여병 액자, 그 위에 사무실 현판이 걸려 있다."],
      people: [{ id: "kang", n: "강도윤", face: A + "story/face-kang.webp",
        intro: ["서준이 왔구나. 앉아라. 차가 식는다.", [null, "은발에 무테안경, 쓰리피스 양복. 교수님이 직접 차를 따라 주셨다."]],
        topics: [
          { id: "kang1", q: "고소장, 잘 받았습니다", a: ["내가 쓴 건 아니다. 차 변호사가 썼지. 그래도 문장이 눈에 익지? 내가 가르친 애니까.", "서준아, 네가 미워서 이러는 게 아니다. 너는 내가 가르친 것 중에 제일 중요한 걸 어겼다."] },
          { q: "3학년 2학기 등록금, 아직 못 갚았습니다", req: ["t:kang1"], a: ["내가 언제 갚으라고 하더냐.", "그때 네가 학교 그만두겠다고 쓴 휴학계는 아직 내 서랍에 있다."] },
          { q: "모의법정 때 제가 많이 혼났지요", req: ["t:kang1"], a: ["혼났지. 2학년 첫 변론에서 '존경하는 재판장님'을 열네 번 했다. 내가 셌다.", ["한서준", "열한 번이었습니다."], "봐라, 너도 셌구나.", "그 뒤로 내 수업에서는 그 말을 한 변론에 두 번까지만 하게 했다.", [null, "나도 모르게 웃었다."]] },
          { q: "143명 앞에서도 입을 지켰어야 합니까?", req: ["t:kang1"], a: ["그걸 정하는 건 변호사가 아니다. 변호사가 자기 마음대로 '이 비밀은 말해도 되겠다'고 고르기 시작하면, 어느 의뢰인이 변호사한테 진실을 말하겠느냐.", "네 마음은 안다. 그래도 그날 일은 오 국장 한 사람으로 끝나지 않는다. 앞으로 변호사를 찾아올 사람들이 다 그걸 본다."] },
          { id: "offerq", q: "고소를 취소하게 해 주실 수는 없습니까?", req: ["t:kang1"], a: ["이 죄는 피해자가 고소해야만 재판을 할 수 있는 죄다. 친고죄라고 하지. 1심 판결이 나기 전에 오 국장이 고소를 취소하면 재판은 거기서 끝난다.", "오 국장은 내 말을 듣는다. 네가 앞으로 장부 일에 더 입을 열지 않겠다고 약속만 하면 내가 말해 보마.", "대답은 천천히 해라. 차 식는다.", [null, "고소인이 대리인 사무실 대표의 말을 듣는다는 얘기다."]], gives: ["offer", { n: "강도윤의 제안", d: "\"앞으로 장부 일에 입을 열지 않겠다고 약속하면 오 국장이 고소를 취소하게 하겠다.\" 고소인이 강도윤의 말을 듣는다는 뜻.", img: "ev/m4-offer.webp" }] }] }],
      looks: [
        { q: "벽의 액자를 본다", a: ["수구여병. 내 사무실 것과 같은 글씨다. 획 끝을 살짝 꺾어 올리는 버릇까지 똑같다.", "교수님은 제자가 개업할 때마다 한 장씩 써 주셨다고 했다."] },
        { q: "액자 위 현판을 본다", a: ["목멱(木覓). 교수님 글씨로 쓴 사무실 이름이다.", "무슨 뜻인지는 여쭤본 적이 없다."] }] },

    special: { n: "특별검사 사무실", s: "1회 뒤 · 다른 방법이 있었는지", round: 1, bg: "f4-special",
      people: [{ id: "sp", n: "특별검사", face: A + "story/face-special.webp",
        intro: ["피고인이 되셨다고 들었습니다. 면목이 없네요. 앉으시죠."],
        topics: [
          { id: "sp1", q: "제 증언 말고 장부를 입증할 다른 방법이 있었습니까?", a: ["있었으면 부르지 않았지요. 수사보고서를 보시겠습니까.", "배상철 씨는 오명환 씨의 2030년 3월 휴대전화 통화 기록에서 찾았습니다. 대리운전 기사 번호가 있었지요. 3월 9일쯤 연락했습니다.", "'기억이 안 난다'고 했고, 출석도 거절했습니다. 변호사님 증언대로라면 그분은 대신 운전했다고 해 달라는 부탁을 받은 당사자입니다. 그 줄을 설명하면 자기도 처벌받을 수 있지요. 법정에 세워도 증언을 거부할 수 있는 사람입니다.", "오명환 씨는 '모른다'. 도원컨설팅 사람들은 다 입을 닫았고요.", "그 줄을 바깥의 사실과 맞출 수 있는 사람은 변호사님 한 분뿐이었습니다. 그렇게 보고서에 썼고, 재판부에도 그렇게 소명했습니다. 변호사님 재판에 내셔도 됩니다."], gives: ["only", { n: "특검 수사보고서", d: "배상철(오명환의 2030년 3월 통화 기록으로 찾음)은 '기억 안 난다'며 출석도 거절(본인도 처벌받을 수 있어 증언거부 가능), 오명환은 부인, 도원 관계자는 진술 거부. '정리비 50'을 맞출 수단은 한서준의 증언 말고 없었다고 적었다.", img: "ev/m4-only.webp" }] },
          { id: "sp2", q: "특검 기록을 제 재판에 낼 수 있겠습니까?", req: ["t:sp1"], a: ["변호인께서 법원을 통해 기록을 보내 달라고 요청하시면 장부 사본과 해독표는 보내 드리겠습니다.", "장부는 아직 다른 사람들 재판에도 쓰이고 있어서 원본은 못 드립니다. 사본으로 충분하실 겁니다."] },
          { q: "제가 증언한 뒤로 달라진 건 뭡니까?", req: ["t:sp1"], a: ["그 줄이 시작이었지요.", "그 뒤로 장부의 다른 항목을 하나씩 맞췄습니다. 도원 법인 계좌에서 현금이 빠져나간 날, 구치소 접견일, 시청 회의 일정. 날짜가 맞는 항목이 나올 때마다 재판부가 장부를 조금씩 더 믿었습니다.", "전직 부시장, 부장검사 항목도 그렇게 입증이 됐습니다."] },
          { id: "sp3", q: "2031년 불기소 기록이 폐기됐다고 합니다", req: ["t:arch1"], a: ["폐기요? 보존기간 3년으로요?", "고발 사건 기록을 3년짜리로 분류했다는 것부터가 이상하지요. 그건 저희가 따로 들여다보겠습니다.", "다행히 작년 압수수색 때 공소청 전산에서 그 사건 불기소 결정서와 첨부 의견서를 출력해 왔습니다. 종이는 버려도 전산 기록은 남거든요.", "그건 이제 저희 수사기록입니다. 원본이 없으니 공소청에 물을 일은 끝났고요. 결정서와 의견서만 달라고 하시면 개인정보 문제도 크지 않을 겁니다. 변호인께 저희 쪽으로 송부촉탁을 넣으시라고 전해 주십시오."] }] }] },

    archive: { n: "공소청 기록보존계", s: "지하 1층 보존 창고 창구", round: 1, gated: true, bg: "m3-archive",
      arrive: ["공소청 지하 1층. 철제 서가가 늘어선 창고 앞에 창구가 하나 있다. 기다리는 사람은 나뿐이다."],
      people: [{ id: "keeper", n: "기록보존계 주무관", face: A + "cut/n50m3.webp",
        intro: ["번호표 뽑으셨어요?", ["한서준", "…저 말고는 아무도 없는데요."], "그래도 뽑으셔야 돼요. 그래야 오늘 민원 처리 건수에 잡혀요.", [null, "번호표를 뽑았다. 1번. 뽑자마자 천장에서 '1번 고객님' 하는 안내 방송이 나왔다. 주무관은 방송이 끝날 때까지 기다렸다가 고개를 들었다."], "1번 고객님, 무슨 일이세요?"],
        topics: [
          { id: "arch1", q: "2031년 정한별 씨 고발 사건 불기소 기록을 보고 싶습니다", a: ["사건 관계인이세요? 고발인, 피고발인, 그 대리인. 아니시면 열람이 안 돼요.", ["한서준", "제 형사재판에 필요한 기록입니다. 재판부를 통해 송부촉탁을 냈는데 보류됐습니다."], "그럼 재판부 결정을 기다리셔야죠. 규정이 그래요.", "…있는지 없는지만 봐 드릴게요. 보기만 하는 건 규정에 없으니까요.", [null, "주무관이 자판을 한참 두드렸다. 두드릴 때마다 돋보기안경을 이마로 올렸다 내렸다 했다."], "아, 이거 없어요. 2034년에 폐기됐네요. 보존기간 3년.", [null, "고발 사건 기록이 3년짜리라니. 그런 분류는 처음 듣는다."], ["한서준", "3년으로 분류한 사람이 누군지 알 수 있습니까?"], "그건 기록 표지 결재란을 봐야 하는데요. 기록이 없으니 결재란도 없죠."] },
          { q: "폐기 전에 누가 그 기록을 본 적은 있습니까?", req: ["t:arch1"], a: ["열람 대장은 제 권한 밖이고요.", "다만 작년에 특검에서 우리 전산 자료를 통째로 가져갔어요. 압수수색이요.", "그 얘기를 왜 저한테 물으세요? 특검에 물어보시지."] }] }] },

    ledger: { n: "특검 기록 사본", s: "문서송부촉탁으로 온 기록", round: 1, gated: true, bg: "rec",
      arrive: ["서연이 가져온 복사본이다. 장부는 상·하 두 권. 출판사 이름도 가격도 없는 문고판 인쇄본이다.", "두 권 표지에 『남산 아래 봄』. 하권 표지에는 둥근 얼룩이 복사본에도 회색으로 찍혀 있다."],
      looks: [
        { q: "하권 2030년 7월 대목을 해독표와 맞춰 본다", a: ["본문은 연애소설처럼 읽힌다. 옆에 특검이 풀어 붙인 해독표가 있다. 감자 한 상자가 1억 원.", "상권과 하권 앞쪽은 인쇄된 글이다. 하권 뒤쪽 빈 장부터 또박또박한 손글씨가 이어진다. 특검 메모로는 구속 뒤에 이어 쓴 부분이다.", "하권 뒤쪽 손글씨 부분, 2030년 7월 대목에 '오 과장 정리비 50.' 이 줄만 감자가 아니라 맨 숫자로 적혀 있다. 만 원 단위, 50만 원이다.", "내가 법정에서 설명한 줄이다. 그 앞뒤로 시청, 금융, 공소청 사람들의 줄이 이어진다."] },
        { id: "namk", q: "2030년 12월 대목을 읽는다", a: ["'첫눈 오던 날, 남산 아래 사는 그분께 감자 서른 상자를 부쳤다. S의 고발 일로 마음 쓰실 일 없게.'", "해독표로는 감자 한 상자가 1억 원. 서른 상자면 30억. 특검은 이 대목을 '남산 / S 고발 건 / 30억'으로 정리했다.", "S는 스타포트. 고발은 정한별이 2030년 12월에 낸 내부 고발이다.", "남산. 사람 이름 대신 동네 이름을 썼다.", "고발이 어떻게 끝났는지는 불기소 기록에 있을 텐데, 그 기록은 송부가 보류됐다. 공소청 기록보존계에 가 봐야겠다."], gives: ["nam", { n: "장부 '남산' 대목", d: "2030년 12월 대목. 해독표로 읽으면 '남산 / S 고발 건 / 30억'.", img: "ev/m4-nam.webp" }], opens: ["archive"] },
        { q: "정한별 고발의 불기소 결정서를 읽는다", req: ["t:namk", "q12"], a: ["2031년 2월 결정. 장부의 그 대목 두 달 뒤다.", "결정 근거로 법무법인 한강로의 의견서가 붙어 있다. 인용 판례 '대법원 2011. 2. 30. 선고 2010다77417 판결.' 청람, 정헌 의견서에서 봤던 그 날짜다.", "담당 수사관 권태훈. 서연이 이름을 찾으면 알려 달라고 했던 그 수사관이다."], gives: ["nop", { n: "불기소 결정서", d: "2031년 2월 정한별 고발 불기소. 담당 수사관 권태훈. 근거로 붙은 한강로 의견서는 대법원 2011. 2. 30. 판결을 인용.", img: "ev/m4-nop.webp" }], opens: ["kwon"] }] },

    kwon: { n: "권태훈 수사관", s: "공소청 앞 공원", round: 1, gated: true, bg: "f2-investigator",
      arrive: ["점심시간이 끝나 가는 공원 벤치. 긴 검은 머리의 수사관이 목에 건 신분증을 재킷 안으로 넣고 있었다."],
      people: [{ id: "kwon", n: "권태훈", face: A + "story/insp.webp",
        intro: ["한서준 변호사님이시죠. 법정에서 증언하시는 거 봤습니다.", "무슨 일로 저를 찾으셨습니까."],
        topics: [
          { id: "kw1", q: "윤서연 변호사가 말을 전해 달랬습니다", a: [["한서준", "'말해야 하는 날이 왔다'고 전해 달라고 했습니다."], "그 말을 그분이 기억하고 있었군요."] },
          { id: "kw2", q: "2031년 불기소, 누가 지시했습니까?", req: ["t:kw1"], a: ["부장님이 '남산에서 정리된 건'이라고 했습니다. 그게 다입니다. 저는 불기소 의견을 올렸어요.", "그 전에 누가 자료를 보내겠다고 연락해 왔습니다. 오지 않았고, 저는 일이 하나 줄었다고만 생각했습니다.", "그게 장부였다는 건 나중에 특검 조사 때 알았습니다."] },
          { q: "'남산'이 누군지 아십니까?", req: ["t:kw2"], a: ["모릅니다. 사람인지 회사인지도요. 부장님이 그 말을 하면 일이 끝났다는 뜻이었습니다.", "그 말이 장부에 그대로 적혀 있다는 건 특검 기록을 보고서야 알았습니다."] },
          { q: "법정에 나와 주시겠습니까?", req: ["t:kw2"], a: ["어제 아침에 출근해 보니 제 책상에 명함이 한 장 꽂혀 있었습니다. 법무법인 목멱, 차윤희. 뒷면에 '증언하시기 전에 한번 뵙고 싶습니다'라고 적혀 있더군요.", "변호사님보다 하루 먼저 다녀간 셈이지요. 연락은 안 했습니다.", [null, "차윤희는 오명환의 고소대리인이다."], "애들한테 먼저 얘기했습니다. 큰애가 고등학생이에요. 듣고 나서 한참 있다가 그러더군요. '엄마, 그럼 그때 왜 말 안 했어?' 대답을 못 했어요.", "네. 나가겠습니다."], gives: ["kwon2", { n: "권태훈의 증언 약속", d: "\"부장검사가 '남산에서 정리된 건'이라고 했다. 불기소 의견을 올렸다.\" 법정에 나오겠다고 약속.", img: "ev/m4-kwon2.webp" }] }] }] },

    cityhall: { n: "서해광역시청 지하 2층", s: "2회 뒤 · 정한별을 찾아서", round: 2, bg: "m3-archive",
      arrive: ["시청 지하 2층. 엘리베이터가 서지 않아 비상계단으로 내려왔다. 국가배상 사건 때 와 본 길이다.", "기록실 문은 잠겨 있고 종이가 붙어 있다. '문서고 정리 중. 지하 1층.'", "계단참에서 서류 상자를 든 직원이 내려오고 있었다."],
      people: [{ id: "clerk", n: "문서고 직원", face: A + "cut/n30m2.webp",
        intro: ["정 주무관님 찾아오셨어요? 위층 문서고에서 서류 옮기고 있어요. 이것만 내려놓고 올라갈 거예요."],
        topics: [
          { id: "ch1", q: "정한별 주무관을 찾아왔습니다", a: ["오늘 정 주무관님 찾는 분이 두 번째시네요. 아까 오전에 여자 변호사분도 오셨어요. 명함 주고 가셨는데… 여기 있네요. 법무법인 목멱.", [null, "명함의 이름은 차윤희였다."], "정 주무관님 금방 내려오세요. 기록실 앞에서 기다리시면 돼요."], opens: ["jung"] },
          { q: "정 주무관은 기록실에 얼마나 있었습니까?", req: ["t:ch1"], a: ["고발하고 나서 내려왔다니까 5년 넘었죠. 인사 발령이야 위에서 하는 거고요.", "저는 위층 문서고에 있어요. 어디 뭐가 있는지 모르면 아직도 정 주무관님한테 물어봐요."] }] }] },

    jung: { n: "정한별", s: "시청 지하 기록실", round: 2, gated: true, bg: "m3-sideline",
      arrive: ["보일러실 옆 기록실. 형광등 하나가 깜빡인다. 금속테 안경을 쓴 남자가 서류 상자 사이에서 고개를 들었다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["…이번엔 변호사님이 피고인이시라면서요.", "전화는 일부러 안 받았습니다. 할 말이 없어서요."],
        topics: [
          { id: "j1", q: "6년 전 일을 사과드리러 왔습니다", a: ["사과요. 국가배상 재판 때도 사과는 안 하셨죠.", "특검 법정 방청석에서 들었습니다. 그 50만 원 얘기요. 안경을 몇 번이나 닦았는지 모릅니다.", "이 층은 습기가 차서 서류에 곰팡이가 피어요. 안경이 늘 뿌옇고요. 고발하고 나서 여기로 왔습니다."] },
          { id: "j2", q: "그 판결문의 문장, 제가 만든 겁니다", req: ["t:j1"], a: ["'증인 정한별의 진술은 믿기 어렵다.' 외우고 있습니다.", "그날 술을 줄여 말한 건 제 잘못이에요. 그건 압니다. 그래도 본 건 봤어요.", "고발했을 때도 그 문장이 따라다녔어요. 거짓말쟁이가 또 뭘 고발하냐고."] },
          { id: "j3", q: "목멱 변호사가 먼저 다녀갔다고 들었습니다", req: ["t:j2"], a: ["오전에요. 차윤희 변호사. 커피를 두 잔 사 왔더라고요. 제가 안 받으니까 혼자 두 잔 다 마시고 갔어요.", "국장님이 제 복직 심사 때 좋게 말씀해 주실 거라고 했어요. 증인으로 나가라 마라는 한마디도 안 했고요.", "저 이제 마흔 넘었어요. 여기서 곰팡이랑 정년까지 갈 생각을 하면… 솔직히 흔들렸습니다."] },
          { q: "제 재판에 증인으로 나와 주시겠습니까?", req: ["t:j3"], needs: "plea", lock: ["변호사님을 위해서는 안 나갑니다. 그건 분명히 해 두죠.", "그리고 지금은 모르겠습니다. 나가면 제가 잃을 게 너무 많아요.", [null, "내가 부탁해서 될 일이 아니다."]], okLine: [[null, "유족회 탄원서 사본을 내밀었다. 정한별은 서명란을 오래 내려다봤다."], "…조경숙 어머님 글씨네요. 국가배상 재판 때 방청석에서 뵀어요.", "이분들도 이름 쓰기 쉽지 않았을 거예요.", "변호사님을 위해서는 안 나갑니다. 그건 분명히 해 두죠.", "제가 그날 본 게 사실이었다고, 어디든 한 줄 적히는 걸 봐야겠어요. 그걸 위해서라면 나가죠."], gives: ["jungn", { n: "정한별의 말", d: "\"제가 그날 본 게 사실이었다고 어디든 한 줄 적히는 걸 봐야겠어요.\" 증인으로 나오겠다는 동의.", img: "ev/m4-jungn.webp" }] }] }] },

    cho: { n: "조경숙 어머니", s: "2회 뒤 · 유족회 분향소", round: 2, bg: "m2-altar",

        topics: [
          { id: "c1", q: "제가 재판을 받게 됐습니다", a: ["들었어요. 유족회 분들이 다 들었어요. 우리 다은이가 왜 못 나왔는지 물어봐 준 변호사님인데, 왜 변호사님이 재판을 받아요.", "저희가 그 사람들 앞에서 뭐라도 할 수 있는 게 있어요?"] },
          { id: "c2", q: "제가 나쁜 변호사였다는 걸 아셔야 합니다", req: ["t:c1"], a: ["그 음주운전 이야기요. 특검 법정에서 들었어요. 그 사람을 변호사님이 빼 주셨다는 것도요. 그 사람이 나중에 그 공사 서류에 도장을 찍었다는 것도요.", "처음엔 며칠 잠을 못 잤어요. 그래도 변호사님이 그 말을 안 했으면 장부가 없었던 거잖아요. 저는 그거 하나만 생각하기로 했어요."] },
          { q: "유족회 이름으로 의견을 내 주실 수 있습니까?", req: ["t:c2"], a: ["네. 탄원서요. 서른한 집이 다 썼어요.", "두 집은 처음에 안 쓰겠다고 했어요. 변호사가 그 사람을 빼 줬는데 왜 우리가 써 주냐고요. 그 말도 맞죠. 그래서 그 말까지 탄원서에 넣자고 했어요. 그랬더니 쓰더라고요.", "제가 글씨가 안 좋아서 문장은 총무님이 써 주셨어요. 이름은 다 자기 손으로 썼고요."], gives: ["plea", { n: "유족회 탄원서", d: "유족 31세대 자필 서명. '변호사가 그 사람을 빼 준 일도 압니다. 그래도 그 증언이 없었으면 장부는 묻혔을 것입니다.'", img: "ev/m4-plea.webp" }] }] }] },

    mokfloor: { n: "목멱 건물 관리실", s: "3회 뒤 · 6층의 네 로펌", round: 3, gated: true, bg: "m4-kang-office",
      arrive: ["목멱이 든 건물 1층 관리실. 우편함이 벽 하나를 채우고 있다.", "6층 칸에 목멱 말고도 이름표 네 개가 더 붙어 있다. 청람, 정헌, 서진, 한강로."],

        topics: [

          { q: "그 방에 들어가 보신 적 있어요?", req: ["t:mailbox"], a: ["청소하러 한 번요. 책상 하나에 컴퓨터 하나. 벽에 붓글씨 액자가 걸려 있던데요.", "한자라 무슨 말인지는 모르겠더라고요. 네 글자였어요."] },

          { id: "room607", q: "끝 방이 몇 호입니까?", req: ["t:lease1"], a: ["607호요. 목멱이 601호부터 605호까지 쓰고, 606호는 창고고, 끝이 607호예요.", "호수는 문에 붙어 있으니까 비밀도 아니죠. 적어 가세요.", "열쇠는 목멱에서 갖고 있어서 저도 못 열어 드려요. 청소도 한 번 하고 나서는 오지 말라더라고요."] }] }] },

        topics: [
          { q: "강의안에 일부러 틀린 판례를 넣으셨지요", a: ["그랬지. 복사해 간 놈 잡으려고. 너는 안 베꼈지?", "남의 글을 베끼면 틀린 것까지 따라 베끼게 된다. 내가 너한테 그 말을 한 적이 있던가."] },
          { id: "k2a", q: "교수님, 사무실 이름 '목멱'은 무슨 뜻입니까?", req: ["nam"], a: ["남산의 옛 이름이다. 목멱산. 우리 사무실이 그 아래 있지. 몰랐느냐.", "법학자는 지명도 공부해야 한다고 했는데, 너는 시험에는 늘 강했어도 교양은 약했다.", [null, "장부에 적힌 '남산 아래 사는 그분'이 떠올랐다."]], gives: ["mok", { n: "목멱 = 남산", d: "강도윤 본인의 설명: 목멱은 남산의 옛 이름이고, 목멱 사무실은 그 아래 있다.", img: "ev/m4-mok.webp" }] },
          { q: "저를 왜 가르치셨습니까?", req: ["t:k2a"], a: ["네가 가르칠 만해서 가르쳤다.", "윤서연이도 그렇고. 나는 내가 가르친 애들 중에 쓸 만한 애들을 좋아한다. 그게 나쁜 일이냐."] },
          { q: "휴학계를 돌려받고 싶습니다", req: ["t:k2a"], a: ["…재판 끝나고 와라. 그때까지 내가 갖고 있으마.", "서준아, 증인석에서는 서로 봐주지 말자."] }] }] } },

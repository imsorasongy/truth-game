<style>

.pop-card { width: min(100%, 330px); max-height: 86%; overflow-y: auto; background: #1f150f; border: 1px solid var(--brass); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 14px 36px #000c; }

  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0d0806f5; border-top: 1px solid #c9a24a44; }

.top { display: flex; align-items: center; gap: 8px; min-height: 36px; }

.stage img.who { --sz: calc(max(170px, min(230px, 60vw)) * .75); width: var(--sz); height: var(--sz); object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 10px 18px #000c); -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }
/* 대화 상대가 있는 화면: 본 게임처럼 얼굴은 위에 고정, 대사와 선택지는 그 바로 아래부터 */
.stage:not(:empty) { flex: 0 0 auto; height: calc(max(170px, min(230px, 60vw)) * .75 + 16px); align-items: flex-start; }

.tag { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: var(--brass); color: #2a1c0c; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 1px 12px; white-space: nowrap; }

.lbl { font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

.ev { display: block; width: 100%; text-align: left; background: #f1e9d8; color: var(--ink); border: 1px solid #d7c9ab; border-radius: 8px; padding: 9px 12px; }
.ev b { font-size: 16px; }

.ev-ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ev .ev-ico { color: #6b5a44; }

.sheet { position: fixed; inset: 0 0 calc(62px + env(safe-area-inset-bottom, 0px)) 0; z-index: 20; background: #000b; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: #f1e9d8; color: var(--ink); width: 100%; max-width: 480px; max-height: 76%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet h3 { margin: 0; font-family: var(--f-d); font-weight: 400; color: #6b4a1e; }
/* 재판: 본 게임 폰 화면과 같은 배치(사건 제목 위, 상대 왼쪽·우리 오른쪽, 게이지, 아래 대화창) */
#bg.court::after { background: linear-gradient(180deg, #140d0955 0%, #140d0922 35%, #140d0988 65%, #140d09e6 100%); }
#app.court { padding: 0; display: block; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }

@keyframes quake { 10%, 50%, 90% { transform: translate(-7px, 3px); } 30%, 70% { transform: translate(7px, -3px); } }
.court .top { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px; }

.court .bench .no, .court .bench .who { color: #d6c6aa; font-family: var(--f-s); font-size: 11.5px; line-height: 1.5; text-shadow: 0 1px 3px #000; }

@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.gauge.zw { animation: zw 1s ease-out; } .gauge.zl { animation: zl 1s ease-out; }

.log-line { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; background: #140d09f0; border: 1.5px solid var(--brass); border-radius: 12px; padding: 12px; font-size: 18px; line-height: 1.5; box-shadow: 0 6px 18px #000a; animation: pop .25s ease-out; }

.log-line .d.pos { color: var(--win); } .log-line .d.neg { color: var(--lose); }
.log-line .more { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--brass); }
.court .opts { display: flex; flex-direction: column; gap: 5px; }
.court .opts .btn { font-size: 15px; padding: 8px 12px; }
.cutin { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; pointer-events: none; }
.ci-band { position: relative; width: 100%; height: 150px; display: flex; align-items: center; gap: 14px; padding: 0 18px; overflow: hidden; }
.cutin.us .ci-band { background: linear-gradient(100deg, #0b2a5ae6, #1b4fa0e6 60%, #0b2a5ae6); animation: ciL var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.cutin.opp .ci-band { flex-direction: row-reverse; background: linear-gradient(260deg, #5a0b0be6, #a01b1be6 60%, #5a0b0be6); animation: ciR var(--ci, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.ci-face { width: 128px; height: 128px; flex: none; border-radius: 10px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 20px #000a; }
.ci-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.ci-txt { font-family: var(--f-d); font-size: clamp(34px, 11vw, 54px); color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #000; transform: rotate(-4deg); white-space: nowrap; }
@keyframes ciL { 0% { transform: translateX(-100%) skewY(-4deg); } 18%, 80% { transform: translateX(0) skewY(-4deg); } 100% { transform: translateX(100%) skewY(-4deg); opacity: 0; } }

<script>
const A = "assets/", H = { m: { n: "한서준", img: A + "hero-m.webp" }, f: { n: "윤서연", img: A + "hero-f.webp" } };
const OFF = Math.max(0, Math.min(3, +new URLSearchParams(location.search).get("office") || 0));
const BG = { court: A + "court-2.webp", m: `${A}office-${OFF}-m.jpg`, f: `${A}office-${OFF}-f.jpg` };
const OLD_BG = ["rec", "er", "diner", "alley", "dock", "rest"];
// 아직 그림이 없는 장소는 비슷한 그림으로 대신한다(그림이 들어오면 여기서 지운다)
const PENDING_BG = { "f-bookshop": "f2-storage", "f-hospital": "er", "f-lee-home": "f2-storage" };
const bgOf = x => { x = PENDING_BG[x] || x; return OLD_BG.includes(x) ? `${A}story/story-${x}.jpg` : `${A}story/${x}.jpg`; };
const homeBg = () => G.c.bgConsult ? bgOf(G.c.bgConsult) : BG[G.c.hero];
// 그림이 있는 증거
const EV_IMG = { bore: "ev-settle.webp", map: "ev-board.webp", sign: "ev-sign.webp", phone: "ev-phone.webp", log: "ev-broadcast.webp" };
const evPic = k => EV_IMG[k] ? `<img class="evpic" src="${A}story/${EV_IMG[k]}" alt="">` : "";
// 대화 장면의 인물은 배경을 지운 그림으로
const CUT = new Set(["face-chair", "face-citylaw", "face-jung-40", "face-kang", "face-lee", "face-mother", "face-oh-50", "face-park_neutral", "face-pf", "face-special", "insp", "hero-m", "hero-f"]);
const EXPRS = ["confident", "flustered", "neutral", "serious"];
["face-citylaw", "face-jung-40", "face-kang", "face-lee", "face-park", "face-special"].forEach(b => EXPRS.forEach(e => CUT.add(`${b}_${e}`)));
const cutPic = u => cut(u);

    ["정한별 주무관과는 무슨 일이 있었나요?", "서류를 몇 번 돌려보낸 일이 있지요. 제가 글자 틀린 걸 못 보는 성격이라. 작년 인사 평가도 좋게 못 줬고요. 요새 젊은 친구들은 그런 걸 오래 담아 둡니다.", []],
    ["다친 분과는 합의가 됐나요?", "집사람이 병원에 찾아가서 합의금 드렸습니다. 처벌 원하지 않는다는 서류도 받았고요. 세탁소 하시는 분인데, 두 달을 문을 닫으셨다고 해서 제가 면목이 없습니다.", []],
    ["대리기사 사실확인서는 어떻게 받으셨어요?", "며칠 전에 집 우편함에 들어 있었습니다. 그 사람도 양심에 찔렸는지 '그날 제가 운전했습니다' 하고 손으로 써서 넣어 놨더라고요. 연락처는 없고요.", []],

    ["공소장에는 0.172%라고 돼 있던데요?", "그러니까 제가 어이가 없는 겁니다. 소주 두어 잔에 그런 숫자가 어떻게 나옵니까. 의식도 없는 사람 피를 뽑았다는데, 그게 제 피가 맞는지부터 따져 봐야지요.", []]],

      { q: "교통사고 실황조사서를 읽는다", after: "sun", a: ["사고 시각은 2030년 3월 15일 금요일 밤 11시 40분. 차량은 골목 전봇대에 앞이 박힌 채 멈춰 있었다.", "운전석 문은 열려 있었다. 뒷좌석 문은 닫혀 있었고, 보행자는 전봇대 앞쪽에 쓰러져 있었다.", "경찰이 도착했을 때 오명환은 차 옆 바닥에 앉은 채 의식을 잃어 가고 있었다고 적혀 있다."] },

      { q: "혈액 감정 경위를 읽는다", after: "sun", a: ["의식 없는 피고인의 혈액을 경찰 요청으로 채취했다. 압수영장란이 비어 있다. 뒷장까지 넘겨도 사후영장을 청구한 기록이 없다.", "피를 뽑는 건 사람 몸에 손을 대는 일이다. 본인이 동의하거나 법원이 영장을 내줘야 하고, 급하면 먼저 뽑더라도 뒤에 곧바로 영장을 받아야 한다.", "채혈 장소는 시립병원 응급실. 의식이 없었다면 동의는 누가 했을까. 그날 피를 뽑은 사람에게 직접 물어봐야겠다."], gives: ["nowarrant", { n: "수사기록 사본", d: "의식 없는 피고인 혈액을 경찰 요청으로 채취. 사전·사후영장 모두 없음." }], opens: ["hosp"] },
      { q: "피해자 진단서와 합의서를 읽는다", after: "sun", a: ["피해자는 세탁소를 하는 쉰여덟 살 남성. 왼쪽 정강이뼈 골절, 전치 6주.", "처벌을 원하지 않는다는 합의서가 붙어 있다. 합의금이 적힌 칸의 숫자가 생각보다 컸다. 세탁소를 두 달 닫은 값으로 치면 많지 않을지도 모른다."] },
      { q: "오명환의 범죄 경력을 확인한다", after: "sun", a: ["7년 전 음주운전 벌금 300만 원. 같은 종류의 전과다.", "검사가 이번에 벌금으로 끝내 주지 않을 이유로는 충분했다."] }] },
    hosp: { n: "시립병원 응급실", s: "채혈한 간호사", fn: "응급실 간호사", face: A + "cut/n30f1.webp", intro: "기록 말씀이세요? 저희가 함부로 드릴 수는 없는데요.", items: [

      { q: "다른 앱을 썼거나 전화로 불렀을 수도 있을까요?", a: ["다른 회사 앱이면 저희는 모르죠. 전화 콜도 저희 기록에는 안 잡히고요.", "그런데 이 고객님은 지난 2년 동안 저희 앱만 쓰셨어요. 그날만 안 쓰신 거예요."], after: "sun" },
      { q: "그날 그 근처에 호출이 있었는지 볼 수 있나요?", a: ["위치별로 뽑아 드리는 건 다른 고객님 정보라서 안 돼요. 법원에서 정식으로 사실조회가 오면 몰라도요.", "금요일 밤이라 시청 앞은 기사님들이 많이 대기하셨을 거예요."], after: "sun" }] },
    diner: { n: "대성식당", s: "회식한 고깃집", fn: "식당 사장", face: A + "cut/n50m2.webp", intro: "손님 정보를 함부로 드릴 수가 있나요.", items: [
      { q: "그날 회식 자료를 요청한다", a: ["…아, 그 사고요?"], needs: "sun", lock: "무슨 일이신데요? 그냥은 말씀 못 드려요.", okLine: "아, 그 양반 사고 난 날이구먼요. 변호사님이시면 말씀드려야지. 그날 열두 분 오셨어요." },
      { q: "그날 과장님은 얼마나 드셨어요?", a: ["많이 드셨죠. 두어 잔이요? 누가 그래요. 혼자 한 병은 넘게 드셨을걸요.", "대리요? 저희 앞에서 대리 부르는 건 못 봤는데. 저희 집 앞에서 부르면 기사들이 가게 앞에 차를 대니까 제가 알거든요."], after: "sun" },
      { q: "끝까지 남은 사람이 있었나요?", a: ["안경 쓴 젊은 분이요. 금속테 안경 쓰고 회갈색 재킷 입은 분. 그분도 꽤 드시던데.", "과장님이 잔을 주면 넙죽넙죽 받아서 다 드셨어요. 상사가 주는 술을 어떻게 안 먹겠어요. 마지막에 같이 나가셨어요. 영수증 드릴까요?"], after: "sun", gives: ["receipt", { n: "회식 영수증", d: "12명, 소주 11병. 사장: 안경 쓴 직원도 끝까지 함께 마심." }] },

      { q: "그날 가게 앞은 어땠어요?", a: ["11시 반쯤 파했어요. 다들 택시 잡으러 큰길 쪽으로 가고, 그분들만 골목 쪽으로 가셨지요.", "저는 불판 닦느라 나중 일은 몰라요. 쿵 소리는 들었는데 나가 보니 벌써 사람들이 몰려 있더라고요."], after: "sun" }] },
    alley: { n: "사고 골목", s: "직접 둘러보기", fn: null, intro: "밤 11시, 사고 시각에 맞춰 와 봤다.", items: [

    kang: { n: "강도윤 교수님께 전화", s: "개업 선물을 주신 은사", fn: "강도윤", face: A + "story/face-kang.webp", intro: "그래, 서준이구나. 밥은 먹고 다니냐?", items: [
      { q: "첫 형사 사건을 맡았다고 말씀드린다", a: ["벌써 형사 사건이 들어왔어? 그 동네에서? 잘됐다. 약사 양반한테 인사라도 해 뒀나 보구나.", "처음 맡는 사건은 평생 기억에 남는다. 나는 초임 때 사건이 아직도 꿈에 나와. 서두르지 말고 기록부터 네 눈으로 다 읽어라."] },

      { q: "의뢰인이 거짓말을 하는 것 같으면 어떡하느냐고 여쭌다", a: ["좋은 질문이다. 너희 때 수업에서 그런 질문을 한 놈이 있었나 모르겠다.", "먼저 네 눈으로 확인해라. 그리고 거짓말인 걸 알았으면 그 거짓말을 법정에 내놓지는 마라. 변호사는 진실을 적극적으로 숨기면 안 되거든.", "다만 검사가 증명을 못 한 것을 네가 대신 증명해 줄 의무도 없다. 그리고 들은 얘기는 벽에 걸린 그 글자대로 하는 거다. 너무 어렵게 생각하지 말고, 밥 먹어라."] },
      { q: "그 액자는 왜 제자들에게 똑같이 써 주시는지 여쭌다", a: ["돈 드는 일이 아니니까 그렇지. 먹하고 종이값이면 되잖아.", "농담이다. 제자들이 어디서 어떤 사건을 하든, 같은 글자를 보고 산다고 생각하면 내가 마음이 좀 놓인다. 늙으면 그런 게 위안이 되더라."] }] } },

    rec: { n: "해성개발 파산 기록", s: "법원 기록 열람실", fn: null, bg: "m2-registry", intro: "파산 신청 사건 기록 열람실이다. 재산 목록이 든 파일이 벽돌만 하다.", items: [
      { q: "기록 열람을 신청한다", a: ["…"], needs: "sun", lock: "이해관계인이라는 서류가 있어야 합니다.", okLine: "위임장 확인했습니다. 저쪽에서 보세요." },
      { q: "사건 진행 상황을 확인한다", after: "sun", a: ["파산 신청만 들어가 있고 선고는 아직이다. 다행이다.", "파산이 선고되면 빼돌린 재산을 되찾는 소송은 파산관재인만 할 수 있다. 어머니 차례가 오려면 관재인이 움직여 주기를 기다려야 한다.", "선고 전이면 채권자가 직접 낼 수 있다. 서둘러야 한다."] },
      { q: "재산 목록을 읽는다", after: "sun", a: ["붕괴 1년 전 자산 3,100억, 대출 3,480억. 그때 이미 갚을 돈보다 빚이 많았다.", "붕괴 석 달 뒤 자산 2억. 대출은 그대로 남아 있다.", "가장 큰 처분은 논현동 빌딩 72억. 등기를 확인해 봐야겠다."], gives: ["assets", { n: "해성개발 재산 목록", d: "붕괴 1년 전 자산 3,100억에 대출 3,480억으로 이미 채무초과. 붕괴 석 달 뒤 자산 2억." }], opens: ["registry"] },
      { q: "매매계약서 사본을 읽는다", after: "sun", a: ["해성개발이 한결에셋에 논현동 빌딩을 72억에 판다는 계약서. 계약일 2034년 3월 2일. 붕괴 40일 전이다.", "뒤에 해성개발 법인인감증명서가 붙어 있다. 회사 도장이 진짜라는 걸 확인해 주는 서류다. 발급일… 2034년 4월 15일?", "붕괴 나흘 뒤에 뗀 증명서가 3월 계약서에 붙어 있다."], gives: ["seal", { n: "법인인감증명서", d: "3월 2일자 매매계약서에 붙은 증명서. 발급일은 붕괴 나흘 뒤인 4월 15일." }] }] },
    registry: { n: "등기소", s: "논현동 빌딩 등기부", fn: "등기소 직원", face: A + "cut/n40f1.webp", bg: "m2-registry", intro: "어떤 부동산 찾으세요?", items: [
      { q: "논현동 빌딩 등기부를 뗀다", a: ["소유권 이전 접수일이 2034년 4월 19일이네요. 원인은 3월 2일 매매요."], gives: ["reg", { n: "논현동 빌딩 등기부", d: "3월 2일 매매를 원인으로 붕괴 8일 뒤인 4월 19일 소유권 이전." }] },
      { q: "계약하고 등기까지 보통 얼마나 걸려요?", a: ["잔금 치르면 바로 하죠. 산 사람 입장에선 등기 안 하면 자기 건물이 아닌 거니까요.", "72억짜리를 48일이나 안 하는 건 드물어요. 그사이에 판 사람이 딴 데 또 팔아 버리면 어쩌려고요."] },
      { q: "이 건물에 대출이 있나요?", a: ["근저당이 58억 잡혀 있어요. 은행이 담보로 먼저 잡아 놓은 거요.", "건물을 되찾아도 은행이 먼저 가져가겠네요. 남는 건 14억쯤이겠고요."] }] },
    shell: { n: "한결에셋 사무실", s: "주소지 찾아가기", fn: "건물 관리인", face: A + "cut/n60f1.webp", bg: "m2-shell", intro: "그 회사요? 사람 있는 거 본 적 없는데. 변호사세요? 저번에 검은 옷 입은 아주머니도 와서 한참 서 계시던데.", items: [
      { q: "이 회사 직원을 보신 적 있어요?", a: ["없어요. 책상 하나 갖다 놓은 게 다예요. 전화기는 있는데 울리는 걸 못 들어 봤네.", "임대료는 꼬박꼬박 들어와요. 그러니까 나야 뭐라 할 게 없죠."] },
      { q: "우편물은 누가 가져가요?", a: ["한 달에 한 번 검은 차가 와요. 운전하는 분이 내려서 가져가요.", "그 사람 명함을 저한테 줬는데… 어디 뒀더라. 여기 있네. 해성개발 회장실 수행기사더라고요."], gives: ["driver", { n: "관리인의 말·수행기사 명함", d: "한결에셋 우편물을 해성개발 회장실 수행기사 배창식이 수거해 감." }] },
      { q: "대표라는 사람은 보셨어요?", a: ["남기철 씨요? 작년에 계약할 때 한 번 왔어요. 그때 뭐랬더라, 회장님 처남이라고 자랑하던데요. 앞으로 잘 부탁한다고 귤도 한 상자 주고 갔어요."], gives: ["bro", { n: "한결에셋 대표의 신분", d: "대표이사 남기철은 구본태 회장의 처남. 임대차 계약 때 관리인에게 직접 말함." }] }] },
    acct: { n: "해성개발 회계 서류", s: "법원을 통해 받은 자료", fn: null, bg: "m2-registry", intro: "법원의 문서송부촉탁으로 받은 회계 서류가 상자 세 개로 도착했다.", items: [
      { q: "논현동 빌딩 대금을 찾아본다", a: ["3월 2일 계약이라면서 72억은 4월 18일에야 들어왔다. 붕괴 일주일 뒤다.", "게다가 같은 날 그 돈이 구은정이라는 사람 계좌로 나갔다. 구은정은 회장의 딸이다.", "그다음은 해성개발 장부만으로는 알 수 없다. 받은 쪽 계좌를 봐야 한다."], gives: ["pay", { n: "해성개발 장부의 72억", d: "3월 계약이라면서 입금은 4월 18일. 같은 날 회장 딸 구은정에게 전액 출금." }] },
      { q: "용역비 항목을 살핀다", a: ["도원컨설팅이라는 회사로 5년간 86억이 나갔다. 품목은 '사업 자문'.", "보고서는 몇 장 없다. 표지를 빼면 인터넷에서 긁어 온 듯한 개발 동향이 전부다. 무엇을 자문했는지 알 수 없다."], gives: ["dowon", { n: "도원컨설팅 용역비 86억", d: "5년간 '사업 자문' 명목 지급. 결과물 거의 없음." }] },
      { q: "함께 묶인 영수증 묶음을 넘겨 본다", a: ["지반조사 용역 정산서가 섞여 있다. 시추공 24개분. 땅을 뚫어 지질을 조사한 구멍 수대로 돈을 치렀다는 뜻이다.", "돈 추적과는 상관없다. 일단 기록철에 넣어 둔다."], gives: ["bore", { n: "지반조사 정산서", d: "지반조사 용역 대금 정산. 시추공 24개분." }] }] },
    control: { n: "방재실 근무자", s: "분향소 앞 벤치", fn: "전 방재실 직원", face: A + "cut/n50m3.webp", bg: "m2-control", intro: "…그 어머니 변호사님이세요?", items: [
      { q: "그날 방재실에서 무슨 일이 있었습니까?", a: ["오후 2시 40분쯤 지하에서 쿵 하는 소리가 나고 벽에 금이 갔다는 신고가 몇 건 들어왔어요.", "바로 윗선에 전화했습니다. 대피 방송을 해야 한다고요. 영업 중단하면 안 된다고 하더군요. 개장 19일째에 손님을 내보내면 입점 업체 위약금이 어떻고, 하면서요.", "그러더니 방송 문구를 불러 주더라고요. 받아 적으라고."] },
      { q: "방송 내용이 남아 있습니까?", a: ["일지는 제가 사진 찍어 뒀어요. 언젠가 누가 물어볼 줄 알고요.", "'설비 점검 중이니 고객님들은 안심하고 쇼핑을 계속하시기 바랍니다.' 2시 44분, 2시 58분. 두 번요."], gives: ["log", { n: "방송 일지 사진", d: "2시 44분과 2시 58분에 '안심하고 쇼핑을 계속' 방송. 붕괴는 3시 12분." }] },
      { q: "왜 지금까지 말씀을 안 하셨어요?", a: ["…제가 마이크를 잡았으니까요."] }] },
    bank: { round: 1, n: "금융거래 제출명령 회신", s: "구은정·한결에셋 계좌", fn: null, bg: "m2-registry", intro: "재판부가 신청을 받아 주었다. 은행 두 곳의 회신이 봉투째 도착했다.", items: [
      { q: "구은정 계좌를 읽는다", a: ["4월 18일 오후 해성개발에서 72억 입금. 적요는 '대여금 상환'.", "4월 19일 오전, 71억 8천만 원이 한결에셋 계좌로 나갔다. 2천만 원만 남기고 하루 만에 돌려보냈다.", "돈은 해성개발에서 구은정을 거쳐 한결에셋으로 돌아왔다. 한 바퀴 돌았을 뿐이다."], gives: ["flow", { n: "72억 계좌 흐름", d: "한결에셋→해성개발→구은정→한결에셋으로 하루 만에 순환. 2천만 원을 뺀 전액이 되돌아옴. 실제 대금 지급 없음." }] },
      { q: "한결에셋 계좌를 읽는다", a: ["4월 18일 아침에 들어온 72억은 대부업체에서 하루 쓰기로 빌린 돈이다. 돌아온 다음 날 바로 갚았다.", "한결에셋이 자기 돈으로 낸 것은 이자뿐이다. 설립 자본금 5천만 원의 입금자도 구은정이다."] }] },
    appr: { round: 1, n: "감정평가사 사무소", s: "피고가 낸 평가서 작성자", fn: "감정평가사", face: A + "cut/n40f3.webp", bg: "m2-registry", intro: "논현동 빌딩이요? 어느 분 의뢰로 오신 건데요. 저희가 함부로 말씀드릴 수는 없어서요.", items: [
      { q: "평가서를 함께 보자고 청한다", a: ["…"], needs: "sun", lock: "소송 관련이시면 서류부터 보여 주세요.", okLine: "위임장이 있으시네요. 소송 자료로 낸 평가서라면 확인은 해 드릴게요. 3월 1일 날짜로 나간 거 맞습니다." },
      { q: "건물 사진에 나무가 보이네요. 이게 언제 찍은 겁니까?", after: "sun", a: ["사진이요? 어, 정문 앞 벚나무가… 꽃이 피어 있네요.", "3월 1일이면 꽃이 필 때가 아니긴 한데요. …잠시만요."] },
      { q: "현장조사 기록부를 보여 주실 수 있습니까?", after: "sun", a: ["내부 기록이긴 한데… 이 일로 나중에 제 자격이 걸리면 곤란해서요. 사실대로 말씀드릴게요.", "현장에 간 날은 4월 13일이에요. 해성개발 회장실에서 전화가 왔어요. 급하니까 평가일은 3월 1일로 해 달라고.", "그땐 타워 사고 수습 때문에 회계 정리하나 보다 했죠. 저도 잘한 건 없습니다."], gives: ["appr", { n: "감정평가 현장조사 기록", d: "3월 1일자 평가서의 현장조사일은 사고 이틀 뒤인 4월 13일. 해성개발 회장실이 날짜를 지정." }] }] },
    chauffeur: { round: 1, n: "회장실 수행기사", s: "명함의 번호로 찾아가기", fn: "배창식", face: A + "cut/n60m2.webp", bg: "diner", intro: "제 명함을 어디서 얻으셨어요. 회장님 일로 오신 거면 저는 할 말 없습니다.", items: [
      { q: "한결에셋 우편물 이야기를 꺼낸다", a: ["…"], needs: "driver", lock: "모르는 분한테 드릴 말씀 없어요. 어디서 제 얘기를 들으셨는지도 모르겠고.", okLine: "관리인 아주머니가 그걸 아직 갖고 계셨군요. …회장님 구속되고 넉 달 치 월급을 못 받았어요. 14년을 모셨는데 퇴직금 얘기도 없습니다. 앉으시죠." },
      { q: "우편물을 왜 가져가셨습니까?", after: "driver", a: ["회장님 지시죠. 그 회사 앞으로 오는 건 전부 회장실로 가져왔습니다.", "한결에셋이 뭐 하는 데냐고요? 저도 몰라요. 남기철 사장님이 거기 일을 한다는 걸 본 적이 없어요."] },
      { q: "사고 직후 며칠 동안 어디를 다니셨습니까?", after: "driver", a: ["그게 말이죠. 사고 다음 날, 4월 12일 밤 11시에 남기철 사장님을 댁에서 모셔다 회장님 자택에 내려 드렸어요. 두 시간쯤 계시다가 서류 봉투를 들고 나오셨습니다.", "차 안에서 사장님 손이 떨리더라고요. '3월로 해야 한대' 하고 전화기에 대고 그러시는 걸 들었습니다.", "운행일지요? 회사 차는 일지를 써야 해서요. 복사본이 제 차에 있습니다. 필요하시면 법정에도 가겠습니다."], gives: ["drive", { n: "회장 차량 운행일지", d: "붕괴 다음 날인 4월 12일 밤 남기철을 회장 자택으로 수행. 기사 배창식이 증언 의사를 밝힘." }] }] },
    logbook: { round: 1, n: "방재실 근무자 재방문", s: "개장 전 균열 대장", fn: "전 방재실 직원", face: A + "cut/n50m3.webp", bg: "m2-control", intro: "또 오셨네요. 어머니는 좀 어떠세요.", items: [
      { q: "개장 전에도 이상 신고가 있었습니까?", a: ["있었죠. 2월 말에 지하 2층 주차장 벽에 금이 갔어요. 사람 손바닥이 들어갈 만큼요.", "시공사가 와서 메우고 페인트를 칠했습니다. 3월 초에 또 났고요."] },
      { q: "그 기록이 남아 있습니까?", a: ["균열 대장을 저희가 썼어요. 2월 27일 칸에 회장실 보고 완료, '개장 일정 변경 없음'이라고 적혀 있습니다. 제가 찍어 둔 게 이겁니다.", "그때 멈췄으면, 하는 생각은 매일 합니다."], gives: ["crack", { n: "균열 대장 사진", d: "2034년 2월 27일 지하 2층 균열을 회장실에 보고. '개장 일정 변경 없음'. 계약일로 주장하는 3월 2일보다 앞선 기록." }] }] },

        intro: ["변호사님이세요? 우리 수아가 신세 지네요.", [null, "투석 바늘을 꽂은 팔로 몸을 일으키려 해서 말렸다."]],
        topics: [
          { id: "mom1", q: "따님은 어떤 분이세요?", a: ["착해요. 너무 착해서 탈이지. 회사 그만두고 나서는 학원 다니면서 저 병원까지 데리고 다니고.", "어릴 때는 아빠를 그렇게 따랐어요. 현장에 따라간다고 떼를 써서, 헬멧 쓰고 사진도 찍고 그랬지."] },
          { id: "dad", q: "아버님은 어떤 분이셨어요?", req: ["t:mom1"], a: ["그 양반은 인천에서 작은 건설회사 했어요. 사람 좋다는 소리만 듣고 돈은 못 벌었지.", "관급공사 하나 따 보겠다고 누가 소개해 준 데를 찾아갔어요. 서울에 무슨 컨설팅이라고. 전직 검사장이 하는 데라 말 한마디면 된다고 그랬대요.", "착수금으로 2억, 나중에 '인사할 데가 있다'고 현금 1억. 은행 돈을 빌려서 갖다줬어요. 공사는 딴 회사가 가져갔고요.", "그해 겨울에 부도가 났어요. 그 양반 현장 컨테이너에서 쓰러져서… 그 길로 못 일어났어요.", "수아가 그 회사에 들어간다고 했을 때 내가 얼마나 말렸는지 몰라요. 아빠 죽인 데를 왜 들어가냐고. 그 애가 그러더라고. 엄마, 거기 가야 알 수 있어. 그 돈이 어디로 갔는지.", [null, "도원컨설팅. 천막 기둥의 신문 기사에서 본 이름이 여기서 다시 나왔다."]] },
          { id: "suits", q: "요즘 따님 회사 일로 찾아온 사람은 없었어요?", req: ["t:dad"], a: ["…있었어요. 작년 가을에, 타워 무너지고 나서. 양복 입은 남자 둘이 여기 병원까지 왔었어요.", "수아가 회사에서 갖고 나간 거 어디 있냐고. 책인지 공책인지. 내가 모른다니까 웃으면서 어머님 몸조리 잘하시라고 하고 가더라고요.", "그날 밤에 수아한테 전화했더니, 엄마 그거 내가 태웠어, 이제 아무도 안 와, 그러더라고요. 근데 변호사님, 그 뒤로도 한 번 더 왔어요."] },
          { q: "투석은 오래 받으셨어요?", a: ["삼 년 됐어요. 일주일에 세 번. 수요일만 수아가 오고 나머지는 혼자 와요.", "수아가 재판받는 거 나는 다 알아요. 걔는 내가 모르는 줄 알지. 변호사님, 우리 애 잘 좀 부탁해요."] }] }] },
    forensic: { n: "디지털 감정 업체", s: "휴대폰 감정 의뢰", round: 1,
      people: [{ id: "lab", n: "감정인", face: A + "cut/n40m1.webp",
        intro: ["기기를 맡기시면 메시지 원본과 저장 시각까지 살펴봅니다. 며칠이면 됩니다."],
        topics: [
          { id: "fxok", q: "이 휴대폰 메시지가 진짜인지 감정해 주세요.", needs: "phone", lock: ["기기가 있어야 감정을 하지요. 사진 찍어 오신 걸로는 안 됩니다."],
            okLine: ["결과 나왔습니다. 메시지 저장 시각은 2031년 1월 16일 오전 9시 12분과 9시 40분입니다.", "그 뒤로 수정되거나 끼워 넣은 흔적은 없습니다. 기기 안의 데이터 구조가 그대로예요."],
            gives: ["fx", { n: "휴대폰 감정서", d: "메시지 저장 시각 2031. 1. 16. 오전 9:12, 9:40. 수정이나 삽입 흔적 없음.", img: "ev/f2-fx.webp" }] },
          { q: "법정에서 위조라고 몰아붙이면 어떻게 답하면 될까요?", req: ["t:fxok"], a: ["나중에 메시지를 지어내 넣으면 저장 순번이 앞뒤 기록과 어긋납니다. 이 휴대폰은 앞뒤로 미용실 예약, 학원 문자가 순서대로 붙어 있어요.", "감정서에 그 표를 붙여 드리겠습니다. 법정에서 물으면 그 표를 보여 주시면 됩니다."] }] }] },
    gear: { n: "공소청 총무과", s: "업무용 휴대폰 지급 대장", round: 1, bg: "rec",
      people: [{ id: "gear", n: "총무과 직원", face: A + "cut/n30f3.webp",
        intro: ["수사관 업무폰 대장이요? 아무나 보실 수 있는 게 아닌데요."],
        topics: [
          { q: "수사과에 여럿이 같이 쓰는 공용 회선이 있었나요?", a: ["공용은 민원 받는 대표 번호 하나예요. 그건 대장 맨 앞에 따로 적혀 있어요.", "개인 지급 번호를 돌려 쓰면 징계 사유예요. 감사 때 제일 먼저 보는 게 그거거든요."] },
          { q: "재판부 사실조회 결정이 있습니다. 2031년 1월 이 번호를 누가 썼는지 확인해 주세요.", needs: "sun", lock: ["변호인이라는 걸 먼저 확인해야 드릴 수 있어요."],
            okLine: ["확인했습니다. 그 번호는 2029년 3월부터 2032년 2월까지 권태훈 수사관 한 사람 앞으로 지급돼 있네요.", "반납 서명도 본인 거예요. 이건 공용 번호가 아니에요."],
            gives: ["line", { n: "업무용 휴대폰 지급 대장", d: "해당 번호는 2029. 3.부터 2032. 2.까지 권태훈 1인에게 지급. 공용 회선이 아니다.", img: "ev/f2-line.webp" }] }] }] },
    kang: { n: "강도윤 교수의 방", s: "법무법인 목멱", round: 1, bg: "m4-kang-office",
      people: [{ id: "kang", n: "강도윤 교수", face: A + "story/face-kang.webp",
        intro: ["얼굴 보고 오라고 했더니 정말 왔구나. 앉아라. 커피는 네가 타라."],
        topics: [
          { id: "kang1", q: "전 의뢰인의 비밀 때문에 막혔어요.", a: ["네가 아는 걸 말하면 빠르겠지. 그래서 힘든 거다. 말하면 안 되는 걸 아는 사람은 제일 빠른 길을 앞에 두고 돌아가야 하니까.", "변호사는 의뢰인의 비밀을 무덤까지 가져가는 사람이다. 지금 의뢰인이 아무리 딱해도 그건 안 바뀐다. 네 입이 한 번 열리면, 앞으로 네 방에 오는 사람은 아무도 너한테 진실을 말하지 않아.", "돌아가거라. 돌아가는 길이 있을 거다."] },
          { id: "kang2", q: "검사가 제 옛 변론을 그대로 들고 나왔어요.", req: ["t:kang1"], a: ["'내용물을 특정할 수 없다'? 잘 썼구나. 그 말이 왜 이제 와서 아프냐?", "그 사건에서 다툰 건 없어진 물건이 뭔지, 누가 가져갔는지였다. 지금 사건에서 다투는 건 보낸 사람이 왜 보냈느냐다. 같은 상자라도 묻는 게 달라.", "상자가 어디로 갔는지 증명하려 들지 마라. 보낸 사람 손을 떠날 때 그 사람이 무슨 마음이었는지를 증명해라."] },
          { q: "보낸 사람의 마음은 어떻게 증명해요?", req: ["t:kang2"], a: ["택배를 잃어버리면 회사가 물어 주잖니. 물어 줄 때 서류를 안 쓰겠냐. 받는 사람, 무게, 크기가 거기 있을 거다.", "송장은 없어져도 돈 나간 기록은 오래 간다. 택배사 배상 담당을 찾아가 봐라."], opens: ["parcel"] },
          { q: "은닉이라는 게 정확히 어디까지예요?", req: ["t:kang2"], a: ["옛날 모의법정 때 쓰던 강의안이 있다. 책장 어디… 여기 있구나. 비매품이야. 복사하지 말고 너만 봐라. 복사하면 내가 안다.", "증거를 숨겼다고 하려면 찾기 어렵게 만들 뜻이 있어야 한다. 수사기관에 보낸 사람한테 그런 뜻이 있겠냐. 받아 적지 말고 머리에 넣어 가라.", [null, "강의안 귀퉁이에 판례 하나가 인쇄되어 있다. '대법원 2011. 2. 30. 선고.' 교수님 강의안에서 판례 날짜까지 따져 볼 일은 없었다. 그대로 가방에 넣었다."], "도원 사건이라니, 몸조심하고. 내 제자가 다치는 건 못 본다."],
            gives: ["lect", { n: "강도윤 교수의 강의안", d: "비매품 강의안. \"은닉은 발견을 어렵게 하려는 뜻이 있어야 한다. 수사기관에 넘기려는 행위와는 함께 설 수 없다.\" 귀퉁이에 '대법원 2011. 2. 30. 선고' 인용.", img: "ev/f2-lect.webp" }] },
          { q: "의뢰인이 제게 처음부터 거짓말을 했어요.", req: ["t:kang1"], a: ["의뢰인은 다 거짓말을 한다. 변호사가 무서워서, 세상이 무서워서. 거짓말을 안 하는 의뢰인이 오면 그게 더 걱정이다.", "중요한 건 왜 했느냐다. 그 이유를 알면 그 사람이 어디까지 너를 믿는지도 보여."] }] }] },
    parcel: { n: "택배사 배상팀", s: "분실 배상 서류 창고", round: 1, gated: true, bg: "dock",
      people: [{ id: "claim", n: "배상팀 직원", face: A + "cut/n40f2.webp",

        topics: [
          { q: "보내는 사람 이수아 씨의 위임장입니다. 2031년 1월 분실 배상 서류를 찾고 싶어요.", a: ["여기 있네요. 2031년 1월 16일 접수, 보내는 사람 이수아. 받는 사람은 '공소청 수사과 권태훈 앞'으로 돼 있고요.", "무게는 1.3킬로, 크기는 가로세로 30에 25, 높이 8센티. 내용물란엔 '사무 서류'. 저희가 배상한 금액은 규정대로 5만 원이네요.", "이거 사본 드릴게요. 받는 사람 칸이 공소청이라 그때 저희도 기억해요. 이런 건 흔치 않거든요."],
            gives: ["waybill", { n: "택배 분실 배상 서류", d: "2031. 1. 16. 접수. 받는 사람 '공소청 수사과 권태훈 앞'. 1.3kg, 30×25×8cm, 내용물 '사무 서류'.", img: "ev/f2-waybill.webp" }] },
          { q: "분실된 물건을 나중에 찾는 경우도 있나요?", a: ["가끔요. 몇 달 뒤에 엉뚱한 지점 창고에서 나오기도 하고요. 그래도 이건 안 나왔어요. 나왔으면 여기 빨간 줄이 그어져 있었을 거예요.", [null, "어디로 갔는지는 아무도 모른다. 이 서류에 남은 것은 누가 어디로 보냈는지뿐이다. 지금은 그거면 된다."]] }] }] },
    term: { n: "옛 터미널", s: "방재호를 찾아서", round: 1, bg: "dock",
      people: [{ id: "mate", n: "동료 기사", face: A + "cut/n50m2.webp",
        intro: ["어, 그때 그 변호사님이시네. 방 형님이요? 왜요, 또 무슨 일 났어요?"],
        topics: [
          { q: "방재호 씨 연락처를 아세요?", a: ["그 일 있고 다음 해에 그만두셨어요. 번호도 바뀌었고요. 어디 지방 내려갔다는 말만 들었지 저도 몰라요.", "찾으시면 안부나 전해 주세요. 형님 떠날 때 술값 내가 냈다고."] },
          { q: "여전히 방재호 씨를 형님이라고 부르시네요.", a: ["형님은 형님이죠. 아, 또 그 얘기 하시려고요? 내가 더 늙어 보인다는 거?", "다들 그래요. 나이는 내가 두 살 어린데. 이 일이 사람을 이렇게 만들어요. 변호사님도 서초동 가시더니 얼굴이 좀 상하셨네."] },
          { q: "휴게실은 어떻게 됐어요?", a: ["리모델링해서 싹 바뀌었어요. 탁자도 새로 들이고 냄비도 새로 샀어요. 옛날 물건은 다 내다 버렸고요.", "에어컨도 달았어요. 형님이 그렇게 노래를 부르던 거. 형님은 정작 못 써 보고 가셨네."] }] }] } },
  lies: [["장부를 태웠다는 말", 2], ["수사기관과 연락한 적 없다는 말", 4], ["구속된 대표의 말을 접견 가서 받아 적었다는 말", 0], ["최동규 상무가 회사를 맡았다는 말", 3], ["아버지 일로 도원에 들어갔다는 말", 8]],

  blind: [["윤서연", "알겠어요. 이수아 씨 말씀대로 정리해 볼게요. 태운 건 태운 거고, 왜 그랬는지를 설명해야죠."], ["이수아", "…믿어 주시는 거예요?"], ["윤서연", "제가 맡은 분 말인데요. 믿고 시작해야죠."], ["이수아", "고맙습니다. 정말이에요."], "이수아는 잠깐 눈을 내리깔았다가 고개를 숙였다. 경위서 한 장이면 충분하다고, 나는 생각했다."],
  press: { open: [["h", "이수아 씨, 정말 태우셨어요?"], ["c", "말씀드렸잖아요. 집 앞 드럼통에서요."]],

      { card: "phone", show: G => [["h", "서랍에서 나온 휴대폰이요. 2031년 1월 16일, 권 수사관이라는 분께 택배로 서류를 보낸다는 메시지가 있어요."], ["c", "……"], ["h", "태운 게 아니죠. 보내셨죠. 제가 맡았던 그 택배로요."],

    bore: { n: "지반조사 정산서", d: "지난 사건 기록철에 남아 있던 회계 서류. 시추공 24개분의 대금을 치른 기록." } },
  start: ["cityfile", "assoc"],
  places: {
    cityfile: { n: "건축 심의 자료", s: "법원 문서제출명령으로 받음", fn: null, bg: "m3-archive", intro: "소를 내자마자 문서제출명령을 신청했다. 법원이 상대에게 '그 문서를 내놓으라'고 명령하는 절차다. 시청 문서고가 열렸다.", items: [
      { q: "심의 자료를 신청한다", a: ["…"], needs: "sun", lock: "소송 당사자의 대리인이라는 서류가 필요합니다.", okLine: "위임장 확인했습니다. 저 책상에서 보세요. 복사는 신청서를 쓰시면 해 드립니다." },
      { q: "지반조사 결과를 읽는다", after: "sun", a: ["건축위원회에 올라간 지반조사 결과다. 시추공 9개. 땅에 구멍을 뚫어 깊이별로 흙을 확인한 기록이다.", "9개 모두 적합 판정. 번호는 BH-1, 2, 4, 7, 8, 11, 12, 15, 18. 왜 번호가 건너뛰는지는 어디에도 설명이 없다.", "9개? 어디서 숫자를 본 것 같다. 해성개발 회계 서류에 24개분을 정산한 영수증이 있었다."], gives: ["nine", { n: "심의 제출 지반조사", d: "건축위원회에 제출된 시추공 9개. 모두 적합. 번호는 1부터 18까지 띄엄띄엄." }] },
      { q: "결재란을 본다", after: "sun", a: ["결재자: 건축과장 오명환. 결재일 2030년 11월 8일.", "2030년 11월. 내가 그 사람을 무죄로 받아 낸 판결이 그해 7월이었다. 넉 달 뒤다.", "기록철에서 탄원서 사본을 꺼냈다. 똑같은 반듯한 글씨, 똑같은 서명.", "그 사람이 나한테 한 말은 법정에서 한 글자도 쓸 수 없다. 서류로만 싸워야 한다."], gives: ["sign", { n: "결재란·탄원서 서명", d: "심의 자료 결재자 오명환. 2030년 11월 8일 결재. 지난 사건 탄원서의 서명과 일치." }] },
      { q: "설계변경 승인 서류를 본다", after: "sun", a: ["지하층 흙막이 설계변경 승인일 2032년 5월 3일. 땅을 파면서 옆의 흙이 무너지지 않게 막는 벽을 바꾼 내용이다.", "서류만 보면 이상한 건 없다. 그 공사가 실제로 언제 있었는지 알아야 비교가 된다."] },
      { q: "심의 회의록을 찾는다", after: "sun", a: ["목록에는 있는데 철이 비어 있다. '위원 보호를 위해 비공개.'", "비공개라면 위원 본인에게 묻는 수밖에 없다. 위원 명단은 아직 못 받았다."] },
      { q: "첨부된 법률검토의견서를 읽는다", after: "sun", a: ["법무법인 정헌. '일부 지점의 조사 결과만으로도 심의 자료로 족하다.'", "인용 판례가 또 있다. '대법원 2011. 2. 30. 선고 2010다77417 판결.' 2월 30일. …청람 의견서랑 똑같이 틀렸네."], gives: ["opin2", { n: "정헌 법률검토의견서", d: "시추공 일부 제출을 적법하다고 포장. 대법원 2011. 2. 30. 판결 인용." }] }] },
    site: { n: "매립지 시추 현장", s: "지반 전문가 동행", fn: "지반공학 교수", face: A + "cut/n60f2.webp", bg: "m3-site", intro: "여긴 바다를 메운 땅이에요. 지하철까지 지나가고요. 한 변호사님이 어머님들 일 맡으셨다면서요.", items: [
      { q: "이 땅은 뭐가 문제입니까?", a: ["바다 쪽으로 갈수록 뻘이 두껍습니다. 육지 쪽은 18미터쯤 파면 단단한 층이 나오는데, 바다 쪽은 41미터를 파도 안 나와요.", "건물은 말뚝을 단단한 층까지 박아서 세웁니다. 그 층이 멀면 말뚝이 뻘에 떠 있는 셈이에요."] },
      { q: "시추공 24개와 9개는 어떻게 다릅니까?", a: ["땅은 한 필지 안에서도 다 달라요. 그래서 여러 군데를 뚫어 보는 겁니다.", "원본 조사표 없인 단정 못 해요. 그런데 단단한 지점만 골랐다면 9개로도 전부 합격이 나옵니다. 시험을 스물네 과목 보고 잘 본 아홉 과목 성적표만 낸 거죠."] },
      { q: "빠진 곳이 어디인지 알 방법이 있나요?", a: ["번호요. 시추공엔 뚫는 순서대로 번호가 붙습니다. 9개 번호가 띄엄띄엄이면 빠진 게 있는 거죠.", "당시 배치도를 복원해 봤어요. 이것 보세요. 제출된 9개는 전부 육지 쪽 줄이고, 빠진 번호 15개가 전부 바다 쪽이에요."], gives: ["map", { n: "시추공 번호 대조", d: "제출 9개와 정산서 24개의 번호 대조. 빠진 15개는 전부 연약한 바다 쪽." }] },
      { q: "그런 땅이면 처음부터 49층은 무리였습니까?", a: ["제가 법적으로 답할 일은 아닌데요. 공학자로서 말씀드리면, 바다 쪽 자료를 봤으면 저는 도장 못 찍습니다."] }] },
    assoc: { n: "유족회 사무실", s: "분향소 뒤 천막", fn: "유족회 총무", face: A + "cut/n50f3.webp", bg: "m2-altar", intro: "아이고, 변호사님. 회장님 전화 받았어요. 뭐든 보세요. 저희는 숨길 게 없어요.", items: [
      { q: "회비 장부를 보여 주십시오", a: ["여기요. 형편대로 낸 거라 금액이 들쭉날쭉해요. 10만 원 낸 집도 있고요.", "이 큰 금액이요? 2,800만 원. 입금자가 김다은으로 돼 있네요. 김다은 씨면… 돌아가신 분인데요.", "회장님이 알아서 처리한다고 하셔서 저는 그대로 적어만 뒀어요. 어디서 난 돈인지는 저도 잘 몰라요."], gives: ["fund", { n: "유족회 회비 장부", d: "2,800만 원이 사망자 '김다은' 명의로 입금. 총무도 출처를 모름. 조경숙의 '회비로만 모았다'는 말과 맞는지 확인이 필요하다." }] },
      { q: "시청에서 합의하자고 온 적이 있습니까?", a: ["몇 번 왔죠. 여기 의향서 복사본이 있네요. 맨 아래 회장님 서명이 있고요.", "왜 있는지는 저도 몰라요. 회장님은 안 한다고 하셨는데."] },
      { q: "유족회 분위기는 어떻습니까?", a: ["작년엔 쉰 집이 넘었어요. 이제 서른한 집이에요. 합의한 분들 욕 못 해요. 애 학원비가 없는데 어쩌겠어요.", "회장님은 천막에서 주무실 때가 많아요. 집에 가면 다은이 방이 그대로라서요."] }] },
    jung: { n: "정한별 찾아가기", s: "시청 지하 기록실", fn: "정한별", face: A + "story/face-jung-40.webp", bg: "m3-sideline", intro: "……그때 그 변호사죠. 명함 안 주셔도 됩니다. 얼굴 압니다.", items: [
      { q: "증언을 부탁드리러 왔습니다", a: ["5년 전에 법정에서 제가 술에 취해 헛것을 봤다고 하셨잖아요. 그 판결문 때문에 저 여기 있습니다.", "판결 나고 다음 달부터 일을 안 주더군요. 문서 편철이나 하라고. 이번에는 또 뭐라고 하실 건데요?"] },
      { q: "(그날 제가 틀렸다고 말하고 싶지만 말할 수 없다) 고발은 어떻게 된 겁니까?", a: ["심의 자료를 묶다가 번호가 이상해서 위에 보고했습니다. 넘어가라고 하길래 고발했죠. 2030년 12월이요.", "석 달도 안 돼서 불기소요. 그다음엔 내부 문서를 들고 나갔다고 감사받고, 지하로 왔습니다."] },
      { q: "여기서는 무슨 일을 하십니까?", a: ["습기 먹은 서류 말립니다. 제습기 물통 비우고요.", "그 일을 5년 했어요. 타워가 무너진 날도 여기 있었습니다. 뉴스를 위층 사람들이 먼저 보고 저한테는 아무도 말을 안 해 줬어요. 퇴근길에 알았습니다."] },
      { q: "유족분들이 증언을 기다리고 있습니다", a: ["…알아요. 편지도 제가 썼으니까.", "분향소에 몇 번 갔어요. 천막 앞까지 갔다가 돌아왔습니다. 제가 그때 더 세게 했으면, 그 생각을 하면 들어갈 수가 없더라고요.", "나갈게요. 다만 변호사님을 믿어서 나가는 건 아닙니다."], gives: ["jungok", { n: "정한별의 증언 동의", d: "심의 자료의 이상을 처음 발견한 내부 증인." }] }] },
    survey: { n: "대양지질 전 현장 기사", s: "폐업한 지반조사 회사", fn: "전 시추 기사", face: A + "cut/n50m4.webp", bg: "m3-site", round: 1, intro: "대양지질이요? 망한 지 3년 됐어요. 저는 지금 우물 파러 다닙니다.", items: [
      { q: "해성개발 현장에서 시추공을 몇 개 뚫었습니까?", a: ["그걸 제가 어떻게 기억해요. 벌써 몇 년 전 일인데. 뭐 증거라도 있어요?"] },
      { q: "정산서를 보여 준다", a: ["…"], needs: "bore", lock: "뭘 근거로 저희 회사라는 건지. 저희가 판 게 맞다는 서류라도 있으면 몰라도요.", okLine: "어, 이거 우리 회사 정산서네. 24공 맞아요. 그 현장 기억납니다. 바다 쪽 파다가 장비가 빠져서 고생했거든요." },
      { q: "원본 조사표가 남아 있습니까?", after: "bore", a: ["회사 서버는 폐업하면서 없어졌어요. 그런데 현장 기사는 원래 야장을 씁니다. 그날 뚫은 깊이, 흙 상태를 손으로 적는 공책이요.", "제가 잘 안 버리는 성격이라. 잠깐만요. 트럭에 박스째 있어요.", "여기요. BH-1부터 BH-24까지 다 있어요. 바다 쪽 번호는 땅 단단한 정도를 재는 숫자, N값이 2니 3이니 그래요. 물렁하다는 뜻입니다. 육지 쪽은 30이 넘고요."], gives: ["orig", { n: "시추 원본 야장", d: "BH-1~24 전부의 현장 기록. 바다 쪽 15공은 N값 2~4, 단단한 층이 41m까지 없음. 육지 쪽 9공은 N값 30 이상." }] },
      { q: "9개짜리 자료는 누가 만들었습니까?", a: ["저희가 납품한 보고서엔 24공이 다 들어갔어요. 9개만 뽑은 건 저희가 만든 게 아닙니다.", "해성개발 과장이 '시청에 낼 건 저희가 따로 정리합니다' 하고 가져갔어요. 돈은 24개분으로 다 줬고요. 그건 깔끔했어요."] }] },
    office: { n: "2030년 사건 기록철", s: "사무실 캐비닛", fn: null, round: 1, intro: "캐비닛 맨 아래 칸. 2030고단1187. 라벨 글씨가 내 글씨인데 낯설다.", items: [
      { q: "판결문 전문을 다시 읽는다", a: ["'증인은 야간에 음주한 상태로, 가로등이 고장 난 골목에서 약 28미터 떨어진 곳에서 사고를 보았다.'", "'위와 같은 목격 조건에 비추어 증인 정한별의 진술은 믿기 어렵다.'", "판결이 믿기 어렵다고 한 건 그날 밤 그 골목의 눈이다. 사람됨이나 다른 일까지 판단한 문장은 없다.", "이 문장을 끌어낸 건 나다. 이제 이 문장의 범위를 내가 다시 재고 있다."], gives: ["ruling", { n: "2030고단1187 판결 이유", d: "'야간, 음주, 고장 난 가로등, 약 28미터'라는 목격 조건 때문에 믿기 어렵다고 판단. 증인의 인격이나 서류에 대한 판단은 없음." }] },
      { q: "함께 묶인 수사기록을 넘겨 본다", a: ["정한별의 진술조서. '요즘 과장님은 해안 복합개발 심의 서류를 혼자 붙들고 계셨고.' 그날 법정에서 그 말이 끝까지 나왔던가.", "이 사람은 그때 이미 뭔가 말하려던 것 같다."] },
      { q: "서랍 속 메모를 본다", a: ["그때 썼던 변론 메모. '28m, 가로등, 소주 11병.' 밑줄을 두 번 그었다.", "밑줄이 반듯하다. 나는 그때 일을 참 잘했다."] }] },
    jung2: { n: "정한별 증언 준비", s: "시청 뒤 분식집", fn: "정한별", face: A + "story/face-jung-40.webp", bg: "diner", round: 1, intro: "여기 사람들 잘 안 와요. 시청 사람은 이쪽 분식집은 안 옵니다. 준비하자면서요.", items: [
      { q: "다음 기일에 그 판결문이 나올 겁니다", a: ["알아요. 그쪽에서 안 쓰면 이상하지요.", "저는 그 말 듣는 데 익숙해요. 5년을 들었으니까. 다만 변호사님 입에서 나온 말을 변호사님 앞에서 다시 듣게 되네요."] },
      { q: "2030년에 이상을 발견했다는 기록이 있습니까?", a: ["번호를 보고 검토 메모를 썼어요. 2030년 11월 3일. 번호 9개 옮겨 적고, '공번 15개 사유 확인 요망'이라고요. 공번은 빈 번호라는 뜻입니다.", "내부 전자문서로 올렸어요. 열람 기록이 남아요. 11월 4일 오전 9시 12분에 과장님이 열어 봤습니다. 결재는 그 나흘 뒤고요.", "이거 내시면 저 또 문서 빼돌렸다는 소리 나옵니다. 그건 아세요?"], gives: ["memo", { n: "정한별 검토 메모·열람 기록", d: "2030년 11월 3일 작성. '공번 15개 사유 확인 요망.' 11월 4일 09:12 오명환 과장 열람. 결재는 나흘 뒤." }] },
      { q: "고발 사건 불기소 이유서를 갖고 계십니까?", a: ["통지서 받았죠. 봉투째 있어요. 여기.", "'증거 불충분으로 혐의없음.' 무고니 허위 고발이니 하는 말은 한 줄도 없어요. 그런데 시청 사람들은 다 제가 허위 고발했다고 알아요."], gives: ["nopros", { n: "불기소 이유 통지서", d: "2031년 2월. 증거 불충분. 허위 고발이라는 판단은 없음." }] },
      { q: "왜 시청을 그만두지 않으셨습니까?", a: ["그만두면 그 사람들 말이 맞는 게 되니까요.", "그리고 지금은 정년까지 그냥 있어 보려고요. 기록실에 있으면 문서가 어디 있는지는 제일 잘 아니까."] }] },

    ["구속되신 뒤에도 일을 보셨어요?", ["공소장에 옥중 지시라고 쓴 부분 말씀이군요. 면회 온 사람하고 안부 몇 마디 나눈 걸 그렇게 부릅니다.", "여기서는 말 한마디도 전부 녹음되고 적힙니다. 궁금하시면 접견 기록을 떼어 보세요. 뭐 나오는 게 있나."], ["guard"], ["visit"]],

    ["대표실 벽에 액자가 걸려 있던데요", ["하하, 압수 사진을 보셨나 보군요. 글씨 좋지요. 귀한 분이 주신 겁니다.", "입을 병마개처럼 지키라는 말인데, 이 바닥 사람이면 다 좋아합니다."], [], ["frame"]],

    ["'감자 세 상자'는 무슨 얘기예요?", ["감자요? 이수아 씨 시골 친척이 감자를 부쳐 줬다는 얘기였을 겁니다. 구치소 밥이 워낙 부실하니까요.", [null, "구치소에는 감자를 들여갈 수 없다. 박진서도 그걸 모를 리 없다."]], [], ["rectape"]],

        { q: "불기소 관련 자료를 읽는다", req: ["t:recok"], a: ["2031년 정한별 고발의 불기소 참고자료로 법무법인 한강로의 의견서가 붙어 있다.", "인용 판례. '대법원 2011. 2. 30. 선고 2010다77417 판결.' 또 2월 30일이다. 이번엔 오타라고 넘길 수가 없다.", "그때 이 사건을 맡은 사람은 권태훈 수사관이었다."], gives: ["opin4", { n: "한강로 의견서", d: "정한별 고발의 불기소 참고자료. 있을 수 없는 날짜인 대법원 2011. 2. 30. 판결을 인용했다.", img: "ev/f4-opin4.webp" }], opens: ["kwon"] },

    grudge: { n: "도원컨설팅 전 경리", s: "1회 뒤 · 이수아의 퇴사 경위", round: 1, bg: "f2-consult",

          { q: "이수아 씨는 처음에 어떻게 입사했어요?", req: ["t:quit"], a: ["그게… 회사에서 다들 아는 얘기라 말씀드리는 건데요.", "수아 씨 아버님이 작은 건설회사를 하셨대요. 동하건설이라고. 대표님한테 착수금이랑 뒷돈을 몇 번 냈는데 일은 하나도 안 풀리고, 회사가 넘어갔대요.", "그러고 얼마 안 돼서 돌아가셨고요. 수아 씨가 그 뒤에 우리 회사 경리로 들어온 거예요. 대표님은 그걸 알고도 뽑았대요. 재미있다면서.", [null, "상담실에서 이수아 씨에게 들었던 이야기다. 이번에는 상담실 밖 사람의 입에서 나왔다."]], gives: ["grudge", { n: "이수아 퇴사·부친 사정", d: "부친의 건설사가 박진서에게 돈을 털린 뒤 무너졌고, 이수아는 그 뒤 도원에 입사했다. 대표 구속 후 사실상 해고되고 횡령 고소까지 당했다(무혐의).", img: "ev/f4-grudge.webp" }] },

    ["박진서 변호인이셨던 게 문제 되지는 않겠습니까?", "그래서 조건을 말씀드린 거예요. 오명환 씨가 고소한 이 사건은 박진서 사건하고 당사자가 달라서 맡는 건 괜찮아요. 대신 접견실에서 들은 건 제 입으로 못 꺼내요. 제가 변호사님 변호하면서 똑같은 죄를 지으면 웃기잖아요.", []],
    ["유죄가 나오면 저는 어떻게 됩니까?", "벌금이면 변호사 자격은 남아요. 금고 이상이면 자격이 없어지고요. 무죄가 나와도 변협 징계는 따로 와요. 비밀 지키라는 윤리 규정을 어긴 건 맞으니까요. 어느 쪽이든 멀쩡하게 끝나지는 않아요. 그건 아시죠?", []],
    ["오명환에게 승낙 말씀이시면, 증언 전날 전화를 했습니다.", "몇 시요? 몇 초 통화했어요? 휴대전화에 남아 있겠네요. 그것부터 찾아 주세요. 의뢰인이 허락했으면 죄가 안 되고요, 허락을 못 받았어도 구하려고 애쓴 흔적은 중요해요. 검사는 분명히 '말 한마디 없이 팔아넘겼다'고 나올 테니까요.", ["phone"]],
    ["고소장 문장이 교수님 수업 때 듣던 그대로입니다.", "…저도 읽고 소름 돋았어요. 그런데 느낌으로는 법정에서 아무것도 못 해요. 이 고소를 누가 먼저 꺼냈는지부터 털어 봐야 돼요. 50만 원 받기로 했다는 그 대리기사 있죠. 그 사람 지금도 일해요? 그 사람한테 누가 찾아왔는지 알아보세요.", ["driver"]],
    ["교수님을 한번 찾아뵐까 합니다.", "찾아가서 뭘 하시게요. 고소대리인 사무실 대표잖아요. …말리지는 않을게요. 스승 찾아뵙는 거니까요. 대신 아무것도 약속하지 마시고, 들은 건 저한테 전부 말씀해 주세요.", ["kang"]],
    ["정한별 씨는 제 전화를 안 받습니다.", "당연하죠. 지금은 그냥 두세요. 그분을 언제 어떻게 부를지는 재판이 돌아가는 걸 보고 정해요. 첫 기일엔 일단 오명환 씨부터 상대해야 하니까요.", []]],
  pre: [0, 1, 2],
  cards0: {
    gong: { n: "공소장", d: "피고인은 변호사로서 업무상 알게 된 전 의뢰인 오명환의 비밀을 특검 재판에서 누설하였다." },
    trans: { n: "한서준 증언 요지", d: "'대리기사에게 50만 원을 주고 대신 운전했다고 해 달라고 했습니다. 장부의 정리비 50은 그 돈입니다.'" } },
  start: ["rec"],
  places: {
    rec: { n: "사건 기록 열람", s: "공소청 열람복사실", fn: null, bg: "rec", intro: "늘 변호인 자격으로 오던 창구다. 오늘은 피고인이다. 직원이 서류를 달라는 듯 손을 내민다.", items: [
      { q: "기록 열람을 신청한다", a: ["…"], needs: "sun", lock: "변호인 선임서를 내셔야 열람하실 수 있습니다.", okLine: "선임서 확인했습니다. 변호사님이 피고인이시네요. …저쪽 책상에서 보세요." },
      { q: "고소장을 읽는다", after: "sun", a: ["고소인 오명환, 서해광역시 도시국장. 고소대리인 법무법인 목멱, 담당 변호사 차윤희. 국가배상 소송 때 시 측을 대리했던 그 사무실, 그 변호사다.", "'피고소인은 의뢰인의 가장 내밀한 고백을 세상에 팔았다.' 문장 끝을 '팔았다'로 맺는 버릇. 수업 때 많이 들었다.", "접수일 2036년 3월 19일. 증언 일주일 뒤다."], gives: ["comp", { n: "오명환 고소장", d: "2036년 3월 19일 접수. 고소대리인 법무법인 목멱(차윤희). 국가배상 소송 때 시 측을 대리한 사무실." }] },
      { q: "특검 재판 증인신문 조서를 읽는다", after: "sun", a: ["재판장이 내게 한 말이 그대로 적혀 있다. '증인에게는 업무상 비밀에 관해 증언을 거부할 권리가 있습니다. 다만 특별검사는 형사소송법 제149조 단서의 중대한 공익상 필요를 주장하고 있습니다.'", "형사소송법 제149조. 변호사는 업무상 알게 된 비밀에 관해 증언을 거부할 수 있지만, 본인이 승낙했거나 중대한 공익상 필요가 있으면 그럴 수 없다.", "특별검사가 낸 의견서도 붙어 있다. 이 줄을 내가 증인석에서 들었다는 게 기록으로 남아 있다."], gives: ["order", { n: "특검 재판 증인신문 조서", d: "재판장이 거부권을 고지했고, 특별검사가 제149조 단서(중대한 공익상 필요)를 주장한 뒤에 증언이 이뤄졌음." }] },
      { q: "특검 사건 판결문을 읽는다", after: "sun", a: ["2036고합47. 피고인 박진서 징역 12년. '압수된 장부의 기재는 증인 한서준의 증언 등 외부 사실과 일치해 신빙성이 있다.'", "내 이름 석 자가 판결 이유에 들어가 있다. 저 한 줄이 내 죄이자 내 변명이다."], gives: ["ruling", { n: "특검 사건 판결문", d: "박진서 징역 12년. 판결 이유: 장부의 신빙성은 증인 한서준의 증언 등 외부 사실과 일치함으로써 인정." }] }] },
    phone: { n: "내 휴대전화와 옛 기록철", s: "사무실 책상", fn: null, bg: "m4-frame", intro: "사무실 불을 켜고 혼자 앉았다. 벽의 액자가 이쪽을 보고 있는 것 같다.", items: [
      { q: "증언 전날의 통화 기록을 찾는다", a: ["2036년 3월 11일 오후 9시 14분. 발신, 오명환. 통화 시간 39초.", "그날의 대화를 다시 떠올렸다. '내일 증인석에 섭니다. 그 50만 원 이야기를 해야 할 것 같습니다. 허락을 구하려고 전화드렸습니다.' 그 사람은 끝까지 듣지 않았다.", "39초. 6년을 지켜 준 사이에 39초면 많이 쓴 건지도 모른다."], gives: ["call", { n: "오명환과의 통화 기록", d: "증언 전날인 2036년 3월 11일 오후 9시 14분 발신, 39초 통화. 승낙을 구한 흔적." }] },
      { q: "그 뒤에 보낸 문자를 확인한다", a: ["통화가 끊긴 뒤 문자를 하나 남겼다. '국장님 입장도 압니다. 내일 전에 전화 주십시오.' 읽음 표시만 있고 답은 없었다."] },
      { q: "액자 뒤를 살펴본다", a: ["떼어 낼까 하고 액자를 내렸다가, 뒤판에 작게 쓰인 글씨를 봤다. '개업 축하한다. 입이 무거운 변호사가 되어라. 2030년 3월, 강도윤.'", "다시 걸었다. 왜 다시 거는지는 나도 모르겠다."] }] },
    driver: { n: "대리기사 허동수", s: "터미널 앞 대리기사 대기소", fn: "허동수", face: A + "cut/n40m3.webp", bg: "alley", intro: "어, 변호사님? 그 변호사님 맞죠? 저 그 일로는 말 안 합니다. 말 안 한다고 약속했어요.", items: [
      { q: "6년 전 일을 여쭙겠습니다. 뭘 약속하셨습니까?", a: ["오 과장, 아니 지금은 국장이죠. 그 양반이 그때 사고 난 밤에 저한테 전화를 했어요. 제가 그 시청 앞에서 자주 태워 드렸거든요. 그분 술 드시면 조수석에 앉아서 애들 얘기를 그렇게 하세요. 아들이 공무원 시험을 세 번 떨어졌는데….", "아니, 그게 중요한 게 아니고. 50만 원 줄 테니까 자기 대신 운전했다고 확인서만 써 달라고 하시더라고요. 저는 아이 학원비가 밀려서요. 그래서 쓰긴 썼어요."] },
      { q: "50만 원은 오명환 씨한테 직접 받으셨습니까?", a: ["그게 이상해요. 오 과장한테 받은 게 아니에요. 재판 끝나고 한참 지나서 웬 양복 입은 남자가 봉투를 들고 왔어요. '오 과장님 일 정리하는 겁니다' 그러면서요.", "그 남자가 두고 간 명함이 어디 있더라. 도원컨설팅. 네, 이거요. 저는 그게 그냥 오 과장 비서인 줄 알았죠."], gives: ["fifty", { n: "허동수의 말과 도원컨설팅 명함", d: "약속한 50만 원은 오명환이 아니라 도원컨설팅 사람이 '오 과장 일 정리'라며 전달. 장부의 '정리비 50'과 맞음." }] },
      { q: "요즘 그 일로 찾아온 사람이 있었습니까?", a: ["어떻게 아셨어요. 3월 11일이요, 제 생일이라 기억해요. 낮 두 시쯤 여자 변호사가 대기소까지 왔어요. 차윤희라고 명함을 주더라고요.", "'곧 오 국장님이 고소를 하게 될 겁니다. 특검에서 물어보면 모른다고 하세요.' 그러고 갔어요.", "근데 변호사님, 저 잘못되는 건 아니죠? 저 이제 나이도 있고, 작년에 무릎 수술도 해서…."], gives: ["visit", { n: "차윤희의 방문", d: "증언 전날인 2036년 3월 11일 낮 2시, 목멱 차윤희 변호사가 허동수에게 '곧 오 국장이 고소를 하게 될 것'이라 말함." }] }] },
    kang: { n: "강도윤의 집무실", s: "법무법인 목멱", fn: "강도윤", face: A + "story/face-kang.webp", bg: "m4-kang-office", intro: "서준이 왔구나. 앉아라. 차가 식는다.", items: [
      { q: "고소장, 잘 받았습니다", a: ["내가 쓴 건 아니다. 차 변호사가 썼지. 그래도 문장이 눈에 익지? 내가 가르친 애니까.", "서준아, 네가 미워서 그러는 게 아니다. 내가 가르친 제일 큰 걸 어겼으니, 내가 안 아프겠느냐."] },
      { q: "2학년 때 등록금, 아직 못 갚았습니다", a: ["그걸 아직도 말하느냐. 갚으라고 낸 돈이 아니다.", "그때 네가 학교 그만두겠다고 쓴 휴학계, 아직 내 서랍에 있다. 이상하게 그건 못 버리겠더구나."] },
      { q: "벽의 액자와 현판을 본다", a: ["수구여병. 네 사무실 것과 같은 글씨다. 제자가 개업할 때마다 한 장씩 써 줬지. 네 것이 먼저고 윤서연이 것이 그다음이었구나.", "그 위에 건 현판은 사무실 이름이고. 목멱. 그것도 내 글씨다."] },
      { q: "143명 앞에서도 입을 지켰어야 합니까?", a: ["그걸 정하는 건 변호사가 아니다. 변호사가 자기 마음에 따라 '이 비밀은 말해도 되겠다'고 고르기 시작하면, 어느 의뢰인이 변호사한테 진실을 말하겠느냐.", "네가 지킨 건 정의일지 몰라도, 네가 깬 건 제도다. 시험에 낼 만한 문제지."] },
      { q: "고소를 취소하게 해 주실 수는 없습니까?", a: ["이 죄는 피해자가 고소해야만 재판을 할 수 있는 죄다. 친고죄지. 1심 판결이 나기 전에 오 국장이 고소를 취소하면 그걸로 끝이야.", "오 국장은 내 말을 듣는다. 네가 앞으로 장부 일에 더 입을 열지 않겠다고 약속만 하면 내가 말해 보마.", "대답은 천천히 해라. 차 식는다."], gives: ["offer", { n: "강도윤의 제안", d: "'앞으로 장부 일에 입을 열지 않겠다고 약속하면 오 국장이 고소를 취소하게 하겠다.' 고소인이 강도윤의 말을 듣는다는 뜻." }] }] },
    ledger: { n: "장부 사본과 불기소 기록", s: "특검 사건 확정 기록", round: 1, fn: null, bg: "rec", intro: "특검 사건 판결이 확정되어 장부 사본을 볼 수 있게 됐다. 표지에는 복사로도 지워지지 않는 둥근 자국이 있다.", items: [
      { q: "장부의 '남산' 항목을 읽는다", a: ["'남산 / S 고발 건 / 3,000.' 날짜는 2030년 12월.", "정한별의 고발이 불기소된 건 이듬해 2월이다. 고발이 불기소되기 두 달 전에 3,000만 원이 '남산'이라는 곳으로 갔다."], gives: ["nam", { n: "장부 '남산' 항목", d: "2030년 12월 '남산 / S 고발 건 / 3,000.' 불기소 결정 두 달 전." }] },
      { q: "정한별 고발의 불기소 결정서를 읽는다", a: ["2031년 2월 결정. 담당 수사관 권태훈. 지휘 부장검사 서명. 결정 근거로 법무법인 한강로의 의견서가 붙어 있다.", "수사를 맡았던 사람의 이름을 적어 둔다. 윤서연이 전에 법정에서 만난 적이 있다는 그 수사관이다."], gives: ["nop", { n: "불기소 결정서", d: "2031년 2월. 담당 수사관 권태훈. 불기소 근거로 한강로 의견서 첨부." }] },
      { q: "장부 첫 장을 다시 본다", a: ["'오 과장 정리비 50.' 내가 말한 한 줄이다. 그 아래로 이름과 숫자가 줄줄이 이어진다. 시청, 금융, 공소청.", "맨 처음에 내가 덮어 준 거짓말이 있고, 그 다음에 143명이 있다."] }] },
    special: { n: "특별검사 사무실", s: "특검 사건 담당자에게 확인", round: 1, fn: "특별검사", face: A + "story/face-special.webp", bg: "f4-special", intro: "피고인이 되셨다고 들었습니다. 면목이 없네요. 앉으시죠.", items: [
      { q: "제 증언 말고 장부를 입증할 다른 방법이 있었습니까?", a: ["있었으면 부르지 않았지요. 수사보고서를 보시겠습니까. 허동수 씨는 '기억 안 난다', 오명환 씨는 '모른다'. 도원컨설팅 사람들은 다 입을 닫았고요.", "장부 첫 줄을 외부 사실과 맞출 수 있는 사람은 변호사님 한 분뿐이었습니다. 그렇게 보고서에 썼고, 변호사님도 제출하셔도 됩니다."], gives: ["only", { n: "특검 수사보고서", d: "허동수·오명환 모두 부인. 장부 첫 줄을 외부 사실과 맞출 수단은 한서준의 증언 외에 없었다고 기재." }] },
      { q: "제가 증언한 뒤로 달라진 건 뭡니까?", a: ["장부가 살아났습니다. 판결문 보셨지요. 그 뒤로 전직 부시장, 부장검사 항목까지 차례로 입증이 됐습니다. 한 줄이 문을 연 겁니다."] }] },
    kwon: { n: "권태훈 수사관", s: "공소청 앞 공원", round: 1, fn: "권태훈 수사관", face: A + "story/insp.webp", bg: "f2-investigator", intro: "윤서연 변호사가 보낸 분이군요. …말해야 하는 날이 왔습니까.", items: [
      { q: "2031년 불기소, 누가 지시했습니까?", a: ["부장님이 '남산에서 정리된 건'이라고 했습니다. 그게 다입니다. 저는 불기소 의견을 올렸어요.", "장부가 택배로 온다는 연락을 받았고, 저는 답장을 보냈어요. 그 택배가 오지 않았을 때 저는 차라리 다행이라고 생각했습니다. 평생 부끄러운 일입니다."], gives: ["kwon2", { n: "권태훈의 진술 약속", d: "'남산에서 정리된 건이라는 지시를 받았다. 불기소 의견을 올렸다.'" }] },
      { q: "윤서연 변호사는 그때 왜 더 묻지 않았다고 생각하십니까?", a: ["모르겠습니다. 다만 그때 그분이 한 번만 더 물었으면 저는 무너졌을 거고, 애들 얼굴을 못 봤을 겁니다. 그날 빚을 졌어요.", "목에 걸린 이 신분증, 올해까지만 달고 다닐 생각입니다."] },
      { q: "법정에 나와 주시겠습니까?", a: ["네. 애들한테도 이야기했습니다. 큰애는 고등학생이에요. 듣고 나서 한참 있다가 그러더군요. '엄마, 그럼 그때 왜 말 안 했어?' 대답을 못 했어요.", "이번에는 대답하려고 나가는 겁니다."] }] },
    jung: { n: "정한별 찾아가기", s: "시청 지하 기록실", round: 2, fn: "정한별", face: A + "story/face-jung-40.webp", bg: "m3-sideline", intro: "…이번엔 변호사님이 피고인이시라면서요.", items: [
      { q: "6년 전 일을 사과드리러 왔습니다", a: ["사과요? 그 판결문 때문에 제가 여기 있습니다. 이 층은 습기가 차서 서류에 곰팡이가 피어요. 안경이 늘 뿌옇고요.", "특검 법정에서 들었습니다. 그날 변호사님 처음으로 저를 봤어요. 그 전까지는 저를 본 적이 없으셨죠. 증인이었으니까."] },
      { q: "제가 법정에서 할 말이 있습니다", a: ["뭘요. 판결문이 잘못됐다고요? 그거 변호사님이 받아 낸 판결문이잖아요.", "…됐어요. 말리지는 않겠습니다."] },
      { q: "제 재판에 증인으로 나와 주시겠습니까?", a: ["변호사님을 위해서는 안 나갑니다. 그건 분명히 해 두죠.", "제 증언은 판결문에 다시 쓰이면 됩니다. 그걸 위해서라면 나가죠. 믿기 어렵다는 그 말이 지워지는 걸 봐야겠어요."], gives: ["jungn", { n: "정한별의 말", d: "'제 증언은 판결문에 다시 쓰이면 됩니다.' 증인으로 나오겠다는 동의." }] }] },
    old: { n: "2030년 사건 기록철", s: "사무실 캐비닛", round: 2, fn: null, bg: "m4-frame", intro: "맨 아래 칸에서 2030고단1187이 적힌 기록철을 꺼냈다. 먼지가 날린다.", items: [
      { q: "내가 쓴 변론요지서를 읽는다", a: ["혈액 감정서는 영장 없이 채취했으니 증거가 안 된다. 목격자는 술을 마셨고 가로등이 나가 있었다.", "한 줄 한 줄 다시 읽어 봤다. 내가 쓴 어디에도 '피고인은 운전하지 않았다'는 문장은 없다. 검사가 증명하지 못했다고만 썼다. 비겁한 문장이지만 거짓 문장은 아니다."], gives: ["brief", { n: "2030년 변론요지서", d: "혈액의 증거능력과 목격 진술의 신빙성만 다툼. '피고인은 운전하지 않았다'는 주장은 한 줄도 없음." }] },
      { q: "탄원서 사본을 본다", a: ["오명환의 반듯한 글씨. 은혜 잊지 않겠다는 말. 그 사람은 정말로 잊지 않은 것 같다."] }] },
    cho: { n: "조경숙 어머니", s: "유족회 사무실", round: 2, fn: "조경숙", face: A + "story/face-mother.webp", bg: "m2-altar", intro: "변호사님, 얼굴이 많이 상하셨네요. 밥은 드세요?", items: [
      { q: "제가 재판을 받게 됐습니다", a: ["들었어요. 유족회 분들이 다 들었어요. 우리 다은이가 왜 못 나왔는지 물어봐 준 변호사님인데, 왜 변호사님이 재판을 받아요.", "저희가 이 사람들 앞에서 뭐라도 할 수 있는 게 있어요?"] },
      { q: "제가 나쁜 변호사였다는 걸 아셔야 합니다", a: ["그 음주운전 이야기요. 특검 법정에서 들었어요. 그 사람을 변호사님이 빼 주셨다는 것도요.", "처음엔 며칠 잠을 못 잤어요. 그래도 변호사님이 그 말을 안 했으면 장부가 없었던 거잖아요. 저는 그거 하나만 생각하기로 했어요."] },
      { q: "유족회 이름으로 의견을 내 주실 수 있습니까?", a: ["네. 탄원서요. 서른한 집이 다 썼어요. 잠깐만요, 제가 글씨가 안 좋아서 총무님이 써 주셨어요. 여기 이름은 다 자기 손으로 썼고요."], gives: ["plea", { n: "유족회 탄원서", d: "유족 31세대 자필 서명. '그 증언이 없었으면 장부는 묻혔을 것입니다.'" }] }] },
    books: { n: "내 책장과 모은 의견서", s: "사무실", round: 3, fn: null, bg: "m4-frame", intro: "오래된 책장이다. 비매품 강의안이 맨 아래 칸에 끼어 있다. 윤서연이 두고 간 서류봉투도 책상에 있다.", items: [
      { q: "강의안 민법 파트를 읽는다", a: ["'대법원 2011. 2. 30. 선고 2010다77417 판결.' 여기다.", "기억이 났다. 교수님이 수업 때 웃으면서 하신 말씀. '이 강의안엔 일부러 틀린 판례 하나를 넣었다. 복사해 간 놈은 내가 잡는다.'", "비매품이다. 교수님 수업을 들은 제자들만 받았다."], gives: ["lect", { n: "강도윤 강의안", d: "비매품. 복제 적발용으로 일부러 넣은 틀린 판례 '대법원 2011. 2. 30. 선고 2010다77417 판결'. 강도윤 제자 외엔 갖고 있지 않음." }] },
      { q: "지금까지 모은 의견서를 나란히 놓는다", a: ["청람, 정헌은 내가 소송에서 받은 것이다. 서진, 한강로는 윤서연이 공개 재판 기록에서 복사해 왔다. 해성의 돈, 시청의 심의, 금융의 대출, 공소청의 불기소.", "네 장 모두 같은 틀린 판례를 인용했다. 2월 30일에 선고된 판결.", "내가 '오타겠지' 하고 넘어간 게 몇 번째인가."], gives: ["four", { n: "네 의견서 대조", d: "청람·정헌·서진·한강로 의견서가 모두 존재할 수 없는 2011. 2. 30. 판결을 사건번호까지 같게 인용." }] }] },
    mokfloor: { n: "목멱 건물 관리실", s: "건물 관리인", round: 3, fn: "건물 관리인", face: A + "cut/n50f2.webp", bg: "m4-kang-office", intro: "목멱 6층이요? 우편물 때문에 오셨어요?", items: [
      { q: "6층에 우편함이 네 개 더 붙어 있네요", a: ["청람, 정헌, 서진, 한강로요. 다 6층 복도 끝 방으로 들어가요. 사람은 못 봤어요, 늘 목멱 직원분이 한꺼번에 가져가시고.", "임대차 계약이요? 제가 보여 드리면 안 되는데… 이거 복사는 한 장만 하세요. 임차인 이름 다 강도윤 대표님이에요. 네 군데 다."], gives: ["lease", { n: "6층 임대차 계약서", d: "청람·정헌·서진·한강로의 주소지인 목멱 건물 6층 끝 방. 임차인은 모두 강도윤 개인. 우편물은 목멱 직원이 수거." }] },
      { q: "그 방에 들어가 보신 적 있어요?", a: ["청소하러 한 번요. 책상 하나에 컴퓨터 하나. 벽에 무슨 붓글씨 액자가 걸려 있던데요. 한자라 무슨 말인지는 모르겠더라고요."] }] },
    kang2: { n: "강도윤의 집무실, 다시", s: "법무법인 목멱", round: 3, fn: "강도윤", face: A + "story/face-kang.webp", bg: "m4-kang-office", intro: "다시 왔구나. 다음 기일에 내가 증인석에 서는 건 들었겠지. 앉아라. 오늘도 차는 있다.", items: [
      { q: "교수님, 사무실 이름 '목멱'은 무슨 뜻입니까?", a: ["남산의 옛 이름이다. 우리 사무실이 그 아래 있지. 몰랐느냐.", "법학자는 지명도 공부해야 한다고 했는데, 네가 시험에는 늘 강했어도 교양은 약했다."], gives: ["mok", { n: "목멱 = 남산", d: "강도윤 본인의 설명: 목멱은 남산의 옛 이름. 장부의 '남산'과 이어짐." }] },
      { q: "저를 왜 가르치셨습니까?", a: ["네가 가르칠 만해서 가르쳤다. 그건 다른 뜻이 없다.", "윤서연이도 그렇고. 나는 내가 가르친 애들 중에 쓸 만한 애들을 좋아한다. 그게 나쁜 일이냐."] },
      { q: "휴학계를 돌려받고 싶습니다", a: ["…재판 끝나고 와라. 그때까지 내가 갖고 있으마.", "서준아, 증인석에서는 서로 봐주지 말자."] }] } },
  rounds: [
    { tt: "제1회 공판기일", next: "증언 말고 장부를 입증할 방법이 없었다는 것을 보여야 한다.",
      toCourt: ["재판 날 아침이다. 변호사 배지를 달아야 하나 잠깐 생각하다가 서랍에 넣었다.", "법정 문을 열고 늘 앉던 쪽을 지나쳤다. 피고인석 의자는 변호인석보다 낮다. 6년 동안 몰랐던 일이다.", "윤서연이 먼저 와 있었다. 내 쪽으로 메모지 한 묶음을 밀며 작게 말했다. \"할 말 있으면 쓰세요. 입은 제가 쓸게요.\""],
      trial: [
        S("judge", "2036고단3318, 피고인 한서준. 출석하셨습니까?"),
        S("h", "네. 출석했습니다."),
        S("judge", "피고인은 진술을 거부할 수 있습니다. 변호사이시니 잘 아시겠지만 절차상 고지합니다. 검사, 공소사실 말씀해 주십시오."),
        S("pros", "피고인은 2036년 3월 12일 특검 재판의 증인석에서, 변호사로서 알게 된 전 의뢰인 오명환의 비밀을 공개했습니다."),
        S("pros", "변호사의 비밀유지 의무는 사법제도의 근간입니다. 의뢰인이 변호사에게 진실을 말할 수 있어야 재판이 돌아갑니다. 이 사건은 그 신뢰를 스스로 깬 사건입니다."),
        S("n", "서연이 펜 끝으로 메모지를 두 번 두드렸다. 공소사실에 대해 뭐라고 할지 정하라는 뜻이다."),
        C("메모지에 무엇이라고 쓸까? 서연이 다듬어 말할 것이다.", [
          ["누설한 사실은 다투지 않습니다. 다만 143명이 숨진 참사의 로비 구조를 밝히는 데 꼭 필요한 증언이었습니다. 형법 제20조의 정당행위로서 죄가 되지 않는다는 입장입니다.", 4, "", "judge", "행위는 인정하되 벌할 수 없는 경우라는 주장이군요. 위법성 조각 사유로 정리하겠습니다."],
          ["오명환 씨가 숨기려 한 그 일은 비밀이라고 할 수 없습니다.", -6, "", "pros", "본인이 6년간 숨기려 했던 사실입니다. 비밀이 아니라면 무엇입니까?"],
          ["오명환 씨는 나쁜 사람입니다. 그런 사람의 비밀을 왜 지켜 줘야 합니까.", -8, "", "judge", "변호인, 법률 주장을 하십시오."]]),
        S("pros", "변호인은 공익을 말씀하시는데, 피고인에게는 증언을 거부할 권리가 있었습니다. 아무도 입을 열라고 강요하지 않았습니다. 피고인은 스스로 말을 꺼낸 것입니다."),
        D("검사가 스스로 입을 열었다고 몰아간다. 서연에게 어떤 자료를 넘길까?", "order", 2, ["특검 재판 증인신문 조서를 보십시오. 재판장이 거부권을 고지한 바로 다음에, 특별검사가 '중대한 공익상 필요'를 주장한 기록이 있습니다.", "형사소송법 제149조는 변호사의 증언거부권을 정하면서, 중대한 공익상 필요가 있으면 거부할 수 없다고 단서를 달고 있습니다. 쉽게 말씀드리면, 피고인은 거부가 받아들여질지 알 수 없는 자리에 소환된 증인이었습니다."], "그 자료로는 증언 당시의 사정을 알 수 없습니다."),
        S("judge", "조서의 취지는 확인했습니다. 다음 증거로 넘어가지요. 검사, 증인 신청하십시오."),

    gu: { n: "구청 자원순환과", s: "2회 뒤 · 소각장 반입 기록", round: 2, bg: "m3-cityhall",
      arrive: ["'버렸다'는 말을 받쳐 줄 서류가 필요하다. 쓰레기가 소각장에 들어간 기록이라면 구청에 있을 것이다.", "민원 창구 옆 안내판에 '정보공개청구는 온라인으로'라고 큼직하게 붙어 있다."],
      people: [{ id: "clerkgu", n: "자원순환과 주무관", face: A + "cut/n30m2.webp",
        intro: ["정보공개청구는 온라인으로 하셔야 됩니다. 처리 기한은 열흘이고요.", ["윤서연", "말씀만 여쭤보려고요. 서류는 그다음에 신청할게요."], "말씀이요? 말씀은… 규정에 없는데. 그럼 말씀만 드리겠습니다. 받아 적지는 마세요."],
        topics: [
          { id: "guno", q: "2031년 1월 소각장 반입 기록을 볼 수 있을까요?", a: ["2031년이요? 반입 계량 기록은 수거 업체 단위로만 남고, 보존 기한이 3년입니다. 2034년에 규정대로 폐기했습니다.", "규정대로요. 제가 폐기한 건 아니고요. 그때는 제가 오기 전이라서요.", "그리고 어느 봉투가 어느 건물에서 나왔는지는 원래 안 적습니다. 쓰레기 봉투에 이름 쓰고 버리는 분은 없잖아요.", [null, "헛걸음이다. 5년 전 쓰레기는 기록까지 같이 태워졌다."]] },
          { q: "그럼 다른 데 남아 있을 만한 기록은 없을까요?", req: ["t:guno"], a: ["저희 쪽엔 없습니다. 다만 큰 사업장은 배출하는 쪽에서 자체 수거 일지를 쓰는 데가 많아요. 터미널 같은 데요.", "그건 저희 규정이 아니라 그쪽 규정이라서, 거기 가서 물어보세요. 저희가 보존하라고 한 적은 없으니까 남아 있는지는 모르겠습니다.", [null, "규정 밖의 기록이 규정 안의 기록보다 오래 남는 경우도 있다."]], opens: ["dump"] },
          { q: "사무장이 준 반입 확인서를 보여 준다", req: ["t:guno"], needs: "burn", lock: "이건 저희 서류가 아닌데요.", okLine: ["…이 서식, 2033년에 바뀐 겁니다. 제가 그 서식 바꾸는 회의에 들어갔었거든요. 회의를 세 번 했습니다.", "그리고 저희는 반입 확인서를 낱장으로 끊어 드린 적이 없습니다. 이걸 어디서 받으셨어요?", [null, "유기택의 웃는 얼굴이 떠올랐다. 이 서류는 다시는 꺼내지 않는다."]] }] }] },

    hosp: { n: "요양병원", s: "방재호의 어머니", round: 2, gated: true, bg: "f-hospital",
      arrive: ["개천 건너 요양병원 3층이다. 복도 끝 병실에서 방재호가 어머니 손톱을 깎고 있었다.", "갈색 재킷은 의자 등받이에 걸려 있었다. 터미널에서 볼 때보다 어깨가 작아 보였다."],
      people: [
        { id: "bang2", n: "방재호", face: A + "cut/n40m2.webp",
          intro: ["…변호사님. 여기까지 오셨어요?", "엄마, 이분이 그때 그 변호사님이에요. 나 살려 준 분. …오늘은 못 알아보시네요."],
          topics: [
            { id: "spcall", q: "특검에서 뭐라고 하던가요?", a: ["나오시면 옛날 택배 일도 다시 여쭤보겠다고요. 그 말만 했어요. 근데 그 말이면 다 한 거잖아요.", "전화 끊고 문자도 왔어요. 출석하실지 미리 알려 달라고. 저는 답장도 못 했어요.", [null, "특검은 아무 협박도 하지 않았다. 협박이 필요 없는 사람에게는 질문 하나로 충분하다."]] },
            { id: "dbl", q: "무죄 받은 사건은 어떻게 되는지 설명한다", req: ["t:spcall"], a: [["윤서연", "기사님 사건은 무죄가 확정됐어요. 한 번 판결이 확정되면 같은 일로 다시 재판받는 일은 없어요. 특검이 무엇을 묻든 그 일로 다시 처벌받지는 않아요."], "그런 게 있어요? 그럼 저는 이제 그때 일로는 진짜 끝이네요.", [null, "방재호는 재킷 소매를 몇 번 잡아당겼다. 끝났다는 사람의 손이 아니었다."]], gives: ["jaedbl", { n: "방재호 면담 메모", d: "무죄가 확정된 사건은 다시 처벌받지 않는다고 설명했다. 방재호는 안도하면서도 불안해했다.", img: "ev/f4-jaedbl.webp" }] },
            { q: "증인으로 나와 주실 수 있겠습니까?", req: ["t:dbl"], a: ["…변호사님이 나오라면 나가야죠. 제가 그때 그 은혜를 어떻게 잊어요. 사무장이라는 분도 돈 몇 푼 준다고 했는데 그건 안 받았어요. 진짜예요.", "뭐라고 말하면 돼요? 그때 버렸다고 한 거, 그대로 하면 되는 거죠?", [null, "대답하지 못했다. 방재호는 내 대답을 기다리지 않고 어머니 손을 다시 잡았다."]] }] },
        { id: "nurse", n: "병동 간호사", face: A + "cut/n30f1.webp",
          intro: ["면회는 30분이에요. 보호자 아니시면 명부에 성함 적어 주세요."],
          topics: [
            { q: "방 기사님은 자주 오세요?", a: ["쉬는 날마다요. 저희 병동에서 제일 자주 오는 아드님이에요.", "근데 저분 오시는 날은 복도에서 라면 냄새가 나요. 외부 음식 반입 금지라고 몇 번을 말씀드렸는데, 어머님 드린 게 아니라 본인이 주차장에서 먹고 온 거래요.", "냄새도 반입이에요. 제가 규정에 넣어 달라고 건의했어요.", [null, "웃으면 안 되는 자리인데 웃음이 났다. 간호사는 진지했다."]] }] }],
      looks: [
        { q: "침대 옆 협탁을 본다", a: ["물컵과 틀니 통 옆에 홍삼 상자가 하나 놓여 있다. 포장 비닐도 뜯지 않았다.", "올해 설에 사 온 것이라고 간호사가 말했다. 어머니가 드시지도 못하는데, 기사님은 그걸 꼭 침대 옆에 두고 간다고 했다."] }] },

    dump: { n: "터미널 관리사무소", s: "폐기물 일지", round: 2, gated: true, bg: "dock",
      people: [{ id: "office", n: "터미널 관리 직원", face: A + "cut/n30m3.webp",
        intro: ["5년 전 쓰레기요? 별걸 다 찾으시네.", "일지는 안 버렸을 거예요. 저희가 버리는 건 쓰레기지 일지가 아니라서."],
        topics: [
          { q: "2031년 1월 폐기물 수거 일지를 부탁한다", a: ["매주 화요일 수거네요. 설 앞이라 양이 많았다는 메모가 있고요. 봉투 하나하나 뭐가 들었는지까지 적진 않죠.", "그런데 소각장 반입 확인서요? 저희가 그런 걸 받은 적이 있나. 소각장에서 그런 서류를 낱개로 끊어 주지는 않을 텐데요."], gives: ["dump", { n: "터미널 폐기물 일지", d: "2031년 1월에도 매주 화요일 폐기물을 수거했다. 봉투별 내용은 적혀 있지 않다.", img: "ev/f4-dump.webp" }] },
          { q: "방재호 기사님은 어떤 분이세요?", a: ["성실하죠. 야간 제일 많이 서는 사람이에요. 어머니가 요양병원에 계셔서 돈이 늘 급하대요.", "그해 설에도 선물 하나 못 사 드렸다고 휴게실에서 혼자 소주 마시던 게 생각나네요."] }] }] },

    bookshop: { n: "골목 헌책방", s: "시장 골목 끝", bg: "f-bookshop", gated: true,
      arrive: ["시장 골목 끝, 간판 글씨가 반쯤 지워진 헌책방이다.", "문을 열자 종이 냄새가 확 끼쳤다. 천장까지 책이 쌓여 있다."],
      people: [{ id: "owner", n: "헌책방 주인", face: A + "cut/n60m1.webp",
        intro: ["찾는 책 있어요? 제목 말하면 있는지 없는지는 알려 드려요. 어디 있는지는 나도 모르고."],
        topics: [
          { id: "yoocard", q: "얼마 전에 양복 입은 분이 다녀가지 않았어요?", a: ["아, 그 사람. 터미널 기사 양반이 옛날에 팔고 간 책을 찾더라고. 5년 전 거를.", "그 기사 양반 기억은 나요. 설 지나서 노끈으로 묶은 책 한 덩이 갖고 와서 소주 값이나 달라고 했지.", "근데 5년 전에 들어온 걸 내가 어떻게 찾아. 저 뒤에 묶음째로 쌓아 둔 게 수백 덩이인데.", "그 양반이 명함을 두고 갔어. 찾으면 연락 달라고, 값은 넉넉히 쳐 주겠다고. 헌책 한 덩이에 넉넉히가 웬 말이야."], gives: ["yoocard", { n: "유기택의 명함", d: "헌책방 주인이 받은 유기택의 명함. 5년 전 터미널 기사가 판 책을 찾으면 연락해 달라고 했다.", img: "ev/f4-yoocard.webp" }] },
          { q: "그 기사분이 판 책은 어떤 책이었어요?", req: ["t:yoocard"], a: ["몰라요. 묶음째 받았으니까. 문고판 몇 권, 잡지 몇 권 그랬겠지.", "기사들이 파는 책이 다 그래요. 휴게실에 굴러다니던 거."] },
          { q: "특검이 책을 찾아간 날 보셨어요?", round: 3, req: ["f:oath", "f:warned"], a: ["봤지. 내가 묶음 풀어 줬는데. 우리 가게 생기고 압수수색은 처음이야. 삼십 년 만에.", "영장인가 뭔가 보여 주길래 내가 그랬지. 영장 없어도 풀어 줬을 거라고. 그 묶음 치우고 싶었거든.", "그래서 사진도 찍어 뒀어. 손주가 폰 바꿔 줘서 사진이 아주 잘 나와. 가게 벽에 붙이려고 했는데 할멈이 하지 말래서.", [null, "주인이 내민 화면에 문고판 두 권이 실려 있었다. 컬러 사진이다. 표지 한가운데 둥근 국물 자국, 그 위로 번진 손글씨, 우글우글한 뒤표지와 떨어져 나간 마지막 몇 장."], [null, "특검이 보여 주지 않는 원본이 이 노인의 휴대폰 안에 있었다. 사진을 내 메일로 보내 달라고 했다. 주인은 메일 보내는 법을 몰라서, 손주에게 전화를 걸었다."]], gives: ["stainc", { n: "장부 표지 컬러 사진", d: "헌책방 주인이 압수 당일 찍은 사진. 표지의 둥근 국물 자국 위로 글씨가 번졌고, 뒷부분 몇 장이 떨어져 나갔다.", img: "ev/f4-stainc.webp" }] },
          { q: "혹시 특검에서 다녀갔어요?", round: 3, req: ["f:nobook", "t:leak"], a: ["특검? 아무도 안 왔는데. 누가 와요?", "그 양복 입은 사무장 양반만 또 왔지. 이번엔 안쪽 묶음을 통째로 사면 얼마냐고 묻더라고. 헌책 묶음을 통째로 사는 사람은 처음 봐.", [null, "특검은 아무 데도 오지 않았다. 기자들 앞에서 한 말은 겁을 주려는 말이었다."], [null, "그리고 나는 그 묶음 앞에서 아무것도 묻지 않고 돌아섰다."]] }] }],
      looks: [
        { q: "안쪽 서가를 본다", a: ["노끈으로 묶은 책 덩이가 사람 키만큼 쌓여 있다. 덩이마다 먼지가 앉은 두께가 다르다.", "무엇을 찾는지도 모르면서 남의 가게 묶음을 풀 수는 없다.", "유기택은 무엇을 찾는 걸까. 장부는 쓰레기봉투에 들어가 태워졌다고 내 의뢰인이 말했다."] }] },

    wrap: { n: "기록 다시 정리", s: "3회 뒤 · 마지막 기일 준비", round: 3, bg: "f4-special",
      arrive: ["기록철 네 권을 책상에 펼쳤다. 첫날부터 쌓인 서류에 형광펜 자국이 늘었다."],
      looks: [
        { q: "특검의 공소 구조를 다시 짚는다", a: ["돈이 들어온 건 맞다. 나간 것도 맞다. 그 사이를 잇는 게 사람의 말뿐이다.", "재판장이 여태 고개를 끄덕인 건 언제였나. '누구에게 갔느냐'는 대목이었다."], gives: ["sum1", { n: "공소 구조 정리 메모", d: "입금과 인출은 증명됐지만 받은 사람과 대가를 잇는 고리는 진술뿐이다.", img: "ev/f4-sum1.webp" }] },
        { q: "특검이 첫날 약속한 것을 찾는다", a: ["특검은 첫날 '전달 내역을 입증하겠다'고 했다. 재판 내내 그 약속을 어디까지 지켰는지 표시해 봤다.", "민망할 만큼 빈칸이 많아야 할 텐데, 정말 그럴까. 나는 이번 재판에서 무엇을 이기고 있는 걸까."] }] },

    press: { n: "법원 기자실 앞", s: "3회 뒤 · 복도", round: 3, bg: "f4-court-press",
      arrive: ["기자실 앞 복도다. 노트북을 무릎에 올린 기자들이 벽을 따라 앉아 있다.", "누군가 내 이름을 불렀다. 돌아보지 말걸 그랬다."],
      people: [{ id: "reporter", n: "법조 기자", face: A + "cut/n30m1.webp",
        intro: ["윤서연 변호사님! 한 말씀만요. 한 줄이면 됩니다.", ["윤서연", "드릴 말씀 없어요."], "'드릴 말씀 없다' 그대로 써도 되죠? 그것도 한 줄이에요."],
        topics: [
          { q: "기사는 몇 줄이나 쓰세요?", a: ["오늘 데스크가 박진서 건은 열두 줄 주겠대요. 변호사님 한 줄 받으면 열세 줄로 늘려 달라고 할 거고요.", "변호사님이 아무 말 안 하시면 저는 '변호인은 말을 아꼈다'라고 써요. 그게 업계에서 제일 많이 쓰는 문장이에요.", [null, "나는 오늘도 말을 아꼈다. 한 줄이 줄었다."]] },
          { id: "leak", q: "특검에서는 뭐라고 하던가요?", req: ["f:nobook"], a: ["특검보가 아까 복도에서 그러더라고요. 장부 행방에 대한 단서를 잡았다, 결심 전에 낸다. 오프 더 레코드라면서 기자 열 명 앞에서요.", "오늘 저녁 기사에 다 나갈 거예요. '특검, 장부 단서 확보.' 변호사님 반론 한 줄 주시면 같이 넣어 드릴게요.", [null, "증인석에서는 아무것도 못 했으니 기자 앞에서 하는 거다. 판사도 저녁에 기사를 읽는다."]], gives: ["leak", { n: "특검보 발언 기사", d: "결심 전 '장부 행방 단서 확보'라는 특검보의 비공식 발언이 그대로 보도됐다. 법정에는 아무것도 제출되지 않았다.", img: "ev/f4-leak.webp" }] },
          { q: "엘리베이터 쪽으로 걸어간다", silent: true, req: ["f:oath", "f:warned"], a: ["장부 나왔다면서요? 소설책 모양이라던데 제목이 뭐예요? 진짜 '봄'이 들어가요?", ["윤서연", "드릴 말씀 없어요."], "그것도 한 줄이죠. 감사합니다, 변호사님.", [null, "엘리베이터 문이 닫힐 때까지 그 기자는 메모를 했다. 내가 한 말은 일곱 글자였다."]] }] }] },

    ledger: { n: "압수된 장부 사본", s: "특검 증거 열람", round: 3, gated: true, bg: "f4-special",

      people: [{ id: "evdesk", n: "특검 증거물 담당", face: A + "cut/n40f2.webp",
        intro: ["사본은 그게 전부입니다. 복사 매수는 장부에 적어 두세요. 한 장이라도 틀리면 제가 경위서를 씁니다."],
        topics: [
          { id: "orig", q: "원본을 직접 보고 싶습니다", a: ["원본은 필적 감정에 들어가 있습니다. 특검에서 변호인 원본 열람은 감정이 끝난 뒤로 미뤄 달라는 의견서를 냈고요.", "감정은 결심 다음 주에 끝납니다.", ["윤서연", "결심이 끝나면 볼 이유가 없잖아요."], "그 말씀은 의견서에 대한 의견서로 내시면 됩니다. 저는 사본 담당이라서요.", [null, "원본 없이 훼손을 다투라는 얘기다. 흑백 사본의 회색 동그라미만으로는 아무 말도 할 수 없다."]] }] }],
      looks: [
        { q: "표지를 살핀다", a: ["흑백이라 국물 자국은 회색 동그라미로만 보인다. 그래도 알아봤다. 5년 전 휴게실 냄비 밑에 깔려 있던 그 책이다.", "그때 나는 누가 읽다 둔 소설인 줄만 알았다. 들춰 볼 생각도 안 했다.", "이 사본으로는 글씨가 얼마나 번졌는지, 뒷장이 어떻게 떨어져 나갔는지 알 수 없다. 원본을 본 사람이 필요하다. 묶음을 푼 날 그 자리에 있던 사람."] },
        { q: "필적을 비교한다", a: ["앞부분은 뭉툭하고 힘이 센 글씨, 구속 뒤는 또박또박한 다른 글씨다. 이수아 씨가 말한 대로다.", "작성자가 둘이라는 점은 공격할 수 있다. 다만 공격할수록 이수아 씨의 증언이 맞았다는 걸 함께 보여 주게 된다."], gives: ["hand", { n: "장부 필적 차이", d: "구속 전후로 필적이 다르다. 쓴 사람이 둘이다.", img: "ev/f4-hand.webp" }] },
        { q: "2030년 12월 대목을 읽는다", a: ["본문은 연애소설처럼 읽힌다. '첫눈 오던 날, 남산 아래 사는 그분께 감자 서른 상자를 부쳤다. S의 고발 일로 마음 쓰실 일 없게.'", "옆에 특검이 이수아 씨 진술로 풀어 붙인 해독표가 있다. 감자 한 상자가 100. 서른 상자면 3,000.", "날짜는 2030년 12월. 정한별 고발이 불기소된 게 이듬해 2월이다. S는 스타포트다. 택배가 제대로 도착했다면 이 대목은 착공 전에 세상에 나왔을 것이다.", "장부는 사람 이름 대신 동네 이름을 썼다. 남산 아래 사무실을 둔 사람."], gives: ["nam", { n: "장부 '남산' 대목", d: "2030년 12월 대목. 해독하면 '남산 / S 고발 건 / 3,000.' 불기소 두 달 전.", img: "ev/f4-nam.webp" }] }] },

    kangf: { n: "법무법인 목멱", s: "강도윤 교수 찾아가기", round: 3, gated: true, bg: "m4-kang-office",

          { q: "대표실에도 같은 액자가 있었습니다", req: ["frame"], a: ["글씨 달라는 사람은 많았다. 쓸 만한 사람한테는 써 줬고.", [null, "차를 따라 주시는 손은 그대로 다정했다. 그게 더 무서웠다."]] }] }],
      looks: [
        { q: "벽 맨 위 현판을 본다", a: ["교수님 글씨로 쓴 현판이다. 목멱(木覓). 대학 때는 멋있는 이름이라고만 생각했다.", "돌아오는 택시 안에서 사전을 찾았다. 목멱산. 남산의 옛 이름.", "나는 전화기를 손에 쥔 채 차창만 봤다. 등록금 고지서를 들고 울던 스물셋의 내가 그 옆에 앉아 있는 것 같았다."] }] },

  qs: [

    { q: "그날 밤 보낸 문자를 확인한다", req: ["t:callk"], a: ["통화가 끊긴 뒤 문자를 하나 남겼다. '국장님 입장도 압니다. 내일 전에 전화 주십시오.'", "읽음 표시만 있고 답은 없었다."] },
    { q: "벽의 액자를 내려 본다", a: ["떼어 낼까 하고 액자를 내렸다가, 뒤판에 작게 쓰인 글씨를 봤다. '개업 축하한다. 입이 무거운 변호사가 되어라. 2030년 3월, 강도윤.'", "다시 걸었다. 왜 다시 거는지는 나도 모르겠다."] },
    { id: "oldfile", q: "캐비닛 맨 아래 칸의 기록철을 꺼낸다", round: 2, a: ["2030고단1187. 표지에 먼지가 앉아 있다. 개업하고 처음 받은 무죄라 버리지 못했고, 다시 열어 보지도 못했다.", "내가 쓴 변론요지서를 읽었다. 혈액은 영장 없이 뽑았으니 증거가 될 수 없다. 목격자는 술자리에 있었고 가로등은 나가 있었다.", "어디에도 '피고인은 운전하지 않았다'는 문장은 없다. 검사가 증명하지 못했다고만 썼다. 그때는 그게 내가 지킬 수 있는 마지막 줄이라고 생각했다."], gives: ["brief", { n: "2030년 변론요지서", d: "혈액의 증거능력과 목격 진술의 신빙성만 다툼. '피고인은 운전하지 않았다'는 주장은 한 줄도 없다.", img: "ev/m4-brief.webp" }] },
    { q: "기록철 속 탄원서 사본을 본다", round: 2, req: ["t:oldfile"], a: ["오명환의 반듯한 글씨. 은혜 잊지 않겠다는 말.", "그 사람은 정말로 잊지 않은 것 같다. 다른 방향으로."] },
    { q: "책상 위 우편물을 정리한다", round: 2, a: ["고지서 세 장. 사무실 월세, 관리비, 변호사회 회비. 피고인이 된 뒤로 새 사건은 한 건도 안 들어왔는데 고지서는 날짜를 정확히 지킨다.", "회비 고지서 맨 아래에 '회원 여러분의 품위 유지에 감사드립니다'라고 인쇄돼 있다. 올해 회비는 내기로 했다. 내년에도 회원일지는 모르겠지만.", "믹스커피 상자를 흔들어 봤다. 열한 개 남았다. 다음 기일까지 하루 하나씩이면 맞다. 재판도 그렇게 계산대로 가면 좋겠다."] },
    { id: "env", q: "서연이 두고 간 서류봉투를 연다", round: 3, a: ["서연이 맡았던 PF 사건의 공개 법정 기록에서 복사한 서류다. 법무법인 서진의 자문 회신.", "인용 판례. '대법원 2011. 2. 30. 선고 2010다77417 판결.'", "봉투 안에 서연의 메모가 있다. '법정에 나온 것만 넣었어요.'"], gives: ["seojin", { n: "서진 자문 회신", d: "윤서연이 맡았던 PF 사건 공판에 제출된 서진의 자문 회신 사본. 대법원 2011. 2. 30. 판결 인용.", img: "ev/m4-seojin.webp" }] },
    { id: "fourk", q: "의견서 네 장을 나란히 놓는다", round: 3, req: ["seojin", "nop"], a: ["조경숙 씨 소송 때 상대가 낸 청람의 자문의견서, 국가배상 소송 때 시 측이 낸 정헌의 의견서. 여기에 서진의 자문 회신과 불기소 기록에 붙은 한강로의 의견서.", "재산 빼돌리기, 인허가, 금융, 수사. 타워가 지나온 길마다 한 장씩이다.", "네 장 모두 같은 판결을 인용했다. 2월 30일에 선고된 판결. 사건번호까지 같다.", "레터헤드의 주소를 보다가 손이 멈췄다. 네 곳 다 같은 건물, 같은 층이다. 목멱이 들어 있는 건물 6층."], gives: ["four", { n: "네 의견서 대조", d: "청람·정헌·서진·한강로 의견서가 모두 있을 수 없는 '대법원 2011. 2. 30.' 판결을 사건번호까지 같게 인용. 주소도 모두 목멱 건물 6층.", img: "ev/m4-four.webp" }], opens: ["mokfloor"] },
    { q: "이삿짐 상자에서 꺼낸 강의안을 편다", round: 3, req: ["four"], a: ["표지가 바랜 제본 책. 강도윤 교수의 민법 강의안, '비매품'. 서초동으로 옮길 때 상자 맨 밑에 넣어 온 것이다.", "민법 파트를 넘기다 형광펜 줄 하나에서 멈췄다. '대법원 2011. 2. 30. 선고 2010다77417 판결.' 3학년 때 내가 그은 줄이다.", "교수님이 수업 때 웃으면서 하신 말씀이 생각났다. '이 강의안엔 일부러 틀린 판례를 하나 넣었다. 복사해 간 놈은 내가 안다.'", "이 강의안은 교수님 수업을 들은 제자들만 받았다. 교수님을 한 번 더 뵈어야겠다."], gives: ["lect", { n: "강도윤 강의안", d: "비매품. 복사를 잡아내려고 일부러 넣은 틀린 판례 '대법원 2011. 2. 30. 선고 2010다77417 판결'이 실려 있다.", img: "ev/m4-lect.webp" }], opens: ["kang2"] },
    { id: "lease1", q: "관리회사의 사실조회 회신을 읽는다", round: 3, req: ["q11"], a: ["회신은 두 장이었다. '6층 임차인: 법무법인 목멱. 601호부터 605호. 보증금, 임대차 기간, 관리비 납부 계좌.' 전부 목멱 것이다.", "청람, 정헌, 서진, 한강로는 한 줄도 없다. 6층에 누가 세 들어 있느냐고 물었더니 6층에서 제일 큰 세입자를 알려 준 것이다.", "끝 방이 몇 호인지부터 알아야 한다. 관리실에 한 번 더 가야겠다."] },
    { q: "관리회사의 두 번째 회신을 읽는다", round: 3, req: ["q13"], a: ["목멱 건물 607호, 6층 끝 방. 전용면적 열두 평. 청람, 정헌, 서진, 한강로가 모두 이 방을 주소로 쓴다.", "임차인 칸에 같은 이름이 네 번 적혀 있다. 강도윤.", "관리비도 한 계좌에서 나간다. 목멱의 법인 계좌가 아니라 교수님 개인 계좌다."], gives: ["lease", { n: "사실조회 회신(6층 임대차)", d: "청람·정헌·서진·한강로의 주소지는 목멱 건물 6층 끝 방 하나. 임차인은 네 건 모두 강도윤 개인이고 관리비도 그의 개인 계좌에서 나간다.", img: "ev/m4-lease.webp" }] }],
  places: {
    rec: { n: "사건 기록 열람", s: "공소청 열람복사실", bg: "rec",
      arrive: ["늘 변호인 자격으로 오던 창구다. 오늘은 피고인으로 왔다."],
      people: [{ id: "desk", n: "열람 담당 직원", face: A + "cut/n30f3.webp",
        intro: ["열람 신청하시게요? 사건번호 적어 주세요.", "2036고단3318… 피고인 본인이세요?"],
        topics: [
          { id: "recok", q: "기록 열람을 신청한다", needs: "sun", lock: ["변호인이 선임돼 있는지 먼저 확인해야 해서요. 선임서 사본 있으세요?", "피고인 본인도 열람은 되는데, 변호인 있으시면 그쪽 확인부터 하거든요."], okLine: ["윤서연 변호사님 선임돼 있네요. 피고인 본인은 열람만 되고 복사는 변호인 쪽으로 신청하셔야 돼요.", "…변호사님이 피고인이시네요. 저쪽 책상에서 보세요.", [null, "늘 앉던 책상이다. 의자가 오늘따라 낮은 것 같았다."]] },
          { q: "복사는 언제쯤 됩니까?", req: ["t:recok"], a: ["변호인이 신청하시면 이삼일이요.", "근데 변호사님, 이 사건 기록 얇아요. 조서 몇 장이랑 고소장이 거의 다예요. 다툴 게 별로 없나 봐요."] }] }],
      looks: [
        { q: "고소장을 읽는다", req: ["t:recok"], a: ["고소인 오명환, 서해광역시 도시국장. 고소대리인 법무법인 목멱, 담당 변호사 차윤희. 국가배상 소송 때 시 측을 대리했던 그 사무실, 그 변호사다.", "'피고소인은 의뢰인의 가장 내밀한 고백을 세상에 팔았다.' 문장 끝을 '팔았다'로 맺는 버릇. 수업 때 많이 들었다.", "접수일 2036년 3월 19일. 증언 일주일 뒤다."], gives: ["comp", { n: "오명환 고소장", d: "2036년 3월 19일 접수. 고소대리인 법무법인 목멱(차윤희). 국가배상 소송 때 시 측을 대리한 사무실.", img: "ev/m4-comp.webp" }] },
        { q: "특검 재판 증인신문 조서를 읽는다", req: ["t:recok"], a: ["재판장이 내게 한 말이 그대로 적혀 있다. '증인은 변호사로서 업무상 알게 된 일에 대해서는 증언을 거부할 수 있습니다.'", "형사소송법 제149조. 변호사는 업무상 알게 된 남의 비밀에 관해 증언을 거부할 수 있다. 다만 본인이 승낙했거나 중대한 공익상 필요가 있으면 거부할 수 없다.", "그 앞에 특별검사의 의견서가 붙어 있다. 이번 증언은 중대한 공익상 필요가 있어 거부할 수 없다는 내용이다. 내가 증인석에 서기 전에 이미 기록에 들어가 있었다."], gives: ["order", { n: "특검 재판 증인신문 조서", d: "재판장이 증언거부권을 알렸고, 그 전에 특별검사가 제149조 단서(중대한 공익상 필요)를 들어 거부할 수 없다는 의견서를 냈다.", img: "ev/m4-order.webp" }] },
        { q: "특검 사건 판결문을 읽는다", req: ["t:recok"], a: ["2036고합47. 피고인 박진서 징역 12년. '압수된 장부의 기재는 증인 한서준의 증언 등 바깥의 사실과 맞아 믿을 만하다.'", "판결 이유에 내 이름 석 자가 들어가 있다. 공소장에도 같은 이름이 있다."], gives: ["ruling", { n: "특검 사건 판결문", d: "박진서 징역 12년. 장부를 믿을 수 있는 이유로 증인 한서준의 증언 등 바깥의 사실과 맞는다는 점을 들었다.", img: "ev/m4-ruling.webp" }] }] },

    driver: { n: "대리기사 배상철", s: "대리기사 대기소 앞 골목", bg: "alley", gated: true,
      arrive: ["밤 열한 시, 대리기사들이 휴대전화를 들여다보며 콜을 기다리는 골목이다.", "6년 전 내 사무실에 찾아왔던 얼굴이 담배를 끄고 있었다."],
      people: [{ id: "bae", n: "배상철", face: A + "cut/n40m4.webp",
        intro: ["어, 변호사님? 그 변호사님 맞죠?", "저 그 일로는 이제 말 안 합니다. 무서워서요."],
        topics: [
          { id: "bae1", q: "6년 전 일 때문에 왔습니다", a: ["오 과장, 아니 지금은 국장이죠. 그 양반이 사고 나고 며칠 있다가 전화를 했어요. 전에 몇 번 태워 드린 손님이라 번호가 있었거든요.", "그분 술 드시면 조수석에서 아들 얘기를 그렇게 하세요. 공무원 시험을 세 번 떨어졌다고….", "아니, 그게 중요한 게 아니고. 50만 원 줄 테니까 그날 자기가 운전했다고 한 장만 써 달라고 했어요. 애 학원비가 밀려 있어서 썼어요. 돈은 끝내 못 받았지만요.", "근데 그거, 지금도 잡혀 갈 수 있는 거죠? 남의 재판에 가짜 종이 써 준 거. 신문에서 그렇게 봤어요."] },
          { id: "suit", q: "그때 양복 입은 사람이 찾아왔다고 하셨지요", req: ["t:bae1"], a: ["네. 재판 끝나고 바로요. 집 앞에 와서 오 과장한테 얼마 받기로 했냐고 묻더라고요. 겁이 나서 50 받았다고 했죠.", "그 사람이 수첩에 뭘 적었어요. 명함은 안 줬는데, 가다가 전화를 받더라고요. '네, 도원입니다.' 그건 똑똑히 들었어요.", "작년에 뉴스에서 박진서 회사 이름 나올 때 그 말이 생각났어요. 도원컨설팅."], gives: ["fifty", { n: "배상철의 말", d: "2030년 재판 직후 '도원'이라고 전화를 받는 남자가 찾아와 오명환에게 받은 돈이 얼마인지 묻고 50이라 적어 갔다. 장부의 '오 과장 정리비 50'과 맞는다.", img: "ev/m4-fifty.webp" }] },
          { id: "visitq", q: "요즘 그 일로 찾아온 사람이 있었습니까?", req: ["t:bae1"], a: ["어떻게 아셨어요. 3월 11일이요. 제 생일이라 기억해요. 낮 두 시쯤 여자 변호사가 여기까지 왔어요. 차윤희라고 명함을 주더라고요.", "'곧 오 국장님이 고소를 하게 될 겁니다. 특검에서 물어보면 모른다고 하세요.' 그러고 갔어요.", "근데 변호사님, 저 잘못되는 건 아니죠? 저 작년에 무릎 수술도 해서…."], gives: ["visit", { n: "차윤희의 방문", d: "증언 전날인 2036년 3월 11일 낮 2시, 목멱 차윤희 변호사가 배상철에게 '곧 오 국장이 고소를 하게 될 것'이라 말했다.", img: "ev/m4-visit.webp" }] },
          { q: "특검에서도 연락이 왔었습니까?", req: ["t:visitq"], a: ["왔죠. 그 변호사 오기 이틀 전에요. 기억 안 난다고 했어요.", "저도 가짜 종이 써 준 사람이잖아요. 말하면 저부터 잡혀 갈 것 같아서요."] },
          { q: "법정에 나와 주실 수 있겠습니까?", req: ["t:visitq"], a: ["…변호사님, 저 애가 아직 고등학생이에요. 그건 못 해요.", [null, "그때 써 준 확인서는 이 사람에게도 죄가 될 수 있다. 공소시효도 아직 남았다. 내 재판을 위해 이 사람을 증인석에 세우면 이 사람이 다친다."], [null, "더 조르지 않았다. 들은 것만 정리해서 서연에게 넘기기로 했다."]] }] }] },

      arrive: ["법무법인 목멱. 벽 한쪽은 법률 서적, 맞은편 벽에는 수구여병 액자, 그 위에 사무실 현판이 걸려 있다."],
      people: [{ id: "kang", n: "강도윤", face: A + "story/face-kang.webp",
        intro: ["서준이 왔구나. 앉아라. 차가 식는다.", [null, "은발에 무테안경, 쓰리피스 양복. 고소인 측 사무실 대표가 피고인에게 차를 따라 주었다."]],
        topics: [
          { id: "kang1", q: "고소장, 잘 받았습니다", a: ["내가 쓴 건 아니다. 차 변호사가 썼지. 그래도 문장이 눈에 익지? 내가 가르친 애니까.", "서준아, 네가 미워서 그러는 게 아니다. 내가 가르친 제일 큰 걸 어겼으니, 내가 안 아프겠느냐."] },
          { q: "3학년 2학기 등록금, 아직 못 갚았습니다", req: ["t:kang1"], a: ["그걸 아직도 말하느냐. 갚으라고 낸 돈이 아니다.", "그때 네가 학교 그만두겠다고 쓴 휴학계, 아직 내 서랍에 있다. 이상하게 그건 못 버리겠더구나."] },
          { q: "모의법정 때 제가 많이 혼났지요", req: ["t:kang1"], a: ["혼났지. 2학년 첫 변론에서 '존경하는 재판장님'을 열네 번 했다. 내가 셌다.", ["한서준", "열한 번이었습니다."], "봐라, 너도 셌구나.", "그 뒤로 내 수업에서는 그 말을 한 변론에 두 번까지만 하게 했다. 후배들이 아직도 그 규칙을 '한서준 조항'이라고 부른다더라.", [null, "웃음이 나왔다. 고소인 측 사무실에서, 고소인 측 대표 앞에서. 이분 앞에서는 늘 이렇게 마음이 풀렸다. 그게 이분의 힘이었다."]] },
          { q: "143명 앞에서도 입을 지켰어야 합니까?", req: ["t:kang1"], a: ["그걸 정하는 건 변호사가 아니다. 변호사가 자기 마음대로 '이 비밀은 말해도 되겠다'고 고르기 시작하면, 어느 의뢰인이 변호사한테 진실을 말하겠느냐.", "네 마음은 안다. 그래도 그날 네가 깬 건 오 국장 한 사람과의 약속이 아니다. 앞으로 변호사를 찾아올 모든 사람과의 약속이지."] },
          { id: "offerq", q: "고소를 취소하게 해 주실 수는 없습니까?", req: ["t:kang1"], a: ["이 죄는 피해자가 고소해야만 재판을 할 수 있는 죄다. 친고죄라고 하지. 1심 판결이 나기 전에 오 국장이 고소를 취소하면 재판은 거기서 끝난다.", "오 국장은 내 말을 듣는다. 네가 앞으로 장부 일에 더 입을 열지 않겠다고 약속만 하면 내가 말해 보마.", "대답은 천천히 해라. 차 식는다.", [null, "고소인이 대리인 사무실 대표의 말을 듣는다. 교수님은 그 말을 아무렇지 않게 하셨다."]], gives: ["offer", { n: "강도윤의 제안", d: "\"앞으로 장부 일에 입을 열지 않겠다고 약속하면 오 국장이 고소를 취소하게 하겠다.\" 고소인이 강도윤의 말을 듣는다는 뜻.", img: "ev/m4-offer.webp" }] }] }],
      looks: [
        { q: "벽의 액자를 본다", a: ["수구여병. 내 사무실 것과 같은 글씨다. 획 끝을 살짝 꺾어 올리는 버릇까지 똑같다.", "교수님은 제자가 개업할 때마다 한 장씩 써 주셨다고 했다."] },
        { q: "액자 위 현판을 본다", a: ["목멱(木覓). 교수님 글씨로 쓴 사무실 이름이다.", "무슨 뜻인지 여쭤본 적이 없다. 학교 다닐 때는 그냥 멋있는 이름이라고만 생각했다."] }] },

    special: { n: "특별검사 사무실", s: "1회 뒤 · 다른 방법이 있었는지", round: 1, bg: "f4-special",

        topics: [
          { id: "sp1", q: "제 증언 말고 장부를 입증할 다른 방법이 있었습니까?", a: ["있었으면 부르지 않았지요. 수사보고서를 보시겠습니까. 배상철 씨는 '기억 안 난다', 오명환 씨는 '모른다'. 도원컨설팅 사람들은 다 입을 닫았고요.", "장부 첫 줄을 바깥의 사실과 맞출 수 있는 사람은 변호사님 한 분뿐이었습니다. 그렇게 보고서에 썼습니다. 변호사님 재판에 내셔도 됩니다."], gives: ["only", { n: "특검 수사보고서", d: "배상철·오명환 모두 부인, 도원 관계자는 진술 거부. 장부 첫 줄을 바깥의 사실과 맞출 수단은 한서준의 증언 말고 없었다고 적었다.", img: "ev/m4-only.webp" }] },
          { id: "sp2", q: "특검 기록을 제 재판에 낼 수 있겠습니까?", req: ["t:sp1"], a: ["변호인께서 법원을 통해 기록을 보내 달라고 요청하시면 보내 드리겠습니다. 장부 사본과 해독표, 2031년 불기소 기록까지요.", "장부는 아직 다른 사람들 재판에도 쓰이고 있어서 원본은 못 드립니다. 사본으로 충분하실 겁니다."] },
          { q: "제가 증언한 뒤로 달라진 건 뭡니까?", req: ["t:sp1"], a: ["장부가 살아났습니다. 판결문 보셨지요. 그 뒤로 전직 부시장, 부장검사 항목까지 차례로 입증이 됐습니다.", "첫 줄이 맞는다는 게 확인되니 나머지 줄도 믿을 수 있게 된 겁니다."] },
          { id: "sp3", q: "2031년 불기소 기록이 폐기됐다고 합니다", req: ["t:arch1"], a: ["폐기요? 보존기간 3년으로요?", "고발 사건 기록을 3년짜리로 분류했다는 것부터가 이상하지요. 그건 저희가 따로 들여다보겠습니다.", "다행히 작년 압수수색 때 공소청 전산에서 그 사건 결정서와 첨부 의견서까지 통째로 출력해 왔습니다. 종이는 버려도 전산 기록은 남거든요.", "그건 이제 저희 수사기록입니다. 고소대리인이 개인정보를 내세워도 이번엔 막기 어려울 겁니다. 변호인께 송부촉탁을 한 번 더 넣으시라고 전해 주십시오.", [null, "지하 창구에서 번호표까지 뽑고 들은 말이 '폐기'였다. 그 폐기가 다시 길을 열어 줬다."]] }] }] },

    archive: { n: "공소청 기록보존계", s: "지하 1층 보존 창고 창구", round: 1, gated: true, bg: "m3-archive",
      arrive: ["공소청 지하 1층. 철제 서가가 끝없이 늘어선 창고 앞에 창구가 하나 있다. 기다리는 사람은 나뿐이다."],
      people: [{ id: "keeper", n: "기록보존계 주무관", face: A + "cut/n50m3.webp",
        intro: ["번호표 뽑으셨어요?", ["한서준", "…저 말고는 아무도 없는데요."], "그래도 뽑으셔야 돼요. 그래야 오늘 민원 처리 건수에 잡혀요.", [null, "번호표를 뽑았다. 1번. 뽑자마자 천장에서 '1번 고객님' 하는 안내 방송이 나왔다. 주무관은 방송이 끝날 때까지 기다렸다가 고개를 들었다."], "1번 고객님, 무슨 일이세요?"],
        topics: [
          { id: "arch1", q: "2031년 정한별 씨 고발 사건 불기소 기록을 보고 싶습니다", a: ["사건 관계인이세요? 고발인, 피고발인, 그 대리인. 아니시면 열람이 안 돼요.", ["한서준", "제 형사재판에 필요한 기록입니다."], "그럼 그 재판부를 통해서 요청하셔야죠. 규정이 그래요.", "…있는지 없는지만 봐 드릴게요. 보기만 하는 건 규정에 없으니까요.", [null, "주무관이 자판을 한참 두드렸다. 두드릴 때마다 돋보기안경을 이마로 올렸다 내렸다 했다."], "아, 이거 없어요. 2034년에 폐기됐네요. 보존기간 3년.", [null, "고발 사건 기록이 3년짜리라니. 그런 분류는 처음 듣는다."], ["한서준", "3년으로 분류한 사람이 누군지 알 수 있습니까?"], "그건 기록 표지 결재란을 봐야 하는데요. 기록이 없으니 결재란도 없죠.", [null, "말은 맞았다. 틀린 데가 없어서 더 막막했다."]] },
          { q: "폐기 전에 누가 그 기록을 본 적은 있습니까?", req: ["t:arch1"], a: ["열람 대장은 제 권한 밖이고요.", "다만 작년에 특검에서 우리 전산 자료를 통째로 떠 가셨어요. 압수수색이라고. 그날 저희 과장님이 점심을 못 드셨어요.", "그 얘기를 왜 저한테 물으세요? 특검에 물어보시지."] }] }] },

    ledger: { n: "특검 기록 사본", s: "문서송부촉탁으로 온 기록", round: 1, gated: true, bg: "rec",
      arrive: ["서연이 가져온 복사본이다. 장부는 문고판 크기 공책 두 권을 실로 엮어 제본한 모양이다. 얼핏 보면 누가 습작한 소설책이다.", "표지에 손글씨로 『남산 아래 봄』. 그 한가운데 둥근 국물 자국이 복사본에도 그대로 찍혀 있다."],
      looks: [
        { q: "장부 첫 장을 해독표와 맞춰 본다", a: ["본문은 연애소설처럼 읽힌다. 옆에 특검이 이수아의 진술로 풀어 붙인 해독표가 있다.", "첫 장 맨 윗줄을 해독하면 '오 과장 정리비 50.' 구속 뒤에 이어 쓴 다른 사람의 또박또박한 글씨다.", "내가 법정에서 설명한 줄이다. 그 아래로 시청, 금융, 공소청 사람들의 줄이 이어진다."] },
        { id: "namk", q: "2030년 12월 대목을 읽는다", a: ["'첫눈 오던 날, 남산 아래 사는 그분께 감자 서른 상자를 부쳤다. S의 고발 일로 마음 쓰실 일 없게.'", "해독표로는 감자 한 상자가 100. 서른 상자면 3,000. 특검은 이 대목을 '남산 / S 고발 건 / 3,000'으로 정리했다.", "S는 스타포트. 고발은 정한별이 2030년에 낸 내부 고발이다.", "남산. 사람 이름 대신 동네 이름을 썼다. 남산 아래 사는 누군가.", "고발이 언제 어떻게 묻혔는지는 불기소 기록에 있을 텐데, 송부된 기록에는 그게 빠져 있다. 공소청 기록보존계에 직접 가 보기로 했다."], gives: ["nam", { n: "장부 '남산' 대목", d: "2030년 12월 대목. 해독표로 읽으면 '남산 / S 고발 건 / 3,000'.", img: "ev/m4-nam.webp" }], opens: ["archive"] },
        { q: "정한별 고발의 불기소 결정서를 읽는다", req: ["t:namk", "q12"], a: ["2031년 2월 결정. 장부의 그 대목 두 달 뒤다. 고발이 묻히기 전에 3,000이 움직였다.", "결정 근거로 법무법인 한강로의 의견서가 붙어 있다. 인용 판례 '대법원 2011. 2. 30. 선고 2010다77417 판결.' 청람, 정헌 의견서에서 봤던 그 날짜다.", "담당 수사관 권태훈. 서연이 이름을 찾으면 알려 달라고 했던 그 수사관이다."], gives: ["nop", { n: "불기소 결정서", d: "2031년 2월 정한별 고발 불기소. 담당 수사관 권태훈. 근거로 붙은 한강로 의견서는 대법원 2011. 2. 30. 판결을 인용.", img: "ev/m4-nop.webp" }], opens: ["kwon"] }] },

    kwon: { n: "권태훈 수사관", s: "공소청 앞 공원", round: 1, gated: true, bg: "f2-investigator",

      people: [{ id: "kwon", n: "권태훈", face: A + "story/insp.webp",

        topics: [
          { id: "kw1", q: "윤서연 변호사가 말을 전해 달랬습니다", a: [["한서준", "'말해야 하는 날이 왔다'고 전해 달라고 했습니다."], "…그 말을 그분이 기억하고 있었군요.", [null, "권태훈은 신분증 끈을 한참 만지작거렸다."]] },
          { id: "kw2", q: "2031년 불기소, 누가 지시했습니까?", req: ["t:kw1"], a: ["부장님이 '남산에서 정리된 건'이라고 했습니다. 그게 다입니다. 저는 불기소 의견을 올렸어요.", "그 전에 장부를 택배로 보낸다는 연락을 받았습니다. 저는 답장을 보냈고요. 그런데 그 택배가 오지 않았을 때, 저는 차라리 다행이라고 생각했습니다. 평생 부끄러운 일입니다."] },
          { q: "'남산'이 누군지 아십니까?", req: ["t:kw2"], a: ["모릅니다. 사람인지 회사인지도요. 부장님이 그 말을 하면 일이 끝났다는 뜻이었습니다.", "그 말이 장부에 그대로 적혀 있다는 건 특검 기록을 보고서야 알았습니다."] },
          { q: "법정에 나와 주시겠습니까?", req: ["t:kw2"], a: ["어제 아침에 출근해 보니 제 책상에 명함이 한 장 꽂혀 있었습니다. 법무법인 목멱, 차윤희. 뒷면에 '증언하시기 전에 한번 뵙고 싶습니다'라고 적혀 있더군요.", "변호사님보다 하루 먼저 다녀간 셈이지요. 연락은 안 했습니다.", [null, "오명환의 고소대리인이다. 증인이 될 사람마다 그쪽이 한 걸음씩 먼저 가 있다."], "…애들한테 먼저 얘기했습니다. 큰애가 고등학생이에요. 듣고 나서 한참 있다가 그러더군요. '엄마, 그럼 그때 왜 말 안 했어?' 대답을 못 했어요.", "네. 나가겠습니다. 이번에는 대답하려고 나가는 겁니다.", "목에 건 이 신분증은 올해까지만 달고 다닐 생각입니다."], gives: ["kwon2", { n: "권태훈의 증언 약속", d: "\"부장검사가 '남산에서 정리된 건'이라고 했다. 불기소 의견을 올렸다.\" 법정에 나오겠다고 약속.", img: "ev/m4-kwon2.webp" }] }] }] },

        intro: ["어떻게 오셨어요? 민원이면 1층이에요."],
        topics: [
          { id: "ch1", q: "정한별 주무관을 찾아왔습니다", a: ["정 주무관님이요? 여기 안 계신 지 3년 넘었어요. 지하 기록실로 발령 나셨어요.", "근데 오늘 정 주무관님 찾는 분이 두 번째시네요. 아까 오전에 여자 변호사분도 오셨어요. 명함 주고 가셨는데… 여기 있네요. 법무법인 목멱.", [null, "차윤희. 이번에도 한발 늦었다."], "지하 기록실은 엘리베이터가 안 서요. 비상계단으로 내려가셔야 돼요. 내려가면 휴대전화도 잘 안 터지고요. 정 주무관님이 전화 안 받으시는 게 그래서일 수도 있어요.", [null, "그래서는 아닐 것이다."]], opens: ["jung"] },
          { q: "정 주무관이 왜 지하로 가게 됐습니까?", req: ["t:ch1"], a: ["저는 그때 여기 없어서요. 인사 발령이야 위에서 하는 거죠.", "제가 아는 건, 정 주무관님 자리였던 데가 지금 제 자리라는 거요. 창가라서 좋긴 한데, 가끔 좀 미안해요."] }] }] },

    jung: { n: "정한별", s: "시청 지하 기록실", round: 2, gated: true, bg: "m3-sideline",
      arrive: ["보일러실 옆 기록실. 형광등 하나가 깜빡인다. 금속테 안경을 쓴 남자가 서류 상자 사이에서 고개를 들었다."],
      people: [{ id: "jung", n: "정한별", face: A + "story/face-jung-40.webp",
        intro: ["…이번엔 변호사님이 피고인이시라면서요.", "전화는 일부러 안 받았습니다. 할 말이 없어서요."],
        topics: [
          { id: "j1", q: "6년 전 일을 사과드리러 왔습니다", a: ["사과요. 국가배상 재판 때 저를 증인으로 다시 세우셨을 때도 사과는 안 하셨죠. 그때는 변호사님이 그 판결문을 어떻게 받아 냈는지 저는 몰랐으니까요.", "특검 법정에서 들었습니다. 알고도 무죄를 받아 냈다고. 방청석에서 안경을 몇 번이나 닦았는지 모릅니다.", "이 층은 습기가 차서 서류에 곰팡이가 피어요. 안경이 늘 뿌옇고요. 그 판결문 따라서 여기까지 왔습니다."] },
          { id: "j2", q: "그 판결문의 문장, 제가 만든 겁니다", req: ["t:j1"], a: ["'증인 정한별의 진술은 믿기 어렵다.' 외우고 있습니다.", "고발했을 때도 그 문장이 따라다녔어요. 거짓말쟁이가 또 뭘 고발하냐고.", "…말리지는 않겠습니다. 변호사님이 하실 말은 하세요."] },
          { id: "j3", q: "목멱 변호사가 먼저 다녀갔다고 들었습니다", req: ["t:j2"], a: ["오전에요. 차윤희 변호사. 커피를 두 잔 사 왔더라고요. 제가 안 받으니까 혼자 두 잔 다 마시고 갔어요.", "국장님이 제 복직 심사 때 좋게 말씀해 주실 거라고 했어요. 증인으로 나가라 마라는 한마디도 안 했고요. 그 말은 안 해도 다 들리게 하더라고요.", "저 이제 마흔 넘었어요. 여기서 곰팡이랑 정년까지 갈 생각을 하면… 솔직히 흔들렸습니다."] },
          { q: "제 재판에 증인으로 나와 주시겠습니까?", req: ["t:j3"], needs: "plea", lock: ["변호사님을 위해서는 안 나갑니다. 그건 분명히 해 두죠.", "그리고 지금은 모르겠습니다. 나가서 제가 얻는 게 뭔지, 잃는 게 뭔지 너무 잘 보여서요.", [null, "지금 내 말로는 이 사람을 움직일 수 없다. 내 말은 6년 전에 이미 이 사람에게 신용을 잃었다."]], okLine: [[null, "유족회 탄원서 사본을 내밀었다. 정한별은 서명란을 오래 내려다봤다."], "…조경숙 어머님 글씨네요. 국가배상 재판 때 방청석에서 뵀어요.", "이분들은 잃을 게 없어서 이름을 쓴 게 아니잖아요. 저보다 훨씬 많이 잃은 분들이에요.", "변호사님을 위해서는 안 나갑니다. 그건 분명히 해 두죠.", "제 증언은 판결문에 다시 쓰이면 됩니다. 그걸 위해서라면 나가죠. 믿기 어렵다는 그 말이 지워지는 걸 봐야겠어요."], gives: ["jungn", { n: "정한별의 말", d: "\"제 증언은 판결문에 다시 쓰이면 됩니다.\" 증인으로 나오겠다는 동의.", img: "ev/m4-jungn.webp" }] }] }] },

    cho: { n: "조경숙 어머니", s: "2회 뒤 · 유족회 분향소", round: 2, bg: "m2-altar",
      arrive: ["분향소 영정 사진이 한 줄로 늘어서 있다. 틀어 올린 머리에 검은 상복 차림의 조경숙 씨가 향을 갈고 있었다."],
      people: [{ id: "cho", n: "조경숙", face: A + "story/face-mother.webp",
        intro: ["변호사님, 얼굴이 많이 상하셨네요. 밥은 드세요?"],
        topics: [
          { id: "c1", q: "제가 재판을 받게 됐습니다", a: ["들었어요. 유족회 분들이 다 들었어요. 우리 다은이가 왜 못 나왔는지 물어봐 준 변호사님인데, 왜 변호사님이 재판을 받아요.", "저희가 그 사람들 앞에서 뭐라도 할 수 있는 게 있어요?"] },
          { id: "c2", q: "제가 나쁜 변호사였다는 걸 아셔야 합니다", req: ["t:c1"], a: ["그 음주운전 이야기요. 특검 법정에서 들었어요. 그 사람을 변호사님이 빼 주셨다는 것도요. 그 사람이 나중에 그 공사 서류에 도장을 찍었다는 것도요.", "처음엔 며칠 잠을 못 잤어요. 그래도 변호사님이 그 말을 안 했으면 장부가 없었던 거잖아요. 저는 그거 하나만 생각하기로 했어요."] },
          { q: "유족회 이름으로 의견을 내 주실 수 있습니까?", req: ["t:c2"], a: ["네. 탄원서요. 서른한 집이 다 썼어요.", "잠깐만요, 제가 글씨가 안 좋아서 문장은 총무님이 써 주셨어요. 이름은 다 자기 손으로 썼고요."], gives: ["plea", { n: "유족회 탄원서", d: "유족 31세대 자필 서명. '그 증언이 없었으면 장부는 묻혔을 것입니다.'", img: "ev/m4-plea.webp" }] }] }] },

    mokfloor: { n: "목멱 건물 관리실", s: "3회 뒤 · 6층의 네 로펌", round: 3, gated: true, bg: "m4-kang-office",
      arrive: ["목멱이 든 건물 1층 관리실. 우편함이 벽 하나를 채우고 있다.", "6층 칸에 목멱 말고도 이름표 네 개가 더 붙어 있다. 청람, 정헌, 서진, 한강로."],
      people: [{ id: "mng", n: "건물 관리인", face: A + "cut/n50f3.webp",
        intro: ["6층이요? 우편물 찾으러 오셨어요?"],
        topics: [
          { id: "mailbox", q: "6층에 우편함이 네 개 더 붙어 있네요", a: ["청람, 정헌, 서진, 한강로요. 다 6층 복도 끝 방으로 들어가요.", "사람 드나드는 건 못 봤어요. 우편물은 늘 목멱 직원분이 한꺼번에 가져가시고.", "임대차요? 그건 제가 보여 드릴 수가 없어요. 관리회사로 정식으로 물어보셔야 돼요."] },
          { q: "그 방에 들어가 보신 적 있어요?", req: ["t:mailbox"], a: ["청소하러 한 번요. 책상 하나에 컴퓨터 하나. 벽에 붓글씨 액자가 걸려 있던데요.", "한자라 무슨 말인지는 모르겠더라고요. 네 글자였어요."] },
          { id: "plateq", q: "6층 우편함 이름표가 없어졌네요", req: ["t:lease1"], a: ["아, 그거요. 변호사님 다녀가신 그날 오후에 목멱 직원분이 와서 떼어 갔어요. 네 개 다요.", "앞으로 그 방 우편물은 목멱 사무실로 바로 올려 달래요. 그게 편하긴 하죠. 저는 우편함 하나 덜 보면 되니까요.", [null, "우편함 6층 칸에 테이프 자국만 네모나게 네 개 남아 있었다."], "근데 이런 거 물어보시는 거 보니 무슨 일 있어요? 제가 알려 드렸다고는 하지 마세요. 저 여기 십오 년 다녔어요."], gives: ["plate", { n: "떼어 간 이름표", d: "한서준이 관리실을 다녀간 날 오후, 목멱 직원이 6층 우편함에서 청람·정헌·서진·한강로 이름표를 떼어 가고 그 방 우편물을 목멱으로 보내 달라고 했다는 관리인의 말.", img: "ev/m4-plate.webp" }] },
          { id: "room607", q: "끝 방이 몇 호입니까?", req: ["t:lease1"], a: ["607호요. 목멱이 601호부터 605호까지 쓰고, 606호는 창고고, 끝이 607호예요.", "호수는 문에 붙어 있으니까 비밀도 아니죠. 적어 가세요.", "열쇠는 목멱에서 갖고 있어서 저도 못 열어 드려요. 청소도 한 번 하고 나서는 오지 말라더라고요."] }] }] },

    kang2: { n: "강도윤의 집무실, 다시", s: "법무법인 목멱", round: 3, gated: true, bg: "m4-kang-office",
      arrive: ["다시 목멱. 오늘은 차를 따라 주시는 손을 끝까지 지켜봤다."],
      people: [{ id: "kang2", n: "강도윤", face: A + "story/face-kang.webp",
        intro: ["다시 왔구나. 다음 기일에 내가 증인석에 서는 건 들었다. 앉아라. 오늘도 차는 있다."],
        topics: [
          { q: "강의안에 일부러 틀린 판례를 넣으셨지요", a: ["그랬지. 복사해 간 놈 잡으려고. 너는 안 베꼈지?", "남의 글을 베끼면 남의 틀린 것까지 베끼게 되는 법이다. 내가 너한테 그 말을 한 적이 있던가."] },
          { id: "k2a", q: "교수님, 사무실 이름 '목멱'은 무슨 뜻입니까?", req: ["nam"], a: ["남산의 옛 이름이다. 목멱산. 우리 사무실이 그 아래 있지. 몰랐느냐.", "법학자는 지명도 공부해야 한다고 했는데, 너는 시험에는 늘 강했어도 교양은 약했다.", [null, "남산 아래 사는 그분. 찻잔을 든 손이 떨리지 않게 하느라 애를 먹었다."]], gives: ["mok", { n: "목멱 = 남산", d: "강도윤 본인의 설명: 목멱은 남산의 옛 이름이고, 목멱 사무실은 그 아래 있다.", img: "ev/m4-mok.webp" }] },
          { q: "저를 왜 가르치셨습니까?", req: ["t:k2a"], a: ["네가 가르칠 만해서 가르쳤다.", "윤서연이도 그렇고. 나는 내가 가르친 애들 중에 쓸 만한 애들을 좋아한다. 그게 나쁜 일이냐."] },
          { q: "휴학계를 돌려받고 싶습니다", req: ["t:k2a"], a: ["…재판 끝나고 와라. 그때까지 내가 갖고 있으마.", "서준아, 증인석에서는 서로 봐주지 말자."] }] }] } },
  rounds: [
    { tt: "제1회 공판기일", next: "증언 말고는 장부를 입증할 방법이 없었다는 것을 보여야 한다.",
      toCourt: ["재판 날 아침이다. 변호사 배지를 달아야 하나 잠깐 생각하다가 서랍에 넣었다.", "법정 문을 열고 늘 앉던 쪽을 지나쳤다. 피고인석 의자는 변호인석보다 낮다. 6년 동안 몰랐던 일이다.", "윤서연이 먼저 와 있었다. 내 쪽으로 메모지 한 묶음을 밀며 작게 말했다. \"할 말 있으면 쓰세요. 입은 제가 쓸게요.\""],
      trial: [
        S("judge", "2036고단3318, 피고인 한서준. 출석하셨습니까?"),
        S("h", "네. 출석했습니다."),
        S("judge", "피고인은 진술을 거부할 수 있습니다. 피고인이 변호사이시니 길게 설명하지는 않겠습니다. 제가 조문을 잘못 읽으면 피고인이 고쳐 주실 것 같아서요."),
        S("h", "…그러지 않겠습니다."),
        S("n", "서연이 책상 밑으로 내 구두를 툭 찼다. 웃지 말라는 건지, 대답하지 말라는 건지는 끝까지 모르겠다."),
        S("judge", "검사, 공소사실 말씀해 주십시오."),
        S("pros", "피고인은 2036년 3월 12일 특검 재판의 증인석에서, 변호사로서 업무상 알게 된 전 의뢰인 오명환의 비밀을 공개했습니다."),
        S("pros", "변호사의 비밀유지 의무는 사법제도의 근간입니다. 의뢰인이 변호사에게 진실을 말할 수 있어야 재판이 돌아갑니다. 이 사건은 그 신뢰를 스스로 깬 사건입니다."),
        S("n", "서연이 펜 끝으로 메모지를 두 번 두드렸다. 공소사실에 대해 뭐라고 할지 정하라는 뜻이다."),
        C("메모지에 무엇이라고 쓸까? 서연이 다듬어 말할 것이다.", [
          ["누설한 사실은 다투지 않습니다. 피고인은 형사소송법 제149조 단서에 따라 증언을 거부할 수 없는 자리에서 증언했고, 그 증언은 143명이 숨진 사건의 진상을 밝히는 데 꼭 필요했습니다. 형법 제20조의 정당행위로서 죄가 되지 않습니다.", 4, "", "judge", "행위는 인정하되 벌할 수 없는 경우라는 주장이군요. 위법성 조각 사유로 정리하겠습니다."],
          ["오명환 씨가 숨기려 한 그 일은 비밀이라고 할 수 없습니다.", -6, "", "pros", "본인이 6년간 숨기려 했던 사실입니다. 비밀이 아니라면 무엇입니까?"],

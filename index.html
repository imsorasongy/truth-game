<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>벼넥시트 외전 : 의뢰인의 진실</title>
<meta name="theme-color" content="#140d09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="의뢰인의 진실">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
/* 한 단 세로 배치: 위 장부띠(HUD) + 아래 장면. 호두나무 사무실 + 놋쇠 + 서류 종이 */
:root {
  --wood: #241912;
  --wood-2: #33241b;
  --wood-3: #47332577;
  --line: #5a4434;
  --brass: #c9a24a;
  --brass-dim: #8f7536;
  --paper: #e8e2d4;
  --paper-2: #d9d1bf;
  --ink: #221d18;
  --ink-soft: #5b5146;
  --text: #f0e7da;
  --muted: #b3a38d;
  --win: #79b585;
  --lose: #d8695a;
  --warn: #e3b448;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-doc: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
/* 카카오톡 등 내장 브라우저에서 옆으로 밀리지 않게 */
html { overflow-x: hidden; }
body { max-width: 100%; word-break: keep-all; overflow-wrap: anywhere; }
body {
  background: var(--wood);
  background-image: repeating-linear-gradient(92deg, #ffffff05 0 2px, transparent 2px 9px), radial-gradient(circle at 50% 0, #4a342566, transparent 70%);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood-2); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--wood-2); border-bottom: 1px solid var(--line); }
.hud .wrap { padding-block: 8px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.hud .rank { font-family: var(--f-display); color: var(--brass); font-size: 17px; letter-spacing: .02em; }
.hud .day { font-size: 12px; color: var(--muted); text-align: right; }
.hud .stats { grid-column: 1 / -1; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; align-items: center; }
.hud .stats b { color: var(--text); font-weight: 600; }
.repbar { flex: 1 1 90px; min-width: 80px; height: 6px; background: #00000055; border-radius: 3px; overflow: hidden; }
.repbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-dim), var(--brass)); transition: width .6s; }

main { padding-block: 18px 120px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; color: var(--brass); }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; color: var(--muted); }
p { margin: 0; }

/* 버튼 */
.btn { display: block; width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--brass-dim); background: var(--wood-2); text-align: left; font-size: 15px; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--brass); background: #3d2c21; }
.btn:disabled { opacity: .38; cursor: default; }
.btn.primary { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 600; text-align: center; }
.btn.primary:hover:not(:disabled) { background: #d8b35c; }
.btn.ghost { background: transparent; text-align: center; }
.btn small { display: block; color: var(--muted); font-size: 12.5px; }
.btn.primary small { color: #3b3020; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(transparent, var(--wood) 30%); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { padding-block: 22px 14px; }

/* 의뢰인 카드 */
.client { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.portrait { width: 96px; height: 112px; border-radius: 8px; border: 3px solid var(--brass-dim); background: #1a120d; overflow: hidden; }
.portrait svg, .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.scene { position: relative; border-radius: 10px; overflow: hidden; border: 3px solid var(--brass-dim); aspect-ratio: 5 / 4; max-height: 48vh; width: 100%; max-width: 100%; background: #1a120d; }
.scene .portrait { width: 100%; height: 100%; border: none; border-radius: 0; }
.scene .plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 14px 10px; background: linear-gradient(transparent, #120c08ee); }
.scene .name { font-family: var(--f-display); font-size: 26px; line-height: 1.2; }
.scene .meta { color: #d8cbb8; font-size: 13.5px; }
.scene .chips { position: absolute; top: 8px; left: 8px; margin: 0; }
.scene .chip { background: #120c08cc; }
/* 수임료 제시 */
.feebox { background: var(--wood-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.feerow { display: grid; grid-template-columns: 64px 44px 1fr 44px; gap: 8px; align-items: center; }
.feerow .lbl { font-size: 13.5px; color: var(--muted); }
.feerow button { height: 44px; border-radius: 8px; border: 1px solid var(--brass-dim); background: transparent; font-size: 20px; color: var(--brass); }
.feerow .amt { display: flex; align-items: center; gap: 4px; min-width: 0; }
.feerow input { width: 100%; min-width: 0; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #1c140f; color: var(--text); font: 600 17px var(--f-body); text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; }
.feerow .unit { font-size: 13px; color: var(--muted); white-space: nowrap; }
.market { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.market b { color: var(--text); }
.hud .wr { font-family: var(--f-display); font-size: 20px; color: var(--text); line-height: 1; }
.hud .wr small { font-family: var(--f-body); font-size: 11px; color: var(--muted); margin-right: 4px; }
.client .name { font-family: var(--f-display); font-size: 24px; line-height: 1.2; }
.client .meta { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.crim { border-color: #a65a4c; color: #e6a497; }
.chip.civ { border-color: #5d7d8c; color: #a8c6d3; }
.offer { display: flex; gap: 16px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; border-top: 1px dashed var(--line); padding-top: 10px; flex-wrap: wrap; }
.offer b { color: var(--text); }

/* 대화 */
.talk { display: flex; flex-direction: column; gap: 10px; }
.bubble { background: var(--paper); color: var(--ink); padding: 11px 14px; border-radius: 4px 14px 14px 14px; max-width: 92%; font-size: 15px; animation: pop .25s ease-out; }
.bubble.me { align-self: flex-end; background: transparent; color: var(--brass); border: 1px solid var(--brass-dim); border-radius: 14px 4px 14px 14px; font-size: 14px; }
.bubble.sys { align-self: center; background: transparent; color: var(--muted); border: none; font-size: 13px; text-align: center; padding: 2px; }
@keyframes pop { from { transform: translateY(6px); opacity: .3; } }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-head .eyebrow b { color: var(--brass); }

/* 증거 카드 */
.evlist { display: flex; flex-direction: column; gap: 8px; }
.ev { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 11px 14px 11px 14px; font-family: var(--f-body); position: relative; box-shadow: 0 2px 0 #00000040; text-align: left; border: none; width: 100%; }
.ev .ev-name { font-weight: 600; font-size: 16.5px; }
.ev .ev-desc { font-size: 15px; color: #3f362d; }
.ev .ev-detail { font-size: 15px; line-height: 1.6; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #b7ac95; }
.ev .ev-hint { position: absolute; right: 10px; top: 10px; font-family: var(--f-body); font-size: 11.5px; color: var(--ink-soft); }
.ev.card-k { background: #d7e3d3; }
.ev.danger { box-shadow: inset 4px 0 0 var(--lose), 0 2px 0 #00000040; }
.tag-danger { font-family: var(--f-body); font-size: 11px; color: #fff; background: var(--lose); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
.pick { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.pick input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
.ev.off { opacity: .55; }

/* 법정 */
.court-head { background: var(--paper); color: var(--ink); font-family: var(--f-doc); padding: 14px 16px; border-radius: 3px; text-align: center; }
.court-head .no { font-size: 13px; color: var(--ink-soft); }
.court-head .tt { font-weight: 700; font-size: 17px; }
.arg { background: var(--wood-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.arg:has(input:checked) { border-color: var(--brass); background: #3d2c21; }
.arg input { accent-color: var(--brass); }
.gauge { position: relative; height: 34px; border-radius: 6px; overflow: hidden; background: linear-gradient(90deg, #6e2f27 0 var(--t1), #6a5426 var(--t1) var(--t2), #2f5a3a var(--t2)); border: 1px solid var(--line); }
.gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--paper); box-shadow: 0 0 8px #000; transition: left .5s cubic-bezier(.3,1.4,.6,1); }
.gauge-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log-line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 9px 12px; border-radius: 8px; background: var(--wood-2); font-size: 14px; animation: pop .25s ease-out; }
.log-line .who { font-size: 11.5px; color: var(--muted); display: block; }
.log-line .d { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; white-space: nowrap; }
.log-line.opp { border-left: 3px solid var(--lose); }
.log-line.ours { border-left: 3px solid var(--win); }
.log-line.null { border-left: 3px solid var(--muted); }
.pos { color: var(--win); } .neg { color: var(--lose); } .zero { color: var(--muted); }
.stamp { align-self: center; font-family: var(--f-display); font-size: 46px; padding: 2px 22px; border: 5px solid currentColor; border-radius: 10px; transform: rotate(-6deg); animation: stamp .35s cubic-bezier(.2,1.6,.5,1); letter-spacing: .06em; }
.stamp.win { color: var(--win); } .stamp.partial { color: var(--warn); } .stamp.lose { color: var(--lose); }
@keyframes stamp { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } }
.judgment { background: var(--paper); color: var(--ink); font-family: var(--f-doc); padding: 14px 16px; border-radius: 3px; font-size: 15px; }
.judgment .lbl { font-family: var(--f-body); font-size: 11.5px; letter-spacing: .12em; color: var(--ink-soft); }
.truth { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.truth b { color: var(--text); }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-variant-numeric: tabular-nums; font-size: 14.5px; background: var(--wood-2); border-radius: 10px; padding: 14px 16px; }
.ledger .r { text-align: right; font-weight: 600; }
.ledger .sum { border-top: 1px solid var(--line); padding-top: 8px; }

/* 표지 */
.cover { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.cover h1 { font-size: clamp(44px, 13vw, 72px); line-height: 1.05; color: var(--text); }
.cover h1 em { font-style: normal; color: var(--brass); }
.cover .lede { color: var(--muted); max-width: 30em; }
.scale-art { width: 120px; height: 90px; }
.visitors { display: flex; flex-direction: column; gap: 8px; }
.visitor { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; background: var(--wood-2); border-radius: 10px; padding: 8px 12px; }
.visitor .portrait { width: 48px; height: 56px; border-width: 2px; }
.visitor .vn { font-weight: 600; }
.visitor .vm { font-size: 12.5px; color: var(--muted); }
.visitor .st { font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.confirm-box { border: 1px solid var(--lose); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

/* ---- 장면 배경·예전 게임 그림 자원 ---- */
#backdrop { position: fixed; inset: 0; z-index: -1; background: var(--wood) center / cover no-repeat; }
#backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #140d09cc 0%, #140d09a6 30%, #140d09ee 70%, #140d09fa 100%); }
html[data-scene="office"] #backdrop { background-image: url("assets/bg-office.webp"); }
html[data-scene="court"] #backdrop { background-image: url("assets/bg-court.webp"); }
.hud { background: #1b120dd9; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #c9a24a40; }
.dock { background: linear-gradient(transparent, #140d09f0 35%); }
.snd { border: 1px solid #c9a24a66; background: transparent; color: var(--brass); border-radius: 99px; font-size: 11.5px; padding: 1px 9px; margin-left: auto; }

.btn { border-style: solid; border-color: transparent; border-width: 9px 14px 9px 16px; border-image: url("assets/frame-choice.png") 32 42 32 46 fill / 9px 14px 9px 16px stretch; border-radius: 0; background: none; padding: 9px 10px; color: #f3e6cf; text-shadow: 0 1px 2px #000a; transition: filter .15s, transform .1s; }
.btn:hover:not(:disabled) { background: none; filter: brightness(1.18); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn small { color: #c9b89c; }
.btn.primary { border: 1px solid #f1d98f; border-image: none; border-radius: 6px; background: linear-gradient(#e4c46e, #b38a34); color: #2a1c0c; text-shadow: none; padding: 14px 16px; box-shadow: inset 0 0 0 2px #7a5a1f40, 0 6px 18px #000a; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(#ecd081, #bf963d); filter: none; }
.btn.ghost { border: 1px solid #c9a24a80; border-image: none; border-radius: 6px; background: #140d0999; padding: 13px 16px; }

.scene { border: 16px solid transparent; border-image: url("assets/frame-modal.webp") 100 / 16px stretch; border-radius: 0; background: #1a120d; box-shadow: 0 14px 36px #000c; aspect-ratio: auto; width: min(100%, 260px); height: min(calc(100vw - 32px), 260px); max-height: none; margin-inline: auto; }
.scene .chips { top: 6px; left: 6px; }
.visitor .portrait, .portrait { border-color: #c9a24a99; }

.feebox, .ledger, .arg, .log-line, .visitor, .truth { background: #1f150fd1; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid #c9a24a33; }
.arg:has(input:checked) { background: #3a2a1ee6; border-color: var(--brass); }
.bubble { background: linear-gradient(#f1eadb, #e3d9c4); box-shadow: 0 4px 14px #0007; }
.bubble.me { background: #140d09b3; }
.bubble.sys { background: none; box-shadow: none; color: #cdbda4; }

/* 법정 */
.bench { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; background: #f1eadbf0; color: var(--ink); padding: 10px 14px 10px 10px; border-radius: 4px; box-shadow: 0 6px 18px #0009; }
.ava { border-radius: 50%; overflow: hidden; border: 2px solid var(--brass); background: #1a120d; }
.ava img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.bench .ava { width: 72px; height: 72px; }
.bench .no { font-family: var(--f-doc); font-size: 13px; color: var(--ink-soft); }
.bench .tt { font-family: var(--f-doc); font-weight: 700; font-size: 17px; }
.bench .who { font-size: 12px; color: var(--ink-soft); }
.log-line.has-ava { grid-template-columns: 36px 1fr auto; }
.log-line .ava { width: 36px; height: 36px; border-width: 1.5px; }
.stamp { color: #c8322b; border-style: double; border-width: 7px; background: #f1eadb22; text-shadow: none; }
.stamp.win, .stamp.partial, .stamp.lose { color: #c8322b; }
.stamp-img { align-self: center; width: min(200px, 56vw); animation: stamp .35s cubic-bezier(.2,1.6,.5,1); filter: drop-shadow(0 4px 10px #000a); }
.cover h1 { text-shadow: 0 4px 24px #000; }
.title { position: fixed; inset: 0; z-index: 12; background: #0b0806; display: flex; align-items: center; justify-content: center; }
.title-box { position: relative; height: 100%; aspect-ratio: 941 / 1672; max-width: 100%; max-height: 100%; }
@supports (height: 100dvh) { .title-box { max-height: 100dvh; } }
.title-box > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hot { position: absolute; left: 26.6%; width: 46.8%; height: 4.7%; background: transparent; border: none; border-radius: 6px; cursor: pointer; }
.hot:hover, .hot:focus-visible { background: #c9a24a26; box-shadow: 0 0 0 2px #c9a24a99; outline: none; }
.hot:active { background: #c9a24a40; }
.title-snd { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; }
.title-snd .snd { background: #0b0806aa; }
.title-save { position: absolute; left: 0; right: 0; top: 92.2%; text-align: center; font-size: 10.5px; color: #cdb98f; text-shadow: 0 1px 3px #000; pointer-events: none; }
.title-pop { position: absolute; left: 8%; right: 8%; top: 62%; background: #1f150ff2; border: 1px solid var(--brass); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 10px 30px #000; }
.cover-sub { font-family: var(--f-display); font-size: 20px; color: var(--brass); letter-spacing: .08em; margin-bottom: -14px; text-shadow: 0 2px 10px #000; }
.op { min-height: 62vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 22px 20px; background: #1f150fd9; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid #c9a24a40; border-radius: 6px; box-shadow: 0 14px 36px #000b; animation: pop .3s ease-out; }
.op h2 { font-size: 24px; }
.op p { color: #e6dac6; font-size: 15.5px; max-width: 30em; }
.op-dots { display: flex; gap: 6px; }
.op-dots i { width: 22px; height: 4px; border-radius: 2px; background: #c9a24a40; }
.op-dots i.on { background: var(--brass); }
.op-art { min-height: 120px; display: flex; align-items: center; padding-block: 6px; }
.op-face { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 3px solid var(--brass); box-shadow: 0 6px 18px #000a; }
.op-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.op-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.op-chips span { font-family: var(--f-display); font-size: 22px; padding: 6px 16px; border: 1px solid var(--brass); border-radius: 6px; color: var(--brass); }
.op-chips span:nth-child(3) { color: #e88b7c; border-color: #e88b7c; }
.op-fee { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid #c9a24a66; border-radius: 6px; font-variant-numeric: tabular-nums; color: var(--muted); }
.heroes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 8px; border-radius: 8px; border: 2px solid #c9a24a40; background: #1f150fd1; color: var(--muted); }
.hero img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 15%; border-radius: 4px; background: #ddd; }
.hero.on { border-color: var(--brass); color: var(--text); box-shadow: 0 0 0 3px #c9a24a33; }
.field { display: flex; flex-direction: column; gap: 6px; }

.op-hero { display: flex; gap: 14px; align-items: center; }

.op-name { font-family: var(--f-display); font-size: 22px; color: var(--brass); }
.op-line { font-family: var(--f-doc); font-size: 16.5px; line-height: 1.75; color: #efe5d3; }
#verdict { overflow: hidden; padding-block: 10px; }
.mono { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; background: #1f150fd1; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid #c9a24a55; border-radius: 10px; padding: 12px 14px; }

.pn { background: #1f150fd1; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid #c9a24a33; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }

.pn-name { font-family: var(--f-display); font-size: 19px; }
.pn .btn { margin-top: 6px; }
.need { color: #e3b448; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; }
.pill.ok { background: #2f5a3a; color: #d3ecd8; }
.mini { border: 1px solid #c9a24a80; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.mini.gold { background: var(--brass); color: #2a1c0c; border-color: var(--brass); }
.sec { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; background: #3a2a1e; border-radius: 8px; padding: 9px 11px; font-size: 14px; }
.sec-ico { font-style: normal; font-size: 11px; color: #2a1c0c; background: var(--brass); border-radius: 4px; padding: 1px 6px; }
.tag-inv { font-family: var(--f-body); font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid #8f7536; color: #5b4a20; }
.tag-inv.ask { cursor: pointer; background: #f6e7bf; }
.tag-inv.good { background: #2f5a3a; color: #fff; border-color: #2f5a3a; }
.tag-inv.bad { background: var(--lose); color: #fff; border-color: var(--lose); }
#backdrop { transition: none; }
html[data-scene^="end"] #backdrop::after { background: linear-gradient(180deg, #140d0966 0%, #140d0933 40%, #140d09d9 80%, #140d09f5 100%); }
#app.enter { animation: fadein .28s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
.hud .wrap { cursor: pointer; }
.hud .stats.more { color: #cdbda4; }
.hud-more { grid-column: 1 / -1; text-align: center; font-size: 10.5px; color: #8f7f69; line-height: 1; margin-top: 2px; }
.scene.confess .portrait img { filter: brightness(.7) saturate(.8); transition: filter .8s; }
.scene.confess::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 60px #7a1f15aa; pointer-events: none; animation: fadein .8s; }
.scene.leave { animation: leave 1.4s ease-in forwards; }
@keyframes leave { 0%,30% { transform: translateX(0); } 8% { transform: translateX(-8px); } 16% { transform: translateX(8px); } 24% { transform: translateX(-5px); } 100% { transform: translateX(40px); opacity: .15; filter: grayscale(1); } }
.ev-ico { width: 17px; height: 17px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: #6b5a44; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.me-row { display: flex; justify-content: flex-end; align-items: flex-end; gap: 6px; }
.me-row .bubble.me { max-width: 80%; }
.me-ava { width: 30px; height: 30px; flex: none; background: #ddd; }
.scale-box { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.scale { width: min(260px, 70vw); height: auto; }
#beam { transition: transform .6s cubic-bezier(.3,1.5,.6,1); }
.scale-now { font-size: 13px; color: var(--muted); }
.scale-now.win { color: var(--win); } .scale-now.lose { color: var(--lose); } .scale-now.partial { color: var(--warn); }
.log-wrap { position: relative; }
.slam { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-8deg) scale(.5); font-family: var(--f-display); font-size: 44px; opacity: 0; pointer-events: none; text-shadow: 0 4px 14px #000; white-space: nowrap; }
.slam.show { animation: slam .7s ease-out; }
.slam.bad { color: #ff7a66; } .slam.good { color: #8fdc9f; }
@keyframes slam { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(2); } 20% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.closeup, .flip { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0d0806e6; animation: fadein .25s; }
.closeup.out, .flip.out { opacity: 0; transition: opacity .3s; }
.closeup-face { width: min(220px, 60vw); aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 4px solid var(--brass); animation: zoom 1.5s ease-out; }
.closeup-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.closeup-txt { font-family: var(--f-doc); font-size: 20px; color: var(--paper); letter-spacing: .1em; }
@keyframes zoom { from { transform: scale(.8); } to { transform: scale(1.05); } }
.flip-card { background: var(--paper); color: var(--ink); width: 170px; padding: 18px 0 14px; text-align: center; border-radius: 6px; box-shadow: 0 10px 30px #000; animation: flip .5s ease-out; transform-origin: top; }
.flip-y { font-size: 13px; color: var(--ink-soft); }
.flip-m { font-family: var(--f-display); font-size: 52px; line-height: 1.1; color: #8a2a1f; }
.flip-f { font-size: 12px; color: var(--ink-soft); }
@keyframes flip { from { transform: rotateX(-90deg); opacity: 0; } to { transform: rotateX(0); opacity: 1; } }
.v-act { display: flex; flex-direction: column; gap: 4px; }
.visitor.dim { opacity: .6; }
.gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.gal-sec { display: flex; flex-direction: column; gap: 6px; }
.gal-t { position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; border: 1px solid #c9a24a55; background: #2a1d14; padding: 0; cursor: pointer; }
.gal-t img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.gal-t span { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 3px; font-size: 10px; line-height: 1.3; color: #f1e6cf; background: #000c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gal-t.lock { display: grid; place-items: center; cursor: default; color: #6b5640; font-size: 20px; background: #140d09cc; border-color: #c9a24a22; }
.gal-t.on { outline: 2px solid var(--brass); }
.gal-open .gal-head { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 10px 12px 0; }
.gal-open .gal-head .portrait { width: 56px; height: 56px; }
.howto { display: flex; flex-direction: column; gap: 6px; }
.howto .note { font-size: 14px; line-height: 1.6; color: var(--text); margin: 0; }
.file { background: #1f150fd1; border: 1px solid #c9a24a33; border-radius: 10px; }
.file summary { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer; list-style: none; }
.file summary::-webkit-details-marker { display: none; }
.file .portrait { width: 44px; height: 52px; border-width: 2px; }
.file .vn { font-weight: 600; }
.file .vm { font-size: 12.5px; color: var(--muted); }
.file-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.op-fee b { color: var(--text); font-size: 18px; margin-left: 6px; }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
/* ===== 폰 게임 화면판(v2): 세로 한 화면 고정 · 비주얼노벨 대화창 · 증거 서랍 · 아래 탭 ===== */
html, body { height: 100%; overflow: hidden; }
.hud { position: fixed; left: 0; right: 0; top: 0; z-index: 9; background: transparent; border: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding-top: env(safe-area-inset-top, 0px); }
.hud .pills { max-width: 480px; margin: 0 auto; display: flex; gap: 6px; padding: 10px 12px 2px; }
.hud .pill { display: flex; align-items: center; gap: 5px; background: #000b; border: 1px solid #c9a24a66; border-radius: 99px; padding: 3px 10px 3px 4px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text); }
.hud .pill i { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #2a1c0c; background: var(--brass); }
.hud .pill.r { margin-left: auto; padding: 3px 10px; }
.hud .rk { max-width: 480px; margin: 0 auto; padding: 0 14px; font-size: 11.5px; color: #d9c9ad; text-shadow: 0 1px 3px #000; }

#app { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 480px; top: calc(58px + env(safe-area-inset-top, 0px)); bottom: 62px; overflow-y: auto; overflow-x: hidden; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
#app.vn { top: 0; padding: 0; overflow: hidden; display: block; }
.dock { left: 0; right: 0; margin: 0 auto; max-width: 480px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: 0; background: linear-gradient(transparent, #0d0806f0 40%); }
.dock .wrap { padding-block: 14px 8px; }

/* 아래 탭 */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; z-index: 8; display: grid; grid-template-columns: repeat(4, 1fr); height: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0d0806f5; border-top: 1px solid #c9a24a44; }
#tabs .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); background: none; border: none; }
#tabs .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs .tab.on { color: var(--brass); }
#tabs .tab.off { opacity: .3; }

/* 상담·판단·수임료: 의뢰인이 배경 위에 서고, 아래 대화창 */
.vn .scene { position: absolute; top: calc(78px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(76%, 340px); height: auto; aspect-ratio: 1; max-height: 40%; border: none; border-image: none; background: none; box-shadow: none; overflow: visible; }
.vn .scene .portrait { width: 100%; height: 100%; border: none; background: none; -webkit-mask-image: radial-gradient(ellipse 62% 70% at 50% 42%, #000 60%, transparent 76%); mask-image: radial-gradient(ellipse 62% 70% at 50% 42%, #000 60%, transparent 76%); }
.vn .scene .chips { top: auto; bottom: 13%; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.vn .scene .plate { left: 50%; right: auto; bottom: 2%; transform: translateX(-50%); padding: 3px 14px; border-radius: 8px; background: var(--brass); color: #2a1c0c; text-align: center; white-space: nowrap; }
.vn .scene .plate .name { font-size: 17px; display: inline; }
.vn .scene .plate .meta { color: #3b2a14; font-size: 12px; display: inline; margin-left: 6px; }
.vn-bottom { position: absolute; left: 10px; right: 10px; bottom: 8px; max-height: 46%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.show-log .vn-bottom { max-height: 82%; background: #0d0806e6; border-radius: 12px; padding: 8px; }
.vn .bubble { max-width: 100%; background: #140d09f0; color: var(--text); border: 1.5px solid var(--brass); border-radius: 12px; font-family: var(--f-doc); font-size: 15px; line-height: 1.65; box-shadow: 0 6px 18px #000a; }
.vn .bubble.me { background: #0d0806e6; color: #e9cf8a; border-color: #8f7536; font-family: var(--f-body); font-size: 13.5px; }
.vn .bubble.sys { border: none; background: #000a; color: #d6c6aa; font-size: 12.5px; box-shadow: none; }
.vn .me-row { justify-content: flex-start; flex-direction: row-reverse; }
.vn:not(.show-log) .talk > :not(:nth-last-child(-n+2)) { display: none; }
.vn .section-head .eyebrow { color: #d6c6aa; text-shadow: 0 1px 3px #000; }
.vn .vn-bottom > div > .eyebrow, .vn .vn-bottom h2 { text-shadow: 0 2px 6px #000; }

/* 증거 서랍 */
.ev-drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 70%; z-index: 6; background: #f1e9d8; border-radius: 18px 18px 0 0; padding: 10px 14px 16px; overflow-y: auto; transform: translateY(105%); visibility: hidden; box-shadow: 0 -10px 30px #000a; }
#app.anim .ev-drawer { transition: transform .28s ease, visibility .28s; }
.show-ev .ev-drawer { transform: none; visibility: visible; }
.ev-drawer::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: #b9ab90; margin: 0 auto 8px; }
.ev-drawer .section-head .eyebrow { color: #6b4a1e; font-size: 13px; letter-spacing: .04em; }
.ev-drawer .ev { box-shadow: none; border: 1px solid #d7c9ab; background: #fffaf0; }

/* 법정: 판사 위, 상대 왼쪽·우리 오른쪽, 게이지, 아래 대화창 */
.court .bench { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: 80%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: none; box-shadow: none; padding: 0; color: var(--text); }
.court .bench .ava { width: 96px; height: 96px; border-width: 3px; box-shadow: 0 6px 18px #000; }
.court .bench .no, .court .bench .who { color: #d6c6aa; font-size: 11.5px; text-shadow: 0 1px 3px #000; }
.court .bench .tt { font-size: 15px; text-shadow: 0 2px 6px #000; }
.court .sides { position: absolute; top: 35%; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.court .side { position: relative; width: 36%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 2px solid; box-shadow: 0 6px 18px #000; }
.court .side img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.court .side span { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11.5px; background: #000b; padding: 2px; }
.court .side.opp { border-color: var(--lose); } .court .side.us { border-color: var(--win); }
.court.hit .side.opp { animation: shake .45s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.court > div:nth-child(2) { position: absolute; left: 16px; right: 16px; top: 64%; }
.court .log-wrap { position: absolute; left: 10px; right: 10px; bottom: 8px; }
.court .log .log-line { display: none; }
.court .log .log-line:last-child { display: grid; background: #140d09f0; border: 1.5px solid var(--brass); border-radius: 12px; padding: 12px; font-size: 14.5px; box-shadow: 0 6px 18px #000a; }
.court .slam { top: -120%; }
.court #verdict:not(:empty) { position: absolute; inset: 0; z-index: 7; overflow-y: auto; background: #0d0806f2; padding: calc(60px + env(safe-area-inset-top, 0px)) 16px 16px; display: flex; flex-direction: column; gap: 12px; }

/* 대화 화면은 스크롤 없이 고정: 예전 코드의 '마지막 대답으로 스크롤'이 화면을 끌어올리지 못하게 */
#app.vn { overflow: clip; }
.vn-bottom { overflow: clip; max-height: none; }
.vn .talk .bubble:last-child { max-height: 8.5em; overflow-y: auto; }
.vn .talk { gap: 6px; }
.vn .bubble { padding: 9px 12px; font-size: 14.5px; }
.vn .bubble.me { padding: 6px 10px; font-size: 13px; }
.vn .me-ava { width: 24px; height: 24px; }
.vn .vn-bottom .stack { gap: 5px; }
.vn .vn-bottom .btn:not(.primary):not(.ghost) { border-width: 6px 10px 6px 12px; border-image-width: 6px 10px 6px 12px; padding: 5px 8px; font-size: 13.5px; line-height: 1.35; }
.vn .vn-bottom .btn small { font-size: 11.5px; line-height: 1.3; }
.vn .vn-bottom .btn.ghost { padding: 8px 12px; font-size: 13.5px; }
.vn .vn-bottom h2 { font-size: 18px; }
.vn .vn-bottom .section-head .eyebrow { font-size: 11px; }
/* 내용이 많은 화면(수임료·흥정)은 의뢰인 그림을 작게 */
.vn.compact .scene { width: min(44%, 200px); max-height: 25%; }
.vn.compact .scene .chips { display: none; }
.vn.compact .feebox { padding: 10px 12px; gap: 8px; }
.vn.compact .feerow { grid-template-columns: 56px 38px 1fr 38px; }
.vn.compact .feerow button, .vn.compact .feerow input { height: 38px; }
.vn.compact .market { font-size: 12px; }
#tabs[hidden] { display: none !important; }

/* 오려 낸 의뢰인 그림: 타원 마스크 대신 아래쪽만 살짝 녹이고 그림자 */
.vn .scene .portrait { -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }
.vn .scene .portrait img { object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 10px 18px #000c); }

/* 글자 키우기: 그림을 줄인 만큼 대사·질문·선택지를 크게 */
.vn .bubble { font-size: 17.5px; line-height: 1.7; padding: 11px 14px; }
.vn .bubble.me { font-size: 15.5px; padding: 7px 12px; }
.vn .bubble.sys { font-size: 14.5px; }
.vn .talk .bubble:last-child { max-height: 9.5em; }
.vn .vn-bottom .btn:not(.primary):not(.ghost) { font-size: 16px; padding: 7px 10px; }
.vn .vn-bottom .btn small { font-size: 13px; }
.vn .vn-bottom .btn.ghost { font-size: 15.5px; }
.vn .vn-bottom h2 { font-size: 21px; }
.vn .vn-bottom .section-head .eyebrow { font-size: 13px; }
.vn .scene .plate .name { font-size: 19px; }
.vn .scene .plate .meta { font-size: 13.5px; }
.vn .scene .chips .chip { font-size: 12.5px; }
.vn .feerow .lbl, .vn .market { font-size: 14px; }
.court .log .log-line:last-child { font-size: 16.5px; }
.dock .btn.primary { font-size: 17px; }

/* 줄인 그림 자리를 글자로 채운다: 대사·질문·버튼을 크게 */
.vn .bubble { font-size: 21px; line-height: 1.6; padding: 14px 16px; }
.vn .bubble.me { font-size: 18px; padding: 9px 14px; }
.vn .bubble.sys { font-size: 16.5px; }
.vn .talk .bubble:last-child { max-height: 8.5em; }
.vn .vn-bottom .btn:not(.primary):not(.ghost) { font-size: 19px; padding: 10px 12px; line-height: 1.4; }
.vn .vn-bottom .btn small { font-size: 15px; }
.vn .vn-bottom .btn.ghost { font-size: 18px; padding: 11px 14px; }
.vn .vn-bottom .stack { gap: 8px; }
.vn .vn-bottom h2 { font-size: 24px; }
.vn .vn-bottom .section-head .eyebrow { font-size: 15px; }
.vn .scene .plate .name { font-size: 21px; }
.vn .scene .plate .meta { font-size: 15px; }
.vn .feerow .lbl, .vn .market { font-size: 15.5px; }
.vn .feerow input { font-size: 19px; }
.court .log .log-line:last-child { font-size: 19px; }
.dock .btn.primary { font-size: 19px; padding: 16px; }
/* 사건 종류 표시는 그림을 가리지 않게 이름표 위 한 줄로 */
.vn .scene .chips { bottom: auto; top: -30px; }

/* 대사·질문은 그림 바로 밑에서 위에서부터 쌓는다 */
.vn-bottom { justify-content: flex-start; }

/* 그림 크기를 지키면서 한 화면에 들어가는 만큼만 크게 */
.vn .bubble { font-size: 19px; padding: 11px 14px; }
.vn .bubble.me { font-size: 16.5px; padding: 7px 12px; }

const visitorRange = rep => [1 + Math.floor(rep * 9 / 100), 2 + Math.floor(rep * 18 / 100)];
// 진행은 월 단위. S.day는 1부터 세는 달 번호(1 = 2030년 1월)
const monthLabel = m => `${2030 + Math.floor((m - 1) / 12)}년 ${((m - 1) % 12) + 1}월`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isCrim = c => c.kind === "criminal";
const resultLabel = (c, r) => isCrim(c) ? { win: "무죄", partial: "감형", lose: "유죄" }[r] : { win: "승소", partial: "일부승소", lose: "패소" }[r];
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

/* ---------- 초상 ---------- */
// 같은 분류의 얼굴 여러 장을 사건마다 돌려 쓴다(예전 게임 캐릭터 얼굴 추가분 m01~m30)
const FACE_POOL = {
  c8: ["c8", "m01", "m05", "m12", "m18", "m22", "m27"],
  ptm: ["ptm", "m20", "m23"],
  c2: ["c2", "m06", "m14", "m28", "m30"],
  ptf: ["ptf", "m02"],
  c4: ["c4", "m13", "m25", "m29"],
  rep: ["rep", "m19", "m21", "m24", "m26"],
  c7: ["c7", "m03", "m08"],
  c3: ["c3", "m04", "m07", "m10", "m16"],
  exec: ["exec", "m09", "m15"],
  vic: ["vic", "m11"]
};
function pickFace(c) {
  const key = FACE[c.id] || c.client.face;
  const pool = FACE_POOL[key];
  return pool ? pool[hash(c.id) % pool.length] : key;
}
function portrait(c) {
  const face = pickFace(c);
  if (face) return `<img src="assets/${face.startsWith("m") ? "more/" + face : "f-" + face}.webp" alt="">`;
  const h = hash(c.client.name + c.id);
  const skins = ["#e9c4a2", "#d9ab84", "#c99470", "#f0d2b6"];
  const hairs = c.client.age >= 58 ? ["#c9c4bd", "#a9a39b", "#e2ded8"] : ["#1d1612", "#3a2619", "#5a3a22", "#2b2b2b"];
  const shirts = ["#3f5d6e", "#6b4a3a", "#4c5a3b", "#5c3f55", "#2f3f5a", "#7a6a4a"];
  const skin = skins[h % 4], hair = hairs[(h >> 3) % hairs.length], shirt = shirts[(h >> 6) % shirts.length];
  const style = (h >> 9) % 3;
  const hairPath = style === 0
    ? `<path d="M30 52 Q30 24 50 24 Q70 24 70 52 Q66 36 50 34 Q34 36 30 52Z" fill="${hair}"/>`
    : style === 1
      ? `<path d="M27 70 Q24 26 50 24 Q76 26 73 70 L68 70 Q68 38 50 36 Q32 38 32 70Z" fill="${hair}"/>`
      : `<path d="M31 50 Q29 27 50 25 Q71 27 69 50 Q62 40 44 40 Q36 41 31 50Z" fill="${hair}"/>`;
  const glasses = (h >> 12) % 4 === 0 ? `<g stroke="#1b1410" stroke-width="1.6" fill="none"><circle cx="42" cy="52" r="5"/><circle cx="58" cy="52" r="5"/><path d="M47 52h6"/></g>` : "";
  return `<svg viewBox="0 0 100 116" aria-hidden="true">
    <rect width="100" height="116" fill="#1f1610"/>
    <path d="M14 116 Q16 84 50 82 Q84 84 86 116Z" fill="${shirt}"/>
    <rect x="44" y="68" width="12" height="16" fill="${skin}"/>
    <ellipse cx="50" cy="52" rx="19" ry="22" fill="${skin}"/>
    ${hairPath}${glasses}
    <circle cx="42" cy="53" r="1.8" fill="#1b1410"/><circle cx="58" cy="53" r="1.8" fill="#1b1410"/>
    <path d="M44 64 Q50 ${66 + (h % 3) - 1} 56 64" stroke="#7a4a3a" stroke-width="1.6" fill="none"/>
  </svg>`;
}

const TRACKS = {
  opening: ["bgm/opening-theme.mp3"],
  normal: ["bgm/bgm1.mp3", "bgm/bgm2.mp3", "bgm/bgm6.mp3"],
  trial: ["bgm/trialtheme.mp3"],
  ending: ["bgm/ending-theme.mp3"]
};
let soundOn = true;
try { soundOn = localStorage.getItem(KEY + "-snd") !== "off"; } catch (e) {}
let audio = null, audioMode = null;
function music(mode) {
  if (mode === audioMode && audio) { if (soundOn && audio.paused) audio.play().catch(() => {}); return; }
  audioMode = mode;
  if (audio) { audio.pause(); audio = null; }
  if (!soundOn) return;
  const list = TRACKS[mode];
  audio = new Audio(list[Math.floor(Math.random() * list.length)]);
  audio.volume = 0.35;
  audio.addEventListener("ended", () => { const m = audioMode; audioMode = null; music(m); });
  audio.play().catch(() => {});
}
// 브라우저는 첫 터치 전에는 소리를 막으므로, 첫 터치 때 다시 튼다
document.addEventListener("pointerdown", () => { if (soundOn && audio && audio.paused) audio.play().catch(() => {}); });
const sndBtn = () => `<button class="snd" aria-pressed="${soundOn}">${soundOn ? "♪ 음악 켬" : "♪ 음악 끔"}</button>`;
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem(KEY + "-snd", soundOn ? "on" : "off"); } catch (e) {}
  document.querySelectorAll(".snd").forEach(b => { b.outerHTML = sndBtn(); });
  on(".snd", toggleSound);
  if (soundOn) { const m = audioMode; audioMode = null; music(m || "normal"); } else if (audio) audio.pause();
}

function resume() {

/* ---------- 하루 계획 ---------- */
function planDay() {
  const [lo, hi] = visitorRange(S.rep);
  const n = Math.max(1, lo + Math.floor(Math.random() * (hi - lo + 1)) + office().guests + (has("mgr") ? 1 + Math.floor(Math.random() * 2) : 0) - (S.rumor || 0));
  S.rumorShown = S.rumor || 0; S.rumor = 0;
  // 들어오는 사건 규모는 사무실이 정한다
  const tiers = office().tiers, maxTier = Math.max(...tiers), fits = c => tiers.includes(c.tier);
  let pool = CASES.filter(c => fits(c) && !S.played.includes(c.id));
  if (pool.length < n) {
    // 다 본 사건은 다시 섞어 넣는다
    S.played = S.played.filter(id => !CASES.some(c => fits(c) && c.id === id));
    pool = CASES.filter(c => fits(c) && !S.played.includes(c.id));
  }
  const weight = c => c.tier === maxTier ? 3 : c.tier === maxTier - 1 ? 2 : 1;
  const picks = [];
  while (picks.length < n && pool.length) {
    const total = pool.reduce((a, c) => a + weight(c), 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length; i++) { r -= weight(pool[i]); if (r <= 0) break; }
    picks.push(pool.splice(Math.min(i, pool.length - 1), 1)[0].id);
  }
  S.today = picks.map(id => ({ id, status: "wait" }));
  S.idx = 0;
  S.dayLog = []; S.taken = 0;
}

    <p class="note">더 큰 사무실로 옮기면 큰 사건이 찾아옵니다.</p>`,

function groupOf(c) {

  if (/임대|전세|보증금|권리금|명도|건물|토지|분양|하자|경계|일조|등기|점유|통행|공유물|분묘|관리비|재건축|원룸|셰어하우스|주택|상가|누수|층간|전대차|근저당|유치권|나무뿌리|아파트|공사 소음|복도|수선의무|중개/.test(t)) return "부동산·임대차";

function startCase(id) {

  C = { c, wallet: 0.8 + Math.random() * 0.6, suspOrder: shuffle([0, 1, 2]), argOrder: shuffle(c.arguments.map((_, i) => i)), asked: [], opened: {}, verdict: null, susp: null, confessed: false, haggled: false, offerF: null, offerB: null, fee: 0, bonus: 0, flagged: false, left: false, sub: new Set(), arg: null };

const tierTxt = ts => { const a = Math.min(...ts), b = Math.max(...ts); return "★".repeat(a) + (b > a ? "~" + "★".repeat(b) : ""); };
const stars = t => "★".repeat(t) + "☆".repeat(3 - t);
const STEP = { 1: 10, 2: 50, 3: 100 };
const roundTo = (n, s) => Math.max(s, Math.round(n / s) * s);
// 시세: 거짓 의뢰인 사건은 데이터에 웃돈이 얹혀 있으므로 걷어 내고 보여 준다
const marketFee = c => roundTo(c.fee / (c.truth === "liar" ? 1.5 : 1), STEP[c.tier]);
const marketBonus = c => roundTo(c.bonus / (c.truth === "liar" ? 1.5 : 1), STEP[c.tier]);
// 의뢰인 마음속 상한(착수금 + 성공보수 절반 기준). 거짓 의뢰인은 웃돈만큼 높다
// 의뢰인 형편: 직업으로 짐작한다. 형편이 어려우면 착수금에 민감하고, 여유가 있으면 성공보수에 민감하다
function payStyle(c) {
  const j = c.client.job || "";
  if (/대표|사장|임원|전무|상무|의사|약사|교수|원장|건물주|집주인|투자/.test(j)) return "rich";
  if (/배달|라이더|학생|대학원|휴학|청소|알바|아르바이트|기사|일용|무직|경비|주부|농사|형틀|목수|수습/.test(j)) return "poor";
  return "mid";
}
const STYLE_W = { poor: [1.3, 0.35], mid: [1, 0.5], rich: [0.85, 0.7] };
// 의뢰인이 느끼는 부담 = 착수금×가중치 + 성공보수×가중치
const burden = (c, f, b) => { const [a, w] = STYLE_W[payStyle(c)]; return f * a + b * w; };
// 의뢰인 마음속 상한: 시세 × 명성 × 사무실 × 지갑 사정(사건마다 ±25%, 화면에 안 보임)
const ceiling = c => burden(c, c.fee, c.bonus) * feeMult(S.rep) * (1 + office().up) * (C.wallet || 1);

  if (!C.lieOrder) C.lieOrder = shuffle(lies.map((_, i) => i));
  show(`${clientCard(c)}
    <div><div class="eyebrow">거짓말을 하고 있다</div><h2>무엇이 거짓말인가</h2></div>
    <div class="stack">${C.lieOrder.map(i => `<button class="btn" data-l="${i}">${esc(lies[i])}</button>`).join("")}</div>
    <button class="btn ghost" id="back">다시 생각하기</button>`);
  on("[data-l]", e => { C.verdict = "liar"; C.lie = +e.currentTarget.dataset.l; react(); });
  on("#back", screenJudge);
}

// 반응 대사: 같은 상황에도 몇 가지 중 하나가 나와서, 말투만으로 바로 가려내지 못하게 한다
const pick = a => a[Math.floor(Math.random() * a.length)];
const LINES = {
  calm: ["아유, 그런 거 없어요. 제가 말씀드린 그대로예요.", "그건 전혀 관계없는 얘기예요.", "그런 건 없는데요. 다른 거 물어보세요."],
  annoyed: ["…그런 거 없다니까요. 왜 자꾸 그러세요.", "변호사님, 저 의심하시는 거예요? 아닌데요.", "그 얘기는… 아니에요. 정말 없어요."],
  rattled: ["그, 그건… 아니에요. 제가 말씀드린 게 맞다니까요.", "네? 그, 그게 왜요… 그런 거 없어요.", "…아, 아니 그건요. 아무튼 제 말이 맞아요."],
  hideMiss: ["네? 그건 전혀 아닌데요.", "음… 그런 일은 없었어요.", "그건 아니에요. 정말로요."],
  lieMiss: ["무슨 말씀이세요? 그건 사실 그대로예요.", "그 부분은 정말 그랬어요. 증거도 있잖아요.", "그건 거짓말 아니에요. 확인해 보셔도 돼요."],
  honestHurt: ["그런 거 없습니다. …뭐, 변호사님이 확인하시는 거겠죠.", "숨긴 거 없어요. 좀 서운하네요.", "…없어요. 제가 그렇게 보이나요?"]
};
function react() {
  const c = C.c, t = c.truth, v = C.verdict;
  const offended = () => Math.random() < 0.5;
  let say = "", note = "";
  if (v === "honest") {
    say = "감사합니다, 변호사님. 잘 부탁드립니다.";
  } else if (v === "hiding") {
    if (t === "hiding" && C.susp === c.hiddenIndex) {
      C.confessed = true; C.card = true; say = c.confession;
      note = "숨긴 사실을 알아냈습니다.";
    } else if (t === "honest") {
      if (offended()) { C.left = true; C.penalty = 1; say = "그런 거 없습니다. 저를 못 믿으시면 다른 데 가 보겠습니다."; note = "의뢰인이 기분이 상해 떠났습니다. 명성 −1 · 나쁜 소문이 돌아 다음 달 손님이 줄어듭니다."; }
      else { say = pick(LINES.honestHurt); note = "의뢰인이 언짢아하지만 남았습니다."; }
    } else if (t === "hiding") {
      // 짚은 곳이 빗나가도 가끔은 멈칫해서 헷갈리게 한다
      say = Math.random() < 0.3 ? pick(LINES.annoyed) : pick(LINES.hideMiss); note = "짚은 곳이 빗나갔습니다.";
    } else if (c.mirror != null && C.susp === c.mirror) {
      // 거짓 의뢰인이라도 거짓말 뒤의 사실을 숨김으로 짚으면 털어놓는다 → 털어놓은 사실 카드
      C.confessed = true; C.card = true; say = c.confession;
      note = "숨긴 사실을 알아냈습니다.";
    } else {
      // 거짓 의뢰인: 거짓말과 맞닿은 곳을 짚으면 당황한다(털어놓지는 않음)
      if (c.touchIndex != null && C.susp === c.touchIndex) { say = pick(LINES.rattled); note = "의뢰인이 눈에 띄게 당황합니다."; }
      else { say = Math.random() < 0.4 ? pick(LINES.annoyed) : pick(LINES.calm); note = "의뢰인은 부인합니다."; }
    }
  } else {
    if (t === "liar" && C.lie === c.lieIndex) {
      C.confessed = true; C.flagged = true; say = c.confession;
      note = "거짓을 간파했습니다.";
    } else if (t === "hiding" && c.mirror != null && C.lie === c.mirror) {
      // 숨긴 사실을 덮은 말을 거짓으로 짚으면 털어놓는다 → 위험한 증거 표시
      C.confessed = true; C.flagged = true; say = c.confession;
      note = "거짓을 간파했습니다.";
    } else if (t === "liar") {
      say = Math.random() < 0.5 ? pick(LINES.lieMiss) : pick(LINES.annoyed); note = "의뢰인은 버팁니다.";
    } else if (t === "honest") {
      C.left = true; C.penalty = 3; say = "제가 거짓말쟁이라고요? 다른 변호사 찾아가겠습니다.";
      note = "의뢰인이 화를 내며 나갔습니다. 명성 −3 · 나쁜 소문이 돌아 다음 달 손님이 줄어듭니다.";
    } else if (offended()) {
      C.left = true; C.penalty = 1; say = "거짓말이라니요! 이런 대접 받으려고 온 거 아닙니다.";
      note = "의뢰인이 기분이 상해 떠났습니다. 명성 −1 · 나쁜 소문이 돌아 다음 달 손님이 줄어듭니다.";
    } else {
      say = "거짓말이라니요! …그 말은 사실이에요. 뭐, 말 안 한 게 조금 있을 수는 있지만요."; note = "의뢰인이 언짢아하지만 남았습니다.";
    }
  }
  C.reaction = { say, note }; C.fxOnce = true;
  if (C.left) {
    show(`${clientCard(c, "leave")}<div class="talk"><div class="bubble">${esc(say)}</div><div class="bubble sys">${esc(note)}</div></div>`,
      `<button class="btn primary" id="next">다음</button>`);
    on("#next", () => {
      const p = C.penalty || 0;
      if (p) { S.rep = Math.max(0, S.rep - p); S.rumor = (S.rumor || 0) + 1; }
      finishCase("left", { rep: -p, money: 0 });
    });
    return;
  }
  screenFee();
}

/* ---------- 수임료 제시 ---------- */
// 비서: 성공보수를 시세대로 둘 때 착수금을 어디까지 받을 수 있는지 범위로 귀띔
// 비서: 정확한 금액 대신 형편과 여유만 귀띔
function secHint(c) {
  const st = payStyle(c), w = C.wallet || 1;
  const a = st === "poor" ? "착수금이 부담스러운 형편 같아요. 성공보수로 받는 게 낫겠어요." : st === "rich" ? "형편이 넉넉해 보여요. 착수금은 넉넉히 받아도 될 것 같고요." : "형편은 보통 같아요.";
  // 형편(0.8~1.4)이 1 아래면 처음 금액에 맞제안이 들어온다
  const b = w > 1.2 ? "이번 건은 꽤 급해 보여서, 더 불러도 될 것 같아요." : w < 1 ? "주머니 사정이 빠듯해 보여요. 이 금액이면 깎자고 할 것 같아요." : "";
  return `<div class="sec"><i class="sec-ico">비서</i>"${a}${b ? " " + b : ""}"</div>`;
}
function screenFee(extra) {
  const c = C.c, step = STEP[c.tier], mult = feeMult(S.rep);
  // 처음 제시액은 내 기준 수임료(시세 × 명성 × 사무실). 의뢰인 형편에 따라 셋 중 하나꼴로 깎자고 한다
  const myRate = v => roundTo(v * mult * (1 + office().up), step);
  if (C.offerF == null) { C.offerF = myRate(marketFee(c)); C.offerB = myRate(marketBonus(c)); }
  const talk = [`<div class="bubble">${esc(C.reaction.say)}</div>`];
  if (C.reaction.note) talk.push(`<div class="bubble sys">${esc(C.reaction.note)}</div>`);
  if (extra) talk.push(extra);
  const fx = C.fxOnce ? (C.confessed ? "confess" : "") : ""; C.fxOnce = false;
  show(`${clientCard(c, fx)}
    <div class="talk">${talk.join("")}</div>
    ${C.card ? `<div class="evlist"><div class="ev card-k"><div class="ev-name">${esc(c.confessionCard.name)}</div><div class="ev-desc">${esc(c.confessionCard.desc)}</div></div></div>` : ""}
    <div class="feebox">
      <div><div class="eyebrow">수임료 제시</div>
      <div class="market">비슷한 사건 시세 착수금 <b>${won(marketFee(c))}</b> · 성공보수 <b>${won(marketBonus(c))}</b></div></div>
      ${has("sec") ? secHint(c) : ""}
      <div class="feerow"><span class="lbl">착수금</span><button data-adj="F" data-d="-1" aria-label="착수금 내리기">−</button>
        <span class="amt"><input id="offerF" inputmode="numeric" value="${C.offerF.toLocaleString()}"><span class="unit">만원</span></span>
        <button data-adj="F" data-d="1" aria-label="착수금 올리기">+</button></div>
      <div class="feerow"><span class="lbl">성공보수</span><button data-adj="B" data-d="-1" aria-label="성공보수 내리기">−</button>
        <span class="amt"><input id="offerB" inputmode="numeric" value="${C.offerB.toLocaleString()}"><span class="unit">만원</span></span>
        <button data-adj="B" data-d="1" aria-label="성공보수 올리기">+</button></div>
    </div>`,
    `<div class="row2"><button class="btn primary" id="propose">이 금액으로 제시</button><button class="btn ghost" id="refuse">돌려보낸다</button></div>`);
  const read = id => Math.max(0, parseInt(document.getElementById(id).value.replace(/[^\d]/g, ""), 10) || 0);
  const sync = () => { C.offerF = read("offerF"); C.offerB = read("offerB"); };
  document.querySelectorAll("#offerF, #offerB").forEach(el => el.addEventListener("input", sync));
  on("[data-adj]", e => {
    sync();
    const k = e.currentTarget.dataset.adj, d = +e.currentTarget.dataset.d * step;
    C["offer" + k] = Math.max(0, C["offer" + k] + d);
    document.getElementById("offer" + k).value = C["offer" + k].toLocaleString();
  });
  on("#propose", () => { sync(); propose(); });
  on("#refuse", () => {
    S.refused++;
    finishCase("refused", { rep: 0, money: 0 });
  });
}

// 맞제안: 형편이 어려우면 착수금을, 여유가 있으면 성공보수를 먼저 깎는다
function counterOffer(c, F, B) {
  const st = STEP[c.tier], [a, w] = STYLE_W[payStyle(c)], t = ceiling(c) * 0.9, val = burden(c, F, B);
  let f = F * t / val, b = B * t / val;
  if (payStyle(c) === "poor" && (t - B * w) / a >= st) { f = (t - B * w) / a; b = B; }
  if (payStyle(c) === "rich" && t - F * a >= 0) { f = F; b = (t - F * a) / w; }
  return [Math.max(st, Math.floor(f / st) * st), Math.max(0, Math.floor(b / st) * st)];
}
function propose() {
  const c = C.c, val = burden(c, C.offerF, C.offerB), ceil = ceiling(c);
  const me = `<div class="bubble me">착수금 ${won(C.offerF)}, 성공보수 ${won(C.offerB)}입니다.</div>`;
  if (val <= ceil + 0.5) {
    C.fee = C.offerF; C.bonus = C.offerB;
    const generous = c.truth === "liar" && val > burden(c, marketFee(c), marketBonus(c)) * feeMult(S.rep) * 1.15;
    const say = generous ? "돈은 얼마든지 드릴게요. 이기게만 해 주세요." : val < ceil * 0.75 ? "그 정도면 감사하죠. 잘 부탁드립니다." : "네, 그렇게 하겠습니다.";
    show(`${clientCard(c)}<div class="talk">${me}<div class="bubble">${esc(say)}</div><div class="bubble sys">수임 계약을 맺었습니다.</div></div>`,
      `<button class="btn primary" id="toTrial">재판 준비하기</button>`);
    S.taken = (S.taken || 0) + 1; save();
    on("#toTrial", screenTrial);
  } else if (!C.haggled && val <= ceil * 1.3) {
    // 비싸면 의뢰인이 금액을 맞제안한다(마음속 상한보다 조금 낮게)
    C.haggled = true;
    const st = payStyle(c), [cf, cb] = counterOffer(c, C.offerF, C.offerB);
    C.offerF = cf; C.offerB = cb;
    const amt = `착수금 ${won(cf)}, 성공보수 ${won(cb)}`;
    const ask = st === "poor" ? `착수금이 부담돼요. ${amt}이면 하겠습니다.` : st === "rich" ? `성공보수가 세네요. ${amt}으로 하시죠.` : `조금 깎아 주세요. ${amt}이면 하겠습니다.`;
    screenFee(`${me}<div class="bubble">${esc(ask)}</div><div class="bubble sys">한 번 더 제시할 수 있습니다.</div>`);
  } else {
    show(`${clientCard(c)}<div class="talk">${me}<div class="bubble">${esc(C.haggled ? "죄송하지만 다른 데 알아볼게요." : "그렇게까지는 못 드리겠네요. 다른 데 알아볼게요.")}</div><div class="bubble sys">의뢰인이 떠났습니다.</div></div>`,
      `<button class="btn primary" id="next">다음</button>`);
    on("#next", () => finishCase("left", { rep: 0, money: 0 }));
  }
}

/* ---------- 재판 준비 ---------- */
// 민사 아닌 사건의 번호 종류: 행정(구), 가사소송(드), 가사비송(느), 보전(카), 합의부 전속(가합)
const COURT = {
  admin: "k11 k12 k13 o12 o13 o14 o15 j13",
  fsuit: "c13 f03 f09 j02 j03 j04 n01 n09 n16 n17",
  fnon: "c10 c15 f01 f06 f12 j01 j05 j10 n04 n05 n18 n25",
  hold: "l01", gahap: "g08"
};
const kindLabel = c => isCrim(c) ? "형사" : { admin: "행정", fsuit: "가사", fnon: "가사" }[courtOf(c)] || "민사";
const courtOf = c => Object.keys(COURT).find(k => COURT[k].split(" ").includes(c.id));
function caseNo(c) {
  const k = courtOf(c), big = c.tier === 3;
  const code = isCrim(c) ? (big ? "고합" : "고단")
    : k === "admin" ? (c.tier === 1 ? "구단" : "구합")
    : k === "fsuit" ? (big ? "드합" : "드단")
    : k === "fnon" ? (big ? "느합" : "느단")
    : k === "hold" ? "카단"
    : k === "gahap" ? "가합"
    : (c.tier === 1 ? "가소" : c.tier === 2 ? "가단" : "가합");
  return `${2030 + Math.floor((((S && S.day) || 1) - 1) / 12)}${code}${(1000 + hash(c.id) % 9000)}`;
}
function trialHead(c) {
  return `<div class="bench"><div class="ava"><img src="assets/judge.webp" alt=""></div><div><div class="no">${caseNo(c)} ${esc(c.category)}</div><div class="tt">${isCrim(c) ? "공판기일" : "변론기일"}</div><div class="who">재판장 · 상대측 ${isCrim(c) ? "검사" : "소송대리인"}</div></div></div>`;
}
function screenTrial() {
  const c = C.c;
  const cards = c.evidence.slice();
  if (C.card) cards.push(Object.assign({ isK: true, detail: "" }, c.confessionCard));
  // 처음엔 전부 제출로 두고, 불리한 것을 직접 빼게 한다
  if (!C.trialInit) { cards.forEach(e => C.sub.add(e.id)); C.trialInit = true; }
  const evs = cards.map((e, i) => {
    const on_ = C.sub.has(e.id), danger = C.flagged && e.value < 0;
    const inv = C.inv === e.id ? (e.value < 0 ? `<span class="tag-inv bad">조사: 위험</span>` : e.value > 0 ? `<span class="tag-inv good">조사: 유리</span>` : `<span class="tag-inv">조사: 쓸모 없음</span>`)
      : has("inv") && !C.inv && !e.isK ? `<span class="tag-inv ask" data-inv="${esc(e.id)}">뒷조사</span>` : "";
    return `<label class="ev pick ${e.isK ? "card-k" : ""} ${danger ? "danger" : ""} ${on_ ? "" : "off"}">
      <input type="checkbox" id="sub-${esc(e.id)}" data-sub="${esc(e.id)}" ${on_ ? "checked" : ""}>
      <span><div class="ev-name">${evIcon(e)}제${i + 1}호증 ${esc(e.name)}${danger ? `<span class="tag-danger">위험</span>` : ""}${inv}</div>
      <div class="ev-desc">${esc(e.desc)}</div>${e.detail ? `<div class="ev-detail">${esc(e.detail)}</div>` : ""}</span></label>`;
  }).join("");
  const args = C.argOrder.map(i => c.arguments[i]).map(a => `<label class="arg pick"><input type="radio" name="arg" id="arg-${esc(a.id)}" data-arg="${esc(a.id)}" ${C.arg === a.id ? "checked" : ""}><span>${esc(a.text)}</span></label>`).join("");
  show(`${trialHead(c)}
    <div class="stack"><div class="section-head"><span class="eyebrow">제출할 증거 고르기</span><span class="eyebrow">${has("inv") ? (C.inv ? "조사원 뒷조사 끝" : "조사원 뒷조사 1회") : "불리한 건 빼도 됩니다"}</span></div>
      <div class="evlist">${evs}</div></div>
    <div class="stack"><div class="eyebrow">주장 하나 고르기</div>${args}</div>`,
    `<button class="btn primary" id="plead" ${C.arg ? "" : "disabled"}>변론 시작</button>`, "court");
  document.querySelectorAll("[data-sub]").forEach(el => el.addEventListener("change", e => {
    const id = e.target.dataset.sub; e.target.checked ? C.sub.add(id) : C.sub.delete(id);
    e.target.closest(".ev").classList.toggle("off", !e.target.checked);
  }));
  document.querySelectorAll("[data-arg]").forEach(el => el.addEventListener("change", e => {
    C.arg = e.target.dataset.arg; document.getElementById("plead").disabled = false;
  }));
  document.querySelectorAll("[data-inv]").forEach(el => el.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    C.inv = e.currentTarget.dataset.inv; const y = window.scrollY; screenTrial(); window.scrollTo({ top: y });
  }));
  on("#plead", runTrial);
}

/* ---------- 재판 진행 ---------- */
const MIN = -8, MAX = 10;
const pct = s => Math.max(0, Math.min(100, (s - MIN) / (MAX - MIN) * 100));

// 받침 있으면 '을', 없으면 '를'
const josaEul = w => { const ch = (w.match(/[가-힣](?=[^가-힣]*$)/) || [""])[0]; return ch && (ch.charCodeAt(0) - 0xac00) % 28 ? "을" : "를"; };
function runTrial() {
  const c = C.c;
  const steps = [];
  const pool = c.evidence.concat(C.card ? [c.confessionCard] : []);
  // 거짓 의뢰인의 위험 증거는 상대가 허점을 파고들어 세 배로 불리하다
  pool.filter(e => C.sub.has(e.id)).forEach(e => steps.push({ cls: "ours", who: "우리 측 증거", text: e.name, d: c.truth === "liar" && e.value < 0 ? e.value * 3 : e.value }));
  const arg = c.arguments.find(a => a.id === C.arg);
  steps.push({ cls: "ours", who: "우리 측 주장", text: arg.text, d: arg.value });
  c.opponent.forEach(o => {
    const cs = o.counters || [];
    // 숨긴 사실 폭로는 털어놓은 사실을 내고 맞는 주장까지 골라야 막힌다
    const hit = c.truth === "hiding" && cs.includes("k") ? C.sub.has("k") && cs.includes(C.arg) : cs.some(id => C.sub.has(id) || id === C.arg);
    // 거짓 의뢰인 사건의 결정타는 막지 못하면 그대로 패소
    const power = c.truth === "liar" && o.power >= 5 ? 12 : o.power;
    steps.push({ ava: isCrim(c) ? "pros" : "opp", cls: "opp", who: "상대방 반박", text: `${o.name} — ${o.desc}`, d: hit ? 0 : -power, dTxt: hit ? "" : null });
    // 막았다면 우리 측이 그 자리에서 증거·털어놓은 사실·주장을 내밀며 반론한다
    if (hit) {
      const ids = cs.filter(id => C.sub.has(id) || id === C.arg);
      const evNames = ids.filter(id => id !== "k" && id !== C.arg).map(id => (c.evidence.find(e => e.id === id) || {}).name).filter(Boolean);
      const lines = [];
      if (ids.includes("k")) lines.push(`그 점은 저희가 먼저 밝힙니다. 「${c.confessionCard.name}」입니다.`);
      if (evNames.length) lines.push(`우리 측 증거 ${evNames.map(n => `「${n}」`).join(", ")}${josaEul(evNames[evNames.length - 1])} 보십시오.`);
      if (ids.includes(C.arg)) { const t = c.arguments.find(a => a.id === C.arg).text; lines.push(/[.!?]$/.test(t) ? t : t + "."); }
      steps.push({ img: heroOf().img, cls: "ours rebut", who: "우리 측 반론", text: `이의 있습니다! ${lines.join(" ")}`, d: 0, dTxt: "막아냄" });
    }
  });
  const r = Math.random();
  const noise = r < 0.2 ? -1 : r > 0.8 ? 1 : 0;
  steps.push({ ava: "judge", cls: "null", who: "재판부", text: noise > 0 ? "재판부가 우리 쪽 설명에 고개를 끄덕입니다." : noise < 0 ? "재판부가 미심쩍은 표정을 짓습니다." : "재판부는 담담하게 기록을 넘깁니다.", d: noise });

  show(`${trialHead(c)}
    <div><div class="gauge" style="--t1:${pct(1)}%;--t2:${pct(3)}%"><div class="needle" id="needle" style="left:${pct(0)}%"></div></div>
      <div class="gauge-labels"><span>${resultLabel(c, "lose")}</span><span>${resultLabel(c, "partial")}</span><span>${resultLabel(c, "win")}</span></div></div>
    <div class="log-wrap"><div class="log" id="log"></div><div class="slam" id="slam" aria-hidden="true"></div></div>
    <div id="verdict" class="stack"></div>`,
    `<button class="btn ghost" id="skip">빨리 넘기기</button>`, "court");

  let score = 0, i = 0, fast = REDUCED, timer = null;
  const logEl = document.getElementById("log"), needle = document.getElementById("needle");
  const tilt = () => { needle.style.left = pct(score) + "%"; };
  tilt();
  const slam = (txt, cls) => {
    if (fast) return;
    const el = document.getElementById("slam");
    el.textContent = txt; el.className = "slam show " + cls;
    setTimeout(() => { el.className = "slam"; }, 700);
  };
  const step = () => {
    if (i >= steps.length) { app.removeEventListener("click", tapNext); return judgeCloseUp(fast, () => verdict(score)); }
    const s = steps[i++]; score += s.d;
    const dTxt = s.dTxt != null ? s.dTxt : s.d > 0 ? `+${s.d}` : s.d < 0 ? `−${-s.d}` : "±0";
    logEl.insertAdjacentHTML("beforeend", `<div class="log-line ${s.cls} ${s.ava || s.img ? "has-ava" : ""}">${s.ava || s.img ? `<div class="ava"><img src="${s.img || `assets/${s.ava}.webp`}" alt=""></div>` : ""}<div><span class="who">${esc(s.who)}</span>${esc(s.text)}</div><span class="d ${s.d > 0 ? "pos" : s.d < 0 ? "neg" : "zero"}">${dTxt}</span></div>`);
    tilt();
    if (s.cls === "opp") slam("반박!", "bad"); else if (s.cls.includes("rebut")) slam("이의 있음!", "good");
    if (!fast) logEl.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
    // 글 길이만큼 읽을 시간을 준다(우리 측 반론은 최소 3초). 화면을 누르면 바로 다음으로
    const wait = Math.min(7000, Math.max(s.cls.includes("rebut") ? 3000 : 1300, 600 + s.text.length * 70));
    timer = setTimeout(step, fast ? 0 : wait);
  };
  const tapNext = e => { if (fast || e.target.closest("button")) return; clearTimeout(timer); step(); };
  app.addEventListener("click", tapNext);
  on("#skip", () => { fast = true; clearTimeout(timer); app.removeEventListener("click", tapNext); step(); });
  timer = setTimeout(step, fast ? 0 : 500);
}

// 판결 직전: 판사 얼굴을 크게 띄우고 의사봉 소리
function judgeCloseUp(fast, done) {
  if (fast || REDUCED) { gavel(); return done(); }
  const ov = document.createElement("div");
  ov.className = "closeup";
  ov.innerHTML = `<div class="closeup-face"><img src="assets/judge.webp" alt=""></div><div class="closeup-txt">판결을 선고합니다</div>`;
  document.body.appendChild(ov);
  setTimeout(gavel, 650);
  setTimeout(() => { ov.classList.add("out"); setTimeout(() => { ov.remove(); done(); }, 300); }, 1500);
}
// 의사봉 소리: 브라우저에서 합성한 짧은 '땅, 땅'
let actx = null;
function gavel() {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t0 => {
      const t = actx.currentTime + t0, o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function verdict(score) {
  const c = C.c;
  const res = score >= 3 ? "win" : score >= 1 ? "partial" : "lose";
  const f = C.fee, b = res === "win" ? C.bonus : res === "partial" ? Math.round(C.bonus / 2 / 10) * 10 : 0;
  const repRaw = res === "win" ? 1 + c.tier : res === "partial" ? 0 : -(1 + c.tier), repBefore = S.rep;
  S.money += f + b;
  // 사무실마다 명성 상한(40·60·80·100): 더 오르려면 사무실을 옮겨야 한다
  S.rep = Math.max(0, Math.min(Math.max(office().repCap, S.rep), S.rep + repRaw));
  const repD = S.rep - repBefore, capped = repRaw > repD;
  S[res === "win" ? "w" : res === "partial" ? "p" : "l"]++;
  if (res === "win") { S.archive = (S.archive || []).concat({ id: c.id, m: S.day, money: f + b }); galAdd(c.id, { m: S.day, money: f + b }); }
  const truthTxt = { honest: "진실한 의뢰인", hiding: "불리한 사실을 숨긴 의뢰인", liar: "거짓말을 한 의뢰인" }[c.truth];
  const el = document.getElementById("verdict");
  const stamp = !isCrim(c) && res !== "partial" ? `<img class="stamp-img" src="assets/stamp-${res}.png" alt="${resultLabel(c, res)}">` : `<div class="stamp ${res}">${resultLabel(c, res)}</div>`;
  el.innerHTML = `${stamp}
    <div class="judgment"><div class="lbl">주문</div>${esc(c.outcomes[res])}</div>
    <div class="mono"><div class="ava"><img src="${heroOf().img}" alt=""></div><div><div class="who">${esc(S.name || heroOf().name)} 변호사 · <span>${truthTxt}</span></div><p>${esc(monoOpener(c, res))} ${esc(c.epilogue)}</p></div></div>
    <div class="ledger">
      <span>착수금</span><span class="r">${won(f)}</span>
      <span>성공보수</span><span class="r">${won(b)}</span>
      <span class="sum">명성</span><span class="r sum ${repD > 0 ? "pos" : repD < 0 ? "neg" : "zero"}">${repD > 0 ? "+" : repD < 0 ? "−" : "±"}${Math.abs(repD)}${capped ? ` (사무실 상한 ${office().repCap})` : ""}</span>
    </div>`;
  renderHud();
  el.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" });
  setDock(`<button class="btn primary" id="done">사무실로 돌아가기</button>`);
  on("#done", () => finishCase("done", { rep: repD, money: f + b, res }));
}

// 판결 뒤 주인공의 첫마디 (의뢰인 유형 × 판결 × 간파 여부)
function monoOpener(c, res) {
  const caught = C.confessed;
  const L = {
    honest: { win: "역시 믿길 잘했다. 거짓말 하나 없는 의뢰인이었다.", partial: "진실을 말한 사람이었는데, 절반밖에 못 지켰다.", lose: "진실한 의뢰인이었다. 그런데 졌다. 내가 부족했던 거다." },
    hiding: { win: caught ? "숨긴 걸 미리 알아낸 덕에 이겼다." : "숨긴 게 있었지만, 운 좋게 이겼다.", partial: caught ? "숨긴 걸 알아냈는데도 다 막지는 못했다." : "역시 숨기는 게 있었다. 그게 발목을 잡았다.", lose: caught ? "숨긴 걸 알고도 졌다. 증거를 잘못 골랐다." : "숨긴 게 있었다. 미리 알아냈어야 했는데." },
    liar: { win: caught ? "거짓인 줄 알고 맡은 사건이다. 그래도 이긴 건 이긴 거다." : "거짓말한 의뢰인이었다. 모르고 이겼으니 찜찜하다.", partial: "거짓말한 의뢰인이었다. 이 정도면 선방이다.", lose: caught ? "거짓인 걸 알면서 맡았다. 결과는 당연했다." : "처음부터 거짓말이었다. 그걸 못 꿰뚫어 본 내 탓이다." }
  };
  return L[c.truth][res];
}


/* ---------- 사무실·직원 ---------- */
const OFFICES = [

  { name: "역세권 오피스", need: 30, cost: 1000, rent: 350, live: 400, guests: 2, up: 0.1, tiers: [1, 2], cap: 5, repCap: 60 },
  { name: "서초동 법조타운", need: 55, cost: 4000, rent: 800, live: 550, guests: 4, up: 0.2, tiers: [1, 2, 3], cap: 6, repCap: 80 },
  { name: "강남 빌딩 한 층", need: 80, cost: 10000, rent: 2000, live: 800, guests: 6, up: 0.3, tiers: [2, 3], cap: 8, repCap: 100 }

const STAFF = [
  { key: "mgr", name: "사무장", pay: 450, desc: "매달 손님 +1~2" },

  { key: "assoc", name: "고용 변호사", pay: 700, desc: "한 달 수임 +3건 · 상담 질문 3번 → 4번" },

];
// 세금(부가세·소득세를 합쳐 매달 수입의 일정 비율)
const TAX_RATE = 0.2;
const office = () => OFFICES[S.office || 0];
const has = k => !!(S.staff && S.staff[k]);
const staffCount = () => STAFF.filter(s => has(s.key)).length;
const capacity = () => (S.office || 0) + 1;
const monthlyCost = () => office().rent + office().live + STAFF.reduce((a, s) => a + (has(s.key) ? s.pay : 0), 0);
const nextOffice = () => OFFICES[(S.office || 0) + 1];
const canMove = () => { const n = nextOffice(); return !!n && S.rep >= n.need && S.money >= n.cost; };

function screenOffice() {
  const cur = office(), nx = nextOffice(), full = staffCount() >= capacity();
  const moveBox = nx ? `<div class="pn ${canMove() ? "on" : ""}">
      <div class="pn-top"><span class="eyebrow">다음 단계</span>${canMove() ? `<span class="pill ok">이전 가능</span>` : ""}</div>
      <div class="pn-name">${esc(nx.name)}</div>
      <div class="note">이전 비용 ${won(nx.cost)} · 월세 ${won(nx.rent)} · 생활비 ${won(nx.live)} · 직원 정원 ${OFFICES.indexOf(nx) + 1}명<br>사건 규모 ${tierTxt(nx.tiers)} · 한 달 수임 ${nx.cap}건 · 명성 상한 ${nx.repCap} · 수임료 +${Math.round(nx.up * 100)}%</div>
      ${canMove() ? `<button class="btn" id="move">${won(nx.cost)} 내고 이전</button>`

    </div>` : `<div class="pn"><div class="note">가장 좋은 사무실입니다.</div></div>`;

    const on_ = has(s.key), dim = !on_ && full;

      <div class="note">${s.desc}${on_ ? " · <span class='pos'>근무 중</span>" : ""}</div></div>`;

      <div class="note">월세 ${won(cur.rent)} · 생활비 ${won(cur.live)} · 직원 정원 ${capacity()}명<br>사건 규모 ${tierTxt(cur.tiers)} · 한 달 수임 ${cur.cap}건 · 명성 상한 ${cur.repCap}${cur.up ? ` · 수임료 +${Math.round(cur.up * 100)}%` : ""}</div></div>
    ${moveBox}
    <button class="btn ghost" id="toArchive">사건 갤러리 · 모은 사건 ${Object.keys(galLoad()).length}건</button>
    <div class="section-head"><span class="eyebrow">직원</span><span class="eyebrow">정원 ${staffCount()} / ${capacity()}</span></div>
    <div class="stack">${staff}</div>`,
    `<button class="btn primary" id="backLedger">장부로 돌아가기</button>`);
  on("#move", () => { S.money -= nx.cost; S.office = (S.office || 0) + 1; S.moveNote = false; save(); screenOffice(); });
  on("[data-hire]", e => { S.staff = S.staff || {}; S.staff[e.currentTarget.dataset.hire] = true; save(); screenOffice(); });
  on("[data-fire]", e => { S.staff[e.currentTarget.dataset.fire] = false; save(); screenOffice(); });
  on("#toArchive", () => screenArchive(screenOffice));
  on("#backLedger", screenDayEnd);
}

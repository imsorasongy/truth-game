/* ---------- 사건 마무리 / 하루 마무리 ---------- */
function finishCase(status, d) {
  const t = S.today[S.idx];
  t.status = status;
  S.dayLog.push({ id: t.id, status, rep: d.rep, money: d.money, res: d.res || null });
  if (!S.played.includes(t.id)) S.played.push(t.id);
  C = null;
  closeIfFull();
  save();
  if (!S.ended && S.rep >= 100) return screenEnding();
  if (monthDone()) screenDayEnd(); else screenDayIntro();
}

function screenDayEnd() {
  const rows = S.dayLog.map(l => {
    const c = BY_ID[l.id];
    const label = l.status === "done" ? resultLabel(c, l.res) : l.status === "refused" ? "돌려보냄" : "떠남";
    return `<span>${esc(c.client.name)} · ${esc(c.category)} <span style="color:var(--muted)">${label}</span></span><span class="r">${l.money ? won(l.money) : "—"}</span>`;
  }).join("");
  const money = S.dayLog.reduce((a, l) => a + l.money, 0), rep = S.dayLog.reduce((a, l) => a + l.rep, 0);
  // 고정비는 달마다 한 번만 뺀다
  if (S.paid !== S.day) {
    S.cost = monthlyCost(); S.tax = Math.round(money * TAX_RATE / 10) * 10; S.money -= S.cost + S.tax; S.paid = S.day;
    S.deficit = S.money < 0 ? (S.deficit || 0) + 1 : 0;
    S.moveNote = !!nextOffice() && S.rep >= nextOffice().need && !S.notified?.[S.office + 1];
    if (S.moveNote) { S.notified = S.notified || {}; S.notified[S.office + 1] = true; }
    save();
    if (S.deficit >= 3) return screenBankrupt();
  }
  const costParts = [`월세 ${office().rent}`, `생활비 ${office().live}`].concat(STAFF.filter(s => has(s.key)).map(s => `${s.name} ${s.pay}`)).join(" · ");
  const net = money - S.cost - (S.tax || 0);
  show(`<div><div class="eyebrow">${monthLabel(S.day)} 말</div><h2>이번 달 장부</h2></div>
    <div class="ledger">${rows}
      <span class="sum">수입</span><span class="r sum">${won(money)}</span>
      <span>고정비 <span class="note">(${costParts})</span></span><span class="r neg">−${won(S.cost)}</span>
      <span>세금 <span class="note">(수입의 ${TAX_RATE * 100}%)</span></span><span class="r neg">${S.tax ? "−" + won(S.tax) : "0원"}</span>
      <span class="sum"><b>이번 달 순이익</b></span><span class="r sum ${net >= 0 ? "pos" : "neg"}">${net >= 0 ? "+" : "−"}${won(Math.abs(net))}</span>
      <span>명성</span><span class="r ${rep >= 0 ? "pos" : "neg"}">${rep >= 0 ? "+" : "−"}${Math.abs(rep)}</span>
    </div>
    ${S.deficit ? `<div class="pn warn">자금이 바닥났습니다. 적자 ${S.deficit}개월째 · 3개월 연속이면 폐업합니다.</div>` : ""}
    ${S.moveNote ? `<div class="pn on">명성 ${nextOffice().need} 달성 · ${esc(nextOffice().name)}로 이전할 수 있습니다.</div>` : ""}
    <button class="btn ghost" id="toOffice">사무실 관리</button>
    <p class="note">다음 달 예상 손님 ${visitorRange(S.rep).join("~")}명 · 수임료 배율 ×${feeMult(S.rep).toFixed(2)}</p>`,
    `<button class="btn primary" id="nextDay">다음 달로</button>`);
  on("#toOffice", screenOffice);
  on("#nextDay", () => { S.day++; S.moveNote = false; planDay(); save(); monthFlip(screenDayIntro); });
}

// 다음 달로 넘어갈 때 달력 한 장이 넘어가는 짧은 전환
function monthFlip(next) {
  if (REDUCED) return next();
  const ov = document.createElement("div");
  ov.className = "flip";
  ov.innerHTML = `<div class="flip-card"><div class="flip-y">${2030 + Math.floor((S.day - 1) / 12)}년</div><div class="flip-m">${((S.day - 1) % 12) + 1}월</div><div class="flip-f">${esc(S.firm || "")}</div></div>`;
  document.body.appendChild(ov);
  setTimeout(next, 450);
  setTimeout(() => { ov.classList.add("out"); setTimeout(() => ov.remove(), 350); }, 1000);
}
function screenEnding() {
  S.ended = true; save();
  show(`<section class="cover">
    <div class="eyebrow">${monthLabel(S.day)}</div>
    <h1>대한민국<br><em>최고의 변호사</em></h1>
    <div class="ledger">
      <span>전적</span><span class="r">${S.w}승 ${S.p}일부 ${S.l}패</span>
      <span>승률</span><span class="r">${winRate()}%</span>
      <span>모은 돈</span><span class="r">${won(S.money)}</span>
    </div>
    <p class="lede">이제 사무실 앞에는 줄이 늘어섭니다. 계속해서 명성을 지켜 보세요.</p>
    <button class="btn ghost" id="endArchive">사건 갤러리 보기 · 모은 사건 ${Object.keys(galLoad()).length}건</button>
  </section>`, `<button class="btn primary" id="cont">계속하기</button>`, "end-top", "ending");
  on("#endArchive", () => screenArchive(screenEnding));
  on("#cont", () => { if (monthDone()) screenDayEnd(); else screenDayIntro(); });
}

/* ===== 폰 게임 화면판(v2): 게임 규칙은 그대로 두고 화면 그리기만 덮어쓴다 ===== */
const tabsEl = document.createElement("nav");
tabsEl.id = "tabs";
document.body.appendChild(tabsEl);
let showLog = false, showEv = false, lastCaseKey = null, sizeKey = null, sizeVal = 0;
const TAB_ICON = {
  ev: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>',
  log: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  arc: '<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'
};
function renderHud() {
  if (!S) { hud.innerHTML = ""; return; }
  const ym = `${2030 + Math.floor((S.day - 1) / 12)}.${((S.day - 1) % 12) + 1}`;
  hud.innerHTML = `<div class="pills">
      <span class="pill"><i>₩</i>${won(S.money)}</span>
      <span class="pill"><i>★</i>${S.rep}${office().repCap < 100 ? `<small>/${office().repCap}</small>` : ""}</span>
      <span class="pill r">${ym} · 수임 ${S.taken || 0}/${intakeCap()}</span>
    </div>
    <div class="rk">${S.name ? esc(S.name) + " · " : ""}${esc(rankOf(S.rep))} · 승률 ${trials() ? winRate() + "%" : "—"}</div>`;
}
function renderTabs() {
  const hasEv = !!app.querySelector(".ev-drawer"), hasTalk = !!app.querySelector(".vn-bottom .talk");
  const items = [["ev", "증거", hasEv], ["log", "대화 기록", hasTalk], ["arc", "갤러리", !C], ["snd", soundOn ? "음악 켬" : "음악 끔", true]];
  tabsEl.innerHTML = items.map(([k, l, ok]) => `<button class="tab ${ok ? "" : "off"} ${(k === "ev" && showEv) || (k === "log" && showLog) ? "on" : ""}" data-tab="${k}" ${ok ? "" : "disabled"}>${TAB_ICON[k]}<span>${l}</span></button>`).join("");
  tabsEl.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.tab;
    if (k === "ev") { showEv = !showEv; app.classList.toggle("show-ev", showEv); }
    if (k === "log") {
      showLog = !showLog; app.classList.toggle("show-log", showLog);
      // 펼치면 가장 최근 대화가 보이게 맨 아래에서 시작
      const bt = app.querySelector(".vn-bottom"); if (bt && showLog) bt.scrollTop = bt.scrollHeight;
      if (!showLog) fitBottom();
    }
    if (k === "arc") return screenArchive(() => monthDone() ? screenDayEnd() : screenDayIntro());
    if (k === "snd") toggleSound();
    renderTabs();
  }));
}
function show(html, dockHtml, scene = "office", track) {
  setScene(scene);
  music(track || (scene === "court" ? "trial" : "normal"));
  renderHud();
  app.className = "";
  app.innerHTML = html;
  const first = app.firstElementChild;
  if (first && first.classList.contains("scene")) {
    // 의뢰인 그림 뒤의 내용은 아래 대화창 영역으로 모은다
    app.classList.add("vn");
    const bottom = document.createElement("div");
    bottom.className = "vn-bottom";
    while (first.nextSibling) bottom.appendChild(first.nextSibling);
    app.appendChild(bottom);
    // 상담 중 증거 목록은 서랍으로 뺀다
    const evStack = [...bottom.querySelectorAll(".stack")].find(s => s.querySelector(".evlist") && !s.querySelector(".pick"));
    if (evStack) {
      evStack.classList.add("ev-drawer"); app.appendChild(evStack);
      // 증거 카드는 그 자리에서만 펼치고 접는다(화면 전체를 다시 그리지 않음)
      evStack.addEventListener("click", ev => {
        const card = ev.target.closest("[data-ev]"); if (!card) return;
        ev.stopPropagation();
        const id = card.dataset.ev, e = C.c.evidence.find(x => x.id === id);
        C.opened[id] = !C.opened[id];
        card.outerHTML = evCard(e, { open: C.opened[id] });
      }, true);
    }
    if (bottom.querySelector(".feebox, .evlist .card-k")) app.classList.add("compact");
  } else if (app.querySelector("#log") && C) {
    app.classList.add("vn", "court");
    const sides = document.createElement("div");
    sides.className = "sides";
    sides.innerHTML = `<div class="side opp"><img src="assets/${isCrim(C.c) ? "pros" : "opp"}.webp" alt=""><span>${isCrim(C.c) ? "검사" : "상대 대리인"}</span></div>
      <div class="side us"><img src="${heroOf().img}" alt=""><span>${esc(S.name || heroOf().name)} 변호사</span></div>`;
    app.appendChild(sides);
    // 상대가 반박할 때 상대 얼굴이 흔들리게
    new MutationObserver(() => {
      const last = app.querySelector(".log .log-line:last-child");
      if (last && (last.classList.contains("opp") || last.classList.contains("rebut"))) { app.classList.remove("hit"); void app.offsetWidth; app.classList.add("hit"); }
    }).observe(app.querySelector("#log"), { childList: true });
  } else {
    app.classList.add("panel");
  }
  // 같은 화면을 다시 그릴 때는 서랍·기록을 연 상태 그대로 둔다
  if (!app.querySelector(".ev-drawer")) showEv = false;
  if (!app.querySelector(".vn-bottom .talk")) showLog = false;
  app.classList.toggle("show-ev", showEv);
  app.classList.toggle("show-log", showLog);
  // 같은 의뢰인과 상담하는 동안에는 다시 나타나는 연출을 하지 않는다
  const caseKey = C && app.classList.contains("vn") ? C.c.id : null;
  if (!caseKey || caseKey !== lastCaseKey) app.classList.add("enter");
  lastCaseKey = caseKey;
  // 서랍 여닫는 움직임은 화면이 자리 잡은 뒤부터
  setTimeout(() => app.classList.add("anim"), 50);
  setDock(dockHtml);
  app.style.bottom = (62 + (dock.hidden ? 0 : dock.offsetHeight)) + "px";
  app.scrollTop = 0;
  renderTabs();
  fitBottom();
}

// 의뢰인은 위쪽 띠 바로 아래, 대사·질문은 그 바로 밑에 둔다.
// 대사·질문이 실제로 차지하는 높이를 먼저 재고, 남는 자리만큼 그림을 키운다(170~260px).
function fitBottom() {
  const sc = app.querySelector(".vn .scene"), bt = app.querySelector(".vn-bottom");
  if (!sc || !bt) return;
  setTimeout(() => {
    const appTop = app.getBoundingClientRect().top, H = app.clientHeight;
    const top = (hud.getBoundingClientRect().bottom || 60) - appTop + 6;
    bt.style.top = "auto"; bt.style.bottom = "auto";
    const need = bt.offsetHeight;                       // 대사·질문의 실제 높이
    // 의뢰인 그림 크기는 화면 폭에 따라서만 정하고 대화 내용과 상관없이 고정
    const size = Math.round(Math.max(170, Math.min(230, app.clientWidth * 0.6)) * 0.75);
    sc.style.top = top + "px"; sc.style.width = sc.style.height = size + "px"; sc.style.maxHeight = "none";
    bt.style.top = (top + size + 40) + "px"; bt.style.bottom = "8px";
    app.classList.toggle("compact", size < 100);
    // 글자 크기는 대화 기록과 같게 고정, 넘치면 아래 대화창을 넘겨 본다
    bt.style.setProperty("--fs", 1);
    // 대화창은 항상 맨 위(가장 최근 대사)부터 보이게
    if (!showLog) bt.scrollTop = 0;
    // 아래가 비면 지난 문답을 최근 것부터 더 보여 준다(넘치기 직전까지)
    const talk = bt.querySelector(".talk");
    if (talk && !showLog) {
      const items = [...talk.children];
      for (let i = items.length - 3; i >= 0; i--) {
        const el = items[i];
        el.style.display = el.classList.contains("me-row") ? "flex" : "block";
        if (bt.scrollHeight > bt.clientHeight + 1) { el.style.display = ""; break; }
      }
    }
  }, 0);
}
// 표지(타이틀 그림)가 떠 있는 동안에는 아래 탭을 숨긴다
new MutationObserver(() => { tabsEl.hidden = !!app.querySelector(".title"); }).observe(app, { childList: true });
// 폰 화면판은 배경을 지운 의뢰인 그림을 쓴다
function portrait(c) {
  const face = pickFace(c);
  return face ? `<img src="assets/cut/${face.startsWith("m") ? face : "f-" + face}.webp" alt="">` : "";
}

/* 화면이 새로 배포되어도 진행 중인 게임을 이어 간다 */
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = data => {
  if (data && data.S) { S = data.S; resume(); } else screenCover();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

<script>
// 오프라인 실행을 위한 서비스 워커 등록
if ("serviceWorker" in navigator) {
  // 새 판이 올라오면 저절로 다시 불러온다(처음 설치 때는 제외)
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    // 앱으로 돌아올 때마다 새 판이 있는지 확인
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
}
</script>
